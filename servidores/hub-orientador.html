<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" href="../assets/img/fav.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orientador — Central de Estágios IFRS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <link rel="stylesheet" href="../assets/css/layout.css">
</head>
<body>
  <header id="app-header">
    <div class="container">
      <div class="header-inner">
        <a href="../index.html" class="header-brand">
          <span class="header-logo-wrap"><img src="../assets/img/logo-ifrs.png" alt="IFRS" class="header-logo"></span>
        </a>
        <div style="display:flex;align-items:center;gap:var(--space-3);">
          <div id="header-user-area"></div>
          <a href="../institucional/index.html" class="back-link">
            <svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="M9.707 16.707a1 1 0 01-1.414 0l-6-6a1 1 0 010-1.414l6-6a1 1 0 011.414 1.414L5.414 9H17a1 1 0 110 2H5.414l4.293 4.293a1 1 0 010 1.414z" clip-rule="evenodd"/></svg>
            Institucional
          </a>
        </div>
      </div>
    </div>
  </header>

  <main id="main-content">
    <section class="page-hero">
      <div class="container">
        <h1>Orientador</h1>
        <p>Gerencie seu perfil e acompanhe os estágios sob sua orientação.</p>
      </div>
    </section>

    <div class="container">
      <div style="width:100%;max-width:860px;margin:0 auto">
      <div class="hub-grid hub-grid--home" role="list">

        <!-- Meu Perfil -->
        <a href="perfil-orientador.html" class="hub-card" role="listitem">
          <svg class="hub-card__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
          <span class="hub-card__label">Meu Perfil</span>
          <span class="hub-card-arrow" style="background:#f3f4f6;color:#6b7280">→</span>
        </a>

        <!-- Declarações -->
        <a href="declaracoes.html" class="hub-card" role="listitem">
          <svg class="hub-card__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 00-3.375-3.375h-1.5A1.125 1.125 0 0113.5 7.125v-1.5a3.375 3.375 0 00-3.375-3.375H8.25m0 12.75h7.5m-7.5 3H12M10.5 2.25H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 00-9-9z"/>
          </svg>
          <span class="hub-card__label">Declarações</span>
          <span class="hub-card-arrow" style="background:#f3f4f6;color:#6b7280">→</span>
        </a>

        <!-- Meus Orientandos -->
        <a href="meus-orientandos.html" class="hub-card" role="listitem">
          <svg class="hub-card__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/>
            <circle cx="9" cy="7" r="4"/>
            <path stroke-linecap="round" stroke-linejoin="round" d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/>
          </svg>
          <span class="hub-card__label">
            Meus Orientandos
            <span id="badge-orientandos" style="display:none;background:var(--color-warning,#f59e0b);color:#fff;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;vertical-align:middle;margin-left:6px;"></span>
          </span>
          <span class="hub-card-arrow" style="background:#f3f4f6;color:#6b7280">→</span>
        </a>

      </div>
      </div>
    </div>
  </main>

  <footer id="app-footer">
    <div class="container">
      <div class="footer-inner">
        <span class="footer-copy">&copy; <script>document.write(new Date().getFullYear())</script> Central de Estágios — IFRS Campus Rio Grande</span>
        <nav class="footer-links"><a href="mailto:estagios@riogrande.ifrs.edu.br">estagios@riogrande.ifrs.edu.br</a></nav>
      </div>
    </div>
  </footer>

  <script src="https://accounts.google.com/gsi/client" async></script>
  <script src="../assets/js/utils.js"></script>
  <script src="../assets/js/notifications-bell.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/api.js"></script>
  <script>
    'use strict';
    document.addEventListener('DOMContentLoaded', function () {
      if (!requireStaffAuth()) return;
      // Badge de aceites pendentes
      apiListarMeusOrientandos().then(function (data) {
        var lista = Array.isArray(data) ? data : (data.orientandos || []);
        var pendentes = lista.filter(function (s) { return s.status === 'Aguardando Aceite Orientador'; }).length;
        if (pendentes > 0) {
          var badge = document.getElementById('badge-orientandos');
          badge.textContent = pendentes + ' pendente' + (pendentes > 1 ? 's' : '');
          badge.style.display = 'inline-flex';
        }
      }).catch(function () { /* silencioso */ });
    });
  </script>
</body>
</html>
