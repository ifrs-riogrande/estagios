<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" href="../assets/img/fav.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coordenador — Central de Estágios IFRS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <link rel="stylesheet" href="../assets/css/layout.css">
</head>
<body>
  <header id="app-header">
    <div class="container">
      <div class="header-inner">
        <a href="../index.html" class="header-brand">
          <span class="header-logo-wrap"><img src="../assets/img/logo-ifrs.png" alt="IFRS" class="header-logo"></span>
        </a>
        <div style="display:flex;align-items:center;gap:var(--space-3);">
          <div id="header-user-area"></div>
          <a href="../institucional/index.html" class="back-link">
            <svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="M9.707 16.707a1 1 0 01-1.414 0l-6-6a1 1 0 010-1.414l6-6a1 1 0 011.414 1.414L5.414 9H17a1 1 0 110 2H5.414l4.293 4.293a1 1 0 010 1.414z" clip-rule="evenodd"/></svg>
            Institucional
          </a>
        </div>
      </div>
    </div>
  </header>

  <main id="main-content">
    <section class="page-hero">
      <div class="container">
        <h1>Coordenador</h1>
        <p>Gerencie seu perfil e acompanhe os estágios do seu curso.</p>
      </div>
    </section>

    <div class="container">
      <div style="width:100%;max-width:860px;margin:0 auto">
      <div class="hub-grid hub-grid--home" role="list">

        <!-- Meu Perfil -->
        <a href="perfil-coordenador.html" class="hub-card" role="listitem">
          <svg class="hub-card__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4.26 10.147a60.438 60.438 0 00-.491 6.347A48.627 48.627 0 0112 20.904a48.627 48.627 0 018.232-4.41 60.46 60.46 0 00-.491-6.347m-15.482 0a50.57 50.57 0 00-2.658-.813A59.906 59.906 0 0112 3.493a59.902 59.902 0 0110.399 5.84c-.896.248-1.783.52-2.658.814m-15.482 0A50.697 50.697 0 0112 13.489a50.702 50.702 0 017.74-3.342M6.75 15a.75.75 0 100-1.5.75.75 0 000 1.5zm0 0v-3.675A55.378 55.378 0 0112 8.443m-7.007 11.55A5.981 5.981 0 006.75 15.75v-1.5"/>
          </svg>
          <span class="hub-card__label">Meu Perfil</span>
          <span class="hub-card-arrow" style="background:#f3f4f6;color:#6b7280">→</span>
        </a>

        <!-- Estágios do Meu Curso -->
        <a href="estagios-curso.html" class="hub-card" role="listitem">
          <svg class="hub-card__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 12h3.75M9 15h3.75M9 18h3.75m3 .75H18a2.25 2.25 0 002.25-2.25V6.108c0-1.135-.845-2.098-1.976-2.192a48.424 48.424 0 00-1.123-.08m-5.801 0c-.065.21-.1.433-.1.664 0 .414.336.75.75.75h4.5a.75.75 0 00.75-.75 2.25 2.25 0 00-.1-.664m-5.8 0A2.251 2.251 0 0113.5 2.25H15c1.012 0 1.867.668 2.15 1.586m-5.8 0c-.376.023-.75.05-1.124.08C9.095 4.01 8.25 4.973 8.25 6.108V8.25m0 0H4.875c-.621 0-1.125.504-1.125 1.125v11.25c0 .621.504 1.125 1.125 1.125h9.75c.621 0 1.125-.504 1.125-1.125V9.375c0-.621-.504-1.125-1.125-1.125H8.25z"/>
          </svg>
          <span class="hub-card__label">Estágios do Meu Curso</span>
          <span class="hub-card-arrow" style="background:#f3f4f6;color:#6b7280">→</span>
        </a>

      </div>
      </div>

      <!-- Pareceres Pendentes -->
      <div style="max-width:860px;margin:var(--space-8) auto 0" id="pareceres-section" hidden>
        <h2 style="font-size:var(--font-size-lg);font-weight:700;margin-bottom:var(--space-4)">
          📋 Pareceres Finais Pendentes
        </h2>
        <div id="lista-pareceres-coord"></div>
      </div>

    </div>
  </main>

  <footer id="app-footer">
    <div class="container">
      <div class="footer-inner">
        <span class="footer-copy">&copy; <script>document.write(new Date().getFullYear())</script> Central de Estágios — IFRS Campus Rio Grande</span>
        <nav class="footer-links"><a href="mailto:estagios@riogrande.ifrs.edu.br">estagios@riogrande.ifrs.edu.br</a></nav>
      </div>
    </div>
  </footer>

  <script src="https://accounts.google.com/gsi/client" async></script>
  <script src="../assets/js/utils.js"></script>
  <script src="../assets/js/notifications-bell.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/api.js"></script>
  <script>
    'use strict';
    document.addEventListener('DOMContentLoaded', async function () {
      const user = requireStaffAuth();
      if (!user || !user.email) return;
      await carregarPareceres(user.email);
    });

    async function carregarPareceres(email) {
      try {
        const lista = await API.get('listarPareceresPendentes', { papel: 'coordenador', ref: email });
        if (!lista || !lista.length) return;
        const sec = document.getElementById('pareceres-section');
        sec.hidden = false;
        const el  = document.getElementById('lista-pareceres-coord');
        el.innerHTML = lista.map(p => `
          <div style="background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-lg);padding:var(--space-4);margin-bottom:var(--space-3);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:var(--space-3)">
            <div>
              <div style="font-weight:600;margin-bottom:2px">${escapeHtml(p.nomeAluno || '—')}</div>
              <div style="font-size:var(--font-size-xs);color:var(--color-text-muted)">${escapeHtml(p.curso || '—')} · ${escapeHtml(String(p.totalHoras || 0))}h · ${escapeHtml(p.modalidade || '—')}</div>
            </div>
            <a href="../parecer/?id=${encodeURIComponent(p.idEstagio)}&token=${encodeURIComponent(p.tokenCoordenador)}"
               class="btn btn-primary btn-sm">
              Preencher Parecer →
            </a>
          </div>`).join('');
      } catch (_) { /* falha silenciosa — pareceres não são críticos para o hub */ }
    }
  </script>
</body>
</html>
