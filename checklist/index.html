<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checklist de Estágio — IFRS Campus Rio Grande</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <link rel="stylesheet" href="../assets/css/layout.css">
  <style>
    /* ── Progresso ─────────────────────────── */
    .ck-progress-bar {
      position: sticky;
      top: 0;
      z-index: 50;
      background: var(--color-surface);
      border-bottom: 1px solid var(--color-border);
      padding: var(--space-3) 0;
      box-shadow: var(--shadow-sm);
    }
    .ck-progress-inner {
      display: flex;
      align-items: center;
      gap: var(--space-4);
    }
    .ck-progress-track {
      flex: 1;
      height: 8px;
      background: var(--color-border);
      border-radius: var(--radius-sm);
      overflow: hidden;
    }
    .ck-progress-fill {
      height: 100%;
      background: var(--color-secondary);
      border-radius: var(--radius-sm);
      transition: width 0.3s ease;
    }
    .ck-progress-label {
      font-size: var(--font-size-sm);
      font-weight: var(--font-weight-medium);
      color: var(--color-text-muted);
      white-space: nowrap;
    }

    /* ── Seção de info do estágio ──────────── */
    .ck-info-card {
      margin-bottom: var(--space-6);
    }
    .ck-prazo-badge {
      display: inline-flex;
      align-items: center;
      gap: var(--space-1);
      font-size: var(--font-size-xs);
      font-weight: var(--font-weight-medium);
      padding: 2px var(--space-2);
      border-radius: var(--radius-sm);
    }
    .ck-prazo-badge--ok {
      background: var(--color-success-light);
      color: var(--color-success);
      border: 1px solid var(--color-success-border);
    }
    .ck-prazo-badge--urgente {
      background: var(--color-warning-light);
      color: var(--color-warning);
      border: 1px solid var(--color-warning-border);
    }
    .ck-prazo-badge--vencido {
      background: var(--color-error-light);
      color: var(--color-error);
      border: 1px solid var(--color-error-border);
    }

    /* ── Lista de itens ────────────────────── */
    .ck-items-list {
      display: flex;
      flex-direction: column;
      gap: var(--space-3);
      margin-bottom: var(--space-6);
    }
    .ck-item {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      padding: var(--space-4) var(--space-5);
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .ck-item:has(.ck-item-checkbox:checked) {
      border-color: var(--color-success-border);
      background: var(--color-success-light);
    }
    .ck-item--auto {
      background: var(--color-info-light);
      border-color: var(--color-info-border);
    }
    .ck-item--flag {
      background: var(--color-warning-light);
      border-color: var(--color-warning-border);
    }
    .ck-item--inactive {
      background: var(--color-bg);
      border-color: var(--color-border);
      opacity: 0.6;
    }
    .ck-item-header {
      display: flex;
      align-items: flex-start;
      gap: var(--space-3);
    }
    .ck-item-checkbox {
      width: 18px;
      height: 18px;
      margin-top: 2px;
      flex-shrink: 0;
      accent-color: var(--color-secondary);
      cursor: pointer;
    }
    .ck-item-label {
      flex: 1;
      font-size: var(--font-size-sm);
      font-weight: var(--font-weight-medium);
      color: var(--color-text);
      line-height: var(--line-height-normal);
    }
    .ck-item-badge {
      display: inline-flex;
      align-items: center;
      gap: var(--space-1);
      font-size: var(--font-size-xs);
      font-weight: var(--font-weight-semibold);
      padding: 3px var(--space-2);
      border-radius: var(--radius-sm);
      flex-shrink: 0;
      margin-top: 1px;
    }
    .ck-item-badge--info {
      background: var(--color-info-light);
      color: var(--color-info);
      border: 1px solid var(--color-info-border);
    }
    .ck-item-badge--ok {
      background: var(--color-success-light);
      color: var(--color-success);
      border: 1px solid var(--color-success-border);
    }
    .ck-item-badge--alerta {
      background: var(--color-warning-light);
      color: var(--color-warning);
      border: 1px solid var(--color-warning-border);
    }
    .ck-item-badge--na {
      background: var(--color-bg);
      color: var(--color-text-muted);
      border: 1px solid var(--color-border);
    }
    .ck-item-valor {
      font-size: var(--font-size-sm);
      color: var(--color-text-muted);
      margin-top: var(--space-2);
      margin-left: 27px;
      font-style: italic;
    }
    .ck-item-obs {
      margin-top: var(--space-3);
      margin-left: 27px;
    }
    .ck-item-obs textarea {
      width: 100%;
      font-size: var(--font-size-sm);
      font-family: var(--font-family);
      color: var(--color-text);
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      padding: var(--space-2) var(--space-3);
      resize: vertical;
      min-height: 56px;
      line-height: var(--line-height-normal);
      box-sizing: border-box;
    }
    .ck-item-obs textarea:focus {
      outline: none;
      border-color: var(--color-secondary);
      box-shadow: 0 0 0 3px rgba(46,95,163,0.1);
    }
    .ck-item-obs-label {
      font-size: var(--font-size-xs);
      color: var(--color-text-muted);
      margin-bottom: var(--space-1);
    }

    /* ── Obs geral ─────────────────────────── */
    .ck-obs-geral {
      margin-bottom: var(--space-6);
    }
    .ck-obs-geral label {
      display: block;
      font-size: var(--font-size-sm);
      font-weight: var(--font-weight-medium);
      color: var(--color-text);
      margin-bottom: var(--space-2);
    }
    .ck-obs-geral textarea {
      width: 100%;
      font-size: var(--font-size-sm);
      font-family: var(--font-family);
      color: var(--color-text);
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      padding: var(--space-3) var(--space-4);
      resize: vertical;
      min-height: 80px;
      line-height: var(--line-height-normal);
      box-sizing: border-box;
    }
    .ck-obs-geral textarea:focus {
      outline: none;
      border-color: var(--color-secondary);
      box-shadow: 0 0 0 3px rgba(46,95,163,0.1);
    }

    /* ── Ações ─────────────────────────────── */
    .ck-actions {
      display: flex;
      gap: var(--space-3);
      flex-wrap: wrap;
      padding-top: var(--space-4);
      border-top: 1px solid var(--color-border);
    }
    .ck-actions .btn {
      flex: 1;
      min-width: 140px;
      justify-content: center;
    }

    /* ── Respondido ────────────────────────── */
    .ck-respondido {
      background: var(--color-success-light);
      border: 1px solid var(--color-success-border);
      border-radius: var(--radius-lg);
      padding: var(--space-8) var(--space-6);
      text-align: center;
    }
    .ck-respondido svg {
      width: 48px;
      height: 48px;
      color: var(--color-success);
      margin: 0 auto var(--space-4);
      display: block;
    }
    .ck-respondido h2 {
      font-size: var(--font-size-lg);
      color: var(--color-success);
      margin-bottom: var(--space-2);
    }
    .ck-respondido p {
      color: var(--color-text-muted);
      font-size: var(--font-size-sm);
    }
    .ck-respondido--ajuste {
      background: var(--color-warning-light);
      border-color: var(--color-warning-border);
    }
    .ck-respondido--ajuste svg,
    .ck-respondido--ajuste h2 {
      color: var(--color-warning);
    }

    /* ── Acesso negado ─────────────────────── */
    .ck-acesso-negado {
      background: var(--color-error-light);
      border: 1px solid var(--color-error-border);
      border-radius: var(--radius-lg);
      padding: var(--space-8) var(--space-6);
      text-align: center;
    }
    .ck-acesso-negado svg {
      width: 48px;
      height: 48px;
      color: var(--color-error);
      margin: 0 auto var(--space-4);
      display: block;
    }
    .ck-acesso-negado h2 {
      font-size: var(--font-size-lg);
      color: var(--color-error);
      margin-bottom: var(--space-2);
    }
    .ck-acesso-negado p {
      color: var(--color-text-muted);
      font-size: var(--font-size-sm);
      margin-bottom: var(--space-4);
    }

    /* ── Loading skeleton ──────────────────── */
    .ck-skeleton {
      display: flex;
      flex-direction: column;
      gap: var(--space-3);
    }
    .ck-skeleton-row {
      height: 72px;
      background: linear-gradient(90deg, var(--color-border) 25%, #e9edf3 50%, var(--color-border) 75%);
      background-size: 200% 100%;
      border-radius: var(--radius-md);
      animation: ck-shimmer 1.4s infinite;
    }
    @keyframes ck-shimmer {
      0%   { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* ── Aviso não-liberado ─────────────────── */
    .ck-nao-liberado {
      background: var(--color-warning-light);
      border: 1px solid var(--color-warning-border);
      border-radius: var(--radius-lg);
      padding: var(--space-8) var(--space-6);
      text-align: center;
    }
    .ck-nao-liberado svg {
      width: 40px;
      height: 40px;
      color: var(--color-warning);
      margin: 0 auto var(--space-4);
      display: block;
    }
    .ck-nao-liberado h2 {
      font-size: var(--font-size-lg);
      color: var(--color-warning);
      margin-bottom: var(--space-2);
    }
    .ck-nao-liberado p {
      color: var(--color-text-muted);
      font-size: var(--font-size-sm);
    }

    /* ── Seções de informação ──────────────────────────── */
    .ck-section{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-lg);margin-bottom:var(--space-3);overflow:hidden;}
    .ck-section-title{font-size:var(--font-size-xs);font-weight:var(--font-weight-semibold);text-transform:uppercase;letter-spacing:.05em;color:var(--color-text-muted);padding:var(--space-3) var(--space-5);background:var(--color-bg);border-bottom:1px solid var(--color-border);}
    .ck-field-grid{display:flex;flex-wrap:wrap;gap:0;padding:var(--space-3) var(--space-4);}
    .ck-field{min-width:160px;flex:1;padding:var(--space-2) var(--space-3);}
    .ck-field-full{flex-basis:100%;}
    .ck-field-label{font-size:var(--font-size-xs);font-weight:var(--font-weight-semibold);text-transform:uppercase;letter-spacing:.04em;color:var(--color-text-muted);display:block;margin-bottom:2px;}
    .ck-field-value{font-size:var(--font-size-sm);font-weight:var(--font-weight-medium);color:var(--color-text);white-space:pre-wrap;word-break:break-word;}
    .ck-locked-section{display:flex;align-items:center;gap:var(--space-2);font-size:var(--font-size-sm);color:var(--color-text-muted);font-style:italic;padding:var(--space-3) var(--space-4);width:100%;}
    .ck-doc-btn{display:inline-flex;align-items:center;gap:4px;font-size:var(--font-size-xs);font-weight:var(--font-weight-medium);color:var(--color-primary);text-decoration:none;background:var(--color-info-light);border:1px solid var(--color-info-border);border-radius:var(--radius-sm);padding:2px 8px;margin-top:var(--space-1);transition:background .1s;white-space:nowrap;}
    .ck-doc-btn:hover{background:var(--color-info-border);}

    /* ── Campo por campo (checklist redesign) ─────────────── */
    .ck-secao-group{margin-bottom:var(--space-3);}
    .ck-secao-header{font-size:var(--font-size-xs);font-weight:var(--font-weight-semibold);text-transform:uppercase;letter-spacing:.05em;color:var(--color-text-muted);padding:var(--space-3) var(--space-5);background:var(--color-bg);border:1px solid var(--color-border);border-bottom:none;border-radius:var(--radius-lg) var(--radius-lg) 0 0;}
    .ck-field-item{display:flex;align-items:flex-start;gap:var(--space-3);padding:var(--space-3) var(--space-4) var(--space-3) var(--space-5);border:1px solid var(--color-border);border-top:none;background:var(--color-surface);transition:background .1s;}
    .ck-field-item:last-child{border-radius:0 0 var(--radius-lg) var(--radius-lg);}
    .ck-field-item:hover{background:var(--color-bg);}
    .ck-field-cb{margin-top:3px;width:16px;height:16px;cursor:pointer;flex-shrink:0;accent-color:var(--color-success);}
    .ck-field-cb-spacer{width:16px;height:16px;flex-shrink:0;margin-top:3px;}
    .ck-field-item-body{flex:1;min-width:0;}
    .ck-field-item-label{font-size:var(--font-size-xs);font-weight:var(--font-weight-semibold);text-transform:uppercase;letter-spacing:.04em;color:var(--color-text-muted);display:flex;align-items:center;gap:var(--space-2);margin-bottom:3px;flex-wrap:wrap;}
    .ck-field-item-valor{font-size:var(--font-size-sm);font-weight:var(--font-weight-medium);color:var(--color-text);white-space:pre-wrap;word-break:break-word;}
    .ck-field-sensivel-badge{font-size:10px;font-weight:var(--font-weight-medium);color:var(--color-text-muted);background:var(--color-bg);border:1px solid var(--color-border);border-radius:var(--radius-sm);padding:1px 5px;text-transform:none;letter-spacing:0;}
    .ck-field-mask{font-family:monospace;color:var(--color-text-muted);letter-spacing:2px;}
    .ck-sensivel-oculto .ck-field-item--sensivel .ck-field-item-valor{filter:blur(5px);user-select:none;pointer-events:none;}
    .ck-toggle-sensivel{display:inline-flex;align-items:center;gap:var(--space-2);font-size:var(--font-size-xs);font-weight:var(--font-weight-medium);color:var(--color-text-muted);background:var(--color-bg);border:1px solid var(--color-border);border-radius:var(--radius-sm);padding:var(--space-1) var(--space-3);cursor:pointer;margin-bottom:var(--space-3);}
    .ck-toggle-sensivel:hover{background:var(--color-surface);border-color:var(--color-primary);color:var(--color-primary);}

    /* Extra (avulso) docs */
    .ck-avulso-list{display:flex;flex-direction:column;gap:var(--space-2);width:100%;padding:var(--space-1) 0;}
    .ck-avulso-item{display:flex;align-items:flex-start;gap:var(--space-3);padding:var(--space-3) var(--space-4);border:1px solid var(--color-border);border-radius:var(--radius-md);background:var(--color-bg);transition:background .1s;}
    .ck-avulso-item:hover{background:var(--color-surface);}
    .ck-avulso-cb{margin-top:2px;width:16px;height:16px;cursor:pointer;accent-color:var(--color-success);}
    .ck-avulso-body{flex:1;min-width:0;}
    .ck-avulso-titulo{font-size:var(--font-size-sm);font-weight:var(--font-weight-medium);color:var(--color-text);word-break:break-word;}
    .ck-avulso-meta{font-size:var(--font-size-xs);color:var(--color-text-muted);margin-top:2px;}
    .ck-avulso-revisado-label{font-size:var(--font-size-xs);color:var(--color-success);font-weight:var(--font-weight-medium);margin-left:var(--space-2);}
    .ck-avulso-empty{font-size:var(--font-size-sm);color:var(--color-text-muted);font-style:italic;padding:var(--space-2) 0;}
    .ck-item-label-wrap{flex:1;display:flex;flex-direction:column;gap:3px;}
    .ck-prazo-inline{display:flex;align-items:center;gap:var(--space-3);padding:var(--space-3) var(--space-5);border-bottom:1px solid var(--color-border);font-size:var(--font-size-sm);color:var(--color-text-muted);margin-bottom:var(--space-3);}
    .ck-checklist-title{font-size:var(--font-size-sm);font-weight:var(--font-weight-semibold);color:var(--color-text);margin:var(--space-5) 0 var(--space-3);padding-bottom:var(--space-2);border-bottom:2px solid var(--color-border);}

    /* ── Movimentações do processo ──────────── */
    .proc-timeline{margin-bottom:var(--space-6);}
    .proc-timeline-title{font-size:var(--font-size-xs);font-weight:var(--font-weight-semibold);text-transform:uppercase;letter-spacing:.06em;color:var(--color-text-muted);margin-bottom:var(--space-3);padding-bottom:var(--space-2);border-bottom:1px solid var(--color-border);}
    .proc-steps{display:flex;flex-direction:column;gap:0;position:relative;}
    .proc-steps::before{content:'';position:absolute;left:11px;top:6px;bottom:6px;width:2px;background:var(--color-border);z-index:0;}
    .proc-step{display:flex;align-items:flex-start;gap:var(--space-3);padding:var(--space-2) 0;position:relative;z-index:1;}
    .proc-dot{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;border:2px solid;background:var(--color-surface);}
    .proc-dot--done   {background:var(--color-success);border-color:var(--color-success);color:#fff;}
    .proc-dot--active {background:var(--color-primary);border-color:var(--color-primary);color:#fff;box-shadow:0 0 0 3px rgba(26,58,107,.12);}
    .proc-dot--pending{background:var(--color-surface);border-color:var(--color-border);color:var(--color-text-muted);}
    .proc-dot--ok     {background:var(--color-success);border-color:var(--color-success);color:#fff;}
    .proc-dot--warn   {background:var(--color-warning);border-color:var(--color-warning);color:#fff;}
    .proc-step-body{flex:1;padding-top:2px;}
    .proc-step-label{font-size:var(--font-size-sm);font-weight:var(--font-weight-medium);color:var(--color-text);line-height:1.3;}
    .proc-step-meta{font-size:var(--font-size-xs);color:var(--color-text-muted);margin-top:1px;}
    .proc-atores{display:flex;flex-wrap:wrap;gap:var(--space-1);margin-top:var(--space-1);}
    .proc-ator-chip{font-size:10px;font-weight:600;padding:1px 7px;border-radius:9999px;border:1px solid;}
    .proc-ator-chip--done   {background:var(--color-success-light);color:var(--color-success);border-color:var(--color-success-border);}
    .proc-ator-chip--warn   {background:var(--color-warning-light);color:var(--color-warning);border-color:var(--color-warning-border);}
    .proc-ator-chip--pending{background:var(--color-bg);color:var(--color-text-muted);border-color:var(--color-border);}

    /* ── Dados da solicitação ── */
    .sol-card { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-lg); padding: var(--space-6); margin-bottom: var(--space-5); }
    .sol-grid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-4) var(--space-8); }
    @media (max-width: 600px) { .sol-grid { grid-template-columns: 1fr; } }
    .sol-full  { grid-column: 1 / -1; }
    .sol-label { font-size: var(--font-size-xs); color: var(--color-text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: .05em; display: block; margin-bottom: 3px; }
    .sol-value { font-size: var(--font-size-base); color: var(--color-text); word-break: break-word; margin: 0 0 var(--space-3); }
    .sol-divider { grid-column: 1/-1; font-size: var(--font-size-sm); font-weight: 600; color: var(--color-text-muted); text-transform: uppercase; letter-spacing: .06em; padding-bottom: var(--space-2); border-bottom: 1px solid var(--color-border); margin-top: var(--space-2); }

    /* ── Utilitários ───────────────────────── */
    .visually-hidden { clip: rect(0 0 0 0); clip-path: inset(50%); height: 1px; overflow: hidden; position: absolute; white-space: nowrap; width: 1px; }
    .text-center { text-align: center; }
  </style>
</head>
<body>
  <header id="app-header">
    <div class="container">
      <div class="header-inner">
        <a href="../index.html" class="header-brand">
          <div class="header-logo-fallback" aria-hidden="true">IFRS</div>
          <div class="header-brand-text">
            <span class="header-brand-name">Central de Estágios</span>
            <span class="header-brand-sub">IFRS Campus Rio Grande</span>
          </div>
        </a>
        <div style="display:flex;align-items:center;gap:var(--space-3);">
          <div id="header-user-area"></div>
          <a href="../index.html" class="back-link">
            <svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
              <path fill-rule="evenodd" d="M9.707 16.707a1 1 0 01-1.414 0l-6-6a1 1 0 010-1.414l6-6a1 1 0 011.414 1.414L5.414 9H17a1 1 0 110 2H5.414l4.293 4.293a1 1 0 010 1.414z" clip-rule="evenodd"/>
            </svg>
            Início
          </a>
        </div>
      </div>
    </div>
  </header>

  <!-- Barra de progresso (sticky) — preenchida via JS -->
  <div class="ck-progress-bar" id="ck-progress-bar" hidden>
    <div class="container">
      <div class="ck-progress-inner">
        <div class="ck-progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="ck-progress-track">
          <div class="ck-progress-fill" id="ck-progress-fill" style="width:0%"></div>
        </div>
        <span class="ck-progress-label" id="ck-progress-label">0 / 0 itens</span>
      </div>
    </div>
  </div>

  <main id="main-content">
    <!-- Hero preenchido via JS -->
    <section class="page-hero" id="ck-hero" hidden>
      <div class="container">
        <div style="display:flex;align-items:center;gap:var(--space-3);flex-wrap:wrap;">
          <span class="badge" id="ck-role-badge">—</span>
        </div>
        <h1 id="ck-hero-title">Checklist de Estágio</h1>
        <p id="ck-hero-desc">Carregando…</p>
      </div>
    </section>

    <!-- Conteúdo principal -->
    <div class="container" style="padding-top:var(--space-8);padding-bottom:var(--space-12);">
      <div style="max-width:720px;margin:0 auto;">

        <!-- Loading -->
        <div id="ck-loading">
          <div class="ck-skeleton">
            <div class="ck-skeleton-row"></div>
            <div class="ck-skeleton-row"></div>
            <div class="ck-skeleton-row"></div>
            <div class="ck-skeleton-row" style="height:40px;"></div>
          </div>
        </div>

        <!-- Conteúdo real (oculto até carregar) -->
        <div id="ck-content" hidden>
          <!-- Banner admin (visível só quando já respondeu) -->
          <div id="ck-admin-banner" hidden style="margin-bottom:var(--space-4);"></div>

          <!-- Movimentações do processo -->
          <div class="proc-timeline" id="proc-timeline" hidden></div>

          <!-- Info card -->
          <div class="ck-info-card" id="ck-info-card"></div>

          <!-- Título da lista de itens -->
          <h3 id="ck-checklist-title" class="ck-checklist-title" hidden>✅ Itens para Verificação</h3>

          <!-- Lista de itens -->
          <div class="ck-items-list" id="ck-items-list" role="list" aria-label="Itens do checklist"></div>

          <!-- Observação geral -->
          <div class="ck-obs-geral">
            <label for="ck-obs-geral">
              Observação geral <span style="color:var(--color-text-muted);font-weight:400;">(opcional)</span>
            </label>
            <textarea id="ck-obs-geral" rows="3" maxlength="500"
              placeholder="Informe observações gerais sobre a verificação…"></textarea>
          </div>

          <!-- Ações -->
          <div class="ck-actions">
            <button class="btn btn-warning" id="btn-ajuste" type="button">
              <svg width="16" height="16" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                <path fill-rule="evenodd" d="M8.257 3.099c.765-1.36 2.722-1.36 3.486 0l5.58 9.92c.75 1.334-.213 2.98-1.742 2.98H4.42c-1.53 0-2.493-1.646-1.743-2.98l5.58-9.92zM11 13a1 1 0 11-2 0 1 1 0 012 0zm-1-8a1 1 0 00-1 1v3a1 1 0 002 0V6a1 1 0 00-1-1z" clip-rule="evenodd"/>
              </svg>
              Devolver para ajustes
            </button>
            <button class="btn btn-success" id="btn-aprovar" type="button">
              <svg width="16" height="16" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"/>
              </svg>
              Confirmar e enviar
            </button>
          </div>
        </div>

        <!-- Erro -->
        <div id="ck-error" hidden></div>

      </div>
    </div>
  </main>

  <!-- Scripts -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="../assets/js/utils.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/api.js"></script>
  <script>
  /* ============================================================
     checklist/index.html — Lógica principal
     ============================================================ */
  'use strict';

  // ── Constantes ────────────────────────────────────────────────
  const LABELS_ATORES = {
    admin:      'Setor de Estágios',
    orientador: 'Orientador(a) de Estágio',
    supervisor: 'Supervisor(a) na Empresa',
  };

  const BADGE_COLORS = {
    admin:      'var(--color-primary)',
    orientador: 'var(--color-secondary)',
    supervisor: 'var(--color-accent)',
  };

  // ── Estado ────────────────────────────────────────────────────
  let checklist = null;
  let meuAtor   = null;  // 'admin' | 'orientador' | 'supervisor'
  let meuEmail  = null;
  let meuToken  = null;  // token para acesso sem Google (supervisor)

  // ── Inicialização ─────────────────────────────────────────────
  document.addEventListener('DOMContentLoaded', () => {
    const params = new URLSearchParams(window.location.search);
    const id     = params.get('id');
    const token  = params.get('token');

    if (!id) {
      mostrarErro('Parâmetro <code>id</code> não encontrado na URL. Verifique o link recebido por e-mail.');
      return;
    }

    // Acesso por magic-link (supervisor sem conta Google)
    if (token) {
      meuToken = token;
      carregarChecklistComToken(id, token);
      return;
    }

    // Acesso por Google OAuth (admin)
    const ok = requireExternalAuth(
      window.location.href,
      'Checklist de Estágio — IFRS Campus Rio Grande',
      'Entre com a sua conta Google para acessar o checklist de validação do estágio. Pode ser qualquer conta Google associada ao processo.'
    );
    if (!ok) return;

    meuEmail = getCurrentUserEmail();
    carregarChecklist(id);
  });

  // ── Carregar via token (sem Google) ───────────────────────────
  async function carregarChecklistComToken(id, token) {
    try {
      const data = await API.get('obterChecklist', { id, token });
      checklist = data;
      meuAtor   = data._meuAtor || null;
      if (!meuAtor) { mostrarErro('Não foi possível identificar o ator pelo token.'); return; }
      renderizarChecklist();
    } catch (err) {
      mostrarErro(err.message || 'Link inválido ou expirado. Entre em contato com o setor de estágios.');
    }
  }

  // ── Carregar dados do backend ─────────────────────────────────
  async function carregarChecklist(id) {
    try {
      const data = await API.get('obterChecklist', { id });
      checklist = data;
      meuAtor = detectarAtor(meuEmail, checklist);
      renderizarChecklist();
    } catch (err) {
      mostrarErro(err.message || 'Não foi possível carregar o checklist. Tente novamente.');
    }
  }

  // ── Detectar qual ator é o usuário logado ──────────────────────
  function detectarAtor(email, ck) {
    if (!email) return null;
    const emailLower = email.toLowerCase();

    // Admin tem prioridade
    if (AUTH_CONFIG.ADMIN_EMAILS.includes(emailLower)) return 'admin';

    // Compara com e-mails dos atores
    if (ck._emailAtores) {
      const atores = ['orientador', 'supervisor'];
      for (const ator of atores) {
        const e = (ck._emailAtores[ator] || '').toLowerCase();
        if (e && e === emailLower) return ator;
      }
    }
    return null;
  }

  // ── Renderizar página ─────────────────────────────────────────
  function renderizarChecklist() {
    document.getElementById('ck-loading').hidden = true;

    const info = checklist._infoSolicitacao || {};
    const ator = meuAtor;

    // Acesso negado — e-mail não pertence a nenhum ator
    if (!ator) {
      mostrarAcessoNegado(meuEmail);
      return;
    }

    // Dados da seção do ator
    const secao = checklist[ator]; // pode ser null (não liberado ainda)

    // Hero
    renderizarHero(ator, info, secao);

    // Se não liberado ainda (atores paralelos aguardando Admin)
    if (ator !== 'admin' && !secao) {
      mostrarNaoLiberado(ator);
      return;
    }

    // Se já respondido — mas admin sempre pode rever e reeditar
    if (secao && (secao.status === 'aprovado' || secao.status === 'ajuste')) {
      if (ator !== 'admin') {
        mostrarRespondido(secao);
        return;
      }
      // Admin: mostra formulário mesmo após resposta, com aviso de status
    }

    // Renderizar formulário
    renderizarFormulario(ator, secao);
  }

  // ── Hero ──────────────────────────────────────────────────────
  function renderizarHero(ator, info, secao) {
    const hero = document.getElementById('ck-hero');
    hero.hidden = false;

    const badge = document.getElementById('ck-role-badge');
    badge.textContent = LABELS_ATORES[ator] || ator;
    badge.style.background = BADGE_COLORS[ator] || 'var(--color-primary)';
    badge.style.color = '#fff';
    badge.style.padding = '2px 10px';
    badge.style.borderRadius = 'var(--radius-sm)';
    badge.style.fontSize = 'var(--font-size-xs)';
    badge.style.fontWeight = 'var(--font-weight-semibold)';
    badge.style.textTransform = 'uppercase';
    badge.style.letterSpacing = '0.05em';

    document.getElementById('ck-hero-title').textContent = 'Checklist de Estágio';

    const partes = [];
    if (info.nomeEstudante) partes.push(escapeHtml(info.nomeEstudante));
    if (info.curso)         partes.push(escapeHtml(info.curso));
    if (info.nomeEmpresa)   partes.push(escapeHtml(info.nomeEmpresa));
    document.getElementById('ck-hero-desc').textContent =
      partes.length ? partes.join(' · ') : 'Verifique os itens abaixo e registre sua resposta.';
  }

  // ── Formulário de itens ───────────────────────────────────────
  function renderizarFormulario(ator, secao) {
    const content = document.getElementById('ck-content');
    content.hidden = false;

    // Admin: banner se já respondeu anteriormente
    if (ator === 'admin' && secao && (secao.status === 'aprovado' || secao.status === 'ajuste')) {
      const banner = document.getElementById('ck-admin-banner');
      if (banner) {
        const isAjuste = secao.status === 'ajuste';
        const dataStr  = secao.data ? ` em ${formatarDataHora(secao.data)}` : '';
        banner.hidden = false;
        banner.className = isAjuste
          ? 'alert alert-warning'
          : 'alert alert-success';
        banner.innerHTML = isAjuste
          ? `⚠ Você já solicitou ajuste${dataStr}. Você pode alterar sua decisão abaixo.`
          : `✓ Você já aprovou este checklist${dataStr}. Você pode alterar sua decisão abaixo.`;
      }
    }

    // Movimentações do processo (visível a todos os atores)
    renderizarHistorico();

    // Info card com prazo
    renderizarInfoCard(ator, secao);
    const tituloEl = document.getElementById('ck-checklist-title');
    tituloEl.hidden = false;
    tituloEl.textContent = '📎 Documentos para Verificação';

    // Itens
    const itens = secao ? secao.itens : [];
    renderizarItens(itens);

    // Progressbar
    atualizarProgressBar(itens);

    // Botões
    document.getElementById('btn-aprovar').addEventListener('click', () => enviarResposta('aprovado'));
    document.getElementById('btn-ajuste').addEventListener('click',  () => enviarResposta('ajuste'));
  }

  // ── Movimentações do processo ─────────────────────────────────
  function renderizarHistorico() {
    const hist = checklist._historico;
    const el   = document.getElementById('proc-timeline');
    if (!hist || !el) return;

    const info = checklist._infoSolicitacao || {};

    const fmtDH = iso => {
      if (!iso) return '';
      try { return new Date(iso).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}); }
      catch(e){ return ''; }
    };
    const statusLabel = s => s === 'aprovado' ? 'Aprovado' : s === 'ajuste' ? 'Ajuste solicitado' : s ? s : 'Pendente';
    const dotCls      = s => s === 'aprovado' ? 'proc-dot--done' : s === 'ajuste' ? 'proc-dot--warn' : 'proc-dot--pending';
    const dotIcon     = (s,n) => s === 'aprovado' ? '✓' : s === 'ajuste' ? '!' : n;
    const chipCls     = s => s === 'aprovado' ? 'proc-ator-chip--done' : s === 'ajuste' ? 'proc-ator-chip--warn' : 'proc-ator-chip--pending';
    const chipIcon    = s => s === 'aprovado' ? '✓ ' : s === 'ajuste' ? '⚠ ' : '◦ ';

    let steps = '';

    /* 1 — Solicitação recebida */
    steps += `<div class="proc-step">
      <div class="proc-dot proc-dot--done">✓</div>
      <div class="proc-step-body">
        <div class="proc-step-label">Solicitação recebida</div>
        <div class="proc-step-meta">${escapeHtml(info.nomeEstudante||'')}${info.nomeEmpresa ? ' · '+escapeHtml(info.nomeEmpresa) : ''}</div>
      </div></div>`;

    /* 2 — Aceite do orientador */
    const aOri = hist.orientador || {};
    const oriFez = aOri.status === 'aprovado' || aOri.status === 'ajuste';
    steps += `<div class="proc-step">
      <div class="proc-dot ${oriFez ? dotCls(aOri.status) : (hist.etapaAtiva === 'orientador' ? 'proc-dot--active' : 'proc-dot--pending')}">${dotIcon(aOri.status,'2')}</div>
      <div class="proc-step-body">
        <div class="proc-step-label">Orientador(a) de Estágio</div>
        <div class="proc-step-meta">${escapeHtml(info.nomeOrientador||'')}${oriFez && aOri.data ? ' · '+fmtDH(aOri.data) : (hist.criacao ? ' · '+fmtDH(hist.criacao) : '')}</div>
        ${oriFez ? `<div class="proc-atores"><span class="proc-ator-chip ${chipCls(aOri.status)}">${chipIcon(aOri.status)}${statusLabel(aOri.status)}</span></div>` : ''}
      </div></div>`;

    /* 3 — Setor de Estágios (admin) */
    const aAdmin = hist.admin || {};
    const adminFez = aAdmin.status === 'aprovado' || aAdmin.status === 'ajuste';
    steps += `<div class="proc-step">
      <div class="proc-dot ${adminFez ? dotCls(aAdmin.status) : (hist.etapaAtiva === 'admin' ? 'proc-dot--active' : 'proc-dot--pending')}">${dotIcon(aAdmin.status,'3')}</div>
      <div class="proc-step-body">
        <div class="proc-step-label">Setor de Estágios</div>
        <div class="proc-step-meta">${adminFez ? statusLabel(aAdmin.status)+(aAdmin.data ? ' · '+fmtDH(aAdmin.data) : '') : 'Em verificação…'}</div>
      </div></div>`;

    /* 4 — Supervisor */
    const aSup = hist.supervisor || {};
    const supFez = aSup.status === 'aprovado' || aSup.status === 'ajuste';
    const supAtivo = hist.etapaAtiva === 'paralelo' || hist.etapaAtiva === 'supervisor' || hist.etapaAtiva === 'concluido';
    steps += `<div class="proc-step">
      <div class="proc-dot ${supFez ? dotCls(aSup.status) : (supAtivo ? 'proc-dot--active' : 'proc-dot--pending')}">${dotIcon(aSup.status,'4')}</div>
      <div class="proc-step-body">
        <div class="proc-step-label">Supervisor(a) na Empresa</div>
        <div class="proc-step-meta">${escapeHtml(info.nomeSupervisor||'')}${supFez && aSup.data ? ' · '+fmtDH(aSup.data) : (!supAtivo ? ' · Aguardando liberação' : ' · Em verificação…')}</div>
        ${supFez ? `<div class="proc-atores"><span class="proc-ator-chip ${chipCls(aSup.status)}">${chipIcon(aSup.status)}${statusLabel(aSup.status)}</span></div>` : ''}
      </div></div>`;

    /* 5 — Assinaturas + ativação */
    const ckOk = hist.statusGeral === 'aprovado';
    steps += `<div class="proc-step">
      <div class="proc-dot ${ckOk ? 'proc-dot--done' : 'proc-dot--pending'}">${ckOk ? '✓' : '5'}</div>
      <div class="proc-step-body">
        <div class="proc-step-label">Assinaturas e ativação do estágio</div>
        <div class="proc-step-meta">TCE · Todas as partes · Direção</div>
      </div></div>`;

    el.innerHTML = `<div class="proc-timeline-title">📋 Movimentações do processo</div><div class="proc-steps">${steps}</div>`;
    el.hidden = false;
  }

  // ── Info card com dados completos da solicitação ─────────────
  function renderizarInfoCard(ator, secao) {
    const card  = document.getElementById('ck-info-card');
    const info  = checklist._infoSolicitacao || {};
    const prazo = secao ? secao.prazoVencimento : null;

    const v = val => val
      ? `<p class="sol-value">${escapeHtml(String(val))}</p>`
      : `<p class="sol-value" style="color:var(--color-text-muted);font-style:italic;">Não informado</p>`;

    let html = '';

    // Prazo badge
    if (prazo) {
      const cls = prazoClass(prazo);
      html += `<div style="margin-bottom:var(--space-5)">
        <span class="ck-prazo-badge ck-prazo-badge--${cls}">
          ${prazoIcon(cls)} Prazo: ${formatarData(prazo)}
        </span>
      </div>`;
    }

    // Dados da solicitação
    html += `<div class="sol-card"><div class="sol-grid">`;
    html += `<div class="sol-divider">Estudante</div>`;
    html += `<div class="sol-full"><span class="sol-label">Nome</span>${v(info.nomeEstudante)}</div>`;
    html += `<div><span class="sol-label">Curso</span>${v(info.curso)}</div>`;
    html += `<div><span class="sol-label">Turno / Semestre</span>${v((info.turno||'') + (info.semestre ? ' · ' + info.semestre + 'º sem.' : ''))}</div>`;

    html += `<div class="sol-divider">Empresa e Tipo</div>`;
    html += `<div><span class="sol-label">Empresa concedente</span>${v(info.nomeEmpresa)}</div>`;
    html += `<div><span class="sol-label">Tipo de estágio</span>${v(info.tipoEstagio)}</div>`;

    html += `<div class="sol-divider">Período</div>`;
    html += `<div><span class="sol-label">Início</span>${v(formatarData(info.dataInicio))}</div>`;
    html += `<div><span class="sol-label">Término</span>${v(formatarData(info.dataTermino))}</div>`;
    html += `<div><span class="sol-label">Carga horária</span>${v(info.cargaHoraria)}</div>`;
    html += `<div><span class="sol-label">Horário</span>${v(info.horario)}</div>`;

    html += `<div class="sol-divider">Plano de Estágio</div>`;
    html += `<div class="sol-full"><span class="sol-label">Plano de atividades</span>${v(info.planoAtividades)}</div>`;

    html += `<div class="sol-divider">Orientador selecionado</div>`;
    html += `<div class="sol-full"><span class="sol-label">Orientador(a)</span>${v(info.nomeOrientador)}</div>`;

    html += `</div></div>`;

    card.innerHTML = html;

    // Carrega documentos avulsos de forma assíncrona (admin only)
    if (ator === 'admin') {
      const _idEst = info.idEstagio || new URLSearchParams(window.location.search).get('id') || '';
      carregarDocsAvulsos(_idEst);
    }
  }

  // ── Documentos Avulsos (admin) ────────────────────────────────
  async function carregarDocsAvulsos(idEstagio) {
    const container = document.getElementById('ck-docs-avulsos-container');
    if (!container) return;

    try {
      const res  = await apiListarDocumentosAvulsos(idEstagio);
      const docs = (res && res.documentos) ? res.documentos : [];

      if (docs.length === 0) {
        container.innerHTML = '<span class="ck-avulso-empty">Nenhum documento adicional enviado.</span>';
        return;
      }

      const ul = document.createElement('div');
      ul.className = 'ck-avulso-list';

      docs.forEach(doc => {
        const item = document.createElement('div');
        item.className = 'ck-avulso-item';

        const cbId = `ck-avulso-cb-${doc.id}`;
        const dataStr = doc.timestamp
          ? new Date(doc.timestamp).toLocaleString('pt-BR', { day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit' })
          : '';

        item.innerHTML = `
          <input type="checkbox" class="ck-avulso-cb" id="${cbId}"
            data-doc-id="${escapeHtml(doc.id)}" ${doc.revisadoAdmin ? 'checked' : ''}>
          <div class="ck-avulso-body">
            <div class="ck-avulso-titulo">${escapeHtml(doc.titulo)}
              ${doc.revisadoAdmin ? '<span class="ck-avulso-revisado-label">✓ Revisado</span>' : ''}
            </div>
            <div class="ck-avulso-meta">
              ${escapeHtml(doc.nomeArquivo)}${dataStr ? ' · ' + dataStr : ''}
              ${doc.emailUploader ? ' · ' + escapeHtml(doc.emailUploader) : ''}
            </div>
            ${doc.url ? `<a href="${escapeHtml(doc.url)}" target="_blank" rel="noopener" class="ck-doc-btn">
              <svg width="11" height="11" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M4 4a2 2 0 012-2h4.586A2 2 0 0112 2.586L15.414 6A2 2 0 0116 7.414V16a2 2 0 01-2 2H6a2 2 0 01-2-2V4z" clip-rule="evenodd"/></svg>
              Abrir documento ↗
            </a>` : ''}
          </div>`;

        // Toggle revisado ao clicar no checkbox
        const cb = item.querySelector('.ck-avulso-cb');
        cb.addEventListener('change', async () => {
          cb.disabled = true;
          try {
            await apiMarcarDocumentoRevisado(idEstagio, doc.id, cb.checked, '');
            // Atualiza o label inline
            const tituloEl = item.querySelector('.ck-avulso-titulo');
            const existingLabel = tituloEl.querySelector('.ck-avulso-revisado-label');
            if (cb.checked) {
              if (!existingLabel) {
                const lbl = document.createElement('span');
                lbl.className = 'ck-avulso-revisado-label';
                lbl.textContent = '✓ Revisado';
                tituloEl.appendChild(lbl);
              }
            } else {
              if (existingLabel) existingLabel.remove();
            }
          } catch (err) {
            cb.checked = !cb.checked; // reverte em caso de erro
            console.error('Erro ao marcar documento:', err);
          } finally {
            cb.disabled = false;
          }
        });

        ul.appendChild(item);
      });

      container.innerHTML = '';
      container.appendChild(ul);
    } catch (err) {
      console.error('Erro ao carregar documentos avulsos:', err);
      container.innerHTML = '<span class="ck-avulso-empty">Erro ao carregar documentos adicionais.</span>';
    }
  }

  // ── Seções do checklist ───────────────────────────────────────
  const CK_SECOES = {
    aceite:      '✅ Aceite de Orientação',
    estudante:   '👤 Dados do Estudante',
    estagio:     '🏢 Dados do Estágio',
    agente:      '🤝 Agente de Integração',
    plano:       '📝 Plano de Atividades',
    responsavel: '👪 Responsável Legal',
    documentos:  '📎 Documentos',
  };

  // ── Itens (somente documentos têm checkbox; supervisor não vê docs) ─────────
  function renderizarItens(itens) {
    const lista    = document.getElementById('ck-items-list');
    const tituloEl = document.getElementById('ck-checklist-title');
    lista.innerHTML = '';
    lista.className = 'ck-items-list';

    // Supervisor não vê documentos
    const isSupervisor = meuAtor === 'supervisor';

    // Somente itens de documento (e não supervisor)
    const docItens = isSupervisor ? [] : (itens || [])
      .map((item, idx) => ({ item, idx }))
      .filter(({ item }) => item.isDoc);

    // Sem documentos — oculta seção inteira
    if (docItens.length === 0) {
      lista.hidden    = true;
      tituloEl.hidden = true;
      document.getElementById('ck-progress-bar').hidden = true;
      return;
    }

    lista.hidden    = false;
    tituloEl.hidden = false;

    const isAdmin = meuAtor === 'admin';

    const groupEl = document.createElement('div');
    groupEl.className = 'ck-secao-group';

    const hdr = document.createElement('div');
    hdr.className = 'ck-secao-header';
    hdr.textContent = '📎 Documentos';
    groupEl.appendChild(hdr);

    docItens.forEach(({ item, idx }) => {
      groupEl.appendChild(criarCampoItemEl(item, idx, isAdmin));
    });

    lista.appendChild(groupEl);
  }

  function criarCampoItemEl(item, idx, isAdmin) {
    const el = document.createElement('div');
    el.setAttribute('role', 'listitem');
    el.dataset.idx = idx;

    const isSensivel = item.sensivel === true;
    const isDoc      = item.isDoc    === true;
    const temCb      = !isSensivel || isAdmin;

    el.className = 'ck-field-item'
      + (isSensivel ? ' ck-field-item--sensivel' : '')
      + (isDoc      ? ' ck-field-item--doc'      : '');

    const cbId = `ck-cb-${idx}`;

    // Checkbox or spacer
    const cbHtml = temCb
      ? `<input type="checkbox" class="ck-field-cb" id="${cbId}" data-idx="${idx}" ${item.checked ? 'checked' : ''}>`
      : `<div class="ck-field-cb-spacer"></div>`;

    // Value
    let valorHtml;
    if (isDoc) {
      valorHtml = item.valor
        ? `<a href="${escapeHtml(item.valor)}" target="_blank" rel="noopener" class="ck-doc-btn">
             <svg width="11" height="11" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M4 4a2 2 0 012-2h4.586A2 2 0 0112 2.586L15.414 6A2 2 0 0116 7.414V16a2 2 0 01-2 2H6a2 2 0 01-2-2V4z" clip-rule="evenodd"/></svg>
             Abrir documento ↗
           </a>`
        : `<span class="ck-field-item-valor" style="color:var(--color-text-muted);font-style:italic;">Não enviado</span>`;
    } else if (isSensivel && !isAdmin) {
      valorHtml = `<span class="ck-field-item-valor ck-field-mask">•••••••••••</span>`;
    } else {
      valorHtml = `<span class="ck-field-item-valor">${escapeHtml(item.valor || '—')}</span>`;
    }

    const sensiBadge = isSensivel
      ? `<span class="ck-field-sensivel-badge">🔒 Dado sensível</span>` : '';

    el.innerHTML = `
      ${cbHtml}
      <div class="ck-field-item-body">
        <div class="ck-field-item-label">${escapeHtml(item.label)}${sensiBadge}</div>
        ${valorHtml}
      </div>`;

    if (temCb) {
      const cb = el.querySelector('.ck-field-cb');
      if (cb) cb.addEventListener('change', () => {
        atualizarProgressBar(checklist[meuAtor] ? checklist[meuAtor].itens : []);
      });
    }

    return el;
  }

  // ── Progresso ─────────────────────────────────────────────────
  function atualizarProgressBar(itens) {
    const lista = document.getElementById('ck-items-list');
    const checkboxes = lista ? lista.querySelectorAll('.ck-field-cb') : [];
    const total = checkboxes.length;

    if (!total) {
      document.getElementById('ck-progress-bar').hidden = true;
      return;
    }

    let marcados = 0;
    checkboxes.forEach(cb => { if (cb.checked) marcados++; });
    const pct = Math.round((marcados / total) * 100);

    document.getElementById('ck-progress-bar').hidden = false;
    document.getElementById('ck-progress-fill').style.width = pct + '%';
    document.getElementById('ck-progress-track').setAttribute('aria-valuenow', pct);
    document.getElementById('ck-progress-label').textContent = `${marcados} / ${total} itens`;
  }

  // ── Coletar itens do DOM ──────────────────────────────────────
  function coletarItens() {
    const secao = checklist[meuAtor];
    if (!secao || !secao.itens) return [];
    const lista = document.getElementById('ck-items-list');

    return secao.itens.map((item, idx) => {
      const cb = lista ? lista.querySelector(`.ck-field-cb[data-idx="${idx}"]`) : null;
      // Itens sem checkbox (não-doc) são considerados automaticamente marcados
      const checked = cb ? cb.checked : (!item.isDoc ? true : item.checked);
      return { ...item, checked };
    });
  }

  // ── Enviar resposta ───────────────────────────────────────────
  async function enviarResposta(decisao) {
    const ator = meuAtor;
    if (!ator) return;

    const id = new URLSearchParams(window.location.search).get('id');
    const itens     = coletarItens();
    const obsGeral  = document.getElementById('ck-obs-geral').value.trim();

    // Validação: todos os checkboxes marcados quando "aprovar"
    if (decisao === 'aprovado') {
      const lista     = document.getElementById('ck-items-list');
      const unchecked = lista.querySelectorAll('.ck-field-cb:not(:checked)');
      if (unchecked.length > 0) {
        mostrarToast('Marque todos os itens antes de Aprovar.', 'warning');
        unchecked[0].closest('.ck-field-item').scrollIntoView({ behavior: 'smooth', block: 'center' });
        unchecked[0].focus();
        return;
      }
    }

    // Desabilita botões durante envio
    const btnAprovar = document.getElementById('btn-aprovar');
    const btnAjuste  = document.getElementById('btn-ajuste');
    btnAprovar.disabled = true;
    btnAjuste.disabled  = true;
    btnAprovar.textContent = 'Enviando…';

    try {
      let body;
      if (ator === 'admin') {
        body = {
          action:    'salvarRespostaAdmin',
          idEstagio: id,
          itens:     itens,
          decisao:   decisao,
          obs:       obsGeral,
          sol:       {},
        };
      } else {
        body = {
          action:    'salvarRespostaAtor',
          idEstagio: id,
          ator:      ator,
          itens:     itens,
          decisao:   decisao,
          obs:       obsGeral,
          emailAtor: meuEmail || '',
          token:     meuToken || '',
        };
      }

      await API.post(ator === 'admin' ? 'salvarRespostaAdmin' : 'salvarRespostaAtor', body);

      // Mostra confirmação dentro do ck-content (sem apagar o DOM inteiro)
      mostrarRespondido({ status: decisao, data: new Date().toISOString(), obs: obsGeral });

    } catch (err) {
      btnAprovar.disabled = false;
      btnAjuste.disabled  = false;
      btnAprovar.innerHTML = `
        <svg width="16" height="16" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"/>
        </svg> Aprovar`;
      mostrarToast('Erro ao enviar: ' + (err.message || 'tente novamente.'), 'error');
    }
  }

  // ── Tela "já respondido" ──────────────────────────────────────
  function mostrarRespondido(secao) {
    document.getElementById('ck-loading').hidden     = true;
    document.getElementById('ck-progress-bar').hidden = true;

    const isAjuste = secao.status === 'ajuste';
    const dataStr  = secao.data ? ` em ${formatarDataHora(secao.data)}` : '';

    // Substitui o conteúdo de ck-content pela mensagem de confirmação
    // (evita remover o DOM inteiro, o que causava tela em branco)
    const content = document.getElementById('ck-content');
    content.hidden = false;
    content.innerHTML = isAjuste
      ? `<div class="ck-respondido ck-respondido--ajuste">
           <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
             <path stroke-linecap="round" stroke-linejoin="round"
               d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126zM12 15.75h.007v.008H12v-.008z"/>
           </svg>
           <h2>Ajuste solicitado${dataStr}</h2>
           <p>Sua solicitação de ajuste foi registrada. O setor de estágios será notificado.</p>
           ${secao.obs ? `<p style="margin-top:var(--space-3);font-style:italic;">"${escapeHtml(secao.obs)}"</p>` : ''}
         </div>`
      : `<div class="ck-respondido">
           <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
             <path stroke-linecap="round" stroke-linejoin="round"
               d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
           </svg>
           <h2>Checklist ${isAjuste ? 'com ajuste' : 'aprovado'}${dataStr}</h2>
           <p>Sua resposta foi registrada com sucesso. Obrigado pela colaboração!</p>
         </div>`;
  }

  // ── Tela "não liberado" ───────────────────────────────────────
  function mostrarNaoLiberado(ator) {
    document.getElementById('ck-loading').hidden = true;
    const el = document.getElementById('ck-content');
    el.hidden = false;
    el.innerHTML = `
      <div class="ck-nao-liberado">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M12 6v6h4.5m4.5 0a9 9 0 11-18 0 9 9 0 0118 0z"/>
        </svg>
        <h2>Aguardando liberação</h2>
        <p>Seu checklist será liberado após o Setor de Estágios concluir a verificação inicial.
           Você receberá um e-mail com o link de acesso quando estiver disponível.</p>
      </div>`;
  }

  // ── Acesso negado ─────────────────────────────────────────────
  function mostrarAcessoNegado(email) {
    document.getElementById('ck-loading').hidden = true;
    const el = document.getElementById('ck-content');
    el.hidden = false;
    el.innerHTML = `
      <div class="ck-acesso-negado">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M18.364 18.364A9 9 0 005.636 5.636m12.728 12.728A9 9 0 015.636 5.636m12.728 12.728L5.636 5.636"/>
        </svg>
        <h2>Acesso não autorizado</h2>
        <p>O e-mail <strong>${escapeHtml(email || '')}</strong> não está associado a nenhum ator deste checklist.</p>
        <p>Se você é da <strong>empresa ou supervisor</strong>, utilize o link recebido por e-mail
           — ele contém um código de acesso e não exige conta Google.</p>
        <p>Se você é orientador ou coordenador, verifique se acessou com a conta Google correta.</p>
        <button onclick="logout('../')" class="btn btn-ghost" style="margin-top:var(--space-4);">
          Sair e usar outra conta
        </button>
      </div>`;
  }

  // ── Erro genérico ─────────────────────────────────────────────
  function mostrarErro(msg) {
    document.getElementById('ck-loading').hidden = true;
    const errEl = document.getElementById('ck-error');
    errEl.hidden = false;
    errEl.innerHTML = `
      <div class="alert alert-error" role="alert">
        <strong>Erro:</strong> ${escapeHtml(msg)}
      </div>`;
  }

  // ── Toast ─────────────────────────────────────────────────────
  function mostrarToast(msg, tipo) {
    let toast = document.getElementById('ck-toast');
    if (!toast) {
      toast = document.createElement('div');
      toast.id = 'ck-toast';
      toast.style.cssText = `
        position:fixed;bottom:var(--space-6);left:50%;transform:translateX(-50%);
        padding:var(--space-3) var(--space-5);border-radius:var(--radius-md);
        font-size:var(--font-size-sm);font-weight:var(--font-weight-medium);
        box-shadow:var(--shadow-md);z-index:1000;max-width:90vw;text-align:center;
        transition:opacity 0.3s;`;
      document.body.appendChild(toast);
    }
    const colors = {
      warning: ['var(--color-warning-light)', 'var(--color-warning)', 'var(--color-warning-border)'],
      error:   ['var(--color-error-light)',   'var(--color-error)',   'var(--color-error-border)'],
      success: ['var(--color-success-light)', 'var(--color-success)', 'var(--color-success-border)'],
    };
    const [bg, color, border] = colors[tipo] || colors.warning;
    toast.style.background = bg;
    toast.style.color      = color;
    toast.style.border     = `1px solid ${border}`;
    toast.textContent      = msg;
    toast.style.opacity    = '1';
    clearTimeout(toast._timer);
    toast._timer = setTimeout(() => { toast.style.opacity = '0'; }, 3500);
  }

  // ── Helpers de data ───────────────────────────────────────────
  function formatarData(iso) {
    if (!iso) return '—';
    try {
      const d = new Date(iso);
      return d.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric' });
    } catch (e) { return iso; }
  }

  function formatarDataHora(iso) {
    if (!iso) return '—';
    try {
      const d = new Date(iso);
      return d.toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
    } catch (e) { return iso; }
  }

  function prazoClass(iso) {
    if (!iso) return 'ok';
    try {
      const hoje = new Date();
      const prazo = new Date(iso);
      const diff = Math.floor((prazo - hoje) / (1000 * 60 * 60 * 24));
      if (diff < 0)  return 'vencido';
      if (diff <= 2) return 'urgente';
      return 'ok';
    } catch (e) { return 'ok'; }
  }

  function prazoIcon(cls) {
    if (cls === 'vencido')  return '⚠';
    if (cls === 'urgente')  return '⏰';
    return '📅';
  }
  </script>
</body>
