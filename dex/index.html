<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DEX — Central de Estágios IFRS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <link rel="stylesheet" href="../assets/css/layout.css">
</head>
<body>
  <header id="app-header">
    <div class="container">
      <div class="header-inner">
        <a href="../index.html" class="header-brand">
          <img src="https://lh3.googleusercontent.com/d/1SvMzacZIWaYCpsyIm8NKvmej3332Qw7w" alt="IFRS" class="header-logo">
          <div class="header-brand-text">
            <span class="header-brand-name">Central de Estágios</span>
            <span class="header-brand-sub">IFRS Campus Rio Grande</span>
          </div>
        </a>
        <div style="display:flex;align-items:center;gap:var(--space-3)">
          <div id="header-user-area"></div>
          <a href="../institucional/index.html" class="back-link">
            <svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="M9.707 16.707a1 1 0 01-1.414 0l-6-6a1 1 0 010-1.414l6-6a1 1 0 011.414 1.414L5.414 9H17a1 1 0 110 2H5.414l4.293 4.293a1 1 0 010 1.414z" clip-rule="evenodd"/></svg>
            Institucional
          </a>
        </div>
      </div>
    </div>
  </header>

  <main id="main-content">
    <section class="page-hero">
      <div class="container">
        <h1>Diretoria de Extensão — DEX</h1>
        <p>Pareceres finais de estágio não obrigatório aguardando assinatura.</p>
      </div>
    </section>

    <div class="container" style="padding-top:var(--space-6);padding-bottom:var(--space-12)">
      <div id="estado-carregando" style="text-align:center;padding:var(--space-16);color:var(--color-text-muted);font-size:var(--font-size-sm)">
        Carregando pareceres…
      </div>
      <div id="lista-pareceres" style="display:none"></div>
    </div>
  </main>

  <footer id="app-footer">
    <div class="container">
      <div class="footer-inner">
        <span class="footer-copy">&copy; <script>document.write(new Date().getFullYear())</script> Central de Estágios — IFRS Campus Rio Grande</span>
        <nav class="footer-links"><a href="mailto:estagios@riogrande.ifrs.edu.br">estagios@riogrande.ifrs.edu.br</a></nav>
      </div>
    </div>
  </footer>

  <script src="https://accounts.google.com/gsi/client" async></script>
  <script src="../assets/js/utils.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/api.js"></script>
  <script>
  'use strict';

  document.addEventListener('DOMContentLoaded', async function () {
    requireStaffAuth();
    await carregarPareceres();
  });

  async function carregarPareceres() {
    try {
      const lista = await API.get('listarPareceresPendentes', { papel: 'diretoria', ref: 'DEX' });
      renderLista(lista || []);
    } catch (err) {
      document.getElementById('estado-carregando').innerHTML =
        '<p style="color:var(--color-error)">Erro ao carregar: ' + escapeHtml(err.message || String(err)) + '</p>';
    }
  }

  function renderLista(lista) {
    document.getElementById('estado-carregando').style.display = 'none';
    const el = document.getElementById('lista-pareceres');
    el.style.display = '';

    if (!lista.length) {
      el.innerHTML = `<div class="empty-state" style="border:1px solid var(--color-border);border-radius:var(--radius-lg)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
        <p>Nenhum parecer pendente para a Diretoria de Extensão.</p>
      </div>`;
      return;
    }

    const linhas = lista.map(p => `
      <tr>
        <td style="font-weight:500">${escapeHtml(p.nomeAluno || '—')}</td>
        <td>${escapeHtml(p.curso || '—')}</td>
        <td>${escapeHtml(p.matricula || '—')}</td>
        <td>${escapeHtml(String(p.totalHoras || 0))}h</td>
        <td>${escapeHtml(p.modalidade || '—')}</td>
        <td>
          <a href="../parecer/?id=${encodeURIComponent(p.idEstagio)}&token=${encodeURIComponent(p.tokenDiretoria)}"
             class="btn btn-primary btn-sm">
            Preencher Parecer →
          </a>
        </td>
      </tr>`).join('');

    el.innerHTML = `
      <h2 style="font-size:var(--font-size-lg);font-weight:700;margin-bottom:var(--space-4)">
        Pareceres Pendentes — Diretoria de Extensão (${lista.length})
      </h2>
      <div class="table-wrap">
        <table class="data-table">
          <thead>
            <tr><th>Aluno(a)</th><th>Curso</th><th>Matrícula</th><th>Horas</th><th>Modalidade</th><th>Ação</th></tr>
          </thead>
          <tbody>${linhas}</tbody>
        </table>
      </div>`;
  }
  </script>
</body>
</html>
