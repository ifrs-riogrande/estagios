<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acompanhamento de Estágio — Central de Estágios IFRS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <link rel="stylesheet" href="../assets/css/layout.css">
  <style>
    /* ── Seletor de estágio ── */
    .estagio-selector{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-lg);padding:var(--space-5);margin-bottom:var(--space-6);}
    .estagio-selector label{font-size:var(--font-size-sm);font-weight:500;display:block;margin-bottom:var(--space-2);}

    /* ── Timeline de status ── */
    .timeline{position:relative;padding-left:var(--space-10);margin-bottom:var(--space-8);}
    .timeline::before{content:'';position:absolute;left:20px;top:12px;bottom:12px;width:2px;background:var(--color-border);}
    .timeline-item{position:relative;margin-bottom:var(--space-6);}
    .timeline-item:last-child{margin-bottom:0;}
    .timeline-dot{
      position:absolute;left:-32px;top:4px;
      width:24px;height:24px;border-radius:50%;
      display:flex;align-items:center;justify-content:center;
      font-size:12px;font-weight:600;border:2px solid;
    }
    .timeline-dot--done    {background:var(--color-success);border-color:var(--color-success);color:#fff;}
    .timeline-dot--active  {background:var(--color-primary);border-color:var(--color-primary);color:#fff;box-shadow:0 0 0 4px rgba(26,58,107,.15);}
    .timeline-dot--pending {background:var(--color-surface);border-color:var(--color-border);color:var(--color-text-light);}
    .timeline-dot--error   {background:var(--color-error);border-color:var(--color-error);color:#fff;}
    .timeline-label{font-size:var(--font-size-sm);font-weight:600;margin-bottom:2px;}
    .timeline-desc {font-size:var(--font-size-xs);color:var(--color-text-muted);line-height:1.5;}
    .timeline-date {font-size:var(--font-size-xs);color:var(--color-text-light);margin-top:2px;}

    /* ── Card de ação ── */
    .action-card{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-lg);padding:var(--space-6);margin-bottom:var(--space-6);}
    .action-card h2{font-size:var(--font-size-md);font-weight:600;margin-bottom:var(--space-2);}
    .action-card p {font-size:var(--font-size-sm);color:var(--color-text-muted);margin-bottom:var(--space-5);}
    .action-card--highlight{border-color:var(--color-primary);background:var(--color-info-light);}

    /* ── Upload ── */
    .upload-area{border:2px dashed var(--color-border);border-radius:var(--radius-md);padding:var(--space-8);text-align:center;cursor:pointer;transition:all .15s;background:var(--color-bg);}
    .upload-area:hover,.upload-area.drag-over{border-color:var(--color-primary);background:var(--color-info-light);}
    .upload-area input{display:none;}
    .upload-area svg{width:40px;height:40px;margin:0 auto var(--space-3);color:var(--color-text-muted);}
    .upload-area p{font-size:var(--font-size-sm);color:var(--color-text-muted);margin-bottom:var(--space-1);}
    .upload-area small{font-size:var(--font-size-xs);color:var(--color-text-light);}
    .file-selected{display:none;align-items:center;gap:var(--space-2);padding:var(--space-3) var(--space-4);background:var(--color-success-light);border-radius:var(--radius-md);font-size:var(--font-size-sm);color:var(--color-success);}
    .file-selected.show{display:flex;}

    /* ── Informações do estágio ── */
    .info-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:var(--space-4);margin-bottom:var(--space-6);}
    .info-item{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-md);padding:var(--space-4);}
    .info-item label{font-size:var(--font-size-xs);color:var(--color-text-muted);display:block;margin-bottom:4px;text-transform:uppercase;letter-spacing:.04em;font-weight:500;}
    .info-item p{font-size:var(--font-size-sm);font-weight:500;}

    /* ── Badge status ── */
    .badge{display:inline-flex;align-items:center;gap:4px;padding:3px 12px;border-radius:9999px;font-size:12px;font-weight:600;}
    .badge::before{content:'';display:inline-block;width:6px;height:6px;border-radius:50%;background:currentColor;flex-shrink:0;}
    .badge-pending {background:var(--color-warning-light);color:var(--color-warning);}
    .badge-analysis{background:var(--color-info-light);color:var(--color-info);}
    .badge-approved{background:var(--color-success-light);color:var(--color-success);}
    .badge-docs    {background:#EDE9FE;color:#7C3AED;}
    .badge-dg      {background:#FEF3C7;color:#92400E;}
    .badge-running {background:var(--color-success-light);color:#065F46;}
    .badge-closed  {background:var(--color-bg);color:var(--color-text-muted);}
    .badge-rejected{background:var(--color-error-light);color:var(--color-error);}
    .badge-waiting {background:#FEF9C3;color:#854D0E;}
    .badge-refused {background:var(--color-error-light);color:var(--color-error);}

    /* ── Trocar orientador ── */
    .trocar-ori-box{margin-top:var(--space-4);padding:var(--space-4);background:#fff;border:1px solid var(--color-border);border-radius:var(--radius-md);}
    .trocar-ori-box h3{font-size:var(--font-size-sm);font-weight:600;margin-bottom:var(--space-3);}

    /* ── Layout ── */
    .main-cols{display:grid;grid-template-columns:1fr 320px;gap:var(--space-6);}
    @media(max-width:900px){.main-cols{grid-template-columns:1fr;}}

    .loading-page{text-align:center;padding:var(--space-16);color:var(--color-text-muted);}

    /* ── Seções de documentos (relatórios / adendo) ── */
    .doc-sections-wrap{margin-top:var(--space-2);}
    .doc-sections-title{font-size:var(--font-size-sm);font-weight:600;color:var(--color-text-muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:var(--space-3);}
    .doc-section{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-lg);margin-bottom:var(--space-3);overflow:hidden;}
    .doc-section-hdr{display:flex;align-items:center;justify-content:space-between;padding:var(--space-4) var(--space-5);cursor:pointer;user-select:none;transition:background .12s;}
    .doc-section-hdr:hover{background:var(--color-bg);}
    .doc-section-hdr h3{font-size:var(--font-size-sm);font-weight:600;margin:0;display:flex;align-items:center;gap:var(--space-2);}
    .doc-section-hdr .ds-chevron{width:18px;height:18px;color:var(--color-text-muted);transition:transform .2s;flex-shrink:0;}
    .doc-section-hdr.is-open .ds-chevron{transform:rotate(180deg);}
    .doc-section-body{display:none;padding:var(--space-5);border-top:1px solid var(--color-border);}
    .doc-section-body.is-open{display:block;}
    /* Toggle modo adendo */
    .mode-toggle{display:flex;gap:var(--space-2);margin-bottom:var(--space-5);}
    .mode-toggle-btn{padding:5px var(--space-4);border-radius:9999px;border:1px solid var(--color-border);background:var(--color-bg);font-size:var(--font-size-sm);cursor:pointer;font-weight:500;transition:all .12s;}
    .mode-toggle-btn.active{background:var(--color-primary);color:#fff;border-color:var(--color-primary);}

    /* ── Histórico de documentos ── */
    .hist-list{display:flex;flex-direction:column;gap:var(--space-3);margin-bottom:var(--space-2);}
    .hist-item{background:var(--color-bg);border:1px solid var(--color-border);border-radius:var(--radius-md);padding:var(--space-3) var(--space-4);}
    .hist-item-row{display:flex;align-items:center;justify-content:space-between;gap:var(--space-3);flex-wrap:wrap;margin-bottom:4px;}
    .hist-item-title{font-size:var(--font-size-sm);font-weight:600;}
    .hist-item-date{font-size:var(--font-size-xs);color:var(--color-text-muted);}
    .hist-item-meta{font-size:var(--font-size-xs);color:var(--color-text-muted);margin-bottom:2px;}
    .hist-item-desc{font-size:var(--font-size-sm);color:var(--color-text);margin-top:var(--space-2);white-space:pre-wrap;}
    .info-section-title{font-size:var(--font-size-xs);font-weight:600;color:var(--color-text-muted);text-transform:uppercase;letter-spacing:.05em;margin:var(--space-5) 0 var(--space-3);border-top:1px solid var(--color-border);padding-top:var(--space-4);}
    .info-section-title:first-child{margin-top:0;border-top:none;padding-top:0;}
  </style>
</head>
<body>

  <header id="app-header">
    <div class="container">
      <div class="header-inner">
        <a href="../index.html" class="header-brand">
          <div class="header-logo-fallback" aria-hidden="true">IFRS</div>
          <div class="header-brand-text">
            <span class="header-brand-name">Central de Estágios</span>
            <span class="header-brand-sub">IFRS Campus Rio Grande</span>
          </div>
        </a>
        <div style="display:flex;align-items:center;gap:var(--space-3);">
          <div id="header-user-area"></div>
          <a href="estagio.html" class="back-link">
            <svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="M9.707 16.707a1 1 0 01-1.414 0l-6-6a1 1 0 010-1.414l6-6a1 1 0 011.414 1.414L5.414 9H17a1 1 0 110 2H5.414l4.293 4.293a1 1 0 010 1.414z" clip-rule="evenodd"/></svg>
            Meus Estágios
          </a>
        </div>
      </div>
    </div>
  </header>

  <main id="main-content">
    <section class="page-hero">
      <div class="container">
        <h1>Acompanhamento de Estágio</h1>
        <p>Acompanhe o andamento do processo e envie documentos quando solicitado.</p>
      </div>
    </section>

    <div class="container" style="padding-top:var(--space-6);padding-bottom:var(--space-12);" id="page-content">
      <div class="loading-page">Carregando seus estágios…</div>
    </div>
  </main>

  <footer id="app-footer">
    <div class="container">
      <div class="footer-inner">
        <span class="footer-copy">&copy; <script>document.write(new Date().getFullYear())</script> Central de Estágios — IFRS Campus Rio Grande</span>
        <nav class="footer-links"><a href="mailto:estagios@riogrande.ifrs.edu.br">estagios@riogrande.ifrs.edu.br</a></nav>
      </div>
    </div>
  </footer>

  <script src="https://accounts.google.com/gsi/client" async></script>
  <script src="../assets/js/utils.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/api.js"></script>
  <script>
    'use strict';

    let _estagios = [];
    let _atual = null;
    let _historico = null;

    /* ── Arquivos selecionados para upload ── */
    const _arquivos = { solicitacao: null, tce: null, tce_nao_obrig: null };

    document.addEventListener('DOMContentLoaded', async () => {
      if (!requireStudentAuth()) return;
      await carregarEstagios();
    });

    /* ════════════════════════════════════════
       CARREGAMENTO
    ════════════════════════════════════════ */
    async function carregarEstagios() {
      try {
        const data = await API.get('listarMeusEstagios', { authToken: getAccessToken() });
        _estagios = Array.isArray(data) ? data : (data.estagios || []);
        renderPaginaPrincipal();
      } catch (err) {
        document.getElementById('page-content').innerHTML =
          `<div class="form-feedback form-feedback--error"><strong>Erro ao carregar.</strong> ${escapeHtml(err.message)}</div>`;
      }
    }

    /* ════════════════════════════════════════
       RENDER PRINCIPAL
    ════════════════════════════════════════ */
    function renderPaginaPrincipal() {
      const c = document.getElementById('page-content');

      if (_estagios.length === 0) {
        c.innerHTML = `
          <div style="text-align:center;padding:var(--space-16);color:var(--color-text-muted)">
            <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" style="margin:0 auto var(--space-4);opacity:.2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12h3.75M9 15h3.75M9 18h3.75m3 .75H18a2.25 2.25 0 002.25-2.25V6.108c0-1.135-.845-2.098-1.976-2.192a48.424 48.424 0 00-1.123-.08m-5.801 0c-.065.21-.1.433-.1.664 0 .414.336.75.75.75h4.5a.75.75 0 00.75-.75 2.25 2.25 0 00-.1-.664m-5.8 0A2.251 2.251 0 0113.5 2.25H15c1.012 0 1.867.668 2.15 1.586m-5.8 0c-.376.023-.75.05-1.124.08C9.095 4.01 8.25 4.973 8.25 6.108V8.25m0 0H4.875c-.621 0-1.125.504-1.125 1.125v11.25c0 .621.504 1.125 1.125 1.125h9.75c.621 0 1.125-.504 1.125-1.125V9.375c0-.621-.504-1.125-1.125-1.125H8.25z"/></svg>
            <p>Você ainda não possui estágios registrados.</p>
            <a href="solicitacao.html" class="btn btn-primary" style="margin-top:var(--space-4)">Solicitar Estágio</a>
          </div>`;
        return;
      }

      // Selector + conteúdo do estágio selecionado
      const opcoes = _estagios.map((e, i) =>
        `<option value="${i}">${escapeHtml(e.id)} — ${escapeHtml(e.empresa)} (${escapeHtml(e.status)})</option>`).join('');

      c.innerHTML = `
        <div class="estagio-selector">
          <label for="sel-estagio">Selecione o estágio:</label>
          <select id="sel-estagio" class="form-control" onchange="selecionarEstagio(this.value)">
            ${opcoes}
          </select>
        </div>
        <div id="estagio-detalhe"></div>`;

      selecionarEstagio(0);
    }

    async function selecionarEstagio(idx) {
      _atual = _estagios[parseInt(idx)] || null;
      _historico = null;
      if (!_atual) return;
      renderDetalhe();
      // Carrega histórico em segundo plano
      try {
        _historico = await apiListarHistoricoEstagio(_atual.id);
      } catch (e) {
        _historico = { error: e.message, relatoriosParciais: [], relatorioFinal: null, adendos: [], documentos: [] };
      }
      const wrap = document.getElementById('wrap-historico');
      if (wrap) wrap.innerHTML = buildSecaoHistorico(_historico);
    }

    /* ════════════════════════════════════════
       RENDER DETALHE DO ESTÁGIO
    ════════════════════════════════════════ */
    function renderDetalhe() {
      const s = _atual;
      const container = document.getElementById('estagio-detalhe');

      // Monta timeline de passos
      const passos = buildTimeline(s.status);

      // Card de ação dependendo do status
      const cardAcao = buildCardAcao(s);

      container.innerHTML = `
        <div class="main-cols">
          <!-- Coluna principal -->
          <div>
            ${cardAcao}
            ${buildSecaoInfoCompleta(s)}
            <div id="wrap-historico">${buildSecaoHistorico(null)}</div>
            ${buildSecaoUploadAvulso()}
          </div>

          <!-- Sidebar: timeline -->
          <div>
            <div class="action-card" style="padding:var(--space-5)">
              <h2 style="margin-bottom:var(--space-5)">Etapas do Processo</h2>
              <div class="timeline">${passos}</div>
            </div>
          </div>
        </div>`;

      // Inicializa uploads
      initUpload('upload-solicitacao', 'solicitacao');
      initUpload('upload-tce', 'tce');
      initUpload('upload-tce-nao', 'tce_nao_obrig');
      initAdendoUpload();
      initUploadAvulso();

      // Inicializa picker de troca de orientador (se visível)
      if (s.status === 'Aceite recusado') inicializarTrocaOrientador();
    }

    /* ════════════════════════════════════════
       SEÇÃO: INFORMAÇÕES COMPLETAS
    ════════════════════════════════════════ */
    function buildSecaoInfoCompleta(s) {
      function infoRow(label, val) {
        return `<div class="info-item"><label>${label}</label><p>${val||'—'}</p></div>`;
      }
      function infoLink(label, url) {
        if (!url) return `<div class="info-item"><label>${label}</label><p>—</p></div>`;
        return `<div class="info-item"><label>${label}</label><p><a href="${escapeHtml(url)}" target="_blank" rel="noopener" style="color:var(--color-primary);text-decoration:none;font-weight:500">Acessar ↗</a></p></div>`;
      }
      return `
        <div class="action-card">
          <h2>Dados do Estágio</h2>

          <p class="info-section-title">Identificação &amp; Período</p>
          <div class="info-grid">
            ${infoRow('ID', `<code style="font-size:12px">${escapeHtml(s.id||'—')}</code>`)}
            ${infoRow('Tipo', escapeHtml(s.tipoEstagio||'—'))}
            ${infoRow('Status', badgeStatus(s.status))}
            ${infoRow('Início', escapeHtml(s.dataInicio||'—'))}
            ${infoRow('Término', escapeHtml(s.dataTermino||'—'))}
            ${infoRow('Carga Horária', escapeHtml(s.cargaHorariaSemanal||'—') + ' h/sem')}
            ${s.horario ? infoRow('Horário', escapeHtml(s.horario)) : ''}
            ${s.turno ? infoRow('Turno', escapeHtml(s.turno)) : ''}
            ${s.semestreAtual ? infoRow('Semestre', escapeHtml(s.semestreAtual)) : ''}
            ${s.formando ? infoRow('Formando', escapeHtml(s.formando)) : ''}
          </div>

          <p class="info-section-title">Empresa &amp; Supervisor</p>
          <div class="info-grid">
            ${infoRow('Empresa', escapeHtml(s.empresa||'—'))}
            ${s.cnpjEmpresa ? infoRow('CNPJ', escapeHtml(s.cnpjEmpresa)) : ''}
            ${infoRow('Supervisor', escapeHtml(s.nomeSupervisor||'—'))}
            ${s.emailSupervisor ? infoRow('E-mail do Supervisor', escapeHtml(s.emailSupervisor)) : ''}
            ${s.nomeAgente ? infoRow('Agente de Integração', escapeHtml(s.nomeAgente)) : ''}
          </div>

          <p class="info-section-title">Orientação &amp; Curso</p>
          <div class="info-grid">
            ${infoRow('Orientador', escapeHtml(s.nomeOrientador||'—'))}
            ${infoRow('Curso', escapeHtml(s.curso||'—'))}
          </div>

          ${(s.remuneracao || s.valorBolsa || s.valorTransporte) ? `
          <p class="info-section-title">Dados Financeiros</p>
          <div class="info-grid">
            ${s.remuneracao     ? infoRow('Remunerado', escapeHtml(s.remuneracao)) : ''}
            ${s.valorBolsa      ? infoRow('Valor da Bolsa', 'R$ ' + escapeHtml(s.valorBolsa)) : ''}
            ${s.valorTransporte ? infoRow('Auxílio-Transporte', 'R$ ' + escapeHtml(s.valorTransporte)) : ''}
          </div>` : ''}

          ${s.planoAtividades ? `
          <p class="info-section-title">Plano de Atividades</p>
          <div style="background:var(--color-bg);border:1px solid var(--color-border);border-radius:var(--radius-md);padding:var(--space-4);font-size:var(--font-size-sm);white-space:pre-wrap;line-height:1.6;margin-bottom:var(--space-2)">
            ${escapeHtml(s.planoAtividades)}
          </div>` : ''}

          <p class="info-section-title">Documentos de Admissão</p>
          <div class="info-grid">
            ${infoLink('Comprovante de Matrícula', s.linkDocMatricula)}
            ${infoLink('Documento de Identidade', s.linkDocIdentidade)}
            ${infoLink('Boletim', s.linkDocBoletim)}
            ${infoLink('Pasta do Estágio no Drive', s.driveUrl)}
          </div>

          ${s.nomeResponsavel ? `
          <p class="info-section-title">Responsável Legal</p>
          <div class="info-grid">
            ${infoRow('Nome', escapeHtml(s.nomeResponsavel))}
            ${s.cpfResponsavel ? infoRow('CPF', escapeHtml(s.cpfResponsavel)) : ''}
            ${s.telResponsavel ? infoRow('Telefone', escapeHtml(s.telResponsavel)) : ''}
          </div>` : ''}

          ${s.observacaoSetor ? `
          <div style="background:var(--color-warning-light);border:1px solid var(--color-warning-border);border-radius:var(--radius-md);padding:var(--space-3) var(--space-4);font-size:var(--font-size-sm);margin-top:var(--space-4)">
            <strong>Observação do setor:</strong> ${escapeHtml(s.observacaoSetor)}
          </div>` : ''}
          ${s.motivoReprovacao ? `
          <div style="background:var(--color-error-light);border:1px solid var(--color-error-border);border-radius:var(--radius-md);padding:var(--space-3) var(--space-4);font-size:var(--font-size-sm);margin-top:var(--space-3)">
            <strong>Motivo da reprovação:</strong> ${escapeHtml(s.motivoReprovacao)}
          </div>` : ''}
        </div>`;
    }

    /* ════════════════════════════════════════
       SEÇÃO: HISTÓRICO DE DOCUMENTOS
    ════════════════════════════════════════ */
    function buildSecaoHistorico(h) {
      if (!h) {
        return `
          <div class="action-card">
            <h2>Histórico de Documentos</h2>
            <p style="color:var(--color-text-muted);font-size:var(--font-size-sm)">Carregando histórico…</p>
          </div>`;
      }
      if (h.error) {
        return `
          <div class="action-card">
            <h2>Histórico de Documentos</h2>
            <p style="color:var(--color-error);font-size:var(--font-size-sm)">Não foi possível carregar o histórico: ${escapeHtml(h.error)}</p>
          </div>`;
      }
      const { relatoriosParciais = [], relatorioFinal = null, adendos = [], documentos = [] } = h;
      const temDados = relatoriosParciais.length || relatorioFinal || adendos.length || documentos.length;
      if (!temDados) {
        return `
          <div class="action-card">
            <h2>Histórico de Documentos</h2>
            <p style="color:var(--color-text-muted);font-size:var(--font-size-sm)">Nenhum documento enviado ainda.</p>
          </div>`;
      }
      let html = `<div class="action-card"><h2>Histórico de Documentos</h2>`;

      if (relatoriosParciais.length) {
        html += `<p class="info-section-title">Relatórios Parciais (${relatoriosParciais.length})</p><div class="hist-list">`;
        relatoriosParciais.forEach(r => {
          html += `<div class="hist-item">
            <div class="hist-item-row">
              <span class="hist-item-title">Período: ${escapeHtml(r.periodoRef||'—')}</span>
              <span class="hist-item-date">${escapeHtml(r.data||'—')}</span>
            </div>
            ${r.avaliacao ? `<div class="hist-item-meta">Avaliação: <strong>${escapeHtml(r.avaliacao)}</strong></div>` : ''}
            ${r.atividades ? `<div class="hist-item-desc">${escapeHtml(r.atividades.substring(0,250))}${r.atividades.length>250?'…':''}</div>` : ''}
          </div>`;
        });
        html += `</div>`;
      }

      if (relatorioFinal) {
        const r = relatorioFinal;
        html += `<p class="info-section-title">Relatório Final</p>
          <div class="hist-item">
            <div class="hist-item-row">
              <span class="hist-item-title">Enviado em ${escapeHtml(r.data||'—')}</span>
              ${r.dataEncerramento ? `<span class="hist-item-date">Encerramento: ${escapeHtml(r.dataEncerramento)}</span>` : ''}
            </div>
            ${r.avalConcedente ? `<div class="hist-item-meta">Empresa: <strong>${escapeHtml(r.avalConcedente)}</strong> · Orientador: <strong>${escapeHtml(r.avalOrientador||'—')}</strong> · Recomendaria: <strong>${escapeHtml(r.recomendaria||'—')}</strong></div>` : ''}
            ${r.resumo ? `<div class="hist-item-desc">${escapeHtml(r.resumo.substring(0,250))}${r.resumo.length>250?'…':''}</div>` : ''}
          </div>`;
      }

      if (adendos.length) {
        html += `<p class="info-section-title">Adendos ao TCE (${adendos.length})</p><div class="hist-list">`;
        adendos.forEach(a => {
          const bc = {'Aprovado':'badge-approved','Reprovado':'badge-rejected','Pendente':'badge-pending'}[a.status]||'badge-closed';
          html += `<div class="hist-item">
            <div class="hist-item-row">
              <span class="hist-item-title">${escapeHtml(a.tipoAdendo||'—')}</span>
              <span class="badge ${bc}">${escapeHtml(a.status||'—')}</span>
            </div>
            <div class="hist-item-date">${escapeHtml(a.data||'—')}</div>
            ${a.justificativa ? `<div class="hist-item-desc">${escapeHtml(a.justificativa.substring(0,200))}${a.justificativa.length>200?'…':''}</div>` : ''}
          </div>`;
        });
        html += `</div>`;
      }

      if (documentos.length) {
        html += `<p class="info-section-title">Documentos Enviados (${documentos.length})</p><div class="hist-list">`;
        documentos.forEach(d => {
          html += `<div class="hist-item">
            <div class="hist-item-row">
              <span class="hist-item-title">${escapeHtml(d.titulo||'—')}</span>
              <span class="hist-item-date">${escapeHtml(d.data||'—')}</span>
            </div>
            <div class="hist-item-meta">Enviado por: ${escapeHtml(d.perfil==='Admin'?'Setor de Estágios':'Você')}</div>
            ${d.linkDrive ? `<a href="${escapeHtml(d.linkDrive)}" target="_blank" rel="noopener" class="btn btn-secondary btn-sm" style="margin-top:var(--space-2)">
              <svg width="14" height="14" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M3 17a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm3.293-7.707a1 1 0 011.414 0L9 10.586V3a1 1 0 112 0v7.586l1.293-1.293a1 1 0 111.414 1.414l-3 3a1 1 0 01-1.414 0l-3-3a1 1 0 010-1.414z" clip-rule="evenodd"/></svg>
              Baixar ↗
            </a>` : ''}
          </div>`;
        });
        html += `</div>`;
      }

      html += `</div>`;
      return html;
    }

    /* ════════════════════════════════════════
       SEÇÃO: UPLOAD DE DOCUMENTO AVULSO

    function buildSecaoUploadAvulso() {
      return `
        <div class="action-card">
          <h2>Enviar Documento</h2>
          <p>Envie arquivos adicionais relacionados ao seu estágio — certificados, comprovantes, declarações ou qualquer outro documento relevante.</p>
          <div id="fb-avulso"></div>
          <div class="form-group">
            <label class="form-label" for="avulso-titulo">Título / Descrição <span style="color:var(--color-error)">*</span></label>
            <input type="text" id="avulso-titulo" class="form-control" placeholder="Ex: Comprovante de matrícula atualizado, Certificado de curso…">
          </div>
          <div class="form-group">
            <label class="form-label">Arquivo PDF <span style="color:var(--color-error)">*</span></label>
            <div class="upload-area" id="drop-avulso" onclick="document.getElementById('upload-avulso').click()">
              <input type="file" id="upload-avulso" accept=".pdf">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 00-3.375-3.375h-1.5A1.125 1.125 0 0113.5 7.125v-1.5a3.375 3.375 0 00-3.375-3.375H8.25m6.75 12H9m1.5-12H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 00-9-9z"/></svg>
              <p>Clique ou arraste o arquivo PDF aqui</p><small>Apenas PDF — máx. 10 MB</small>
            </div>
            <div class="file-selected" id="file-avulso-info"></div>
          </div>
          <button class="btn btn-primary btn-sm" id="btn-avulso" onclick="enviarDocumentoAvulso(this)">Enviar Documento</button>
        </div>`;
    }

    function initUploadAvulso() {
      const input = document.getElementById('upload-avulso');
      if (!input) return;
      input.addEventListener('change', () => {
        const file = input.files[0];
        if (!file) return;
        if (file.type !== 'application/pdf') { alert('Apenas arquivos PDF são aceitos.'); input.value = ''; return; }
        if (file.size > 10 * 1024 * 1024) { alert('Arquivo muito grande. Máximo: 10 MB.'); input.value = ''; return; }
        const info = document.getElementById('file-avulso-info');
        if (info) { info.innerHTML = `✓ ${escapeHtml(file.name)} (${(file.size/1024).toFixed(1)} KB)`; info.classList.add('show'); }
      });
      const drop = document.getElementById('drop-avulso');
      if (!drop) return;
      drop.addEventListener('dragover',  e => { e.preventDefault(); drop.classList.add('drag-over'); });
      drop.addEventListener('dragleave', ()  => drop.classList.remove('drag-over'));
      drop.addEventListener('drop', e => {
        e.preventDefault(); drop.classList.remove('drag-over');
        const file = e.dataTransfer.files[0];
        if (file) { input.files = e.dataTransfer.files; input.dispatchEvent(new Event('change')); }
      });
    }

    async function enviarDocumentoAvulso(btn) {
      const titulo = document.getElementById('avulso-titulo')?.value.trim();
      const input  = document.getElementById('upload-avulso');
      const file   = input?.files[0];
      const fbId   = 'fb-avulso';
      if (!titulo || !file) {
        showFormFeedback(fbId, 'error', 'Campos obrigatórios', 'Informe o título e selecione um arquivo PDF.');
        return;
      }
      btn.disabled = true; btn.classList.add('is-loading');
      hideFormFeedback(fbId);
      try {
        await apiUploadDocumentoEstagio(_atual.id, titulo, file);
        showFormFeedback(fbId, 'success', 'Documento enviado!', 'O arquivo foi salvo com sucesso na pasta do estágio.');
        btn.textContent = 'Enviado ✓';
        // Limpa formulário
        document.getElementById('avulso-titulo').value = '';
        input.value = '';
        const info = document.getElementById('file-avulso-info');
        if (info) { info.innerHTML = ''; info.classList.remove('show'); }
        // Recarrega histórico
        const wrap = document.getElementById('wrap-historico');
        if (wrap) wrap.innerHTML = buildSecaoHistorico(null);
        try {
          _historico = await apiListarHistoricoEstagio(_atual.id);
        } catch (e2) {
          _historico = { error: e2.message, relatoriosParciais: [], relatorioFinal: null, adendos: [], documentos: [] };
        }
        const wrap2 = document.getElementById('wrap-historico');
        if (wrap2) wrap2.innerHTML = buildSecaoHistorico(_historico);
        setTimeout(() => { btn.textContent = 'Enviar Documento'; btn.disabled = false; btn.classList.remove('is-loading'); }, 2500);
      } catch (err) {
        showFormFeedback(fbId, 'error', 'Erro ao enviar', err.message);
        btn.disabled = false; btn.classList.remove('is-loading');
      }
    }

      { label: 'Estágio ativo',        desc: 'Processo concluído. Estágio em andamento.' },
    ];
    const STATUS_PASSO_NOVO = {
      'Aguardando aceite orientador': 2,
      'Aceite recusado':              2,
      'Em Checklist':                 3,
      'Em Assinaturas':               4,
      'Ativo':                        11,
      'Encerrado':                    11,
    };

    const STATUSES_NOVO = new Set(['Aguardando aceite orientador','Aceite recusado','Em Checklist','Em Assinaturas','Ativo']);

    function buildTimeline(status) {
      if (STATUSES_NOVO.has(status)) {
        const etapa    = STATUS_PASSO_NOVO[status] || 1;
        const recusado = status === 'Aceite recusado';
        return PASSOS_NOVO.map((p, i) => {
          const num = i + 1;
          let cls = 'timeline-dot--pending';
          let label = p.label;
          if (recusado && num === 2) { cls = 'timeline-dot--error'; label = 'Aceite recusado — escolha outro orientador'; }
          else if (num < etapa) cls = 'timeline-dot--done';
          else if (num === etapa) cls = 'timeline-dot--active';
          return `
            <div class="timeline-item">
              <div class="timeline-dot ${cls}">${(num < etapa && !recusado) || (recusado && num < 2) ? '✓' : num}</div>
              <div class="timeline-label">${escapeHtml(label)}</div>
              <div class="timeline-desc">${escapeHtml(p.desc)}</div>
            </div>`;
        }).join('');
      }

      // Fluxo antigo
      const etapaAtual = STATUS_PASSO_ANTIGO[status] || 1;
      const reprovado  = status === 'Reprovado';
      return PASSOS_ANTIGO.map((p, i) => {
        const num = i + 1;
        let cls = 'timeline-dot--pending';
        let label = p.label;
        if (reprovado && num === 2) { cls = 'timeline-dot--error'; label = 'Reprovado'; }
        else if (num < etapaAtual) cls = 'timeline-dot--done';
        else if (num === etapaAtual) cls = 'timeline-dot--active';
        return `
          <div class="timeline-item">
            <div class="timeline-dot ${cls}">${num < etapaAtual ? '✓' : num}</div>
            <div class="timeline-label">${escapeHtml(label)}</div>
            <div class="timeline-desc">${escapeHtml(p.desc)}</div>
          </div>`;
      }).join('');
    }

        'Aprovado':                  '✅ Solicitação aprovada. Em breve o fluxo de assinaturas será iniciado.',

    function initUpload(inputId, key) {
      const input = document.getElementById(inputId);
      if (!input) return;
      input.addEventListener('change', () => {
        const file = input.files[0];
        if (!file) return;
        if (file.type !== 'application/pdf') { alert('Apenas arquivos PDF são aceitos.'); input.value = ''; return; }
        if (file.size > 10 * 1024 * 1024) { alert('Arquivo muito grande. Máximo: 10 MB.'); input.value = ''; return; }
        _arquivos[key] = file;
        const infoId = { solicitacao: 'file-sol-info', tce: 'file-tce-info', tce_nao_obrig: 'file-tce-nao-info' }[key];
        const info = document.getElementById(infoId);
        if (info) {
          info.innerHTML = `✓ ${escapeHtml(file.name)} (${(file.size/1024).toFixed(1)} KB)`;
          info.classList.add('show');
        }
      });

      // Drag & drop
      const dropId = { solicitacao: 'drop-solicitacao', tce: 'drop-tce', tce_nao_obrig: 'drop-tce-nao' }[key];
      const drop = document.getElementById(dropId);
      if (!drop) return;
      drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('drag-over'); });
      drop.addEventListener('dragleave', () => drop.classList.remove('drag-over'));
      drop.addEventListener('drop', e => {
        e.preventDefault(); drop.classList.remove('drag-over');
        const file = e.dataTransfer.files[0];
        if (file) { input.files = e.dataTransfer.files; input.dispatchEvent(new Event('change')); }
      });
    }

    async function enviarDocumentos() {
      const btn = document.getElementById('btn-enviar-docs');
      const feedbackId = 'feedback-upload';

      // Valida arquivos
      const tipo = _atual?.tipoEstagio;
      const temSol = _arquivos.solicitacao;
      const temTce = tipo === 'Obrigatório' ? _arquivos.tce : _arquivos.tce_nao_obrig;

      if (!temSol || !temTce) {
        showFormFeedback(feedbackId, 'error', 'Arquivos obrigatórios', 'Selecione todos os documentos antes de enviar.');
        return;
      }

      btn.classList.add('is-loading'); btn.disabled = true;
      hideFormFeedback(feedbackId);

      try {
        // Converte arquivos para base64
        const [b64Sol, b64Tce] = await Promise.all([
          fileToBase64(tipo === 'Obrigatório' ? _arquivos.tce : _arquivos.tce_nao_obrig),
          fileToBase64(_arquivos.solicitacao),
        ]);

        await API.post('enviarDocumentosAssinados', {
          idEstagio: _atual.id,
          authToken: getAccessToken(),
          arquivos: {
            tce:        { nome: (tipo === 'Obrigatório' ? _arquivos.tce : _arquivos.tce_nao_obrig).name, base64: b64Sol },
            solicitacao:{ nome: _arquivos.solicitacao.name, base64: b64Tce },
          },
        });

        showFormFeedback(feedbackId, 'success', 'Documentos enviados!',
          'O setor de estágios irá revisar e encaminhar ao Diretor Geral. Você será notificado por e-mail.');
        btn.textContent = 'Enviado ✓';

        // Recarrega após 3s para atualizar status
        setTimeout(() => carregarEstagios(), 3000);
      } catch (err) {
        showFormFeedback(feedbackId, 'error', 'Erro no envio', err.message);
        btn.classList.remove('is-loading'); btn.disabled = false;
      }
    }

    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload  = () => resolve(reader.result.split(',')[1]);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

      } catch (err) {
        showFormFeedback(fbId, 'error', 'Erro ao enviar', err.message);
        btn.disabled = false; btn.classList.remove('is-loading');
      }
    }

    /* ════════════════════════════════════════
       ENVIO — ADENDO (upload)
    ════════════════════════════════════════ */
    async function submitAdendoUpload(btn) {
      const fbId        = 'fb-adendo';
      const tipoAdendo  = document.getElementById('adendo-tipoAdendo-up')?.value;
      const justificativa = document.getElementById('adendo-justificativa-up')?.value.trim();
      const fileInput   = document.getElementById('upload-adendo');
      const file        = fileInput?.files[0];

      if (!tipoAdendo || !justificativa || !file) {
        showFormFeedback(fbId, 'error', 'Campos obrigatórios', 'Selecione o tipo, informe a justificativa e anexe o PDF do adendo.');
        return;
      }
      btn.disabled = true; btn.classList.add('is-loading');
      hideFormFeedback(fbId);
      try {
        const b64 = await fileToBase64(file);
        await API.post('enviarAdendo', {
          authToken:   getAccessToken(),
          idEstagio:   _atual.id,
          tipoAdendo,
          justificativa,
          modoAnexo:   true,
          arquivo:     { nome: file.name, base64: b64 },
        });
        showFormFeedback(fbId, 'success', 'Adendo enviado!',
          'Seu documento de adendo foi recebido e será analisado pelo setor de estágios.');
        btn.textContent = 'Enviado ✓';
      } catch (err) {
        showFormFeedback(fbId, 'error', 'Erro ao enviar', err.message);
        btn.disabled = false; btn.classList.remove('is-loading');
      }
    }

    /* ════════════════════════════════════════
       HELPERS
    ════════════════════════════════════════ */
    function badgeStatus(status) {
      const m = {
        'Pendente':                       'badge-pending',
        'Em análise':                     'badge-analysis',
        'Aguardando Documentos':          'badge-approved',
        'Docs Enviados':                  'badge-docs',
        'Aguardando DG':                  'badge-dg',
        'Aguardando Validação Final':     'badge-dg',
        'Em execução':                    'badge-running',
        'Em Checklist':                   'badge-analysis',
        'Em Assinaturas':                 'badge-docs',
        'Ativo':                          'badge-running',
        'Encerrado':                      'badge-closed',
        'Reprovado':                      'badge-rejected',
        'Aguardando aceite orientador':   'badge-waiting',
        'Aceite recusado':                'badge-refused',
      };
      return `<span class="badge ${m[status]||'badge-closed'}">${escapeHtml(status||'—')}</span>`;
    }

    /* ════════════════════════════════════════
       TROCAR ORIENTADOR
    ════════════════════════════════════════ */
    let _orientadoresTroca = [];

    async function carregarOrientadoresTroca() {
      if (_orientadoresTroca.length) return; // já carregado
      try {
        const lista = await apiListarOrientadores(_atual?.curso || '');
        _orientadoresTroca = Array.isArray(lista) ? lista : [];
      } catch (e) {
        _orientadoresTroca = [];
      }
    }

    // Chamado quando o DOM do card "Aceite recusado" é montado
    async function inicializarTrocaOrientador() {
      await carregarOrientadoresTroca();
      const loading = document.getElementById('trocar-ori-loading');
      const form    = document.getElementById('trocar-ori-form');
      const sel     = document.getElementById('sel-novo-ori');
      if (!loading || !form || !sel) return;

      if (!_orientadoresTroca.length) {
        loading.textContent = 'Nenhum orientador disponível. Entre em contato com o setor de estágios.';
        return;
      }

      sel.innerHTML = '<option value="">Escolha um orientador…</option>' +
        _orientadoresTroca.map(o =>
          `<option value="${escapeHtml(o.email)}" data-nome="${escapeHtml(o.nome)}">${escapeHtml(o.nome)}</option>`
        ).join('');

      loading.style.display = 'none';
      form.style.display    = '';
    }

    async function confirmarTrocaOrientador() {
      const sel  = document.getElementById('sel-novo-ori');
      const fbId = 'fb-trocar-ori';
      if (!sel || !sel.value) {
        showFormFeedback(fbId, 'error', 'Selecione um orientador', 'Escolha um orientador da lista antes de continuar.');
        return;
      }
      const emailOri = sel.value;
      const nomeOri  = sel.options[sel.selectedIndex]?.dataset?.nome || sel.value;
      const btn      = document.querySelector('#trocar-ori-form .btn-primary');
      if (btn) { btn.disabled = true; btn.classList.add('is-loading'); }
      hideFormFeedback(fbId);
      try {
        await apiTrocarOrientador({
          authToken:       getAccessToken(),
          idEstagio:       _atual.id,
          nomeOrientador:  nomeOri,
          emailOrientador: emailOri,
        });
        showFormFeedback(fbId, 'success', 'Solicitação enviada!',
          nomeOri + ' receberá um e-mail para aceitar a orientação. Você será notificado por e-mail.');
        if (btn) { btn.textContent = 'Enviado ✓'; }
        setTimeout(() => carregarEstagios(), 3000);
      } catch (err) {
        showFormFeedback(fbId, 'error', 'Erro ao trocar orientador', err.message);
        if (btn) { btn.disabled = false; btn.classList.remove('is-loading'); }
      }
    }
  </script>
</body>
