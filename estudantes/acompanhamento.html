<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" href="../assets/img/fav.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acompanhamento de Estágio — Central de Estágios IFRS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <link rel="stylesheet" href="../assets/css/layout.css">
  <style>
    /* ── Seletor de estágio ── */
    .estagio-selector{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-lg);padding:var(--space-5);margin-bottom:var(--space-6);}
    .estagio-selector label{font-size:var(--font-size-sm);font-weight:500;display:block;margin-bottom:var(--space-2);}

    /* ── Abas ── */
    .ficha-tabs{display:flex;gap:0;border-bottom:2px solid var(--color-border);margin-bottom:var(--space-6);}
    .ficha-tab{padding:var(--space-3) var(--space-5);font-size:var(--font-size-sm);font-weight:500;cursor:pointer;border:none;background:none;color:var(--color-text-muted);border-bottom:2px solid transparent;margin-bottom:-2px;transition:all 0.15s;display:flex;align-items:center;gap:var(--space-2);white-space:nowrap;}
    .ficha-tab.active{color:var(--color-primary);border-bottom-color:var(--color-primary);}
    .ficha-tab:hover:not(.active){color:var(--color-text);}
    .tab-count{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;border-radius:9999px;font-size:11px;background:var(--color-bg);padding:0 6px;}
    .ficha-tab.active .tab-count{background:var(--color-primary);color:#fff;}
    .tab-count:empty{display:none;}

    /* ── Hero subtítulo ── */
    #hero-sub{display:flex;align-items:center;gap:var(--space-3);flex-wrap:wrap;margin-top:4px;font-size:var(--font-size-sm);}
    .hero-sep{opacity:.4;}

    /* ── Timeline de status ── */
    .timeline{position:relative;padding-left:var(--space-10);margin-bottom:var(--space-8);}
    .timeline::before{content:'';position:absolute;left:20px;top:12px;bottom:12px;width:2px;background:var(--color-border);}
    .timeline-item{position:relative;margin-bottom:var(--space-6);}
    .timeline-item:last-child{margin-bottom:0;}
    .timeline-dot{position:absolute;left:-32px;top:4px;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;border:2px solid;}
    .timeline-dot--done    {background:var(--color-success);border-color:var(--color-success);color:#fff;}
    .timeline-dot--active  {background:var(--color-primary);border-color:var(--color-primary);color:#fff;box-shadow:0 0 0 4px rgba(26,58,107,.15);}
    .timeline-dot--pending {background:var(--color-surface);border-color:var(--color-border);color:var(--color-text-light);}
    .timeline-dot--error   {background:var(--color-error);border-color:var(--color-error);color:#fff;}
    .timeline-label{font-size:var(--font-size-sm);font-weight:600;margin-bottom:2px;}
    .timeline-desc {font-size:var(--font-size-xs);color:var(--color-text-muted);line-height:1.5;}
    .timeline-date {font-size:var(--font-size-xs);color:var(--color-text-light);margin-top:2px;}

    /* ── Card de ação ── */
    .action-card{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-lg);padding:var(--space-6);margin-bottom:var(--space-6);}
    .action-card h2{font-size:var(--font-size-md);font-weight:600;margin-bottom:var(--space-2);}
    .action-card p {font-size:var(--font-size-sm);color:var(--color-text-muted);margin-bottom:var(--space-5);}
    .action-card--highlight{border-color:var(--color-primary);background:var(--color-info-light);}

    /* ── Upload ── */
    .upload-area{border:2px dashed var(--color-border);border-radius:var(--radius-md);padding:var(--space-8);text-align:center;cursor:pointer;transition:all .15s;background:var(--color-bg);}
    .upload-area:hover,.upload-area.drag-over{border-color:var(--color-primary);background:var(--color-info-light);}
    .upload-area input{display:none;}
    .upload-area svg{width:40px;height:40px;margin:0 auto var(--space-3);color:var(--color-text-muted);}
    .upload-area p{font-size:var(--font-size-sm);color:var(--color-text-muted);margin-bottom:var(--space-1);}
    .upload-area small{font-size:var(--font-size-xs);color:var(--color-text-light);}
    .file-selected{display:none;align-items:center;gap:var(--space-2);padding:var(--space-3) var(--space-4);background:var(--color-success-light);border-radius:var(--radius-md);font-size:var(--font-size-sm);color:var(--color-success);}
    .file-selected.show{display:flex;}

    /* ── Detail grid (legado) ── */
    .detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-2) var(--space-6);margin-bottom:var(--space-6);}
    @media(max-width:560px){.detail-grid{grid-template-columns:1fr;}}
    .detail-item label{font-size:var(--font-size-xs);color:var(--color-primary);display:block;margin-bottom:1px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;}
    .detail-item p{font-size:var(--font-size-sm);word-break:break-word;margin-bottom:var(--space-2);}
    .detail-full{grid-column:1/-1;}
    /* ── Dados do Estágio — cards ── */
    .d-wrap{display:flex;flex-direction:column;gap:var(--space-4);}
    .d-row{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-4);}
    @media(max-width:680px){.d-row{grid-template-columns:1fr;}}
    .d-card{background:var(--color-surface,#fff);border:1px solid var(--color-border);border-radius:var(--radius-lg,8px);padding:var(--space-5);}
    .d-card-hdr{display:flex;align-items:center;gap:10px;margin-bottom:var(--space-4);padding-bottom:var(--space-3);border-bottom:1px solid var(--color-border);}
    .d-icon{width:32px;height:32px;min-width:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;}
    .d-card-ttl{font-size:var(--font-size-sm);font-weight:700;color:var(--color-text);}
    .d-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:0 var(--space-5);}
    .d-field label{font-size:var(--font-size-xs);color:var(--color-primary);font-weight:600;text-transform:uppercase;letter-spacing:.04em;display:block;margin-bottom:2px;}
    .d-field p{font-size:var(--font-size-sm);word-break:break-word;margin-bottom:var(--space-3);margin-top:0;}
    .d-full{grid-column:1/-1;}

    /* ── Tabela (avaliações) ── */
    .table-wrap{overflow-x:auto;border-radius:var(--radius-lg);border:1px solid var(--color-border);background:var(--color-surface);}
    .data-table{width:100%;border-collapse:collapse;font-size:var(--font-size-sm);}
    .data-table th{background:var(--color-bg);padding:var(--space-3) var(--space-4);text-align:left;font-weight:600;font-size:var(--font-size-xs);color:var(--color-text-muted);text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--color-border);white-space:nowrap;}
    .data-table td{padding:var(--space-3) var(--space-4);border-bottom:1px solid var(--color-border);vertical-align:middle;}
    .data-table tr:last-child td{border-bottom:none;}
    .data-table tr:hover td{background:#F9FAFB;}

    /* ── Avulso list (documentos) ── */
    .avulso-list{display:flex;flex-direction:column;gap:var(--space-3);margin-bottom:var(--space-2);}
    .avulso-item{background:var(--color-bg);border:1px solid var(--color-border);border-radius:var(--radius-md);padding:var(--space-3) var(--space-4);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:var(--space-3);}
    .avulso-item-info{flex:1;}
    .avulso-item-title{font-size:var(--font-size-sm);font-weight:600;}
    .avulso-item-meta{font-size:var(--font-size-xs);color:var(--color-text-muted);margin-top:2px;}

    /* ── Badge status ── */
    .badge{display:inline-flex;align-items:center;gap:4px;padding:3px 12px;border-radius:9999px;font-size:12px;font-weight:600;}
    .badge::before{content:'';display:inline-block;width:6px;height:6px;border-radius:50%;background:currentColor;flex-shrink:0;}
    .badge-pending {background:var(--color-warning-light);color:var(--color-warning);}
    .badge-analysis{background:var(--color-info-light);color:var(--color-info);}
    .badge-approved{background:var(--color-success-light);color:var(--color-success);}
    .badge-docs    {background:#EDE9FE;color:#7C3AED;}
    .badge-dg      {background:#FEF3C7;color:#92400E;}
    .badge-running {background:var(--color-success-light);color:#065F46;}
    .badge-closed  {background:var(--color-bg);color:var(--color-text-muted);}
    .badge-rejected{background:var(--color-error-light);color:var(--color-error);}
    .badge-waiting {background:#FEF9C3;color:#854D0E;}
    .badge-refused {background:var(--color-error-light);color:var(--color-error);}

    /* ── Trocar orientador ── */
    .trocar-ori-box{margin-top:var(--space-4);padding:var(--space-4);background:#fff;border:1px solid var(--color-border);border-radius:var(--radius-md);}
    .trocar-ori-box h3{font-size:var(--font-size-sm);font-weight:600;margin-bottom:var(--space-3);}

    /* ── Layout ── */
    .main-cols{display:grid;grid-template-columns:1fr 320px;gap:var(--space-6);}
    @media(max-width:900px){.main-cols{grid-template-columns:1fr;}}

    .loading-page{text-align:center;padding:var(--space-16);color:var(--color-text-muted);}

    /* ── Seções de documentos ── */
    .doc-sections-wrap{margin-top:var(--space-2);}
    .doc-sections-title{font-size:var(--font-size-sm);font-weight:600;color:var(--color-text-muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:var(--space-3);}
    .doc-section{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-lg);margin-bottom:var(--space-3);overflow:hidden;}
    .doc-section-hdr{display:flex;align-items:center;justify-content:space-between;padding:var(--space-4) var(--space-5);cursor:pointer;user-select:none;transition:background .12s;}
    .doc-section-hdr:hover{background:var(--color-bg);}
    .doc-section-hdr h3{font-size:var(--font-size-sm);font-weight:600;margin:0;display:flex;align-items:center;gap:var(--space-2);}
    .doc-section-hdr .ds-chevron{width:18px;height:18px;color:var(--color-text-muted);transition:transform .2s;flex-shrink:0;}
    .doc-section-hdr.is-open .ds-chevron{transform:rotate(180deg);}
    .doc-section-body{display:none;padding:var(--space-5);border-top:1px solid var(--color-border);}
    .doc-section-body.is-open{display:block;}
    .mode-toggle{display:flex;gap:var(--space-2);margin-bottom:var(--space-5);}
    .mode-toggle-btn{padding:5px var(--space-4);border-radius:9999px;border:1px solid var(--color-border);background:var(--color-bg);font-size:var(--font-size-sm);cursor:pointer;font-weight:500;transition:all .12s;}
    .mode-toggle-btn.active{background:var(--color-primary);color:#fff;border-color:var(--color-primary);}

    /* ── Histórico ── */
    .hist-list{display:flex;flex-direction:column;gap:var(--space-3);margin-bottom:var(--space-2);}
    .hist-item{background:var(--color-bg);border:1px solid var(--color-border);border-radius:var(--radius-md);padding:var(--space-3) var(--space-4);}
    .hist-item-row{display:flex;align-items:center;justify-content:space-between;gap:var(--space-3);flex-wrap:wrap;margin-bottom:4px;}
    .hist-item-title{font-size:var(--font-size-sm);font-weight:600;}
    .hist-item-date{font-size:var(--font-size-xs);color:var(--color-text-muted);}
    .hist-item-meta{font-size:var(--font-size-xs);color:var(--color-text-muted);margin-bottom:2px;}
    .hist-item-desc{font-size:var(--font-size-sm);color:var(--color-text);margin-top:var(--space-2);white-space:pre-wrap;}
    .info-section-title{font-size:var(--font-size-xs);font-weight:600;color:var(--color-text-muted);text-transform:uppercase;letter-spacing:.05em;margin:var(--space-5) 0 var(--space-3);border-top:1px solid var(--color-border);padding-top:var(--space-4);}
    .info-section-title:first-child{margin-top:0;border-top:none;padding-top:0;}
  </style>
</head>
<body>

  <header id="app-header">
    <div class="container">
      <div class="header-inner">
        <a href="../index.html" class="header-brand">
          <span class="header-logo-wrap"><img src="../assets/img/logo-ifrs.png" alt="IFRS" class="header-logo"></span>
        </a>
        <div style="display:flex;align-items:center;gap:var(--space-3);">
          <div id="header-user-area"></div>
          <a href="estagio.html" class="back-link">
            <svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="M9.707 16.707a1 1 0 01-1.414 0l-6-6a1 1 0 010-1.414l6-6a1 1 0 011.414 1.414L5.414 9H17a1 1 0 110 2H5.414l4.293 4.293a1 1 0 010 1.414z" clip-rule="evenodd"/></svg>
            Meus Estágios
          </a>
        </div>
      </div>
    </div>
  </header>

  <main id="main-content">
    <section class="page-hero">
      <div class="container">
        <h1 id="hero-titulo">Acompanhamento de Estágio</h1>
        <div id="hero-sub"></div>
      </div>
    </section>

    <div class="container" style="padding-top:var(--space-6);padding-bottom:var(--space-12);" id="page-content">
      <div class="loading-page">Carregando seus estágios…</div>
    </div>
  </main>

  <footer id="app-footer">
    <div class="container">
      <div class="footer-inner">
        <span class="footer-copy">&copy; <script>document.write(new Date().getFullYear())</script> Central de Estágios — IFRS Campus Rio Grande</span>
        <nav class="footer-links"><a href="mailto:estagios@riogrande.ifrs.edu.br">estagios@riogrande.ifrs.edu.br</a></nav>
      </div>
    </div>
  </footer>

  <script src="https://accounts.google.com/gsi/client" async></script>
  <script src="../assets/js/utils.js"></script>
  <script src="../assets/js/notifications-bell.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/api.js"></script>
  <script>
    'use strict';

    let _estagios = [];
    let _atual = null;
    let _historico    = null;
    let _avaliacoes   = [];
    let _ckInfoAluno  = null;
    let _fluxoAluno   = null;
    let _meuperfil = null;  // cache de obterMeuCadastro

    const _arquivos = { solicitacao: null, tce: null, tce_nao_obrig: null };

    document.addEventListener('DOMContentLoaded', async () => {
      if (!requireStudentAuth()) return;
      await carregarEstagios();
    });

    /* ════════════════════════════════════════
       CARREGAMENTO
    ════════════════════════════════════════ */
    async function carregarEstagios() {
      try {
        const data = await API.get('listarMeusEstagios', { authToken: getAccessToken() });
        _estagios = Array.isArray(data) ? data : (data.estagios || []);
        renderPaginaPrincipal();
      } catch (err) {
        document.getElementById('page-content').innerHTML =
          `<div class="form-feedback form-feedback--error"><strong>Erro ao carregar.</strong> ${escapeHtml(err.message)}</div>`;
      }
    }

    /* ════════════════════════════════════════
       RENDER PRINCIPAL
    ════════════════════════════════════════ */
    function renderPaginaPrincipal() {
      const c = document.getElementById('page-content');

      if (_estagios.length === 0) {
        c.innerHTML = `
          <div style="text-align:center;padding:var(--space-16);color:var(--color-text-muted)">
            <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" style="margin:0 auto var(--space-4);opacity:.2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12h3.75M9 15h3.75M9 18h3.75m3 .75H18a2.25 2.25 0 002.25-2.25V6.108c0-1.135-.845-2.098-1.976-2.192a48.424 48.424 0 00-1.123-.08m-5.801 0c-.065.21-.1.433-.1.664 0 .414.336.75.75.75h4.5a.75.75 0 00.75-.75 2.25 2.25 0 00-.1-.664m-5.8 0A2.251 2.251 0 0113.5 2.25H15c1.012 0 1.867.668 2.15 1.586m-5.8 0c-.376.023-.75.05-1.124.08C9.095 4.01 8.25 4.973 8.25 6.108V8.25m0 0H4.875c-.621 0-1.125.504-1.125 1.125v11.25c0 .621.504 1.125 1.125 1.125h9.75c.621 0 1.125-.504 1.125-1.125V9.375c0-.621-.504-1.125-1.125-1.125H8.25z"/></svg>
            <p>Você ainda não possui estágios registrados.</p>
            <a href="solicitacao.html" class="btn btn-primary" style="margin-top:var(--space-4)">Solicitar Estágio</a>
          </div>`;
        return;
      }

      const selectorHtml = _estagios.length > 1
        ? `<div class="estagio-selector">
             <label for="sel-estagio">Selecione o estágio:</label>
             <select id="sel-estagio" class="form-control" onchange="selecionarEstagio(this.value)">
               ${_estagios.map((e, i) =>
                 `<option value="${i}">${escapeHtml(e.id)} — ${escapeHtml(e.empresa)} (${escapeHtml(e.status)})</option>`
               ).join('')}
             </select>
           </div>`
        : '';

      c.innerHTML = `
        ${selectorHtml}
        <div id="ficha-tabs-wrap">
          <div class="ficha-tabs" role="tablist">
            <button class="ficha-tab active" data-tab="andamento" onclick="mudarAba('andamento')" role="tab">
              <svg width="14" height="14" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm1-12a1 1 0 10-2 0v4a1 1 0 00.293.707l2.828 2.829a1 1 0 101.415-1.415L11 9.586V6z" clip-rule="evenodd"/></svg>
              Andamento
            </button>
            <button class="ficha-tab" data-tab="dados" onclick="mudarAba('dados')" role="tab">
              <svg width="14" height="14" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M4 4a2 2 0 012-2h4.586A2 2 0 0112 2.586L15.414 6A2 2 0 0116 7.414V16a2 2 0 01-2 2H6a2 2 0 01-2-2V4zm2 6a1 1 0 011-1h6a1 1 0 110 2H7a1 1 0 01-1-1zm1 3a1 1 0 100 2h6a1 1 0 100-2H7z" clip-rule="evenodd"/></svg>
              Dados
            </button>
            <button class="ficha-tab" data-tab="documentos" onclick="mudarAba('documentos')" role="tab">
              <svg width="14" height="14" viewBox="0 0 20 20" fill="currentColor"><path d="M9 2a2 2 0 00-2 2v8a2 2 0 002 2h6a2 2 0 002-2V6.414A2 2 0 0016.414 5L14 2.586A2 2 0 0012.586 2H9z"/><path d="M3 8a2 2 0 012-2v10h8a2 2 0 01-2 2H5a2 2 0 01-2-2V8z"/></svg>
              Documentos
            </button>
            <button class="ficha-tab" data-tab="adendos" onclick="mudarAba('adendos')" role="tab">
              <svg width="14" height="14" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M17.707 9.293a1 1 0 010 1.414l-7 7a1 1 0 01-1.414 0l-7-7A.997.997 0 012 10V5a3 3 0 013-3h5c.256 0 .512.098.707.293l7 7zM5 6a1 1 0 100-2 1 1 0 000 2z" clip-rule="evenodd"/></svg>
              Adendos
              <span class="tab-count" id="cnt-adendos"></span>
            </button>
            <button class="ficha-tab" data-tab="avaliacoes" onclick="mudarAba('avaliacoes')" role="tab">
              <svg width="14" height="14" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M9 2a1 1 0 000 2h2a1 1 0 100-2H9z"/><path fill-rule="evenodd" d="M4 5a2 2 0 012-2 3 3 0 003 3h2a3 3 0 003-3 2 2 0 012 2v11a2 2 0 01-2 2H6a2 2 0 01-2-2V5zm9.707 5.707a1 1 0 00-1.414-1.414L9 12.586l-1.293-1.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/></svg>
              Avaliações
              <span class="tab-count" id="cnt-avaliacoes"></span>
            </button>
            <button class="ficha-tab" data-tab="parecer" onclick="mudarAba('parecer')" role="tab">
              <svg width="14" height="14" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/></svg>
              Parecer Final
              <span class="tab-count" id="cnt-parecer"></span>
            </button>
          </div>
          <div id="tab-andamento"></div>
          <div id="tab-dados" hidden></div>
          <div id="tab-documentos" hidden></div>
          <div id="tab-adendos" hidden></div>
          <div id="tab-avaliacoes" hidden></div>
          <div id="tab-parecer" hidden></div>
        </div>`;

      selecionarEstagio(0);
    }

    async function selecionarEstagio(idx) {
      _atual = _estagios[parseInt(idx)] || null;
      _historico = null;
      _avaliacoes = [];
      if (!_atual) return;

      // Atualiza hero
      const _heroTitulo = document.getElementById('hero-titulo');
      if (_heroTitulo) _heroTitulo.textContent = 'Estágio ' + _atual.id;
      document.title = 'Estágio ' + _atual.id + ' — Central de Estágios IFRS';
      const sub = document.getElementById('hero-sub');
      if (sub) {
        sub.innerHTML =
          escapeHtml(_atual.nomeEstudante || '—') +
          '<span class="hero-sep">·</span>' +
          escapeHtml(_atual.empresa || '—') +
          '<span class="hero-sep">·</span>' +
          badgeStatus(_atual.status);
      }

      renderDetalhe();

      // Carrega histórico e avaliações em segundo plano
      try {
        [_historico, _avaliacoes, _ckInfoAluno, _fluxoAluno] = await Promise.all([
          apiListarHistoricoEstagio(_atual.id),
          API.get('listarAvaliacoesEstagio', { id: _atual.id, authToken: getAccessToken() }).catch(() => []),
          API.get('obterChecklist',          { id: _atual.id }).catch(() => null),
          API.get('obterFluxoAssinaturas',   { id: _atual.id }).catch(() => null),
        ]);
        if (!Array.isArray(_avaliacoes)) _avaliacoes = [];
      } catch (e) {
        _historico = { error: e.message, adendos: [], documentos: [] };
        _avaliacoes = [];
      }

      const wrapDocsAval   = document.getElementById('wrap-docs-aval');
      const wrapDocsParecer= document.getElementById('wrap-docs-parecer');
      const wrapAvulsos    = document.getElementById('wrap-hist-avulsos');
      const wrapAdendos    = document.getElementById('wrap-hist-adendos');
      const wrapAval       = document.getElementById('wrap-hist-aval');
      if (wrapDocsAval)    wrapDocsAval.innerHTML    = buildDocsAvaliacoes();
      if (wrapDocsParecer) wrapDocsParecer.innerHTML = buildDocsParecer(_historico);
      if (wrapAvulsos)     wrapAvulsos.innerHTML     = buildHistoricoAvulsos(_historico);
      if (wrapAdendos)     wrapAdendos.innerHTML     = buildHistoricoAdendos(_historico);
      if (wrapAval)        wrapAval.innerHTML        = buildAvaliacoesContent(_atual);
      document.getElementById('tab-andamento').innerHTML = buildTabAndamento(_atual, _historico, _avaliacoes, _ckInfoAluno, _fluxoAluno);
      document.getElementById('tab-parecer').innerHTML   = buildTabParecer(_historico);
      _atualizarContadores();
    }

    /* ════════════════════════════════════════
       RENDER DETALHE — PREENCHE ABAS
    ════════════════════════════════════════ */
    function renderDetalhe() {
      const s = _atual;

      document.getElementById('tab-andamento').innerHTML  = buildTabAndamento(s);
      document.getElementById('tab-dados').innerHTML      = buildTabDados(s);
      document.getElementById('tab-documentos').innerHTML = buildTabDocumentos(s);
      document.getElementById('tab-adendos').innerHTML    = buildTabAdendos(s);
      document.getElementById('tab-avaliacoes').innerHTML = buildTabAvaliacoes(s);

      initUpload('upload-solicitacao', 'solicitacao');
      initUpload('upload-tce', 'tce');
      initUpload('upload-tce-nao', 'tce_nao_obrig');
      initAdendoUpload();
      initUploadAvulso();

      if (s.status === 'Aceite recusado') inicializarTrocaOrientador();
    }

    function mudarAba(aba) {
      document.querySelectorAll('.ficha-tab').forEach(t =>
        t.classList.toggle('active', t.dataset.tab === aba)
      );
      ['andamento', 'dados', 'documentos', 'adendos', 'avaliacoes', 'parecer'].forEach(id => {
        const el = document.getElementById('tab-' + id);
        if (el) el.hidden = (id !== aba);
      });
    }

    function _atualizarContadores() {
      if (!_historico) return;
      const { adendos = [] } = _historico;
      const cntAdendo  = adendos.length;
      const cntAval    = _avaliacoes.length;
      const temParecer = !!(_historico.parecerFinal && _historico.parecerFinal.pdfUrl);
      const elAdendo   = document.getElementById('cnt-adendos');
      const elAval     = document.getElementById('cnt-avaliacoes');
      const elParecer  = document.getElementById('cnt-parecer');
      if (elAdendo)  elAdendo.textContent  = cntAdendo  > 0 ? String(cntAdendo) : '';
      if (elAval)    elAval.textContent    = cntAval    > 0 ? String(cntAval)   : '';
      if (elParecer) elParecer.textContent = temParecer ? '✓' : '';
    }

    /* ════════════════════════════════════════
       ABA: ANDAMENTO
    ════════════════════════════════════════ */
    function buildTabAndamento(s, hist, avals, ckInfo, fluxoInfo) {
      // Old-flow statuses keep the two-column layout
      var NEW_SET = {'Aguardando aceite orientador':1,'Aceite recusado':1,'Em Checklist':1,
                     'Em Assinaturas':1,'Ativo':1,'Em execução':1,'Encerrado':1,'Concluído':1};
      if (!NEW_SET[s.status]) {
        return '<div class="main-cols">'
          + '<div>' + buildCardAcao(s) + '</div>'
          + '<div><div class="action-card" style="padding:var(--space-5)">'
          + '<h2 style="margin-bottom:var(--space-5)">Etapas do Processo</h2>'
          + '<div class="timeline">' + buildTimeline(s.status) + '</div>'
          + '</div></div></div>';
      }

      // Determine active macro-step (1–7), 8 = all done
      var BASE = {'Aguardando aceite orientador':2,'Aceite recusado':2,'Em Checklist':3,
                  'Em Assinaturas':4,'Ativo':5,'Em execução':5,'Encerrado':7,'Concluído':8};
      var step = BASE[s.status] || 1;
      if (step === 3 && ckInfo && ckInfo.statusGeral === 'aprovado') step = 4;
      if (step === 5 && avals && avals.length) step = 6;
      if (hist && hist.parecerFinal)                                          step = Math.max(step, 7);
      if (hist && hist.parecerFinal && hist.parecerFinal.statusGeral === 'aprovado') step = 8;
      var isErr = s.status === 'Aceite recusado';
      var pct   = Math.min(100, Math.round((step - 1) / 7 * 100));

      function stOf(n) {
        if (n < step)           return 'done';
        if (n === step && n === 8) return 'done';
        if (n === step) return (isErr && n === 2) ? 'error' : 'active';
        return 'pending';
      }

      // ── Stepper ──────────────────────────────────────────────────────────────
      var MACROS = ['Solicitação','Orientador indicado','Checklist','Assinaturas','Estágio Ativo','Avaliações','Parecer Final','Estágio Concluído'];
      var DOT_CLR = {
        done:    'background:var(--color-success);border-color:var(--color-success);color:#fff',
        active:  'background:var(--color-primary);border-color:var(--color-primary);color:#fff',
        error:   'background:var(--color-error);border-color:var(--color-error);color:#fff',
        pending: 'background:var(--color-surface);border-color:var(--color-border);color:var(--color-text-muted)'
      };
      var LBL_CLR = {done:'var(--color-success)',active:'var(--color-primary)',error:'var(--color-error)',pending:'var(--color-text-muted)'};
      var LBL_TXT = {done:'Concluído',active:'Em andamento',error:'Recusado',pending:'Pendente'};

      var stepperHtml = MACROS.map(function(lbl, i) {
        var n   = i + 1;
        var st  = stOf(n);
        var ico = st === 'done' ? '✓' : n;
        var lineColor = (st === 'done' && n < 8) ? 'var(--color-success)' : 'var(--color-border)';
        var line = n < 8
          ? '<div style="position:absolute;top:13px;left:50%;right:-50%;height:2px;z-index:0;background:' + lineColor + '"></div>'
          : '';
        return '<div style="flex:1;min-width:60px;display:flex;flex-direction:column;align-items:center;position:relative">'
          + line
          + '<div style="width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;'
          +   'font-size:11px;font-weight:600;position:relative;z-index:1;border:2px solid;flex-shrink:0;' + DOT_CLR[st] + '">' + ico + '</div>'
          + '<div style="font-size:10px;font-weight:600;margin-top:4px;text-align:center">' + escapeHtml(lbl) + '</div>'
          + '<span style="font-size:9px;color:' + LBL_CLR[st] + '">' + LBL_TXT[st] + '</span>'
          + '</div>';
      }).join('');

      // ── Block builders ────────────────────────────────────────────────────────
      var BADGE_S = {
        done:    'background:#d1fae5;color:#065f46',
        active:  'background:var(--color-info-light);color:var(--color-info)',
        error:   'background:var(--color-error-light);color:var(--color-error)',
        pending: 'background:var(--color-bg);color:var(--color-text-muted)'
      };

      function block(n, title, sub, st, body) {
        var brd   = st === 'active' ? 'border-color:var(--color-primary)'
                  : st === 'error'  ? 'border-color:var(--color-error)' : '';
        var hBg   = st === 'done'   ? 'background:var(--color-bg)'
                  : st === 'active' ? 'background:var(--color-info-light)'
                  : st === 'error'  ? 'background:var(--color-error-light)' : '';
        var tClr  = st === 'active' ? 'color:var(--color-info)'
                  : st === 'error'  ? 'color:var(--color-error)' : '';
        var dSt   = st === 'done'   ? 'background:var(--color-success);border:2px solid var(--color-success);color:#fff'
                  : st === 'active' ? 'background:var(--color-primary);border:2px solid var(--color-primary);color:#fff'
                  : st === 'error'  ? 'background:var(--color-error);border:2px solid var(--color-error);color:#fff'
                  : 'border:1.5px solid var(--color-border);color:var(--color-text-muted)';
        var dIco  = st === 'done' ? '✓' : n;
        var bdg   = '<span style="font-size:10px;padding:2px 9px;border-radius:9999px;font-weight:600;white-space:nowrap;' + BADGE_S[st] + '">' + LBL_TXT[st] + '</span>';
        return '<div style="border-radius:var(--radius-lg);border:1px solid var(--color-border);overflow:hidden;' + brd + '">'
          + '<div style="display:flex;align-items:center;gap:var(--space-3);padding:var(--space-3) var(--space-4);' + hBg + '">'
          +   '<div style="width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;flex-shrink:0;' + dSt + '">' + dIco + '</div>'
          +   '<div style="flex:1">'
          +     '<div style="font-size:var(--font-size-sm);font-weight:600;' + tClr + '">' + n + '. ' + escapeHtml(title) + '</div>'
          +     '<div style="font-size:var(--font-size-xs);color:var(--color-text-muted);margin-top:2px">' + escapeHtml(sub) + '</div>'
          +   '</div>'
          +   bdg
          + '</div>'
          + (body ? '<div style="padding:var(--space-3) var(--space-4) var(--space-4) 46px;border-top:1px solid var(--color-border);'
          +         'font-size:var(--font-size-sm);color:var(--color-text-muted);line-height:1.6;background:var(--color-surface)">' + body + '</div>' : '')
          + '</div>';
      }

      function btns(html) { return '<div style="display:flex;flex-wrap:wrap;gap:var(--space-2);margin-top:var(--space-3)">' + html + '</div>'; }
      function sdot(n)    { return '<div style="width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:600;flex-shrink:0;border:1.5px solid var(--color-border);color:var(--color-text-muted)">' + n + '</div>'; }

      // ── Per-step content ──────────────────────────────────────────────────────
      var st1=stOf(1), st2=stOf(2), st3=stOf(3), st4=stOf(4), st5=stOf(5), st6=stOf(6), st7=stOf(7);
      // Etapas padrão quando fluxo ainda não carregou
      var ASS_DEF = ['Estudante / Responsável Legal','Empresa concedente','Central de Estágios (revisão)','Direção-Geral','Central de Estágios (finalização)'];
      var assEtapas = (fluxoInfo && fluxoInfo.etapas) ? fluxoInfo.etapas : null;
      var assCount  = assEtapas ? assEtapas.length : ASS_DEF.length;

      function assRow(label, status, isoData) {
        var done   = status === 'concluido';
        var active = status === 'aguardando';
        var error  = status === 'rejeitado';
        var dSt = done   ? 'background:var(--color-success);border:1.5px solid var(--color-success);color:#fff'
                : active ? 'background:var(--color-primary);border:1.5px solid var(--color-primary);color:#fff'
                : error  ? 'background:var(--color-error);border:1.5px solid var(--color-error);color:#fff'
                :          'border:1.5px solid var(--color-border);color:var(--color-text-muted)';
        var ico = done ? '✓' : active ? '!' : error ? '✗' : '·';
        var dateStr = (done && isoData)
          ? ' <span style="color:var(--color-text-muted);font-size:9px;margin-left:4px">· ' + fmtIso(isoData) + '</span>' : '';
        var lbl = done   ? '<span style="color:var(--color-success);font-size:9px">Concluído</span>' + dateStr
                : active ? '<span style="color:var(--color-primary);font-size:9px">Em andamento</span>'
                : error  ? '<span style="color:var(--color-error);font-size:9px">Rejeitado</span>'
                :          '<span style="color:var(--color-text-muted);font-size:9px">Aguardando</span>';
        return '<div style="display:flex;align-items:center;gap:var(--space-2);padding:4px 0;font-size:var(--font-size-xs)">'
          + '<div style="width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;flex-shrink:0;' + dSt + '">' + ico + '</div>'
          + '<span style="flex:1">' + escapeHtml(label) + '</span>'
          + lbl + '</div>';
      }
      function assRows(forceStatus) {
        if (assEtapas) {
          return assEtapas.map(function(et) { return assRow(et.label, forceStatus || et.status, et.data); }).join('');
        }
        return ASS_DEF.map(function(l) { return assRow(l, forceStatus || 'pendente'); }).join('');
      }
      var avalD = avals ? avals.filter(function(a){return a.status==='concluido';}).length : 0;
      var avalT = avals ? avals.length : 0;
      var pf    = hist && hist.parecerFinal;

      var nomeOrient = escapeHtml(s.nomeOrientador || 'O orientador indicado');
      var b2body = st2 === 'active'
        ? '<strong>' + nomeOrient + '</strong> foi indicado e receberá um e-mail para aceitar a orientação. O processo só avança após o aceite.<br>'
          + '<span style="font-size:var(--font-size-xs);display:inline-block;margin-top:4px">Sem resposta em 5 dias úteis? Entre em contato com o setor de estágios.</span>'
        : st2 === 'error'
        ? '<strong>' + nomeOrient + '</strong> recusou a orientação. Você precisa indicar outro orientador para prosseguir.'
        : '<strong>' + nomeOrient + '</strong> aceitou a orientação deste estágio.';

      var CK_ORDER  = ['orientador','supervisor','coordenador','admin'];
      var CK_ATORES = ['Orientador acadêmico','Supervisor','Coordenador de curso','Setor de Estágios'];
      var ckAtiva   = ckInfo ? ckInfo.etapaAtiva : null;
      var ckOk      = ckInfo && ckInfo.statusGeral === 'aprovado';
      var ckIdx     = ckAtiva ? CK_ORDER.indexOf(ckAtiva) : -1;

      function ckStOf(i) {
        if (ckOk || (ckIdx > -1 && i < ckIdx)) return 'done';
        if (!ckOk && i === ckIdx)               return 'active';
        return 'pending';
      }
      function fmtIso(iso) {
        if (!iso) return '';
        var p = iso.slice(0,10).split('-');
        return p[2] + '/' + p[1] + '/' + p[0];
      }
      function ckRow(nome, st, isoData) {
        var dSt = st === 'done'   ? 'background:var(--color-success);border:1.5px solid var(--color-success);color:#fff'
                : st === 'active' ? 'background:var(--color-primary);border:1.5px solid var(--color-primary);color:#fff'
                : 'border:1.5px solid var(--color-border);color:var(--color-text-muted)';
        var ico = st === 'done' ? '✓' : st === 'active' ? '!' : '·';
        var dateStr = (st === 'done' && isoData)
          ? ' <span style="color:var(--color-text-muted);font-size:9px;margin-left:4px">· ' + fmtIso(isoData) + '</span>' : '';
        var lbl = st === 'done'   ? '<span style="color:var(--color-success);font-size:9px">Aprovado</span>' + dateStr
                : st === 'active' ? '<span style="color:var(--color-primary);font-size:9px">Em andamento</span>'
                : '<span style="color:var(--color-text-muted);font-size:9px">Aguardando</span>';
        return '<div style="display:flex;align-items:center;gap:var(--space-2);padding:4px 0;font-size:var(--font-size-xs)">'
          + '<div style="width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;flex-shrink:0;' + dSt + '">' + ico + '</div>'
          + '<span style="flex:1">' + escapeHtml(nome) + '</span>'
          + lbl + '</div>';
      }
      var ckListAtivo = '<div style="margin-top:var(--space-2)">'
        + CK_ATORES.map(function(n, i) {
            var d = (ckInfo && ckInfo[CK_ORDER[i]]) ? ckInfo[CK_ORDER[i]].data : null;
            return ckRow(n, ckStOf(i), d);
          }).join('')
        + '</div>';
      var ckListConcluido = '<div style="margin-top:var(--space-2)">'
        + CK_ATORES.map(function(n, i) {
            var d = (ckInfo && ckInfo[CK_ORDER[i]]) ? ckInfo[CK_ORDER[i]].data : null;
            return ckRow(n, 'done', d);
          }).join('')
        + '</div>';

      var b3body = st3 === 'active'
        ? 'Cada ator abaixo precisa validar os dados do estágio antes de prosseguir. Você será notificado por e-mail quando concluído.'
          + ckListAtivo
        : st3 === 'done'
        ? 'Todos os atores validaram os dados do estágio.' + ckListConcluido
        : null;

      var assLink = btns('<a href="../assinaturas/?id=' + encodeURIComponent(s.id) + '" target="_blank" rel="noopener" class="btn btn-secondary btn-sm">Acompanhar Assinaturas ↗</a>');
      var b4subs = (st4 === 'active' || st4 === 'done')
        ? '<div style="margin-top:var(--space-2)">' + assRows(st4 === 'done' ? 'concluido' : null) + '</div>'
          + (st4 === 'active' ? assLink : '')
        : null;

      var b5body = st5 === 'active'
        ? 'Seu estágio está em andamento. Acompanhe avaliações e documentos nas abas acima.'
        : null;

      var b6body = st6 === 'active'
        ? (avalD > 0
            ? avalD + ' avaliação(ões) concluída(s)' + (avalT > avalD ? ' · ' + (avalT - avalD) + ' pendente(s)' : '') + '.'
            : 'As avaliações parciais serão solicitadas ao longo do estágio.')
        : null;

      var b7body = st7 === 'active'
        ? (pf && pf.statusGeral === 'aprovado'
            ? 'Parecer final aprovado' + (pf.dataAprov ? ' em ' + escapeHtml(pf.dataAprov) : '') + '.'
              + btns('<button class="btn btn-secondary btn-sm" data-estagio="' + escapeHtml(s.id) + '" data-tipo="parecer" data-ref="" onclick="enviarDocBtn(this)">✉ Enviar para mim</button>')
            : 'O coordenador de curso e o diretor da área estão analisando o seu estágio.')
        : null;

      var blocks =
          block(1, 'Solicitação enviada',  'Dados e documentos submetidos ao sistema', st1,
                   s.dataSolicitacao ? 'Solicitação enviada em <strong>' + escapeHtml(s.dataSolicitacao) + '</strong>.' : null)
        + block(2, st2==='error' ? 'Aceite recusado' : st2==='active' ? 'Orientador indicado — aguardando aceite' : 'Orientador indicado',
                   st2==='done' ? 'Aceitou a orientação deste estágio' : 'O orientador deve aceitar a indicação por e-mail', st2, b2body)
        + block(3, 'Checklist',            'Orientador, coordenador, supervisor e setor validam os dados',        st3, b3body)
        + block(4, st4==='done' ? 'Assinaturas concluídas' : 'Assinaturas do TCE',
                   assCount + ' etapas de assinatura sequenciais',                     st4, b4subs)
        + block(5, 'Estágio ativo',        'TCE assinado, estágio em execução',         st5, b5body)
        + block(6, 'Avaliações',           'Parciais e final pelo orientador',          st6, b6body)
        + block(7, 'Parecer Final',        'Aprovação pelo coordenador e diretoria',    st7, b7body)
        + block(8, 'Estágio Concluído',   'Registro final do estágio no sistema',      stOf(8),
                   stOf(8) === 'done' ? 'Estágio registrado como concluído. Parabéns!' : null);

      return '<div style="background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-lg);padding:var(--space-5);margin-bottom:var(--space-4)">'
        + '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--space-2)">'
        +   '<span style="font-size:var(--font-size-sm);font-weight:600">Progresso do Estágio</span>'
        +   '<span style="font-size:var(--font-size-sm);font-weight:600;color:var(--color-primary)">' + pct + '%</span>'
        + '</div>'
        + '<div style="height:5px;background:var(--color-border);border-radius:3px;margin:var(--space-2) 0 var(--space-5)">'
        +   '<div style="height:5px;background:var(--color-primary);border-radius:3px;width:' + pct + '%"></div>'
        + '</div>'
        + '<div style="display:flex;overflow-x:auto;gap:0;padding-bottom:2px">' + stepperHtml + '</div>'
        + '</div>'
        + '<div style="display:flex;flex-direction:column;gap:var(--space-2)">' + blocks + '</div>';
    }

    /* ════════════════════════════════════════
       ABA: DADOS
    ════════════════════════════════════════ */
    function buildTabDados(s) {
      return buildSecaoInfoCompleta(s);
    }

    /* ════════════════════════════════════════
       ABA: DOCUMENTOS (leitura — espelho do admin)
    ════════════════════════════════════════ */
    function buildTabDocumentos(s) {
      const sec = (titulo, conteudo) =>
        `<div style="margin-bottom:var(--space-6)">
           <h3 style="font-size:var(--font-size-sm);font-weight:600;margin-bottom:var(--space-4);
                      padding:var(--space-2) var(--space-4);background:var(--color-bg);
                      border-left:3px solid var(--color-primary);
                      border-radius:0 var(--radius-md) var(--radius-md) 0;
                      color:var(--color-text)">${titulo}</h3>
           ${conteudo}
         </div>`;

      const docCard = (titulo, meta, url, labelBtn) =>
        `<div class="avulso-item">
           <div class="avulso-item-info">
             <div class="avulso-item-title">📄 ${escapeHtml(titulo)}</div>
             <div class="avulso-item-meta">${escapeHtml(meta)}</div>
           </div>
           ${url ? `<a href="${escapeHtml(url)}" target="_blank" rel="noopener" class="btn btn-secondary btn-sm">${escapeHtml(labelBtn || 'Abrir ↗')}</a>` : ''}
         </div>`;

      const vazio = msg =>
        `<p style="font-size:var(--font-size-sm);color:var(--color-text-muted)">${msg}</p>`;

      let html = '';

      // ── 1. Documentos de Admissão ─────────────────────────────────────────────
      {
        const admDocs = [
          { num: '1.1', label: 'Comprovante de Matrícula', url: s.linkDocMatricula },
          { num: '1.2', label: 'Documento de Identidade',  url: s.linkDocIdentidade },
          { num: '1.3', label: 'Boletim / Histórico',      url: s.linkDocBoletim },
        ];
        html += sec('1. 📄 Documentos de Admissão',
          `<div class="avulso-list">` +
          admDocs.map(d =>
            `<div class="avulso-item">
               <div class="avulso-item-info">
                 <div class="avulso-item-title">📄 ${d.num}. ${escapeHtml(d.label)}</div>
                 <div class="avulso-item-meta">Enviado pelo estudante na solicitação</div>
               </div>
               ${d.url
                 ? `<span style="font-size:var(--font-size-xs);font-weight:600;color:var(--color-success)">✓ Enviado</span>`
                 : `<span style="font-size:var(--font-size-xs);color:var(--color-text-muted)">Não enviado</span>`}
             </div>`
          ).join('') + `</div>`
        );
      }

      // ── 3. Documentos do Fluxo ────────────────────────────────────────────────
      {
        const statusesComFluxo = ['Em Assinaturas','Ativo','Em execução','Encerrado','Concluído',
                                   'Docs Enviados','Aguardando DG','Aguardando Validação Final'];
        const temFluxo = statusesComFluxo.includes(s.status);
        const emAss    = s.status === 'Em Assinaturas';

        let fluxoHtml = '';
        if (temFluxo) {
          // 3.1 Solicitação
          const solBtnHtml = s.checklistPdfUrl
            ? `<button type="button" class="btn btn-secondary btn-sm"
                 data-estagio="${escapeHtml(s.id)}" data-tipo="solicitacao" data-ref=""
                 onclick="enviarDocBtn(this)">✉ Enviar para mim</button>`
            : `<span style="font-size:var(--font-size-xs);color:var(--color-text-muted)">PDF em preparação</span>`;
          fluxoHtml += `<div style="margin-bottom:var(--space-4)">
            <div style="font-size:var(--font-size-xs);font-weight:600;text-transform:uppercase;
                        color:var(--color-text-muted);letter-spacing:.04em;margin-bottom:var(--space-3)">
              📄 2.1 Solicitação de Estágio
            </div>
            <div class="avulso-list">
              <div class="avulso-item">
                <div class="avulso-item-info">
                  <div class="avulso-item-title">📄 Solicitação de Estágio</div>
                  <div class="avulso-item-meta">Documento com assinaturas do checklist</div>
                </div>
                ${solBtnHtml}
              </div>
            </div>
          </div>`;

          // 3.2 TCE
          const tceMeta = emAss
            ? '🔏 Fluxo de assinaturas em andamento'
            : 'Todas as assinaturas concluídas · ✓ Concluído';
          const tceBtnHtml = emAss
            ? `<a href="../assinaturas/?id=${encodeURIComponent(s.id)}" target="_blank" rel="noopener" class="btn btn-secondary btn-sm">Ir para Assinaturas ↗</a>`
            : `<button type="button" class="btn btn-secondary btn-sm"
                 data-estagio="${escapeHtml(s.id)}" data-tipo="tce" data-ref=""
                 onclick="enviarDocBtn(this)">✉ Enviar para mim</button>`;
          fluxoHtml += `<div>
            <div style="font-size:var(--font-size-xs);font-weight:600;text-transform:uppercase;
                        color:var(--color-text-muted);letter-spacing:.04em;margin-bottom:var(--space-3)">
              📄 2.2 TCE — Termo de Compromisso de Estágio
            </div>
            <div class="avulso-list">
              <div class="avulso-item">
                <div class="avulso-item-info">
                  <div class="avulso-item-title">📄 Termo de Compromisso de Estágio (TCE)</div>
                  <div class="avulso-item-meta">${escapeHtml(tceMeta)}</div>
                </div>
                ${tceBtnHtml}
              </div>
            </div>
          </div>`;
        }

        html += sec('2. 📄 Documentos do Fluxo',
          temFluxo ? fluxoHtml : vazio('Os documentos do fluxo estarão disponíveis após aprovação da solicitação.')
        );
      }

      // ── 4. Avaliações de Estágio ─────────────────────────────────────────────
      html += sec('3. 📄 Avaliações de Estágio',
        `<div id="wrap-docs-aval">${buildDocsAvaliacoes()}</div>`
      );

      // ── 5. Parecer Final ─────────────────────────────────────────────────────
      html += sec('4. 📄 Parecer Final',
        `<div id="wrap-docs-parecer">${buildDocsParecer(null)}</div>`
      );

      // ── 6. Demais Documentos ─────────────────────────────────────────────────
      {
        const avulsoUpload = buildSecaoUploadAvulso();
        const avulsoHist   = `<div id="wrap-hist-avulsos">${buildHistoricoAvulsos(null)}</div>`;
        html += sec('5. 📄 Demais Documentos', avulsoUpload + avulsoHist);
      }

      return html;
    }

    /* Seção 4: avaliações concluídas com PDF */
    function buildDocsAvaliacoes() {
      if (!_avaliacoes || !_avaliacoes.length) {
        return `<div style="margin-bottom:var(--space-3)">
          <div style="font-size:var(--font-size-xs);font-weight:600;text-transform:uppercase;color:var(--color-text-muted);letter-spacing:.04em;margin-bottom:var(--space-3)">3.1 Avaliações Parciais</div>
          <p style="font-size:var(--font-size-sm);color:var(--color-text-muted)">Nenhuma avaliação parcial concluída.</p>
        </div>
        <div>
          <div style="font-size:var(--font-size-xs);font-weight:600;text-transform:uppercase;color:var(--color-text-muted);letter-spacing:.04em;margin-bottom:var(--space-3)">3.2 Avaliação Final</div>
          <p style="font-size:var(--font-size-sm);color:var(--color-text-muted)">Avaliação final ainda não concluída.</p>
        </div>`;
      }
      const parciais = _avaliacoes.filter(a => a.tipo !== 'final' && a.status === 'concluido' && a.pdfUrl);
      const final    = _avaliacoes.find(a => a.tipo === 'final' && a.status === 'concluido' && a.pdfUrl);

      let html = `<div style="margin-bottom:var(--space-4)">
        <div style="font-size:var(--font-size-xs);font-weight:600;text-transform:uppercase;color:var(--color-text-muted);letter-spacing:.04em;margin-bottom:var(--space-3)">3.1 Avaliações Parciais</div>`;
      if (parciais.length) {
        html += `<div class="avulso-list">` +
          parciais.map((a, i) => `
            <div class="avulso-item">
              <div class="avulso-item-info">
                <div class="avulso-item-title">📄 Avaliação ${i + 1} — ${escapeHtml(a.periodoRef || a.periodo || '')}</div>
                <div class="avulso-item-meta">✓ Concluída</div>
              </div>
              <button type="button" class="btn btn-secondary btn-sm"
                data-estagio="${escapeHtml(_atual.id)}" data-tipo="avaliacao" data-ref="${escapeHtml(a.avalId)}"
                onclick="enviarDocBtn(this)">✉ Enviar para mim</button>
            </div>`).join('') + `</div>`;
      } else {
        html += `<p style="font-size:var(--font-size-sm);color:var(--color-text-muted)">Nenhuma avaliação parcial concluída.</p>`;
      }
      html += `</div><div>
        <div style="font-size:var(--font-size-xs);font-weight:600;text-transform:uppercase;color:var(--color-text-muted);letter-spacing:.04em;margin-bottom:var(--space-3)">3.2 Avaliação Final</div>`;
      if (final) {
        html += `<div class="avulso-list">
          <div class="avulso-item">
            <div class="avulso-item-info">
              <div class="avulso-item-title">📄 Avaliação Final</div>
              <div class="avulso-item-meta">✓ Concluída</div>
            </div>
            <button type="button" class="btn btn-secondary btn-sm"
              data-estagio="${escapeHtml(_atual.id)}" data-tipo="avaliacao" data-ref="${escapeHtml(final.avalId)}"
              onclick="enviarDocBtn(this)">✉ Enviar para mim</button>
          </div>
        </div>`;
      } else {
        html += `<p style="font-size:var(--font-size-sm);color:var(--color-text-muted)">Avaliação final ainda não concluída.</p>`;
      }
      html += `</div>`;
      return html;
    }

    /* Seção 5: parecer final */
    function buildDocsParecer(h) {
      if (!h) return `<p style="font-size:var(--font-size-sm);color:var(--color-text-muted)">Carregando…</p>`;
      const p = h.parecerFinal;
      if (!p || !p.pdfUrl) {
        return `<p style="font-size:var(--font-size-sm);color:var(--color-text-muted)">Parecer final ainda não concluído.</p>`;
      }
      return `<div class="avulso-list">
        <div class="avulso-item">
          <div class="avulso-item-info">
            <div class="avulso-item-title">📄 Parecer Final de Estágio</div>
            <div class="avulso-item-meta">✓ Concluído${p.dataAprov ? ' · ' + escapeHtml(p.dataAprov) : ''}</div>
          </div>
          <button type="button" class="btn btn-secondary btn-sm"
            data-estagio="${escapeHtml(_atual.id)}" data-tipo="parecer" data-ref=""
            onclick="enviarDocBtn(this)">✉ Enviar para mim</button>
        </div>
      </div>`;
    }

    /* Histórico de documentos avulsos (seção 6) */
    function buildHistoricoAvulsos(h) {
      if (!h) return `<p style="font-size:var(--font-size-sm);color:var(--color-text-muted);margin-top:var(--space-4)">Carregando…</p>`;
      const { documentos = [] } = h;
      if (!documentos.length) return '';
      return `<div class="hist-list" style="margin-top:var(--space-4)">` +
        documentos.map(d =>
          `<div class="hist-item">
            <div class="hist-item-row">
              <span class="hist-item-title">${escapeHtml(d.titulo || '—')}</span>
              <span class="hist-item-date">${escapeHtml(d.data || '—')}</span>
            </div>
            <div class="hist-item-meta">Enviado por: ${escapeHtml(d.perfil === 'Admin' ? 'Setor de Estágios' : 'Você')}${d.nomeArquivo ? ' · ' + escapeHtml(d.nomeArquivo) : ''}</div>
            ${d.linkDrive
              ? `<button type="button" class="btn btn-secondary btn-sm" style="margin-top:var(--space-2)"
                   data-estagio="${escapeHtml(_atual.id)}" data-tipo="avulso" data-ref="${escapeHtml(d.linkDrive)}"
                   onclick="enviarDocBtn(this)">✉ Enviar para mim</button>`
              : ''}
          </div>`
        ).join('') + `</div>`;
    }


    /* ════════════════════════════════════════
       ABA: ADENDOS
    ════════════════════════════════════════ */
    function buildTabAdendos(s) {
      const isAtivo = s.status === 'Ativo' || s.status === 'Em execução';
      const chevron = `<svg class="ds-chevron" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd"/></svg>`;

      const tipoAdendoOpts = `
        <option value="">Selecione o tipo...</option>
        <option value="Prorrogação de estágio">Prorrogação de estágio</option>
        <option value="Alteração de vigência (início e final)">Alteração de vigência (início e final)</option>
        <option value="Alteração de modalidade (obrigatório → não obrigatório)">Alteração de modalidade (obrigatório → não obrigatório)</option>
        <option value="Alteração de modalidade (não obrigatório → obrigatório)">Alteração de modalidade (não obrigatório → obrigatório)</option>
        <option value="Alteração de orientador">Alteração de orientador</option>
        <option value="Alteração de supervisor">Alteração de supervisor</option>
        <option value="Alteração de horário / carga horária">Alteração de horário / carga horária</option>
        <option value="Alteração do plano de atividades">Alteração do plano de atividades</option>
        <option value="Alteração de apólice de seguro">Alteração de apólice de seguro</option>
        <option value="Alteração de local/setor">Alteração de local/setor</option>
        <option value="Alteração de remuneração">Alteração de remuneração</option>
        <option value="Rescisão de estágio">Rescisão de estágio</option>`;

      let html = '';

      if (isAtivo) {
        html += `
        <div class="doc-sections-wrap">
          <p class="doc-sections-title">Nova Solicitação de Adendo</p>
          <div class="doc-section">
            <div class="doc-section-hdr" id="adendo-hdr" onclick="toggleDocSection('adendo')">
              <h3>✏️ Adendo ao TCE</h3>${chevron}
            </div>
            <div class="doc-section-body" id="adendo-body">
              <p style="font-size:var(--font-size-sm);color:var(--color-text-muted);margin-bottom:var(--space-4)">
                Solicite alterações no Termo de Compromisso de Estágio. Preencha o formulário ou, se preferir, anexe um documento já preparado.
              </p>
              <div class="mode-toggle">
                <button class="mode-toggle-btn active" data-modo="form" onclick="setAdendoModo('form')">Preencher formulário</button>
                <button class="mode-toggle-btn" data-modo="upload" onclick="setAdendoModo('upload')">Anexar documento</button>
              </div>

              <!-- Modo formulário -->
              <div id="adendo-form-area">
                <div class="form-group">
                  <label class="form-label">Tipo de Adendo <span style="color:var(--color-error)">*</span></label>
                  <select id="adendo-tipoAdendo" class="form-control" onchange="onAdendoTipoChange()">${tipoAdendoOpts}</select>
                </div>
                <!-- Campos dinâmicos por tipo -->
                <div id="adendo-campos-dinamicos" style="display:none"></div>
                <div id="btn-adendo-wrap" style="display:none;gap:var(--space-2);flex-wrap:wrap">
                  <button class="btn btn-secondary btn-sm" id="btn-adendo-preview" onclick="previewAdendo()">📄 Visualizar Documento</button>
                  <button class="btn btn-primary btn-sm"   id="btn-adendo-form"    onclick="submitAdendoForm(this)">Enviar Adendo</button>
                </div>
                <div id="fb-adendo" style="margin-top:var(--space-3)"></div>
              </div>

              <!-- Modo upload -->
              <div id="adendo-upload-area" style="display:none">
                <div class="form-group">
                  <label class="form-label">Tipo de Adendo <span style="color:var(--color-error)">*</span></label>
                  <select id="adendo-tipoAdendo-up" class="form-control">${tipoAdendoOpts}</select>
                </div>
                <div class="form-group">
                  <label class="form-label">Justificativa <span style="color:var(--color-error)">*</span></label>
                  <textarea id="adendo-justificativa-up" class="form-control" rows="2" placeholder="Motivo da solicitação de alteração..."></textarea>
                </div>
                <div class="form-group">
                  <label class="form-label">Documento do Adendo (PDF) <span style="color:var(--color-error)">*</span></label>
                  <div class="upload-area" id="drop-adendo" onclick="document.getElementById('upload-adendo').click()">
                    <input type="file" id="upload-adendo" accept=".pdf">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 00-3.375-3.375h-1.5A1.125 1.125 0 0113.5 7.125v-1.5a3.375 3.375 0 00-3.375-3.375H8.25m6.75 12H9m1.5-12H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 00-9-9z"/></svg>
                    <p>Clique ou arraste o PDF aqui</p><small>Apenas PDF — máx. 10 MB</small>
                  </div>
                  <div class="file-selected" id="file-adendo-info"></div>
                </div>
                <button class="btn btn-primary btn-sm" onclick="submitAdendoUpload(this)">Enviar Adendo</button>
                <div id="fb-adendo-up" style="margin-top:var(--space-3)"></div>
              </div>
            </div>
          </div>
        </div>`;
      }

      html += `<div id="wrap-hist-adendos">${buildHistoricoAdendos(null)}</div>`;
      return html;
    }

    /* ════════════════════════════════════════
       ABA: AVALIAÇÕES
    ════════════════════════════════════════ */
    function buildTabAvaliacoes(s) {
      return `<div id="wrap-hist-aval">${buildAvaliacoesContent(s)}</div>`;
    }

    /* ════════════════════════════════════════
       ABA: PARECER FINAL
    ════════════════════════════════════════ */
    function buildTabParecer(h) {
      const p = h && h.parecerFinal;

      if (!p) {
        return `<div style="background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-lg);padding:var(--space-6);">
          <h3 style="font-size:var(--font-size-md);font-weight:600;margin-bottom:var(--space-2)">Parecer Final de Estágio</h3>
          <p style="font-size:var(--font-size-sm);color:var(--color-text-muted)">
            O parecer final estará disponível ao término do estágio, após todas as avaliações serem concluídas e aprovadas pelo coordenador de curso e pela diretoria.
          </p>
        </div>`;
      }

      const STATUS_LABEL = {
        aguardando_coordenador: 'Aguardando Coordenador',
        aguardando_diretoria:   'Aguardando Diretoria',
        aguardando_admin:       'Aguardando Aprovação',
        aprovado:               'Aprovado ✓',
      };
      const stLabel  = STATUS_LABEL[p.statusGeral] || escapeHtml(p.statusGeral || '—');
      const aprovado = p.statusGeral === 'aprovado';
      const badgeCls = aprovado ? 'badge-approved' : 'badge-analysis';

      return `<div style="background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-lg);padding:var(--space-5);">
        <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:var(--space-3);margin-bottom:${aprovado && p.pdfUrl ? 'var(--space-4)' : '0'}">
          <div>
            <div style="font-size:var(--font-size-xs);color:var(--color-text-muted);margin-bottom:4px">PARECER FINAL</div>
            <span class="badge ${badgeCls}">${stLabel}</span>
            ${p.dataAprov ? `<span style="font-size:var(--font-size-xs);color:var(--color-text-muted);margin-left:var(--space-3)">${escapeHtml(p.dataAprov)}</span>` : ''}
          </div>
          ${aprovado && p.pdfUrl ? `
          <button type="button" class="btn btn-secondary btn-sm"
            data-estagio="${escapeHtml(_atual.id)}" data-tipo="parecer" data-ref=""
            onclick="enviarDocBtn(this)">✉ Enviar para mim</button>` : ''}
        </div>
        ${!aprovado ? `<p style="font-size:var(--font-size-sm);color:var(--color-text-muted);margin-top:var(--space-3)">O documento ainda está em processo de assinatura. Você receberá uma notificação quando for concluído.</p>` : ''}
      </div>`;
    }

    function buildAvaliacoesContent(s) {
      return buildAvaliacoesPrevistasHtml(s.dataInicio, s.dataTermino, _avaliacoes) +
             buildHistoricoAvaliacoes();
    }

    function buildHistoricoAvaliacoes() {
      const STATUS_LABEL = {
        aguardando_preenchimento:   'Aguardando Preenchimento',
        aguardando_assinatura_2:    'Aguardando 2ª Assinatura',
        aguardando_assinatura_3:    'Aguardando 3ª Assinatura',
        aguardando_aprovacao_admin: 'Aguardando Aprovação da Central',
        concluido:                  'Concluído ✓',
      };

      if (!_avaliacoes.length) {
        return `
          <div class="action-card">
            <h2>Avaliações de Estágio</h2>
            <p style="color:var(--color-text-muted);font-size:var(--font-size-sm)">Nenhuma avaliação iniciada para este estágio. O setor de estágios iniciará as avaliações no momento oportuno.</p>
          </div>`;
      }

      const linhas = _avaliacoes.map(a => {
        const tipoLabel = a.tipo === 'concedente' ? 'Pela Concedente' : 'Pelo Aluno';
        const badgeCls  = a.status === 'concluido' ? 'badge-approved' : 'badge-analysis';
        const badgeTxt  = STATUS_LABEL[a.status] || a.status;
        const dtInicio  = a.tsInicio ? new Date(a.tsInicio).toLocaleDateString('pt-BR') : '—';

        let acoes = '';
        if (a.status === 'concluido' && a.pdfUrl) {
          acoes = `<a href="${escapeHtml(a.pdfUrl)}" target="_blank" rel="noopener" class="btn btn-secondary btn-sm">📄 Abrir PDF ↗</a>`;
        } else if (a.status === 'aguardando_preenchimento' && a.tipo === 'aluno') {
          const avalUrl = `../avaliacoes/?id=${encodeURIComponent(_atual.id)}&aval=${encodeURIComponent(a.avalId || '')}`;
          acoes = `<a href="${escapeHtml(avalUrl)}" class="btn btn-primary btn-sm">Preencher Avaliação ↗</a>`;
        } else {
          acoes = `<span style="font-size:var(--font-size-xs);color:var(--color-text-muted)">Você receberá um e-mail quando for sua vez.</span>`;
        }

        return `
          <tr>
            <td style="font-size:12px">${escapeHtml(tipoLabel)}</td>
            <td style="font-size:12px">${escapeHtml(a.periodoRef || a.periodo || '—')}</td>
            <td><span class="badge ${badgeCls}">${escapeHtml(badgeTxt)}</span></td>
            <td style="font-size:12px">${escapeHtml(dtInicio)}</td>
            <td>${acoes}</td>
          </tr>`;
      }).join('');

      return `
        <div class="action-card">
          <h2>Avaliações de Estágio (${_avaliacoes.length})</h2>
          <div class="table-wrap" style="margin-top:var(--space-4)">
            <table class="data-table">
              <thead>
                <tr>
                  <th>Tipo</th>
                  <th>Período</th>
                  <th>Status</th>
                  <th>Iniciada em</th>
                  <th>Ação</th>
                </tr>
              </thead>
              <tbody>${linhas}</tbody>
            </table>
          </div>
        </div>`;
    }

    /* ════════════════════════════════════════
       SEÇÃO: INFORMAÇÕES COMPLETAS
    ════════════════════════════════════════ */
    function buildSecaoInfoCompleta(s) {
      function dr(label, val) {
        return `<div class="d-field"><label>${label}</label><p>${val || '—'}</p></div>`;
      }
      function drMask(label, val) {
        return `<div class="d-field"><label>${label}</label><p>${val ? escapeHtml(mascararCPF(val)) : '—'}</p></div>`;
      }
      var icoP = `<svg viewBox="0 0 24 24" fill="white" width="16" height="16"><path d="M12 12c2.7 0 5-2.2 5-5s-2.3-5-5-5-5 2.2-5 5 2.3 5 5 5zm0 2c-3.3 0-10 1.7-10 5v2h20v-2c0-3.3-6.7-5-10-5z"/></svg>`;
      var icoG = `<svg viewBox="0 0 24 24" fill="white" width="16" height="16"><path d="M5 13.18v4L12 21l7-3.82v-4L12 17l-7-3.82zM12 3L1 9l11 6 9-4.91V17h2V9L12 3z"/></svg>`;

      // 5. Concedente

      var _tabHor = (function() {

        `<div style="${_Gr};grid-template-columns:repeat(4,1fr);margin-bottom:var(--space-3)">${dr('Início',escapeHtml(s.dataInicio||'—'))}${dr('Término',escapeHtml(s.dataTermino||'—'))}${dr('CH Semanal',_chS)}${dr('CH Total',escapeHtml(s.cargaHorariaTotal||'—'))}</div>`+
        _tabHor+

      var c8 = `<div class="d-field d-full"><div style="line-height:1.7">${s.planoAtividades ? renderAtividades(s.planoAtividades) : '<span style="color:var(--color-text-muted)">—</span>'}</div></div>`;

      var _heroCard = `<div class="d-card" style="display:flex;flex-wrap:wrap;align-items:center;gap:var(--space-4)">

      var h = `<div class="d-wrap">`;

      }
      if (s.motivoReprovacao) {

    /* ════════════════════════════════════════
       HISTÓRICO: ADENDOS
    ════════════════════════════════════════ */
    function buildHistoricoAdendos(h) {
      if (!h) return `
        <div class="action-card" style="margin-top:var(--space-4)">
          <h2>Histórico de Adendos</h2>
          <p style="color:var(--color-text-muted);font-size:var(--font-size-sm)">Carregando…</p>
        </div>`;
      if (h.error) return `
        <div class="action-card" style="margin-top:var(--space-4)">
          <h2>Histórico de Adendos</h2>
          <p style="color:var(--color-error);font-size:var(--font-size-sm)">Não foi possível carregar: ${escapeHtml(h.error)}</p>
        </div>`;

      const { adendos = [] } = h;
      if (!adendos.length) return `
        <div class="action-card" style="margin-top:var(--space-4)">
          <h2>Histórico de Adendos</h2>
          <p style="color:var(--color-text-muted);font-size:var(--font-size-sm)">Nenhum adendo solicitado.</p>
        </div>`;

      let html = `<div class="action-card" style="margin-top:var(--space-4)"><h2>Histórico de Adendos (${adendos.length})</h2><div class="hist-list">`;
      adendos.forEach(a => {
        const badgeCls = {
          'Aprovado':            'badge-approved',
          'Reprovado':           'badge-rejected',
          'Pendente':            'badge-pending',
          'Aguardando Correção': 'badge-closed',
          'Em Assinatura':       'badge-analysis',
          'Assinado':            'badge-approved',
        }[a.status] || 'badge-closed';

        const emAssinatura = a.status === 'Em Assinatura';
        const assinado     = a.status === 'Assinado';
        const idAdendo     = a.idAdendo || a.id || '';
        const idEstagio    = a.idEstagio || _atual.id || '';

        let acaoHtml = '';
        if ((emAssinatura || assinado) && idAdendo) {
          const assUrl = `../assinaturas/adendo.html?id=${encodeURIComponent(idEstagio)}&adendo=${encodeURIComponent(idAdendo)}&token=${encodeURIComponent(a.tokenEstudante || '')}`;
          acaoHtml = `
            <div style="margin-top:8px;">
              <a href="${escapeHtml(assUrl)}" target="_blank" rel="noopener"
                 style="display:inline-flex;align-items:center;gap:6px;font-size:var(--font-size-xs);font-weight:600;
                        color:var(--color-secondary);text-decoration:none;
                        padding:4px 10px;border:1px solid var(--color-secondary);border-radius:var(--radius-sm);
                        background:var(--color-info-light);">
                🔏 ${emAssinatura ? 'Acompanhar / Assinar Aditamento' : 'Ver histórico de assinaturas'} ↗
              </a>
            </div>`;
        }

        html += `<div class="hist-item">
          <div class="hist-item-row">
            <span class="hist-item-title">${escapeHtml(a.tipoAdendo || '—')}</span>
            <span class="badge ${badgeCls}">${escapeHtml(a.status || '—')}</span>
          </div>
          <div class="hist-item-date">${escapeHtml(a.data || '—')}</div>
          ${a.justificativa ? `<div class="hist-item-desc">${escapeHtml(a.justificativa.substring(0, 200))}${a.justificativa.length > 200 ? '…' : ''}</div>` : ''}
          ${acaoHtml}
        </div>`;
      });
      html += `</div></div>`;
      return html;
    }

    /* ════════════════════════════════════════
       SEÇÃO: UPLOAD DE DOCUMENTO AVULSO
    ════════════════════════════════════════ */
    function buildSecaoUploadAvulso() {
      return `
        <div class="action-card" style="margin-top:var(--space-2)">
          <h2>Enviar Documento</h2>
          <p>Envie arquivos adicionais relacionados ao seu estágio — certificados, comprovantes, declarações ou qualquer outro documento relevante.</p>
          <div id="fb-avulso"></div>
          <div class="form-group">
            <label class="form-label" for="avulso-titulo">Título / Descrição <span style="color:var(--color-error)">*</span></label>
            <input type="text" id="avulso-titulo" class="form-control" placeholder="Ex: Comprovante de matrícula atualizado, Certificado de curso…">
          </div>
          <div class="form-group">
            <label class="form-label">Arquivo PDF <span style="color:var(--color-error)">*</span></label>
            <div class="upload-area" id="drop-avulso" onclick="document.getElementById('upload-avulso').click()">
              <input type="file" id="upload-avulso" accept=".pdf">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 00-3.375-3.375h-1.5A1.125 1.125 0 0113.5 7.125v-1.5a3.375 3.375 0 00-3.375-3.375H8.25m6.75 12H9m1.5-12H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 00-9-9z"/></svg>
              <p>Clique ou arraste o arquivo PDF aqui</p><small>Apenas PDF — máx. 10 MB</small>
            </div>
            <div class="file-selected" id="file-avulso-info"></div>
          </div>
          <button class="btn btn-primary btn-sm" id="btn-avulso" onclick="enviarDocumentoAvulso(this)">Enviar Documento</button>
        </div>`;
    }

    function initUploadAvulso() {
      const input = document.getElementById('upload-avulso');
      if (!input) return;
      input.addEventListener('change', () => {
        const file = input.files[0];
        if (!file) return;
        validarPdfArquivo(file,
          (msg) => { showToast(msg, 'error'); input.value = ''; },
          (f)   => {
            const info = document.getElementById('file-avulso-info');
            if (info) { info.innerHTML = `✓ ${escapeHtml(f.name)} (${(f.size / 1024).toFixed(1)} KB)`; info.classList.add('show'); }
          }
        );
      });
      const drop = document.getElementById('drop-avulso');
      if (!drop) return;
      drop.addEventListener('dragover',  e => { e.preventDefault(); drop.classList.add('drag-over'); });
      drop.addEventListener('dragleave', ()  => drop.classList.remove('drag-over'));
      drop.addEventListener('drop', e => {
        e.preventDefault(); drop.classList.remove('drag-over');
        const file = e.dataTransfer.files[0];
        if (file) { input.files = e.dataTransfer.files; input.dispatchEvent(new Event('change')); }
      });
    }

    async function enviarDocumentoAvulso(btn) {
      const titulo = document.getElementById('avulso-titulo')?.value.trim();
      const input  = document.getElementById('upload-avulso');
      const file   = input?.files[0];
      const fbId   = 'fb-avulso';
      if (!titulo || !file) {
        showFormFeedback(fbId, 'error', 'Campos obrigatórios', 'Informe o título e selecione um arquivo PDF.');
        return;
      }
      btn.disabled = true; btn.classList.add('is-loading');
      hideFormFeedback(fbId);
      try {
        await apiUploadDocumentoEstagio(_atual.id, titulo, file);
        showFormFeedback(fbId, 'success', 'Documento enviado!', 'O arquivo foi salvo com sucesso na pasta do estágio.');
        btn.textContent = 'Enviado ✓';
        document.getElementById('avulso-titulo').value = '';
        input.value = '';
        const info = document.getElementById('file-avulso-info');
        if (info) { info.innerHTML = ''; info.classList.remove('show'); }
        // Recarrega histórico
        const wrapAvulsos = document.getElementById('wrap-hist-avulsos');
        if (wrapAvulsos) wrapAvulsos.innerHTML = buildHistoricoAvulsos(null);
        try {

    function initUpload(inputId, key) {
      const input = document.getElementById(inputId);
      if (!input) return;
      input.addEventListener('change', () => {
        const file = input.files[0];
        if (!file) return;
        validarPdfArquivo(file,
          (msg) => { showToast(msg, 'error'); input.value = ''; delete _arquivos[key]; },
          (f)   => {
            _arquivos[key] = f;
            const infoId = { solicitacao: 'file-sol-info', tce: 'file-tce-info', tce_nao_obrig: 'file-tce-nao-info' }[key];
            const info = document.getElementById(infoId);
            if (info) { info.innerHTML = `✓ ${escapeHtml(f.name)} (${(f.size / 1024).toFixed(1)} KB)`; info.classList.add('show'); }
          }
        );
      });
      const dropId = { solicitacao: 'drop-solicitacao', tce: 'drop-tce', tce_nao_obrig: 'drop-tce-nao' }[key];
      const drop = document.getElementById(dropId);
      if (!drop) return;
      drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('drag-over'); });
      drop.addEventListener('dragleave', () => drop.classList.remove('drag-over'));
      drop.addEventListener('drop', e => {
        e.preventDefault(); drop.classList.remove('drag-over');
        const file = e.dataTransfer.files[0];
        if (file) { input.files = e.dataTransfer.files; input.dispatchEvent(new Event('change')); }
      });
    }

    async function enviarDocumentos() {
      const btn = document.getElementById('btn-enviar-docs');
      const feedbackId = 'feedback-upload';
      const tipo = _atual?.tipoEstagio;
      const temSol = _arquivos.solicitacao;
      const temTce = tipo === 'Obrigatório' ? _arquivos.tce : _arquivos.tce_nao_obrig;

      if (!temSol || !temTce) {
        showFormFeedback(feedbackId, 'error', 'Arquivos obrigatórios', 'Selecione todos os documentos antes de enviar.');
        return;
      }

      btn.classList.add('is-loading'); btn.disabled = true;
      hideFormFeedback(feedbackId);

      try {
        const [b64Sol, b64Tce] = await Promise.all([
          fileToBase64(tipo === 'Obrigatório' ? _arquivos.tce : _arquivos.tce_nao_obrig),
          fileToBase64(_arquivos.solicitacao),
        ]);

        await API.post('enviarDocumentosAssinados', {
          idEstagio: _atual.id,
          authToken: getAccessToken(),
          arquivos: {
            tce:        { nome: (tipo === 'Obrigatório' ? _arquivos.tce : _arquivos.tce_nao_obrig).name, base64: b64Sol },
            solicitacao:{ nome: _arquivos.solicitacao.name, base64: b64Tce },
          },
        });

        showFormFeedback(feedbackId, 'success', 'Documentos enviados!',
          'O setor de estágios irá revisar e encaminhar ao Diretor Geral. Você será notificado por e-mail.');
        btn.textContent = 'Enviado ✓';
        setTimeout(() => carregarEstagios(), 3000);
      } catch (err) {
        showFormFeedback(feedbackId, 'error', 'Erro no envio', err.message);
        btn.classList.remove('is-loading'); btn.disabled = false;
      }
    }

    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload  = () => resolve(reader.result.split(',')[1]);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }
