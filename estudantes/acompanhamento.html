    function _cabecalhoAdendo(titulo) {
      return `<div style="text-align:center;font-family:Arial,sans-serif;margin-bottom:8px">
        <div style="width:54px;height:54px;background:#005a2b;color:#fff;font-weight:bold;font-size:13pt;
                    display:flex;align-items:center;justify-content:center;border-radius:6px;
                    margin:0 auto 6px;font-family:Arial,sans-serif">IFRS</div>
        <p style="margin:1px 0;font-size:8pt;font-family:Arial,sans-serif">MINISTÉRIO DA EDUCAÇÃO</p>
        <p style="margin:1px 0;font-size:9pt;font-weight:bold;font-family:Arial,sans-serif">INSTITUTO FEDERAL DE EDUCAÇÃO, CIÊNCIA E TECNOLOGIA DO RIO GRANDE DO SUL</p>
        <p style="margin:1px 0 8px;font-size:8pt;font-family:Arial,sans-serif">Campus Rio Grande</p>
      </div>
      <hr style="border:none;border-top:1px solid #888;margin:0 0 12px">
      <p style="text-align:center;font-family:Arial,sans-serif;font-size:13pt;font-weight:bold;margin:0 0 16px">${titulo}</p>`;
    }

    function _assinHtml(nome, papel) {
      return `<div style="margin-top:50px;text-align:center;font-family:Arial,sans-serif;font-size:10pt">
        <div style="margin:0">_______________________________________</div>
        <div style="font-weight:bold;margin:2px 0">${nome}</div>
        <div style="margin:2px 0">${papel}</div>
      </div>`;
    }

    function _rodapeAdendo(d, opcoes) {
      d = d || {};
      opcoes = opcoes || {};
      const _mesesPt = ['janeiro','fevereiro','março','abril','maio','junho','julho',
                        'agosto','setembro','outubro','novembro','dezembro'];
      const _hoje     = new Date();
      const _dataLinha = 'Rio Grande, ' + _hoje.getDate() + ' de ' + _mesesPt[_hoje.getMonth()] + ' de ' + _hoje.getFullYear() + '.';
      const _nomeAluno = d.nomeAluno ? escapeHtml(d.nomeAluno) : 'ESTAGIÁRIO(A)';
      const _idEstagio = d.idEstagio ? escapeHtml(String(d.idEstagio)) : '—';
      const _dataEmissao = _hoje.toLocaleDateString('pt-BR');

      const _permanencia = opcoes.omitirPermanencia ? '' :
        `<p style="margin-top:16px;font-family:Arial,sans-serif;font-size:10pt">A partir deste adendo, permanecem inalteradas todas as demais disposições do Termo de Compromisso de Estágio e do Plano de Atividades.</p>`;

      return `${_permanencia}
        <p style="font-family:Arial,sans-serif;font-size:10pt">E por estarem de inteiro e comum acordo com as condições e dizeres deste instrumento, as partes assinam-no digitalmente.</p>
        <p style="margin-top:20px;font-family:Arial,sans-serif;font-size:10pt">${_dataLinha}</p>
        ${_assinHtml(_nomeAluno, 'ESTAGIÁRIO(A)')}
        ${_assinHtml('Representante', 'CONCEDENTE')}
        ${_assinHtml('COORDENADOR(A) DO CURSO', 'COORDENADOR(A) DO CURSO')}
        ${_assinHtml('DIRETOR-GERAL DO IFRS – CAMPUS RIO GRANDE', 'INSTITUIÇÃO DE ENSINO')}
        <p style="margin-top:48px;text-align:center;font-family:Arial,sans-serif;font-size:7pt;font-style:italic;color:#777;border-top:1px solid #ccc;padding-top:6px">SGE · IFRS Campus Rio Grande · Visualização gerada em ${_dataEmissao} · ID: ${_idEstagio}</p>`;
    }

    async function previewAdendo() {
      const tipo = document.getElementById('adendo-tipoAdendo')?.value;
      if (!tipo || !ADENDO_TEMPLATES[tipo]) {
        alert('Selecione um tipo de adendo e preencha os campos antes de visualizar.');
        return;
      }
      const s = _atual || {};

      // Carrega perfil do estudante (nome e matrícula oficiais) — uma só vez por sessão
      if (!_meuperfil) {
        try {
          _meuperfil = await API.get('obterMeuCadastro', { authToken: getAccessToken() });
        } catch (_) { _meuperfil = {}; }
      }

      // Coleta dados do formulário dinâmico
      const campos = _coletarCamposDinamicos();

      // Subtipo de remuneração/rescisão (select interno)
      const cfg = ADENDO_CONFIG[tipo];
      if (cfg?.subtipos) {
        const stVal = document.getElementById(cfg.subtipos.id)?.value;
        if (stVal) campos[cfg.subtipos.id.replace('ac-', '')] = stVal;
      }

      // Converte YYYY-MM-DD → DD/MM/YYYY para qualquer campo de data vindo do <input type="date">
      function _isoParaBr(v) {
        if (!v) return null;
        const m = String(v).match(/^(\d{4})-(\d{2})-(\d{2})$/);
        return m ? `${m[3]}/${m[2]}/${m[1]}` : String(v);
      }
      Object.keys(campos).forEach(k => {
        if (/data|inicio|termino|vigencia/i.test(k) && /^\d{4}-\d{2}-\d{2}$/.test(campos[k])) {
          campos[k] = _isoParaBr(campos[k]);
        }
      });

      // Formata CNPJ: 14 dígitos → XX.XXX.XXX/XXXX-XX
      function _fmtCnpj(v) {
        const d = String(v || '').replace(/\D/g, '');
        return d.length === 14 ? d.replace(/^(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})$/, '$1.$2.$3/$4-$5') : (v || '');
      }

      // Empresa: remove CNPJ embutido no nome se existir ("Nome — 12345678000100")
      const _empBruto  = s.empresa || '_______________';
      const _empMatch  = _empBruto.match(/^(.+?)\s*[—–-]+\s*(\d+)\s*$/);
      const _empNome   = _empMatch ? _empMatch[1].trim() : _empBruto;
      const _empCnpj   = _fmtCnpj(s.cnpjEmpresa || (_empMatch ? _empMatch[2] : ''));
      const _nomeEmpresaLabel = _empNome + (_empCnpj ? ', CNPJ: ' + _empCnpj : '');

      const d = {
        idEstagio:         s.id                                             || '',
        dataFirmamentoTCE: s.dataInicio                                    || '___/___/______',
        nomeEmpresa:       _nomeEmpresaLabel,
        nomeAluno:         _meuperfil.nome || s.nomeEstudante              || '_______________',
        curso:             s.curso                                         || '_______________',
        matricula:         _meuperfil.matricula || s.matricula             || '_______________',
        dataInicio:        s.dataInicio                                    || '___/___/______',
        dataTermino:       s.dataTermino                                   || '___/___/______',
        ...campos,
      };

      const tmpl = ADENDO_TEMPLATES[tipo];
      const corpo = typeof tmpl === 'function' ? tmpl(d) : '';

      const modal = document.getElementById('modal-adendo-preview');
      const conteudo = document.getElementById('modal-adendo-corpo');
      if (!modal || !conteudo) return;
      conteudo.innerHTML = corpo;
      modal.style.display = 'flex';
      document.body.style.overflow = 'hidden';
    }

    function fecharPreviewAdendo() {
      const modal = document.getElementById('modal-adendo-preview');
      if (modal) modal.style.display = 'none';
      document.body.style.overflow = '';
    }

    function imprimirAdendo() {
      const conteudo = document.getElementById('modal-adendo-corpo')?.innerHTML || '';
      const janela = window.open('', '_blank');
      janela.document.write(`<!DOCTYPE html><html><head><meta charset="UTF-8">
        <title>Adendo — IFRS Campus Rio Grande</title>
        <style>
          body{font-family:Arial,sans-serif;font-size:10pt;line-height:1.6;margin:56px 72px;color:#222}
          p{margin:4px 0 8px;font-family:Arial,sans-serif;font-size:10pt}
          blockquote{border-left:3px solid #ccc;margin:12px 0;padding:8px 16px;color:#555}
          @page{margin:20mm}
          @media print{body{margin:0}}
        </style>
      </head><body>${conteudo}</body></html>`);
      janela.document.close();
      janela.focus();
      setTimeout(() => janela.print(), 400);
    }
  </script>
