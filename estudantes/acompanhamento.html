       ADENDO — RENDERIZAÇÃO DINÂMICA
    ════════════════════════════════════════ */
    async function onAdendoTipoChange() {
      const tipo      = document.getElementById('adendo-tipoAdendo')?.value;
      const container = document.getElementById('adendo-campos-dinamicos');
      const btnWrap   = document.getElementById('btn-adendo-wrap');
      hideFormFeedback('fb-adendo');

      if (!tipo || !ADENDO_CONFIG[tipo]) {
        if (container) { container.innerHTML = ''; container.style.display = 'none'; }
        if (btnWrap)   btnWrap.style.display = 'none';
        return;
      }

      const cfg = ADENDO_CONFIG[tipo];
      let html = '';

      // Instrução
      if (cfg.instrucao) {
        html += `<p style="font-size:var(--font-size-sm);color:var(--color-text-muted);
                           background:var(--color-bg);border:1px solid var(--color-border);
                           border-radius:var(--radius-md);padding:var(--space-3) var(--space-4);
                           margin-bottom:var(--space-4)">${escapeHtml(cfg.instrucao)}</p>`;
      }

      // Campos diretos (sem subtipos)
      if (cfg.campos) {
        html += renderCamposAdendo(cfg.campos);
      }

      // Tabela de horários — tipo especial
      if (cfg.tipo === 'horario-tabela') {
        html += _buildHorarioTabelaHtml();
      }

      // Subtipos (remuneração, rescisão)
      if (cfg.subtipos) {
        const st = cfg.subtipos;
        html += `
          <div class="form-group">
            <label class="form-label">Tipo de Alteração <span style="color:var(--color-error)">*</span></label>
            <select id="${escapeHtml(st.id)}" class="form-control" onchange="onAdendoSubtipoChange()">
              <option value="">Selecione...</option>
              ${st.opcoes.map(o => `<option value="${escapeHtml(o.value)}">${escapeHtml(o.label)}</option>`).join('')}
            </select>
          </div>
          <div id="adendo-subcampos"></div>`;
      }

      // Justificativa — opcional, sem campo de obs adicionais
      html += `
        <div class="form-group">
          <label class="form-label">Justificativa</label>
          <textarea id="adendo-justificativa" class="form-control" rows="3"
            placeholder="Motivo da solicitação de alteração… (opcional)"></textarea>
        </div>`;

      container.innerHTML = html;
      container.style.display = '';
      if (btnWrap) btnWrap.style.display = 'flex';

      // Tabela de horários: adiciona primeira linha automaticamente
      if (cfg.tipo === 'horario-tabela') {
        adicionarLinhaHorario();
      }

      // Carrega orientadores se necessário
      if (tipo === 'Alteração de orientador') {
        await _carregarSelectOrientadoresAdendo();
      }
    }

    function onAdendoSubtipoChange() {
      const tipo   = document.getElementById('adendo-tipoAdendo')?.value;
      const cfg    = ADENDO_CONFIG[tipo];
      if (!cfg || !cfg.subtipos) return;

      const st       = cfg.subtipos;
      const subtipo  = document.getElementById(st.id)?.value;
      const subcont  = document.getElementById('adendo-subcampos');
      if (!subcont) return;

      if (!subtipo || !st.camposPorSubtipo[subtipo]) {
        subcont.innerHTML = '';

        // Rescisão pela empresa — verifica dados em falta
        if (tipo === 'Rescisão de estágio' && subtipo === 'pela-empresa') {
          subcont.innerHTML = _buildCamposRescisaoEmpresa();
        }
        return;
      }

      const campos = st.camposPorSubtipo[subtipo];
      if (tipo === 'Rescisão de estágio' && subtipo === 'pela-empresa') {
        subcont.innerHTML = _buildCamposRescisaoEmpresa();
      } else {
        subcont.innerHTML = renderCamposAdendo(campos);
      }
    }

    function _buildCamposRescisaoEmpresa() {
      // Mostra apenas campos que NÃO estão preenchidos no estágio atual
      const s = _atual || {};
      let html = '';
      if (!s.enderecoEmpresa)      html += renderCamposAdendo([{ id: 'ac-enderecoEmpresa',    label: 'Endereço da Empresa',                    type: 'text', required: true, placeholder: 'Rua, número, bairro, cidade/UF' }]);
      if (!s.telefoneEmpresa)      html += renderCamposAdendo([{ id: 'ac-telefoneEmpresa',    label: 'Telefone da Empresa',                    type: 'text', required: false, placeholder: 'Ex: (53) 99999-9999' }]);
      if (!s.representanteLegal)   html += renderCamposAdendo([{ id: 'ac-representanteLegal', label: 'Nome do Representante Legal da Empresa', type: 'text', required: true, placeholder: 'Nome completo' }]);
      if (!s.cargoRepresentante)   html += renderCamposAdendo([{ id: 'ac-cargoRepresentante', label: 'Cargo do Representante Legal',           type: 'text', required: true, placeholder: 'Ex: Diretor Administrativo' }]);
      if (!html) html = `<p style="font-size:var(--font-size-sm);color:var(--color-success);margin-bottom:var(--space-4)">✓ Todos os dados da concedente já estão registrados no sistema.</p>`;
      return html;
    }

    function renderCamposAdendo(campos) {
      return campos.map(f => {
        if (f.type === 'checkbox') {
          return `
            <div class="form-group">
              <label style="display:flex;align-items:center;gap:var(--space-2);font-size:var(--font-size-sm);cursor:pointer;font-weight:400">
                <input type="checkbox" id="${escapeHtml(f.id)}"
                  onchange="document.getElementById('${escapeHtml(f.toggleId)}').style.display=this.checked?'':'none'">
                ${escapeHtml(f.label)}
              </label>
            </div>
            <div id="${escapeHtml(f.toggleId)}" style="display:none"></div>`;
        }

        if (f.groupId && f.groupHidden) {
          // Campo dentro de um grupo toggle — renderizado no container do grupo
          const script = `
            <script>
              (function(){
                var g=document.getElementById('${escapeHtml(f.groupId)}');
                if(g) g.innerHTML += ${JSON.stringify(renderCamposAdendo([{...f, groupId:undefined, groupHidden:undefined}]))};
              })();
            </scr` + `ipt>`;
          return script;
        }

        const req  = f.required ? `<span style="color:var(--color-error)">*</span>` : '';
        let input  = '';

        if (f.type === 'select-api') {
          input = `<select id="${escapeHtml(f.id)}" class="form-control">
                     <option value="">Carregando orientadores…</option>
                   </select>`;
        } else if (f.type === 'textarea') {
          input = `<textarea id="${escapeHtml(f.id)}" class="form-control"
                     rows="${f.rows || 3}"
                     placeholder="${escapeHtml(f.placeholder || '')}"></textarea>`;
        } else if (f.type === 'number') {
          input = `<input type="number" id="${escapeHtml(f.id)}" class="form-control"
                     min="${f.min || ''}" max="${f.max || ''}"
                     placeholder="${escapeHtml(f.placeholder || '')}">`;
        } else {
          input = `<input type="${escapeHtml(f.type)}" id="${escapeHtml(f.id)}" class="form-control"
                     placeholder="${escapeHtml(f.placeholder || '')}">`;
        }

        return `<div class="form-group"><label class="form-label">${escapeHtml(f.label)} ${req}</label>${input}</div>`;
      }).join('');
    }

    // Mapa em memória: nome do orientador → e-mail (evita expor PII no DOM)
    let _orientadoresEmailMap = {};

    async function _carregarSelectOrientadoresAdendo() {
      const sel = document.getElementById('ac-nomeNovoOrientador');
      if (!sel) return;
      try {
        const lista = await apiListarOrientadores(_atual?.curso || '');
        const opts  = Array.isArray(lista) ? lista : [];
        _orientadoresEmailMap = {};
        opts.forEach(o => { if (o.nome && o.email) _orientadoresEmailMap[o.nome] = o.email; });
        sel.innerHTML = '<option value="">Selecione um orientador…</option>' +
          opts.map(o => `<option value="${escapeHtml(o.nome)}">${escapeHtml(o.nome)}</option>`).join('');
      } catch (e) {
        sel.innerHTML = '<option value="">Erro ao carregar — tente novamente</option>';
      }
    }

    /* ════════════════════════════════════════
       ADENDO — COLETA CAMPOS DINÂMICOS
    ════════════════════════════════════════ */
    function _coletarCamposDinamicos() {
      // Coleta todos os inputs/selects/textareas com id começando em "ac-"
      const payload = {};
      document.querySelectorAll('[id^="ac-"]').forEach(el => {
        const key = el.id.replace('ac-', '');
        if (el.type === 'checkbox') {
          payload[key] = el.checked;
        } else {
          const val = (el.value || '').trim();
          if (val) payload[key] = val;
        }
      });
      // Orientador: resolve e-mail via mapa em memória (não exposto no DOM)
      const oriSel = document.getElementById('ac-nomeNovoOrientador');
      if (oriSel && oriSel.value) {
        const emailOri = _orientadoresEmailMap[oriSel.value];
        if (emailOri) payload['emailNovoOrientador'] = emailOri;
      }
      // Tabela de horários: serializa como JSON se presente
      const tbody = document.getElementById('horario-tabela-tbody');
      if (tbody) {
        const dias = [];
        Array.from(tbody.rows).forEach(tr => {
          const dia     = (tr.querySelector('.horario-dia')?.value     || '').trim();
          const entrada = (tr.querySelector('.horario-entrada')?.value || '').trim();
          const saida   = (tr.querySelector('.horario-saida')?.value   || '').trim();
          const diaria  = (tr.querySelector('.horario-diaria')?.textContent || '').trim();
          if (dia || entrada || saida) {
            dias.push({ dia, entrada, saida, diaria: diaria !== '—' ? diaria : '' });
          }
        });
        if (dias.length) {
          payload['novoHorario']       = JSON.stringify(dias);
          payload['novaCargaHoraria']  = document.getElementById('horario-total-semanal')?.textContent || '';
        }
      }
      return payload;
    }

    function adicionarLinhaHorario() {
      const tbody = document.getElementById('horario-tabela-tbody');
      if (!tbody) return;
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>
          <select class="form-control horario-dia"
                  style="min-width:150px;font-size:var(--font-size-sm)">
            <option value="">Selecione...</option>
            <option>Segunda-feira</option>
            <option>Terça-feira</option>
            <option>Quarta-feira</option>
            <option>Quinta-feira</option>
            <option>Sexta-feira</option>
            <option>Sábado</option>
            <option>Domingo</option>
          </select>
        </td>
        <td>
          <input type="time" class="form-control horario-entrada"
                 oninput="recalcularLinhaHorario(this.closest('tr'))"
                 style="width:110px;font-size:var(--font-size-sm)">
        </td>
        <td>
          <input type="time" class="form-control horario-saida"
                 oninput="recalcularLinhaHorario(this.closest('tr'))"
                 style="width:110px;font-size:var(--font-size-sm)">
        </td>
        <td>
          <span class="horario-diaria"
                style="font-size:var(--font-size-sm);color:var(--color-text-muted);
                       padding:0 var(--space-2)">—</span>
        </td>
        <td>
          <button type="button"
                  onclick="this.closest('tr').remove();recalcularTotalSemanal()"
                  class="btn btn-secondary btn-sm"
                  style="color:var(--color-error);padding:4px 10px"
                  title="Remover linha">✕</button>
        </td>`;
      tbody.appendChild(tr);
    }

    function recalcularLinhaHorario(tr) {
      if (!tr) return;
      const entrada = tr.querySelector('.horario-entrada')?.value;
      const saida   = tr.querySelector('.horario-saida')?.value;
      const span    = tr.querySelector('.horario-diaria');
      if (!span) return;
      if (entrada && saida) {
        const [eh, em] = entrada.split(':').map(Number);
        const [sh, sm] = saida.split(':').map(Number);
        const mins = (sh * 60 + sm) - (eh * 60 + em);
        if (mins > 0) {
          const h = Math.floor(mins / 60);
          const m = mins % 60;
          span.textContent = h + 'h' + (m ? String(m).padStart(2, '0') + 'min' : '');
          span.style.color = 'var(--color-text)';
        } else {
          span.textContent = '—';
          span.style.color = 'var(--color-error)';
        }
      } else {
        span.textContent = '—';
        span.style.color = 'var(--color-text-muted)';
      }
      recalcularTotalSemanal();
    }

    function recalcularTotalSemanal() {
      const tbody   = document.getElementById('horario-tabela-tbody');
      const totalEl = document.getElementById('horario-total-semanal');
      if (!tbody || !totalEl) return;
      let totalMins = 0;
      Array.from(tbody.rows).forEach(tr => {
        const entrada = tr.querySelector('.horario-entrada')?.value;
        const saida   = tr.querySelector('.horario-saida')?.value;
        if (entrada && saida) {
          const [eh, em] = entrada.split(':').map(Number);
          const [sh, sm] = saida.split(':').map(Number);
          const mins = (sh * 60 + sm) - (eh * 60 + em);
          if (mins > 0) totalMins += mins;
        }
      });
      const h = Math.floor(totalMins / 60);
      const m = totalMins % 60;
      totalEl.textContent = h + 'h' + (m ? String(m).padStart(2, '0') + 'min' : '');
    }

    /* ════════════════════════════════════════
       ENVIO — ADENDO (formulário)
    ════════════════════════════════════════ */
    async function submitAdendoForm(btn) {
      const fbId        = 'fb-adendo';
      const tipoAdendo  = document.getElementById('adendo-tipoAdendo')?.value;
      const justificativa = document.getElementById('adendo-justificativa')?.value?.trim();

      if (!tipoAdendo) {
        showFormFeedback(fbId, 'error', 'Tipo obrigatório', 'Selecione o tipo de adendo.');
        return;
      }
      // Valida campos obrigatórios do tipo selecionado
      const cfg = ADENDO_CONFIG[tipoAdendo];
      const camposObrig = (cfg?.campos || []).filter(f => f.required && f.type !== 'checkbox' && !f.groupHidden);
      for (const f of camposObrig) {
        const el = document.getElementById(f.id);
        if (!el || !el.value.trim()) {
          showFormFeedback(fbId, 'error', 'Campo obrigatório', `Preencha o campo "${f.label}".`);
          el?.focus();
          return;
        }
      }
      // Valida tabela de horários
      if (cfg?.tipo === 'horario-tabela') {
        const tbody = document.getElementById('horario-tabela-tbody');
        const linhasValidas = tbody
          ? Array.from(tbody.rows).filter(tr =>
              tr.querySelector('.horario-dia')?.value &&
              tr.querySelector('.horario-entrada')?.value &&
              tr.querySelector('.horario-saida')?.value)
          : [];
        if (!linhasValidas.length) {
          showFormFeedback(fbId, 'error', 'Horário obrigatório',
            'Adicione pelo menos um dia com dia da semana, entrada e saída preenchidos.');
          return;
        }
      }

      const _tok = getAccessToken();
      if (!_tok) {
        showFormFeedback(fbId, 'error', 'Sessão expirada', 'Sua sessão expirou. Recarregue a página e faça login novamente.');
        return;
      }

      btn.disabled = true; btn.classList.add('is-loading');
      hideFormFeedback(fbId);
      try {
        const camposDinamicos = _coletarCamposDinamicos();
        await API.post('enviarAdendo', {
          authToken:    _tok,
          idEstagio:    _atual.id,
          tipoAdendo,
          justificativa,
          ...camposDinamicos,
        });
        showFormFeedback(fbId, 'success', 'Adendo enviado!',
          'Sua solicitação foi registrada e será analisada pelo setor de estágios.');
        setTimeout(() => window.location.reload(), 1800);
      } catch (err) {
        showFormFeedback(fbId, 'error', 'Erro ao enviar', err.message);
        btn.disabled = false; btn.classList.remove('is-loading');
      }
    }

    /* ════════════════════════════════════════
       ENVIO — ADENDO (upload)
    ════════════════════════════════════════ */
    async function submitAdendoUpload(btn) {
      const fbId          = 'fb-adendo-up';
      const tipoAdendo    = document.getElementById('adendo-tipoAdendo-up')?.value;
      const justificativa = document.getElementById('adendo-justificativa-up')?.value.trim();
      const fileInput     = document.getElementById('upload-adendo');
      const file          = fileInput?.files[0];

      if (!tipoAdendo || !justificativa || !file) {
        showFormFeedback(fbId, 'error', 'Campos obrigatórios', 'Selecione o tipo, informe a justificativa e anexe o PDF do adendo.');
        return;
      }
      const _tok2 = getAccessToken();
      if (!_tok2) {
        showFormFeedback(fbId, 'error', 'Sessão expirada', 'Sua sessão expirou. Recarregue a página e faça login novamente.');
        return;
      }

      btn.disabled = true; btn.classList.add('is-loading');
      hideFormFeedback(fbId);
      try {
        const b64 = await fileToBase64(file);
        await API.post('enviarAdendo', {
          authToken:   _tok2,
          idEstagio:   _atual.id,
          tipoAdendo,
          justificativa,
          modoAnexo:   true,
          arquivo:     { nome: file.name, base64: b64 },
        });
        btn.classList.remove('is-loading');
        btn.textContent = 'Enviado ✓';
        showFormFeedback(fbId, 'success', 'Adendo enviado!',
          'Seu documento de adendo foi recebido e será analisado pelo setor de estágios.');
      } catch (err) {
        showFormFeedback(fbId, 'error', 'Erro ao enviar', err.message);
        btn.disabled = false; btn.classList.remove('is-loading');
      }
    }

    function _cabecalhoAdendo(titulo, subtitulo) {
      const _sub = subtitulo
        ? `<p style="text-align:center;font-family:Arial,sans-serif;font-size:10pt;font-weight:normal;margin:0 0 16px;text-transform:uppercase;letter-spacing:.04em">${escapeHtml(subtitulo)}</p>`
        : '';
      return `<div style="text-align:center;font-family:Arial,sans-serif;margin-bottom:8px">
        <div style="width:54px;height:54px;background:#005a2b;color:#fff;font-weight:bold;font-size:13pt;
                    display:flex;align-items:center;justify-content:center;border-radius:6px;
                    margin:0 auto 6px;font-family:Arial,sans-serif">IFRS</div>
        <p style="margin:1px 0;font-size:8pt;font-family:Arial,sans-serif">MINISTÉRIO DA EDUCAÇÃO</p>
        <p style="margin:1px 0;font-size:9pt;font-weight:bold;font-family:Arial,sans-serif">INSTITUTO FEDERAL DE EDUCAÇÃO, CIÊNCIA E TECNOLOGIA DO RIO GRANDE DO SUL</p>
        <p style="margin:1px 0 8px;font-size:8pt;font-family:Arial,sans-serif">Campus Rio Grande</p>
      </div>
      <hr style="border:none;border-top:1px solid #888;margin:0 0 12px">
      <p style="text-align:center;font-family:Arial,sans-serif;font-size:13pt;font-weight:bold;margin:0 0 4px">${titulo}</p>
      ${_sub}`;
    }

    function _assinHtml(nome, papel) {
      return `<div style="margin-top:50px;text-align:center;font-family:Arial,sans-serif;font-size:10pt">
        <div style="margin:0">_______________________________________</div>
        <div style="font-weight:bold;margin:2px 0">${nome}</div>
        <div style="margin:2px 0">${papel}</div>
      </div>`;
    }

    function _rodapeAdendo(d, opcoes) {
      d = d || {};
      opcoes = opcoes || {};
      const _mesesPt = ['janeiro','fevereiro','março','abril','maio','junho','julho',
                        'agosto','setembro','outubro','novembro','dezembro'];
      const _hoje     = new Date();
      const _dataLinha = 'Rio Grande, ' + _hoje.getDate() + ' de ' + _mesesPt[_hoje.getMonth()] + ' de ' + _hoje.getFullYear() + '.';
      const _nomeAluno = d.nomeAluno ? escapeHtml(d.nomeAluno) : 'ESTAGIÁRIO(A)';
      const _idEstagio = d.idEstagio ? escapeHtml(String(d.idEstagio)) : '—';
      const _dataEmissao = _hoje.toLocaleDateString('pt-BR');

      const _permanencia = opcoes.omitirPermanencia ? '' :
        `<p style="margin-top:16px;font-family:Arial,sans-serif;font-size:10pt">A partir deste adendo, permanecem inalteradas todas as demais disposições do Termo de Compromisso de Estágio e do Plano de Atividades.</p>`;

      return `${_permanencia}
        <p style="font-family:Arial,sans-serif;font-size:10pt">E por estarem de inteiro e comum acordo com as condições e dizeres deste instrumento, as partes assinam-no digitalmente.</p>
        <p style="margin-top:20px;font-family:Arial,sans-serif;font-size:10pt">${_dataLinha}</p>
        ${_assinHtml(_nomeAluno, 'ESTAGIÁRIO(A)')}
        ${_assinHtml('Representante', 'CONCEDENTE')}
        ${_assinHtml('COORDENADOR(A) DO CURSO', 'COORDENADOR(A) DO CURSO')}
        ${_assinHtml('DIRETOR-GERAL DO IFRS – CAMPUS RIO GRANDE', 'INSTITUIÇÃO DE ENSINO')}
        <p style="margin-top:48px;text-align:center;font-family:Arial,sans-serif;font-size:7pt;font-style:italic;color:#777;border-top:1px solid #ccc;padding-top:6px">SGE · IFRS Campus Rio Grande · Visualização gerada em ${_dataEmissao} · ID: ${_idEstagio}</p>`;
    }

    async function previewAdendo() {
      const tipo = document.getElementById('adendo-tipoAdendo')?.value;
      if (!tipo || !ADENDO_TEMPLATES[tipo]) {
        alert('Selecione um tipo de adendo e preencha os campos antes de visualizar.');
        return;
      }
      const s = _atual || {};

      // Carrega perfil do estudante (nome e matrícula oficiais) — uma só vez por sessão
      if (!_meuperfil) {
        try {
          _meuperfil = await API.get('obterMeuCadastro', { authToken: getAccessToken() });
        } catch (_) { _meuperfil = {}; }
      }

      // Coleta dados do formulário dinâmico
      const campos = _coletarCamposDinamicos();

      // Subtipo de remuneração/rescisão (select interno)
      const cfg = ADENDO_CONFIG[tipo];
      if (cfg?.subtipos) {
        const stVal = document.getElementById(cfg.subtipos.id)?.value;
        if (stVal) campos[cfg.subtipos.id.replace('ac-', '')] = stVal;
      }

      // Converte YYYY-MM-DD → DD/MM/YYYY para qualquer campo de data vindo do <input type="date">
      function _isoParaBr(v) {
        if (!v) return null;
        const m = String(v).match(/^(\d{4})-(\d{2})-(\d{2})$/);
        return m ? `${m[3]}/${m[2]}/${m[1]}` : String(v);
      }
      Object.keys(campos).forEach(k => {
        if (/data|inicio|termino|vigencia/i.test(k) && /^\d{4}-\d{2}-\d{2}$/.test(campos[k])) {
          campos[k] = _isoParaBr(campos[k]);
        }
      });

      // Formata CNPJ: 14 dígitos → XX.XXX.XXX/XXXX-XX
      function _fmtCnpj(v) {
        const d = String(v || '').replace(/\D/g, '');
        return d.length === 14 ? d.replace(/^(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})$/, '$1.$2.$3/$4-$5') : (v || '');
      }

      // Empresa: remove CNPJ embutido no nome se existir ("Nome — 12345678000100")
      const _empBruto  = s.empresa || '_______________';
      const _empMatch  = _empBruto.match(/^(.+?)\s*[—–-]+\s*(\d+)\s*$/);
      const _empNome   = _empMatch ? _empMatch[1].trim() : _empBruto;
      const _empCnpj   = _fmtCnpj(s.cnpjEmpresa || (_empMatch ? _empMatch[2] : ''));
      const _nomeEmpresaLabel = _empNome + (_empCnpj ? ', CNPJ: ' + _empCnpj : '');

      const d = {
        idEstagio:         s.id                                             || '',
        tipoAdendo:        tipo,
        dataFirmamentoTCE: s.dataInicio                                    || '___/___/______',
        nomeEmpresa:       _nomeEmpresaLabel,
        nomeAluno:         _meuperfil.nome || s.nomeEstudante              || '_______________',
        curso:             s.curso                                         || '_______________',
        matricula:         _meuperfil.matricula || s.matricula             || '_______________',
        dataInicio:        s.dataInicio                                    || '___/___/______',
        dataTermino:       s.dataTermino                                   || '___/___/______',
        ...campos,
      };

      const tmpl = ADENDO_TEMPLATES[tipo];
      const corpo = typeof tmpl === 'function' ? tmpl(d) : '';

      const modal = document.getElementById('modal-adendo-preview');
      const conteudo = document.getElementById('modal-adendo-corpo');
      if (!modal || !conteudo) return;
      conteudo.innerHTML = corpo;
      modal.style.display = 'flex';
      document.body.style.overflow = 'hidden';
    }

    function fecharPreviewAdendo() {
      const modal = document.getElementById('modal-adendo-preview');
      if (modal) modal.style.display = 'none';
      document.body.style.overflow = '';
    }

    function imprimirAdendo() {
      const conteudo = document.getElementById('modal-adendo-corpo')?.innerHTML || '';
      const janela = window.open('', '_blank');
      janela.document.write(`<!DOCTYPE html><html><head><meta charset="UTF-8">
  <link rel="icon" type="image/png" href="../assets/img/fav.png">
        <title>Adendo — IFRS Campus Rio Grande</title>
        <style>
          body{font-family:Arial,sans-serif;font-size:10pt;line-height:1.6;margin:56px 72px;color:#222}
          p{margin:4px 0 8px;font-family:Arial,sans-serif;font-size:10pt}
          blockquote{border-left:3px solid #ccc;margin:12px 0;padding:8px 16px;color:#555}
          @page{margin:20mm}
          @media print{body{margin:0}}
        </style>
      </head><body>${conteudo}</body></html>`);
      janela.document.close();
      janela.focus();
      setTimeout(() => janela.print(), 400);
    }

    // ── Envio de documento por e-mail ─────────────────────────────────────────
    // Cooldown client-side: evita clique duplo e spam (60s por documento)
    const _envioTimers = {};

    function enviarDocBtn(btn) {
      enviarDoc(btn.dataset.estagio, btn.dataset.tipo, btn.dataset.ref || '', btn);
    }

    async function enviarDoc(idEstagio, tipoDoc, docRef, btn) {
      const key = tipoDoc + '|' + (docRef || idEstagio);
      const agora = Date.now();
      if (_envioTimers[key] && agora - _envioTimers[key] < 60000) {
        const restante = Math.ceil((60000 - (agora - _envioTimers[key])) / 1000);
        _exibirFeedbackEnvio(btn, 'warn', `Aguarde ${restante}s para reenviar.`);
        return;
      }
      const origHtml = btn.innerHTML;
      btn.disabled = true;
      btn.textContent = 'Enviando…';
      try {
        await API.post('enviarDocumentoPorEmail', {
          authToken: getAccessToken(),
          idEstagio,
          tipoDoc,
          docRef: docRef || '',
        });
        _envioTimers[key] = Date.now();
        btn.textContent = '✓ Enviado!';
        btn.style.color = 'var(--color-success)';
        setTimeout(() => {
          btn.innerHTML = origHtml;
          btn.disabled = false;
          btn.style.color = '';
        }, 4000);
      } catch (err) {
        btn.innerHTML = origHtml;
        btn.disabled = false;
        const msg = (err && err.message) ? err.message : 'Erro ao enviar.';
        _exibirFeedbackEnvio(btn, 'error', msg);
      }
    }

    function _exibirFeedbackEnvio(btn, tipo, msg) {
      const cor = tipo === 'error' ? 'var(--color-error)' : 'var(--color-warning, #b45309)';
      const el = document.createElement('span');
      el.style.cssText = `font-size:var(--font-size-xs);color:${cor};margin-left:8px;`;
      el.textContent = msg;
      btn.parentNode.insertBefore(el, btn.nextSibling);
      setTimeout(() => el.remove(), 5000);
    }
    // ── fim envio de documento ────────────────────────────────────────────────

  </script>

  <!-- ── [TESTE] Modal preview adendo ── -->
  <div id="modal-adendo-preview"
       style="display:none;position:fixed;inset:0;z-index:9000;background:rgba(0,0,0,.5);
              align-items:flex-start;justify-content:center;padding:32px 16px;overflow-y:auto">
    <div style="background:#fff;border-radius:8px;max-width:780px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.3)">
      <!-- Header -->
      <div style="display:flex;align-items:center;justify-content:space-between;padding:16px 24px;
                  border-bottom:1px solid #e5e7eb">
        <div>
          <span style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;
                       color:#6b7280;background:#f3f4f6;padding:2px 8px;border-radius:4px">
            🔬 MODO TESTE
          </span>
          <span style="font-size:14px;font-weight:600;margin-left:12px">Visualização do Documento</span>
        </div>
        <button onclick="fecharPreviewAdendo()"
                style="border:none;background:none;font-size:20px;cursor:pointer;color:#6b7280;line-height:1">×</button>
      </div>
      <!-- Corpo do documento -->
      <div id="modal-adendo-corpo"
           style="padding:32px 40px;font-family:Arial,sans-serif;font-size:10pt;line-height:1.6;color:#222"></div>
      <!-- Footer -->
      <div style="display:flex;gap:12px;padding:16px 24px;border-top:1px solid #e5e7eb;justify-content:flex-end">
        <button onclick="fecharPreviewAdendo()"
                style="padding:6px 16px;border:1px solid #d1d5db;border-radius:6px;background:#fff;cursor:pointer;font-size:13px">
          Fechar
        </button>
        <button onclick="imprimirAdendo()"
                style="padding:6px 16px;border:none;border-radius:6px;background:#1a3a6b;color:#fff;cursor:pointer;font-size:13px;font-weight:600">
          🖨️ Imprimir / Baixar PDF
        </button>
      </div>
    </div>
  </div>
</body>
</html>
