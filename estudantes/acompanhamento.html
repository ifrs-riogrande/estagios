<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acompanhamento de Estágio — Central de Estágios IFRS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <link rel="stylesheet" href="../assets/css/layout.css">
  <style>
    /* ── Seletor de estágio ── */
    .estagio-selector{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-lg);padding:var(--space-5);margin-bottom:var(--space-6);}
    .estagio-selector label{font-size:var(--font-size-sm);font-weight:500;display:block;margin-bottom:var(--space-2);}

    /* ── Abas ── */
    .ficha-tabs{display:flex;gap:0;border-bottom:2px solid var(--color-border);margin-bottom:var(--space-6);overflow-x:auto;}
    .ficha-tab{padding:var(--space-3) var(--space-5);font-size:var(--font-size-sm);font-weight:500;cursor:pointer;border:none;background:none;color:var(--color-text-muted);border-bottom:2px solid transparent;margin-bottom:-2px;transition:all 0.15s;display:flex;align-items:center;gap:var(--space-2);white-space:nowrap;}
    .ficha-tab.active{color:var(--color-primary);border-bottom-color:var(--color-primary);}
    .ficha-tab:hover:not(.active){color:var(--color-text);}
    .tab-count{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;border-radius:9999px;font-size:11px;background:var(--color-bg);padding:0 6px;}
    .ficha-tab.active .tab-count{background:var(--color-primary);color:#fff;}
    .tab-count:empty{display:none;}

    /* ── Hero subtítulo ── */
    #hero-sub{display:flex;align-items:center;gap:var(--space-3);flex-wrap:wrap;margin-top:4px;font-size:var(--font-size-sm);}
    .hero-sep{opacity:.4;}

    /* ── Timeline de status ── */
    .timeline{position:relative;padding-left:var(--space-10);margin-bottom:var(--space-8);}
    .timeline::before{content:'';position:absolute;left:20px;top:12px;bottom:12px;width:2px;background:var(--color-border);}
    .timeline-item{position:relative;margin-bottom:var(--space-6);}
    .timeline-item:last-child{margin-bottom:0;}
    .timeline-dot{position:absolute;left:-32px;top:4px;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;border:2px solid;}
    .timeline-dot--done    {background:var(--color-success);border-color:var(--color-success);color:#fff;}
    .timeline-dot--active  {background:var(--color-primary);border-color:var(--color-primary);color:#fff;box-shadow:0 0 0 4px rgba(26,58,107,.15);}
    .timeline-dot--pending {background:var(--color-surface);border-color:var(--color-border);color:var(--color-text-light);}
    .timeline-dot--error   {background:var(--color-error);border-color:var(--color-error);color:#fff;}
    .timeline-label{font-size:var(--font-size-sm);font-weight:600;margin-bottom:2px;}
    .timeline-desc {font-size:var(--font-size-xs);color:var(--color-text-muted);line-height:1.5;}
    .timeline-date {font-size:var(--font-size-xs);color:var(--color-text-light);margin-top:2px;}

    /* ── Card de ação ── */
    .action-card{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-lg);padding:var(--space-6);margin-bottom:var(--space-6);}
    .action-card h2{font-size:var(--font-size-md);font-weight:600;margin-bottom:var(--space-2);}
    .action-card p {font-size:var(--font-size-sm);color:var(--color-text-muted);margin-bottom:var(--space-5);}
    .action-card--highlight{border-color:var(--color-primary);background:var(--color-info-light);}

    /* ── Upload ── */
    .upload-area{border:2px dashed var(--color-border);border-radius:var(--radius-md);padding:var(--space-8);text-align:center;cursor:pointer;transition:all .15s;background:var(--color-bg);}
    .upload-area:hover,.upload-area.drag-over{border-color:var(--color-primary);background:var(--color-info-light);}
    .upload-area input{display:none;}
    .upload-area svg{width:40px;height:40px;margin:0 auto var(--space-3);color:var(--color-text-muted);}
    .upload-area p{font-size:var(--font-size-sm);color:var(--color-text-muted);margin-bottom:var(--space-1);}
    .upload-area small{font-size:var(--font-size-xs);color:var(--color-text-light);}
    .file-selected{display:none;align-items:center;gap:var(--space-2);padding:var(--space-3) var(--space-4);background:var(--color-success-light);border-radius:var(--radius-md);font-size:var(--font-size-sm);color:var(--color-success);}
    .file-selected.show{display:flex;}

    /* ── Detail grid (espelhando admin) ── */
    .detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-4) var(--space-6);margin-bottom:var(--space-6);}
    @media(max-width:560px){.detail-grid{grid-template-columns:1fr;}}
    .detail-item label{font-size:var(--font-size-xs);color:var(--color-text-muted);display:block;margin-bottom:2px;font-weight:500;text-transform:uppercase;letter-spacing:.04em;}
    .detail-item p{font-size:var(--font-size-sm);word-break:break-word;}
    .detail-full{grid-column:1/-1;}

    /* ── Tabela (avaliações) ── */
    .table-wrap{overflow-x:auto;border-radius:var(--radius-lg);border:1px solid var(--color-border);background:var(--color-surface);}
    .data-table{width:100%;border-collapse:collapse;font-size:var(--font-size-sm);}
    .data-table th{background:var(--color-bg);padding:var(--space-3) var(--space-4);text-align:left;font-weight:600;font-size:var(--font-size-xs);color:var(--color-text-muted);text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--color-border);white-space:nowrap;}
    .data-table td{padding:var(--space-3) var(--space-4);border-bottom:1px solid var(--color-border);vertical-align:middle;}
    .data-table tr:last-child td{border-bottom:none;}
    .data-table tr:hover td{background:#F9FAFB;}

    /* ── Avulso list (documentos) ── */
    .avulso-list{display:flex;flex-direction:column;gap:var(--space-3);margin-bottom:var(--space-2);}
    .avulso-item{background:var(--color-bg);border:1px solid var(--color-border);border-radius:var(--radius-md);padding:var(--space-3) var(--space-4);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:var(--space-3);}
    .avulso-item-info{flex:1;}
    .avulso-item-title{font-size:var(--font-size-sm);font-weight:600;}
    .avulso-item-meta{font-size:var(--font-size-xs);color:var(--color-text-muted);margin-top:2px;}

    /* ── Badge status ── */
    .badge{display:inline-flex;align-items:center;gap:4px;padding:3px 12px;border-radius:9999px;font-size:12px;font-weight:600;}
    .badge::before{content:'';display:inline-block;width:6px;height:6px;border-radius:50%;background:currentColor;flex-shrink:0;}
    .badge-pending {background:var(--color-warning-light);color:var(--color-warning);}
    .badge-analysis{background:var(--color-info-light);color:var(--color-info);}
    .badge-approved{background:var(--color-success-light);color:var(--color-success);}
    .badge-docs    {background:#EDE9FE;color:#7C3AED;}
    .badge-dg      {background:#FEF3C7;color:#92400E;}
    .badge-running {background:var(--color-success-light);color:#065F46;}
    .badge-closed  {background:var(--color-bg);color:var(--color-text-muted);}
    .badge-rejected{background:var(--color-error-light);color:var(--color-error);}
    .badge-waiting {background:#FEF9C3;color:#854D0E;}
    .badge-refused {background:var(--color-error-light);color:var(--color-error);}

    /* ── Trocar orientador ── */
    .trocar-ori-box{margin-top:var(--space-4);padding:var(--space-4);background:#fff;border:1px solid var(--color-border);border-radius:var(--radius-md);}
    .trocar-ori-box h3{font-size:var(--font-size-sm);font-weight:600;margin-bottom:var(--space-3);}

    /* ── Layout ── */
    .main-cols{display:grid;grid-template-columns:1fr 320px;gap:var(--space-6);}
    @media(max-width:900px){.main-cols{grid-template-columns:1fr;}}

    .loading-page{text-align:center;padding:var(--space-16);color:var(--color-text-muted);}

    /* ── Seções de documentos ── */
    .doc-sections-wrap{margin-top:var(--space-2);}
    .doc-sections-title{font-size:var(--font-size-sm);font-weight:600;color:var(--color-text-muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:var(--space-3);}
    .doc-section{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-lg);margin-bottom:var(--space-3);overflow:hidden;}
    .doc-section-hdr{display:flex;align-items:center;justify-content:space-between;padding:var(--space-4) var(--space-5);cursor:pointer;user-select:none;transition:background .12s;}
    .doc-section-hdr:hover{background:var(--color-bg);}
    .doc-section-hdr h3{font-size:var(--font-size-sm);font-weight:600;margin:0;display:flex;align-items:center;gap:var(--space-2);}
    .doc-section-hdr .ds-chevron{width:18px;height:18px;color:var(--color-text-muted);transition:transform .2s;flex-shrink:0;}
    .doc-section-hdr.is-open .ds-chevron{transform:rotate(180deg);}
    .doc-section-body{display:none;padding:var(--space-5);border-top:1px solid var(--color-border);}
    .doc-section-body.is-open{display:block;}
    .mode-toggle{display:flex;gap:var(--space-2);margin-bottom:var(--space-5);}
    .mode-toggle-btn{padding:5px var(--space-4);border-radius:9999px;border:1px solid var(--color-border);background:var(--color-bg);font-size:var(--font-size-sm);cursor:pointer;font-weight:500;transition:all .12s;}
    .mode-toggle-btn.active{background:var(--color-primary);color:#fff;border-color:var(--color-primary);}

    /* ── Histórico ── */
    .hist-list{display:flex;flex-direction:column;gap:var(--space-3);margin-bottom:var(--space-2);}
    .hist-item{background:var(--color-bg);border:1px solid var(--color-border);border-radius:var(--radius-md);padding:var(--space-3) var(--space-4);}
    .hist-item-row{display:flex;align-items:center;justify-content:space-between;gap:var(--space-3);flex-wrap:wrap;margin-bottom:4px;}
    .hist-item-title{font-size:var(--font-size-sm);font-weight:600;}
    .hist-item-date{font-size:var(--font-size-xs);color:var(--color-text-muted);}
    .hist-item-meta{font-size:var(--font-size-xs);color:var(--color-text-muted);margin-bottom:2px;}
    .hist-item-desc{font-size:var(--font-size-sm);color:var(--color-text);margin-top:var(--space-2);white-space:pre-wrap;}
    .info-section-title{font-size:var(--font-size-xs);font-weight:600;color:var(--color-text-muted);text-transform:uppercase;letter-spacing:.05em;margin:var(--space-5) 0 var(--space-3);border-top:1px solid var(--color-border);padding-top:var(--space-4);}
    .info-section-title:first-child{margin-top:0;border-top:none;padding-top:0;}
  </style>
</head>
<body>

  <header id="app-header">
    <div class="container">
      <div class="header-inner">
        <a href="../index.html" class="header-brand">
          <div class="header-logo-fallback" aria-hidden="true">IFRS</div>
          <div class="header-brand-text">
            <span class="header-brand-name">Central de Estágios</span>
            <span class="header-brand-sub">IFRS Campus Rio Grande</span>
          </div>
        </a>
        <div style="display:flex;align-items:center;gap:var(--space-3);">
          <div id="header-user-area"></div>
          <a href="estagio.html" class="back-link">
            <svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="M9.707 16.707a1 1 0 01-1.414 0l-6-6a1 1 0 010-1.414l6-6a1 1 0 011.414 1.414L5.414 9H17a1 1 0 110 2H5.414l4.293 4.293a1 1 0 010 1.414z" clip-rule="evenodd"/></svg>
            Meus Estágios
          </a>
        </div>
      </div>
    </div>
  </header>

  <main id="main-content">
    <section class="page-hero">
      <div class="container">
        <h1>Acompanhamento de Estágio</h1>
        <div id="hero-sub"></div>
      </div>
    </section>

    <div class="container" style="padding-top:var(--space-6);padding-bottom:var(--space-12);" id="page-content">
      <div class="loading-page">Carregando seus estágios…</div>
    </div>
  </main>

  <footer id="app-footer">
    <div class="container">
      <div class="footer-inner">
        <span class="footer-copy">&copy; <script>document.write(new Date().getFullYear())</script> Central de Estágios — IFRS Campus Rio Grande</span>
        <nav class="footer-links"><a href="mailto:estagios@riogrande.ifrs.edu.br">estagios@riogrande.ifrs.edu.br</a></nav>
      </div>
    </div>
  </footer>

  <script src="https://accounts.google.com/gsi/client" async></script>
  <script src="../assets/js/utils.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/api.js"></script>
  <script>
    'use strict';

    let _estagios = [];
    let _atual = null;
    let _historico = null;
    let _avaliacoes = [];
    let _meuperfil = null;  // cache de obterMeuCadastro

    const _arquivos = { solicitacao: null, tce: null, tce_nao_obrig: null };

    document.addEventListener('DOMContentLoaded', async () => {
      if (!requireStudentAuth()) return;
      await carregarEstagios();
    });

    /* ════════════════════════════════════════
       CARREGAMENTO
    ════════════════════════════════════════ */
    async function carregarEstagios() {
      try {
        const data = await API.get('listarMeusEstagios', { authToken: getAccessToken() });
        _estagios = Array.isArray(data) ? data : (data.estagios || []);
        renderPaginaPrincipal();
      } catch (err) {
        document.getElementById('page-content').innerHTML =
          `<div class="form-feedback form-feedback--error"><strong>Erro ao carregar.</strong> ${escapeHtml(err.message)}</div>`;
      }
    }

    /* ════════════════════════════════════════
       RENDER PRINCIPAL
    ════════════════════════════════════════ */
    function renderPaginaPrincipal() {
      const c = document.getElementById('page-content');

      if (_estagios.length === 0) {
        c.innerHTML = `
          <div style="text-align:center;padding:var(--space-16);color:var(--color-text-muted)">
            <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" style="margin:0 auto var(--space-4);opacity:.2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12h3.75M9 15h3.75M9 18h3.75m3 .75H18a2.25 2.25 0 002.25-2.25V6.108c0-1.135-.845-2.098-1.976-2.192a48.424 48.424 0 00-1.123-.08m-5.801 0c-.065.21-.1.433-.1.664 0 .414.336.75.75.75h4.5a.75.75 0 00.75-.75 2.25 2.25 0 00-.1-.664m-5.8 0A2.251 2.251 0 0113.5 2.25H15c1.012 0 1.867.668 2.15 1.586m-5.8 0c-.376.023-.75.05-1.124.08C9.095 4.01 8.25 4.973 8.25 6.108V8.25m0 0H4.875c-.621 0-1.125.504-1.125 1.125v11.25c0 .621.504 1.125 1.125 1.125h9.75c.621 0 1.125-.504 1.125-1.125V9.375c0-.621-.504-1.125-1.125-1.125H8.25z"/></svg>
            <p>Você ainda não possui estágios registrados.</p>
            <a href="solicitacao.html" class="btn btn-primary" style="margin-top:var(--space-4)">Solicitar Estágio</a>
          </div>`;
        return;
      }

      const selectorHtml = _estagios.length > 1
        ? `<div class="estagio-selector">
             <label for="sel-estagio">Selecione o estágio:</label>
             <select id="sel-estagio" class="form-control" onchange="selecionarEstagio(this.value)">
               ${_estagios.map((e, i) =>
                 `<option value="${i}">${escapeHtml(e.id)} — ${escapeHtml(e.empresa)} (${escapeHtml(e.status)})</option>`
               ).join('')}
             </select>
           </div>`
        : '';

      c.innerHTML = `
        ${selectorHtml}
        <div id="ficha-tabs-wrap">
          <div class="ficha-tabs" role="tablist">
            <button class="ficha-tab active" data-tab="andamento" onclick="mudarAba('andamento')" role="tab">
              <svg width="14" height="14" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm1-12a1 1 0 10-2 0v4a1 1 0 00.293.707l2.828 2.829a1 1 0 101.415-1.415L11 9.586V6z" clip-rule="evenodd"/></svg>
              Andamento
            </button>
            <button class="ficha-tab" data-tab="dados" onclick="mudarAba('dados')" role="tab">
              <svg width="14" height="14" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M4 4a2 2 0 012-2h4.586A2 2 0 0112 2.586L15.414 6A2 2 0 0116 7.414V16a2 2 0 01-2 2H6a2 2 0 01-2-2V4zm2 6a1 1 0 011-1h6a1 1 0 110 2H7a1 1 0 01-1-1zm1 3a1 1 0 100 2h6a1 1 0 100-2H7z" clip-rule="evenodd"/></svg>
              Dados
            </button>
            <button class="ficha-tab" data-tab="documentos" onclick="mudarAba('documentos')" role="tab">
              <svg width="14" height="14" viewBox="0 0 20 20" fill="currentColor"><path d="M9 2a2 2 0 00-2 2v8a2 2 0 002 2h6a2 2 0 002-2V6.414A2 2 0 0016.414 5L14 2.586A2 2 0 0012.586 2H9z"/><path d="M3 8a2 2 0 012-2v10h8a2 2 0 01-2 2H5a2 2 0 01-2-2V8z"/></svg>
              Documentos
              <span class="tab-count" id="cnt-docs"></span>
            </button>
            <button class="ficha-tab" data-tab="adendos" onclick="mudarAba('adendos')" role="tab">
              <svg width="14" height="14" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M17.707 9.293a1 1 0 010 1.414l-7 7a1 1 0 01-1.414 0l-7-7A.997.997 0 012 10V5a3 3 0 013-3h5c.256 0 .512.098.707.293l7 7zM5 6a1 1 0 100-2 1 1 0 000 2z" clip-rule="evenodd"/></svg>
              Adendos
              <span class="tab-count" id="cnt-adendos"></span>
            </button>
            <button class="ficha-tab" data-tab="avaliacoes" onclick="mudarAba('avaliacoes')" role="tab">
              <svg width="14" height="14" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M9 2a1 1 0 000 2h2a1 1 0 100-2H9z"/><path fill-rule="evenodd" d="M4 5a2 2 0 012-2 3 3 0 003 3h2a3 3 0 003-3 2 2 0 012 2v11a2 2 0 01-2 2H6a2 2 0 01-2-2V5zm9.707 5.707a1 1 0 00-1.414-1.414L9 12.586l-1.293-1.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/></svg>
              Avaliações
              <span class="tab-count" id="cnt-avaliacoes"></span>
            </button>
          </div>
          <div id="tab-andamento"></div>
          <div id="tab-dados" hidden></div>
          <div id="tab-documentos" hidden></div>
          <div id="tab-adendos" hidden></div>
          <div id="tab-avaliacoes" hidden></div>
        </div>`;

      selecionarEstagio(0);
    }

    async function selecionarEstagio(idx) {
      _atual = _estagios[parseInt(idx)] || null;
      _historico = null;
      _avaliacoes = [];
      if (!_atual) return;

      // Atualiza hero
      const sub = document.getElementById('hero-sub');
      if (sub) {
        sub.innerHTML =
          `<code style="font-size:13px;background:rgba(255,255,255,.2);padding:2px 6px;border-radius:4px">${escapeHtml(_atual.id)}</code>` +
          '<span class="hero-sep">·</span>' +
          escapeHtml(_atual.empresa || '—') +
          '<span class="hero-sep">·</span>' +
          badgeStatus(_atual.status);
      }

      renderDetalhe();

      // Carrega histórico e avaliações em segundo plano
      try {
        [_historico, _avaliacoes] = await Promise.all([
          apiListarHistoricoEstagio(_atual.id),
          API.get('listarAvaliacoesEstagio', { id: _atual.id, authToken: getAccessToken() }).catch(() => []),
        ]);
        if (!Array.isArray(_avaliacoes)) _avaliacoes = [];
      } catch (e) {
        _historico = { error: e.message, relatoriosParciais: [], relatorioFinal: null, adendos: [], documentos: [] };
        _avaliacoes = [];
      }

      const wrapDocs    = document.getElementById('wrap-hist-docs');
      const wrapAdendos = document.getElementById('wrap-hist-adendos');
      const wrapAval    = document.getElementById('wrap-hist-aval');
      if (wrapDocs)    wrapDocs.innerHTML    = buildHistoricoDocumentos(_historico);
      if (wrapAdendos) wrapAdendos.innerHTML = buildHistoricoAdendos(_historico);
      if (wrapAval)    wrapAval.innerHTML    = buildAvaliacoesContent(_atual);
      _atualizarContadores();
    }

    /* ════════════════════════════════════════
       RENDER DETALHE — PREENCHE ABAS
    ════════════════════════════════════════ */
    function renderDetalhe() {
      const s = _atual;

      document.getElementById('tab-andamento').innerHTML  = buildTabAndamento(s);
      document.getElementById('tab-dados').innerHTML      = buildTabDados(s);
      document.getElementById('tab-documentos').innerHTML = buildTabDocumentos(s);
      document.getElementById('tab-adendos').innerHTML    = buildTabAdendos(s);
      document.getElementById('tab-avaliacoes').innerHTML = buildTabAvaliacoes(s);

      initUpload('upload-solicitacao', 'solicitacao');
      initUpload('upload-tce', 'tce');
      initUpload('upload-tce-nao', 'tce_nao_obrig');
      initAdendoUpload();
      initUploadAvulso();

      if (s.status === 'Aceite recusado') inicializarTrocaOrientador();
    }

    function mudarAba(aba) {
      document.querySelectorAll('.ficha-tab').forEach(t =>
        t.classList.toggle('active', t.dataset.tab === aba)
      );
      ['andamento', 'dados', 'documentos', 'adendos', 'avaliacoes'].forEach(id => {
        const el = document.getElementById('tab-' + id);
        if (el) el.hidden = (id !== aba);
      });
    }

    function _atualizarContadores() {
      if (!_historico) return;
      const { relatoriosParciais = [], relatorioFinal = null, adendos = [], documentos = [] } = _historico;
      const cntDocs   = relatoriosParciais.length + (relatorioFinal ? 1 : 0) + documentos.length;
      const cntAdendo = adendos.length;
      const cntAval   = _avaliacoes.length;
      const elDocs    = document.getElementById('cnt-docs');
      const elAdendo  = document.getElementById('cnt-adendos');
      const elAval    = document.getElementById('cnt-avaliacoes');
      if (elDocs)   elDocs.textContent   = cntDocs   > 0 ? String(cntDocs)   : '';
      if (elAdendo) elAdendo.textContent = cntAdendo > 0 ? String(cntAdendo) : '';
      if (elAval)   elAval.textContent   = cntAval   > 0 ? String(cntAval)   : '';
    }

    /* ════════════════════════════════════════
       ABA: ANDAMENTO
    ════════════════════════════════════════ */
    function buildTabAndamento(s) {
      const passos   = buildTimeline(s.status);
      const cardAcao = buildCardAcao(s);
      return `
        <div class="main-cols">
          <div>${cardAcao}</div>
          <div>
            <div class="action-card" style="padding:var(--space-5)">
              <h2 style="margin-bottom:var(--space-5)">Etapas do Processo</h2>
              <div class="timeline">${passos}</div>
            </div>
          </div>
        </div>`;
    }

    /* ════════════════════════════════════════
       ABA: DADOS
    ════════════════════════════════════════ */
    function buildTabDados(s) {
      return buildSecaoInfoCompleta(s);
    }

    /* ════════════════════════════════════════
       ABA: DOCUMENTOS
    ════════════════════════════════════════ */
    function buildTabDocumentos(s) {
      const isAtivo = s.status === 'Ativo' || s.status === 'Em execução';
      const chevron = `<svg class="ds-chevron" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd"/></svg>`;
      const avOpts  = `
        <option value="">Selecione...</option>
        <option value="Ótimo">Ótimo</option>
        <option value="Bom">Bom</option>
        <option value="Regular">Regular</option>
        <option value="Ruim">Ruim</option>`;

      const sec = (titulo, conteudo) =>
        `<div style="margin-bottom:var(--space-6)">
           <h3 style="font-size:var(--font-size-sm);font-weight:600;margin-bottom:var(--space-4);
                      padding:var(--space-2) var(--space-4);
                      background:var(--color-bg);
                      border-left:3px solid var(--color-primary);
                      border-radius:0 var(--radius-md) var(--radius-md) 0;
                      color:var(--color-text)">${titulo}</h3>
           ${conteudo}
         </div>`;

      let html = '';

      // ── 1. Pasta do Estágio no Drive ─────────────────────────────────────────
      if (s.driveUrl) {
        html += sec('1. 📁 Pasta do Estágio no Drive',
          `<div class="avulso-list">
            <div class="avulso-item">
              <div class="avulso-item-info">
                <div class="avulso-item-title">Pasta do Estágio</div>
                <div class="avulso-item-meta">Todos os documentos do seu estágio são salvos aqui</div>
              </div>
              <a href="${escapeHtml(s.driveUrl)}" target="_blank" rel="noopener" class="btn btn-secondary btn-sm">📁 Abrir pasta ↗</a>
            </div>
          </div>`
        );
      }

      // ── 2. Documentos de Admissão ─────────────────────────────────────────────
      {
        const docs = [
          { label: 'Comprovante de Matrícula', url: s.linkDocMatricula },
          { label: 'Documento de Identidade',  url: s.linkDocIdentidade },
          { label: 'Boletim / Histórico',      url: s.linkDocBoletim },
        ].filter(d => d.url);

        const admHtml = docs.length
          ? `<div class="avulso-list">` +
            docs.map((d, i) =>
              `<div class="avulso-item">
                <div class="avulso-item-info">
                  <div class="avulso-item-title">2.${i + 1}. ${escapeHtml(d.label)}</div>
                  <div class="avulso-item-meta">Enviado na solicitação de estágio</div>
                </div>
                <a href="${escapeHtml(d.url)}" target="_blank" rel="noopener" class="btn btn-secondary btn-sm">Abrir ↗</a>
              </div>`
            ).join('') +
            `</div>`
          : `<p style="font-size:var(--font-size-sm);color:var(--color-text-muted)">Nenhum documento de admissão registrado.</p>`;

        html += sec('2. 📄 Documentos de Admissão', admHtml);
      }

      // ── 3. Relatórios ─────────────────────────────────────────────────────────
      {
        let relHtml = `<div id="wrap-hist-docs">${buildHistoricoDocumentos(null)}</div>`;

        if (isAtivo) {
          relHtml += `
          <div class="doc-sections-wrap" style="margin-top:var(--space-4)">
            <p class="doc-sections-title">Enviar Relatório</p>

            <!-- ── Relatório Parcial ── -->
            <div class="doc-section">
              <div class="doc-section-hdr" id="rp-hdr" onclick="toggleDocSection('rp')">
                <h3>📄 Relatório Parcial</h3>${chevron}
              </div>
              <div class="doc-section-body" id="rp-body">
                <p style="font-size:var(--font-size-sm);color:var(--color-text-muted);margin-bottom:var(--space-4)">
                  Descreva as atividades realizadas no período de referência. Após o envio, o documento passará pelo fluxo de assinaturas digitais (gov.br): <strong>você → empresa concedente → supervisor</strong>.
                </p>
                <div id="fb-rp"></div>
                <div class="form-group">
                  <label class="form-label">Período de Referência <span style="color:var(--color-error)">*</span></label>
                  <input type="text" id="rp-periodoRef" class="form-control" placeholder="Ex: Jan/2025 – Mar/2025">
                </div>
                <div class="form-group">
                  <label class="form-label">Atividades Realizadas <span style="color:var(--color-error)">*</span></label>
                  <textarea id="rp-atividadesRealizadas" class="form-control" rows="4" placeholder="Descreva as principais atividades desenvolvidas no período..."></textarea>
                </div>
                <div class="form-group">
                  <label class="form-label">Aprendizagens Obtidas</label>
                  <textarea id="rp-aprendizagens" class="form-control" rows="3" placeholder="Conhecimentos e habilidades adquiridos..."></textarea>
                </div>
                <div class="form-group">
                  <label class="form-label">Relação com o Curso</label>
                  <textarea id="rp-relacaoCurso" class="form-control" rows="3" placeholder="Como as atividades se relacionam com o seu curso..."></textarea>
                </div>
                <div class="form-group">
                  <label class="form-label">Avaliação do Estágio <span style="color:var(--color-error)">*</span></label>
                  <select id="rp-avaliacaoEstagio" class="form-control">${avOpts}</select>
                </div>
                <div class="form-group">
                  <label class="form-label">Dificuldades Encontradas</label>
                  <textarea id="rp-dificuldades" class="form-control" rows="3" placeholder="Dificuldades ou desafios encontrados..."></textarea>
                </div>
                <div class="form-group">
                  <label class="form-label">Sugestões</label>
                  <textarea id="rp-sugestoes" class="form-control" rows="2" placeholder="Sugestões para melhoria do estágio..."></textarea>
                </div>
                <button class="btn btn-primary btn-sm" onclick="submitRelatorioParcial(this)">Enviar Relatório Parcial</button>
              </div>
            </div>

            <!-- ── Relatório Final ── -->
            <div class="doc-section">
              <div class="doc-section-hdr" id="rf-hdr" onclick="toggleDocSection('rf')">
                <h3>📋 Relatório Final</h3>${chevron}
              </div>
              <div class="doc-section-body" id="rf-body">
                <p style="font-size:var(--font-size-sm);color:var(--color-text-muted);margin-bottom:var(--space-4)">
                  Relatório a ser preenchido ao término do estágio. Após o envio, o documento passará pelo fluxo de assinaturas digitais (gov.br): <strong>você → empresa concedente → supervisor</strong>.
                </p>
                <div id="fb-rf"></div>
                <div class="form-group">
                  <label class="form-label">Data de Encerramento <span style="color:var(--color-error)">*</span></label>
                  <input type="date" id="rf-dataEncerramento" class="form-control">
                </div>
                <div class="form-group">
                  <label class="form-label">Resumo das Atividades <span style="color:var(--color-error)">*</span></label>
                  <textarea id="rf-resumoAtividades" class="form-control" rows="4" placeholder="Resumo geral das atividades realizadas durante todo o estágio..."></textarea>
                </div>
                <div class="form-group">
                  <label class="form-label">Competências Desenvolvidas</label>
                  <textarea id="rf-competenciasDesenvolvidas" class="form-control" rows="3" placeholder="Competências técnicas e comportamentais desenvolvidas..."></textarea>
                </div>
                <div class="form-group">
                  <label class="form-label">Contribuição para a Formação</label>
                  <textarea id="rf-contribuicaoFormacao" class="form-control" rows="3" placeholder="Como o estágio contribuiu para sua formação acadêmica e profissional..."></textarea>
                </div>
                <div class="form-group">
                  <label class="form-label">Avaliação da Empresa Concedente <span style="color:var(--color-error)">*</span></label>
                  <select id="rf-avaliacaoConcedente" class="form-control">${avOpts}</select>
                </div>
                <div class="form-group">
                  <label class="form-label">Avaliação do Orientador Acadêmico <span style="color:var(--color-error)">*</span></label>
                  <select id="rf-avaliacaoOrientador" class="form-control">${avOpts}</select>
                </div>
                <div class="form-group">
                  <label class="form-label">Recomendaria este estágio? <span style="color:var(--color-error)">*</span></label>
                  <div style="display:flex;gap:var(--space-5);margin-top:var(--space-2)">
                    <label style="display:flex;align-items:center;gap:var(--space-2);font-size:var(--font-size-sm);font-weight:400;cursor:pointer">
                      <input type="radio" name="recomendaria" value="Sim"> Sim
                    </label>
                    <label style="display:flex;align-items:center;gap:var(--space-2);font-size:var(--font-size-sm);font-weight:400;cursor:pointer">
                      <input type="radio" name="recomendaria" value="Não"> Não
                    </label>
                  </div>
                </div>
                <div class="form-group">
                  <label class="form-label">Considerações Finais</label>
                  <textarea id="rf-consideracoesFinais" class="form-control" rows="3" placeholder="Comentários finais sobre a experiência..."></textarea>
                </div>
                <button class="btn btn-primary btn-sm" onclick="submitRelatorioFinal(this)">Enviar Relatório Final</button>
              </div>
            </div>

          </div>`;
        }

        html += sec('3. 📄 Relatórios', relHtml);
      }

      // ── 4. Demais Documentos ──────────────────────────────────────────────────
      html += sec('4. 📄 Demais Documentos', buildSecaoUploadAvulso());

      return html;
    }

    /* ════════════════════════════════════════
       ABA: ADENDOS
    ════════════════════════════════════════ */
    function buildTabAdendos(s) {
      const isAtivo = s.status === 'Ativo' || s.status === 'Em execução';
      const chevron = `<svg class="ds-chevron" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd"/></svg>`;

      const tipoAdendoOpts = `
        <option value="">Selecione o tipo...</option>
        <option value="Prorrogação de estágio">Prorrogação de estágio</option>
        <option value="Alteração de vigência (início e final)">Alteração de vigência (início e final)</option>
        <option value="Alteração de modalidade (obrigatório → não obrigatório)">Alteração de modalidade (obrigatório → não obrigatório)</option>
        <option value="Alteração de modalidade (não obrigatório → obrigatório)">Alteração de modalidade (não obrigatório → obrigatório)</option>
        <option value="Alteração de orientador">Alteração de orientador</option>
        <option value="Alteração de supervisor">Alteração de supervisor</option>
        <option value="Alteração de horário">Alteração de horário</option>
        <option value="Alteração de carga horária semanal">Alteração de carga horária semanal</option>
        <option value="Alteração do plano de atividades">Alteração do plano de atividades</option>
        <option value="Alteração de apólice de seguro">Alteração de apólice de seguro</option>
        <option value="Alteração de local/setor">Alteração de local/setor</option>
        <option value="Alteração de remuneração">Alteração de remuneração</option>
        <option value="Rescisão de estágio">Rescisão de estágio</option>`;

      let html = '';

      if (isAtivo) {
        html += `
        <div class="doc-sections-wrap">
          <p class="doc-sections-title">Nova Solicitação de Adendo</p>
          <div class="doc-section">
            <div class="doc-section-hdr" id="adendo-hdr" onclick="toggleDocSection('adendo')">
              <h3>✏️ Adendo ao TCE</h3>${chevron}
            </div>
            <div class="doc-section-body" id="adendo-body">
              <p style="font-size:var(--font-size-sm);color:var(--color-text-muted);margin-bottom:var(--space-4)">
                Solicite alterações no Termo de Compromisso de Estágio. Preencha o formulário ou, se preferir, anexe um documento já preparado.
              </p>
              <div class="mode-toggle">
                <button class="mode-toggle-btn active" data-modo="form" onclick="setAdendoModo('form')">Preencher formulário</button>
                <button class="mode-toggle-btn" data-modo="upload" onclick="setAdendoModo('upload')">Anexar documento</button>
              </div>
              <div id="fb-adendo"></div>

              <!-- Modo formulário -->
              <div id="adendo-form-area">
                <div class="form-group">
                  <label class="form-label">Tipo de Adendo <span style="color:var(--color-error)">*</span></label>
                  <select id="adendo-tipoAdendo" class="form-control" onchange="onAdendoTipoChange()">${tipoAdendoOpts}</select>
                </div>
                <!-- Campos dinâmicos por tipo -->
                <div id="adendo-campos-dinamicos" style="display:none"></div>
                <div id="btn-adendo-wrap" style="display:none;display:none;gap:var(--space-2);flex-wrap:wrap">
                  <button class="btn btn-secondary btn-sm" id="btn-adendo-preview" onclick="previewAdendo()">📄 Visualizar Documento</button>
                  <button class="btn btn-primary btn-sm"   id="btn-adendo-form"    onclick="submitAdendoForm(this)">Enviar Adendo</button>
                </div>
              </div>

              <!-- Modo upload -->
              <div id="adendo-upload-area" style="display:none">
                <div class="form-group">
                  <label class="form-label">Tipo de Adendo <span style="color:var(--color-error)">*</span></label>
                  <select id="adendo-tipoAdendo-up" class="form-control">${tipoAdendoOpts}</select>
                </div>
                <div class="form-group">
                  <label class="form-label">Justificativa <span style="color:var(--color-error)">*</span></label>
                  <textarea id="adendo-justificativa-up" class="form-control" rows="2" placeholder="Motivo da solicitação de alteração..."></textarea>
                </div>
                <div class="form-group">
                  <label class="form-label">Documento do Adendo (PDF) <span style="color:var(--color-error)">*</span></label>
                  <div class="upload-area" id="drop-adendo" onclick="document.getElementById('upload-adendo').click()">
                    <input type="file" id="upload-adendo" accept=".pdf">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 00-3.375-3.375h-1.5A1.125 1.125 0 0113.5 7.125v-1.5a3.375 3.375 0 00-3.375-3.375H8.25m6.75 12H9m1.5-12H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 00-9-9z"/></svg>
                    <p>Clique ou arraste o PDF aqui</p><small>Apenas PDF — máx. 10 MB</small>
                  </div>
                  <div class="file-selected" id="file-adendo-info"></div>
                </div>
                <button class="btn btn-primary btn-sm" onclick="submitAdendoUpload(this)">Enviar Adendo</button>
              </div>
            </div>
          </div>
        </div>`;
      }

      html += `<div id="wrap-hist-adendos">${buildHistoricoAdendos(null)}</div>`;
      return html;
    }

    /* ════════════════════════════════════════
       ABA: AVALIAÇÕES
    ════════════════════════════════════════ */
    function buildTabAvaliacoes(s) {
      return `<div id="wrap-hist-aval">${buildAvaliacoesContent(s)}</div>`;
    }

    function buildAvaliacoesContent(s) {
      return buildAvaliacoesPrevistasHtml(s.dataInicio, s.dataTermino, _avaliacoes) +
             buildHistoricoAvaliacoes();
    }

    function buildHistoricoAvaliacoes() {
      const STATUS_LABEL = {
        aguardando_preenchimento:   'Aguardando Preenchimento',
        aguardando_assinatura_2:    'Aguardando 2ª Assinatura',
        aguardando_assinatura_3:    'Aguardando 3ª Assinatura',
        aguardando_aprovacao_admin: 'Aguardando Aprovação da Central',
        concluido:                  'Concluído ✓',
      };

      if (!_avaliacoes.length) {
        return `
          <div class="action-card">
            <h2>Avaliações de Estágio</h2>
            <p style="color:var(--color-text-muted);font-size:var(--font-size-sm)">Nenhuma avaliação iniciada para este estágio. O setor de estágios iniciará as avaliações no momento oportuno.</p>
          </div>`;
      }

      const linhas = _avaliacoes.map(a => {
        const tipoLabel = a.tipo === 'concedente' ? 'Pela Concedente' : 'Pelo Aluno';
        const badgeCls  = a.status === 'concluido' ? 'badge-approved' : 'badge-analysis';
        const badgeTxt  = STATUS_LABEL[a.status] || a.status;
        const dtInicio  = a.tsInicio ? new Date(a.tsInicio).toLocaleDateString('pt-BR') : '—';

        let acoes = '';
        if (a.status === 'concluido' && a.pdfUrl) {
          acoes = `<a href="${escapeHtml(a.pdfUrl)}" target="_blank" rel="noopener" class="btn btn-secondary btn-sm">📄 Abrir PDF ↗</a>`;
        } else if (a.status === 'aguardando_preenchimento' && a.tipo === 'aluno') {
          const avalUrl = `../avaliacoes/?id=${encodeURIComponent(_atual.id)}&aval=${encodeURIComponent(a.avalId || '')}`;
          acoes = `<a href="${escapeHtml(avalUrl)}" class="btn btn-primary btn-sm">Preencher Avaliação ↗</a>`;
        } else {
          acoes = `<span style="font-size:var(--font-size-xs);color:var(--color-text-muted)">Você receberá um e-mail quando for sua vez.</span>`;
        }

        return `
          <tr>
            <td style="font-size:12px">${escapeHtml(tipoLabel)}</td>
            <td style="font-size:12px">${escapeHtml(a.periodoRef || a.periodo || '—')}</td>
            <td><span class="badge ${badgeCls}">${escapeHtml(badgeTxt)}</span></td>
            <td style="font-size:12px">${escapeHtml(dtInicio)}</td>
            <td>${acoes}</td>
          </tr>`;
      }).join('');

      return `
        <div class="action-card">
          <h2>Avaliações de Estágio (${_avaliacoes.length})</h2>
          <div class="table-wrap" style="margin-top:var(--space-4)">
            <table class="data-table">
              <thead>
                <tr>
                  <th>Tipo</th>
                  <th>Período</th>
                  <th>Status</th>
                  <th>Iniciada em</th>
                  <th>Ação</th>
                </tr>
              </thead>
              <tbody>${linhas}</tbody>
            </table>
          </div>
        </div>`;
    }

    /* ════════════════════════════════════════
       SEÇÃO: INFORMAÇÕES COMPLETAS
    ════════════════════════════════════════ */
    function buildSecaoInfoCompleta(s) {
      function dr(label, val) {
        return `<div class="detail-item"><label>${label}</label><p>${val || '—'}</p></div>`;
      }
      const secTitle = (titulo) =>
        `<div class="detail-full" style="margin-top:var(--space-3);margin-bottom:0;font-size:var(--font-size-xs);font-weight:600;color:var(--color-text-muted);text-transform:uppercase;letter-spacing:.05em;border-top:1px solid var(--color-border);padding-top:var(--space-4)">${titulo}</div>`;

      let html = `<div class="action-card"><h2>Dados do Estágio</h2><div class="detail-grid">`;

      // Identificação & Período
      html += secTitle('Identificação &amp; Período');
      html += dr('ID', `<code style="font-size:12px">${escapeHtml(s.id || '—')}</code>`);
      html += dr('Tipo', escapeHtml(s.tipoEstagio || '—'));
      html += dr('Status', badgeStatus(s.status));
      html += dr('Início', escapeHtml(s.dataInicio || '—'));
      html += dr('Término', escapeHtml(s.dataTermino || '—'));
      html += dr('Carga Horária', escapeHtml(s.cargaHorariaSemanal || '—') + ' h/sem');
      if (s.horario)       html += dr('Horário', escapeHtml(s.horario));
      if (s.turno)         html += dr('Turno', escapeHtml(s.turno));
      if (s.semestreAtual) html += dr('Semestre', escapeHtml(s.semestreAtual));
      if (s.formando)      html += dr('Formando', escapeHtml(s.formando));

      // Empresa & Supervisor
      html += secTitle('Empresa &amp; Supervisor');
      html += dr('Empresa', escapeHtml(s.empresa || '—'));
      if (s.cnpjEmpresa)    html += dr('CNPJ', escapeHtml(s.cnpjEmpresa));
      html += dr('Supervisor', escapeHtml(s.nomeSupervisor || '—'));
      if (s.emailSupervisor) html += dr('E-mail do Supervisor', escapeHtml(s.emailSupervisor));
      if (s.nomeAgente)      html += dr('Agente de Integração', escapeHtml(s.nomeAgente));

      // Orientação & Curso
      html += secTitle('Orientação &amp; Curso');
      html += dr('Orientador', escapeHtml(s.nomeOrientador || '—'));
      html += dr('Curso', escapeHtml(s.curso || '—'));

      // Dados Financeiros
      if (s.remuneracao || s.valorBolsa || s.valorTransporte) {
        html += secTitle('Dados Financeiros');
        if (s.remuneracao)     html += dr('Remunerado', escapeHtml(s.remuneracao));
        if (s.valorBolsa)      html += dr('Valor da Bolsa', 'R$ ' + escapeHtml(s.valorBolsa));
        if (s.valorTransporte) html += dr('Auxílio-Transporte', 'R$ ' + escapeHtml(s.valorTransporte));
      }

      html += `</div>`;

      // Plano de Atividades (fora da grade)
      if (s.planoAtividades) {

          <div class="detail-grid" style="margin-bottom:var(--space-4)">`;

          <strong>Motivo da reprovação:</strong> ${escapeHtml(s.motivoReprovacao)}

      html += `</div>`;
      return html;

    /* ════════════════════════════════════════
       HISTÓRICO: DOCUMENTOS
    ════════════════════════════════════════ */
    function buildHistoricoDocumentos(h) {
      if (!h) return `
        <div class="action-card">
          <h2>Histórico de Relatórios</h2>
          <p style="color:var(--color-text-muted);font-size:var(--font-size-sm)">Carregando histórico…</p>
        </div>`;
      if (h.error) return `
        <div class="action-card">
          <h2>Histórico de Relatórios</h2>
          <p style="color:var(--color-error);font-size:var(--font-size-sm)">Não foi possível carregar o histórico: ${escapeHtml(h.error)}</p>
        </div>`;

      const { relatoriosParciais = [], relatorioFinal = null, documentos = [] } = h;
      const temDados = relatoriosParciais.length || relatorioFinal || documentos.length;
      if (!temDados) return `
        <div class="action-card">
          <h2>Histórico de Relatórios</h2>
          <p style="color:var(--color-text-muted);font-size:var(--font-size-sm)">Nenhum relatório enviado ainda.</p>
        </div>`;

      let html = `<div class="action-card"><h2>Histórico de Relatórios</h2>`;

      if (relatoriosParciais.length) {
        html += `<p class="info-section-title">Relatórios Parciais (${relatoriosParciais.length})</p><div class="hist-list">`;
        relatoriosParciais.forEach(r => {
          html += `<div class="hist-item">
            <div class="hist-item-row">
              <span class="hist-item-title">Período: ${escapeHtml(r.periodoRef || '—')}</span>
              <span class="hist-item-date">${escapeHtml(r.data || '—')}</span>
            </div>
            ${r.avaliacao ? `<div class="hist-item-meta">Avaliação: <strong>${escapeHtml(r.avaliacao)}</strong></div>` : ''}
            ${r.atividades ? `<div class="hist-item-desc">${escapeHtml(r.atividades.substring(0, 250))}${r.atividades.length > 250 ? '…' : ''}</div>` : ''}
          </div>`;
        });
        html += `</div>`;
      }

      if (relatorioFinal) {
        const r = relatorioFinal;
        html += `<p class="info-section-title">Relatório Final</p>
          <div class="hist-item">
            <div class="hist-item-row">
              <span class="hist-item-title">Enviado em ${escapeHtml(r.data || '—')}</span>
              ${r.dataEncerramento ? `<span class="hist-item-date">Encerramento: ${escapeHtml(r.dataEncerramento)}</span>` : ''}
            </div>
            ${r.avalConcedente ? `<div class="hist-item-meta">Empresa: <strong>${escapeHtml(r.avalConcedente)}</strong> · Orientador: <strong>${escapeHtml(r.avalOrientador || '—')}</strong> · Recomendaria: <strong>${escapeHtml(r.recomendaria || '—')}</strong></div>` : ''}
            ${r.resumo ? `<div class="hist-item-desc">${escapeHtml(r.resumo.substring(0, 250))}${r.resumo.length > 250 ? '…' : ''}</div>` : ''}
          </div>`;
      }

      if (documentos.length) {
        html += `<p class="info-section-title">Documentos Avulsos (${documentos.length})</p><div class="hist-list">`;
        documentos.forEach(d => {
          html += `<div class="hist-item">
            <div class="hist-item-row">
              <span class="hist-item-title">${escapeHtml(d.titulo || '—')}</span>
              <span class="hist-item-date">${escapeHtml(d.data || '—')}</span>
            </div>
            <div class="hist-item-meta">Enviado por: ${escapeHtml(d.perfil === 'Admin' ? 'Setor de Estágios' : 'Você')}${d.nomeArquivo ? ' · ' + escapeHtml(d.nomeArquivo) : ''}</div>
            ${d.linkDrive
              ? `<a href="${escapeHtml(d.linkDrive)}" target="_blank" rel="noopener" class="btn btn-secondary btn-sm" style="margin-top:var(--space-2)">
                  <svg width="14" height="14" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M3 17a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm3.293-7.707a1 1 0 011.414 0L9 10.586V3a1 1 0 112 0v7.586l1.293-1.293a1 1 0 111.414 1.414l-3 3a1 1 0 01-1.414 0l-3-3a1 1 0 010-1.414z" clip-rule="evenodd"/></svg>
                  Baixar ↗
                </a>`
              : `<span style="font-size:var(--font-size-xs);color:var(--color-text-light);margin-top:var(--space-1);display:block">Arquivo registrado — link disponível após aprovação do estágio</span>`}
          </div>`;
        });
        html += `</div>`;
      }

      html += `</div>`;
      return html;
    }

    /* ════════════════════════════════════════
       HISTÓRICO: ADENDOS
    ════════════════════════════════════════ */
    function buildHistoricoAdendos(h) {
      if (!h) return `
        <div class="action-card" style="margin-top:var(--space-4)">

      if (!adendos.length) return `

          <h2>Histórico de Adendos</h2>
          <p style="color:var(--color-text-muted);font-size:var(--font-size-sm)">Nenhum adendo solicitado.</p>

      let html = `<div class="action-card" style="margin-top:var(--space-4)"><h2>Histórico de Adendos (${adendos.length})</h2><div class="hist-list">`;

    /* ════════════════════════════════════════
       SEÇÃO: UPLOAD DE DOCUMENTO AVULSO
    ════════════════════════════════════════ */
    function buildSecaoUploadAvulso() {
      return `
        <div class="action-card" style="margin-top:var(--space-2)">
          <h2>Enviar Documento</h2>
          <p>Envie arquivos adicionais relacionados ao seu estágio — certificados, comprovantes, declarações ou qualquer outro documento relevante.</p>
          <div id="fb-avulso"></div>
          <div class="form-group">
            <label class="form-label" for="avulso-titulo">Título / Descrição <span style="color:var(--color-error)">*</span></label>
            <input type="text" id="avulso-titulo" class="form-control" placeholder="Ex: Comprovante de matrícula atualizado, Certificado de curso…">
          </div>
          <div class="form-group">
            <label class="form-label">Arquivo PDF <span style="color:var(--color-error)">*</span></label>
            <div class="upload-area" id="drop-avulso" onclick="document.getElementById('upload-avulso').click()">
              <input type="file" id="upload-avulso" accept=".pdf">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 00-3.375-3.375h-1.5A1.125 1.125 0 0113.5 7.125v-1.5a3.375 3.375 0 00-3.375-3.375H8.25m6.75 12H9m1.5-12H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 00-9-9z"/></svg>
              <p>Clique ou arraste o arquivo PDF aqui</p><small>Apenas PDF — máx. 10 MB</small>
            </div>
            <div class="file-selected" id="file-avulso-info"></div>
          </div>
          <button class="btn btn-primary btn-sm" id="btn-avulso" onclick="enviarDocumentoAvulso(this)">Enviar Documento</button>
        </div>`;
    }

    function initUploadAvulso() {
      const input = document.getElementById('upload-avulso');
      if (!input) return;
      input.addEventListener('change', () => {
        const file = input.files[0];
        if (!file) return;
        if (file.type !== 'application/pdf') { alert('Apenas arquivos PDF são aceitos.'); input.value = ''; return; }
        if (file.size > 10 * 1024 * 1024) { alert('Arquivo muito grande. Máximo: 10 MB.'); input.value = ''; return; }
        const info = document.getElementById('file-avulso-info');
        if (info) { info.innerHTML = `✓ ${escapeHtml(file.name)} (${(file.size / 1024).toFixed(1)} KB)`; info.classList.add('show'); }
      });
      const drop = document.getElementById('drop-avulso');
      if (!drop) return;
      drop.addEventListener('dragover',  e => { e.preventDefault(); drop.classList.add('drag-over'); });
      drop.addEventListener('dragleave', ()  => drop.classList.remove('drag-over'));
      drop.addEventListener('drop', e => {
        e.preventDefault(); drop.classList.remove('drag-over');
        const file = e.dataTransfer.files[0];
        if (file) { input.files = e.dataTransfer.files; input.dispatchEvent(new Event('change')); }
      });
    }

    async function enviarDocumentoAvulso(btn) {
      const titulo = document.getElementById('avulso-titulo')?.value.trim();
      const input  = document.getElementById('upload-avulso');
      const file   = input?.files[0];
      const fbId   = 'fb-avulso';
      if (!titulo || !file) {
        showFormFeedback(fbId, 'error', 'Campos obrigatórios', 'Informe o título e selecione um arquivo PDF.');
        return;
      }
      btn.disabled = true; btn.classList.add('is-loading');
      hideFormFeedback(fbId);
      try {
        await apiUploadDocumentoEstagio(_atual.id, titulo, file);
        showFormFeedback(fbId, 'success', 'Documento enviado!', 'O arquivo foi salvo com sucesso na pasta do estágio.');
        btn.textContent = 'Enviado ✓';
        document.getElementById('avulso-titulo').value = '';
        input.value = '';
        const info = document.getElementById('file-avulso-info');
        if (info) { info.innerHTML = ''; info.classList.remove('show'); }
        // Recarrega histórico
        const wrapDocs = document.getElementById('wrap-hist-docs');
        if (wrapDocs) wrapDocs.innerHTML = buildHistoricoDocumentos(null);
        try {
          _historico = await apiListarHistoricoEstagio(_atual.id);
        } catch (e2) {
          _historico = { error: e2.message, relatoriosParciais: [], relatorioFinal: null, adendos: [], documentos: [] };
        }
        const wrapDocs2 = document.getElementById('wrap-hist-docs');
        if (wrapDocs2) wrapDocs2.innerHTML = buildHistoricoDocumentos(_historico);
        _atualizarContadores();
        setTimeout(() => { btn.textContent = 'Enviar Documento'; btn.disabled = false; btn.classList.remove('is-loading'); }, 2500);
      } catch (err) {
        showFormFeedback(fbId, 'error', 'Erro ao enviar', err.message);
        btn.disabled = false; btn.classList.remove('is-loading');
      }
    }

    /* ════════════════════════════════════════

      { label: 'Checklist',            desc: 'Validação interna pelos atores do processo (setor, orientador, coordenador, empresa e supervisor).' },

      { label: 'Estágio ativo',        desc: 'Processo concluído. Estágio em andamento.' },
    ];
    const STATUS_PASSO_NOVO = {
      'Aguardando aceite orientador': 2,
      'Aceite recusado':              2,
      'Em Checklist':                 3,
      'Em Assinaturas':               4,
      'Ativo':                        11,
      'Encerrado':                    11,
    };

    const STATUSES_NOVO = new Set(['Aguardando aceite orientador', 'Aceite recusado', 'Em Checklist', 'Em Assinaturas', 'Ativo']);

    function buildTimeline(status) {
      if (STATUSES_NOVO.has(status)) {
        const etapa    = STATUS_PASSO_NOVO[status] || 1;
        const recusado = status === 'Aceite recusado';
        return PASSOS_NOVO.map((p, i) => {
          const num = i + 1;
          let cls = 'timeline-dot--pending';
          let label = p.label;
          if (recusado && num === 2) { cls = 'timeline-dot--error'; label = 'Aceite recusado — escolha outro orientador'; }
          else if (num < etapa) cls = 'timeline-dot--done';
          else if (num === etapa) cls = 'timeline-dot--active';
          return `
            <div class="timeline-item">
              <div class="timeline-dot ${cls}">${(num < etapa && !recusado) || (recusado && num < 2) ? '✓' : num}</div>
              <div class="timeline-label">${escapeHtml(label)}</div>
              <div class="timeline-desc">${escapeHtml(p.desc)}</div>
            </div>`;
        }).join('');
      }

      const etapaAtual = STATUS_PASSO_ANTIGO[status] || 1;
      const reprovado  = status === 'Reprovado';
      return PASSOS_ANTIGO.map((p, i) => {
        const num = i + 1;
        let cls = 'timeline-dot--pending';
        let label = p.label;
        if (reprovado && num === 2) { cls = 'timeline-dot--error'; label = 'Reprovado'; }
        else if (num < etapaAtual) cls = 'timeline-dot--done';
        else if (num === etapaAtual) cls = 'timeline-dot--active';
        return `
          <div class="timeline-item">
            <div class="timeline-dot ${cls}">${num < etapaAtual ? '✓' : num}</div>
            <div class="timeline-label">${escapeHtml(label)}</div>
            <div class="timeline-desc">${escapeHtml(p.desc)}</div>
          </div>`;
      }).join('');
    }

    /* ════════════════════════════════════════
       UPLOAD
    ════════════════════════════════════════ */
    function initUpload(inputId, key) {
      const input = document.getElementById(inputId);
      if (!input) return;
      input.addEventListener('change', () => {
        const file = input.files[0];
        if (!file) return;
        if (file.type !== 'application/pdf') { alert('Apenas arquivos PDF são aceitos.'); input.value = ''; return; }
        if (file.size > 10 * 1024 * 1024) { alert('Arquivo muito grande. Máximo: 10 MB.'); input.value = ''; return; }
        _arquivos[key] = file;
        const infoId = { solicitacao: 'file-sol-info', tce: 'file-tce-info', tce_nao_obrig: 'file-tce-nao-info' }[key];
        const info = document.getElementById(infoId);
        if (info) {
          info.innerHTML = `✓ ${escapeHtml(file.name)} (${(file.size / 1024).toFixed(1)} KB)`;
          info.classList.add('show');
        }
      });
      const dropId = { solicitacao: 'drop-solicitacao', tce: 'drop-tce', tce_nao_obrig: 'drop-tce-nao' }[key];
      const drop = document.getElementById(dropId);
      if (!drop) return;
      drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('drag-over'); });
      drop.addEventListener('dragleave', () => drop.classList.remove('drag-over'));
      drop.addEventListener('drop', e => {
        e.preventDefault(); drop.classList.remove('drag-over');
        const file = e.dataTransfer.files[0];
        if (file) { input.files = e.dataTransfer.files; input.dispatchEvent(new Event('change')); }
      });
    }

    async function enviarDocumentos() {
      const btn = document.getElementById('btn-enviar-docs');
      const feedbackId = 'feedback-upload';
      const tipo = _atual?.tipoEstagio;
      const temSol = _arquivos.solicitacao;
      const temTce = tipo === 'Obrigatório' ? _arquivos.tce : _arquivos.tce_nao_obrig;

      if (!temSol || !temTce) {
        showFormFeedback(feedbackId, 'error', 'Arquivos obrigatórios', 'Selecione todos os documentos antes de enviar.');
        return;
      }

      btn.classList.add('is-loading'); btn.disabled = true;
      hideFormFeedback(feedbackId);

      try {
        const [b64Sol, b64Tce] = await Promise.all([
          fileToBase64(tipo === 'Obrigatório' ? _arquivos.tce : _arquivos.tce_nao_obrig),
          fileToBase64(_arquivos.solicitacao),
        ]);

        await API.post('enviarDocumentosAssinados', {
          idEstagio: _atual.id,
          authToken: getAccessToken(),
          arquivos: {
            tce:        { nome: (tipo === 'Obrigatório' ? _arquivos.tce : _arquivos.tce_nao_obrig).name, base64: b64Sol },
            solicitacao:{ nome: _arquivos.solicitacao.name, base64: b64Tce },
          },
        });

        showFormFeedback(feedbackId, 'success', 'Documentos enviados!',
          'O setor de estágios irá revisar e encaminhar ao Diretor Geral. Você será notificado por e-mail.');
        btn.textContent = 'Enviado ✓';
        setTimeout(() => carregarEstagios(), 3000);
      } catch (err) {
        showFormFeedback(feedbackId, 'error', 'Erro no envio', err.message);
        btn.classList.remove('is-loading'); btn.disabled = false;
      }
    }

    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload  = () => resolve(reader.result.split(',')[1]);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    async function onAdendoTipoChange() {
      const tipo      = document.getElementById('adendo-tipoAdendo')?.value;
      const container = document.getElementById('adendo-campos-dinamicos');
      const btnWrap   = document.getElementById('btn-adendo-wrap');
      hideFormFeedback('fb-adendo');

      if (!tipo || !ADENDO_CONFIG[tipo]) {
        if (container) { container.innerHTML = ''; container.style.display = 'none'; }
        if (btnWrap)   btnWrap.style.display = 'none';
        return;
      }

      const cfg = ADENDO_CONFIG[tipo];
      let html = '';

      // Instrução
      if (cfg.instrucao) {
        html += `<p style="font-size:var(--font-size-sm);color:var(--color-text-muted);
                           background:var(--color-bg);border:1px solid var(--color-border);
                           border-radius:var(--radius-md);padding:var(--space-3) var(--space-4);
                           margin-bottom:var(--space-4)">${escapeHtml(cfg.instrucao)}</p>`;
      }

      // Campos diretos (sem subtipos)
      if (cfg.campos) {
        html += renderCamposAdendo(cfg.campos);
      }

      // Subtipos (remuneração, rescisão)
      if (cfg.subtipos) {
        const st = cfg.subtipos;
        html += `
          <div class="form-group">
            <label class="form-label">Tipo de Alteração <span style="color:var(--color-error)">*</span></label>
            <select id="${escapeHtml(st.id)}" class="form-control" onchange="onAdendoSubtipoChange()">
              <option value="">Selecione...</option>
              ${st.opcoes.map(o => `<option value="${escapeHtml(o.value)}">${escapeHtml(o.label)}</option>`).join('')}
            </select>
          </div>
          <div id="adendo-subcampos"></div>`;
      }

      // Justificativa e obs — sempre presentes
      html += `
        <div class="form-group">
          <label class="form-label">Justificativa <span style="color:var(--color-error)">*</span></label>
          <textarea id="adendo-justificativa" class="form-control" rows="3"
            placeholder="Motivo da solicitação de alteração…"></textarea>
        </div>
        <div class="form-group">
          <label class="form-label">Observações Adicionais</label>
          <textarea id="adendo-obsAdicionais" class="form-control" rows="2"></textarea>
        </div>`;

      container.innerHTML = html;
      container.style.display = '';
      if (btnWrap) btnWrap.style.display = 'flex';

      // Carrega orientadores se necessário
      if (tipo === 'Alteração de orientador') {
        await _carregarSelectOrientadoresAdendo();
      }
    }

    function onAdendoSubtipoChange() {
      const tipo   = document.getElementById('adendo-tipoAdendo')?.value;
      const cfg    = ADENDO_CONFIG[tipo];
      if (!cfg || !cfg.subtipos) return;

      const st       = cfg.subtipos;
      const subtipo  = document.getElementById(st.id)?.value;
      const subcont  = document.getElementById('adendo-subcampos');
      if (!subcont) return;

      if (!subtipo || !st.camposPorSubtipo[subtipo]) {
        subcont.innerHTML = '';

        // Rescisão pela empresa — verifica dados em falta
        if (tipo === 'Rescisão de estágio' && subtipo === 'pela-empresa') {
          subcont.innerHTML = _buildCamposRescisaoEmpresa();
        }
        return;
      }

      const campos = st.camposPorSubtipo[subtipo];
      if (tipo === 'Rescisão de estágio' && subtipo === 'pela-empresa') {
        subcont.innerHTML = _buildCamposRescisaoEmpresa();
      } else {
        subcont.innerHTML = renderCamposAdendo(campos);
      }
    }

    function _buildCamposRescisaoEmpresa() {
      // Mostra apenas campos que NÃO estão preenchidos no estágio atual
      const s = _atual || {};
      let html = '';
      if (!s.enderecoEmpresa)      html += renderCamposAdendo([{ id: 'ac-enderecoEmpresa',    label: 'Endereço da Empresa',                    type: 'text', required: true, placeholder: 'Rua, número, bairro, cidade/UF' }]);
      if (!s.telefoneEmpresa)      html += renderCamposAdendo([{ id: 'ac-telefoneEmpresa',    label: 'Telefone da Empresa',                    type: 'text', required: false, placeholder: 'Ex: (53) 99999-9999' }]);
      if (!s.representanteLegal)   html += renderCamposAdendo([{ id: 'ac-representanteLegal', label: 'Nome do Representante Legal da Empresa', type: 'text', required: true, placeholder: 'Nome completo' }]);
      if (!s.cargoRepresentante)   html += renderCamposAdendo([{ id: 'ac-cargoRepresentante', label: 'Cargo do Representante Legal',           type: 'text', required: true, placeholder: 'Ex: Diretor Administrativo' }]);
      if (!html) html = `<p style="font-size:var(--font-size-sm);color:var(--color-success);margin-bottom:var(--space-4)">✓ Todos os dados da empresa já estão registrados no sistema.</p>`;
      return html;
    }

    function renderCamposAdendo(campos) {
      return campos.map(f => {
        if (f.type === 'checkbox') {
          return `
            <div class="form-group">
              <label style="display:flex;align-items:center;gap:var(--space-2);font-size:var(--font-size-sm);cursor:pointer;font-weight:400">
                <input type="checkbox" id="${escapeHtml(f.id)}"
                  onchange="document.getElementById('${escapeHtml(f.toggleId)}').style.display=this.checked?'':'none'">
                ${escapeHtml(f.label)}
              </label>
            </div>
            <div id="${escapeHtml(f.toggleId)}" style="display:none"></div>`;
        }

        if (f.groupId && f.groupHidden) {
          // Campo dentro de um grupo toggle — renderizado no container do grupo
          const script = `
            <script>
              (function(){
                var g=document.getElementById('${escapeHtml(f.groupId)}');
                if(g) g.innerHTML += ${JSON.stringify(renderCamposAdendo([{...f, groupId:undefined, groupHidden:undefined}]))};
              })();
            </scr` + `ipt>`;
          return script;
        }

        const req  = f.required ? `<span style="color:var(--color-error)">*</span>` : '';
        let input  = '';

        if (f.type === 'select-api') {
          input = `<select id="${escapeHtml(f.id)}" class="form-control">
                     <option value="">Carregando orientadores…</option>
                   </select>`;
        } else if (f.type === 'textarea') {
          input = `<textarea id="${escapeHtml(f.id)}" class="form-control"
                     rows="${f.rows || 3}"
                     placeholder="${escapeHtml(f.placeholder || '')}"></textarea>`;
        } else if (f.type === 'number') {
          input = `<input type="number" id="${escapeHtml(f.id)}" class="form-control"
                     min="${f.min || ''}" max="${f.max || ''}"
                     placeholder="${escapeHtml(f.placeholder || '')}">`;
        } else {
          input = `<input type="${escapeHtml(f.type)}" id="${escapeHtml(f.id)}" class="form-control"
                     placeholder="${escapeHtml(f.placeholder || '')}">`;
        }

        return `<div class="form-group"><label class="form-label">${escapeHtml(f.label)} ${req}</label>${input}</div>`;
      }).join('');
    }

    async function _carregarSelectOrientadoresAdendo() {
      const sel = document.getElementById('ac-nomeNovoOrientador');
      if (!sel) return;
      try {
        const lista = await apiListarOrientadores(_atual?.curso || '');
        const opts  = Array.isArray(lista) ? lista : [];
        sel.innerHTML = '<option value="">Selecione um orientador…</option>' +
          opts.map(o => `<option value="${escapeHtml(o.nome)}" data-email="${escapeHtml(o.email)}">${escapeHtml(o.nome)}</option>`).join('');
      } catch (e) {
        sel.innerHTML = '<option value="">Erro ao carregar — tente novamente</option>';
      }
    }

    /* ════════════════════════════════════════
       ADENDO — COLETA CAMPOS DINÂMICOS
    ════════════════════════════════════════ */
    function _coletarCamposDinamicos() {
      // Coleta todos os inputs/selects/textareas com id começando em "ac-"
      const payload = {};
      document.querySelectorAll('[id^="ac-"]').forEach(el => {
        const key = el.id.replace('ac-', '');
        if (el.type === 'checkbox') {
          payload[key] = el.checked;
        } else {
          const val = (el.value || '').trim();
          if (val) payload[key] = val;
        }
      });
      // Orientador: pega também o email do data-attribute
      const oriSel = document.getElementById('ac-nomeNovoOrientador');
      if (oriSel && oriSel.value) {
        const opt = oriSel.options[oriSel.selectedIndex];
        if (opt && opt.dataset.email) payload['emailNovoOrientador'] = opt.dataset.email;
      }
      return payload;
    }

    /* ════════════════════════════════════════
       ENVIO — ADENDO (formulário)
    ════════════════════════════════════════ */
    async function submitAdendoForm(btn) {
      const fbId        = 'fb-adendo';
      const tipoAdendo  = document.getElementById('adendo-tipoAdendo')?.value;
      const justificativa = document.getElementById('adendo-justificativa')?.value?.trim();

      if (!tipoAdendo) {
        showFormFeedback(fbId, 'error', 'Tipo obrigatório', 'Selecione o tipo de adendo.');
        return;
      }
      if (!justificativa) {
        showFormFeedback(fbId, 'error', 'Justificativa obrigatória', 'Preencha a justificativa para o adendo.');
        return;
      }

      // Valida campos obrigatórios do tipo selecionado
      const cfg = ADENDO_CONFIG[tipoAdendo];
      const camposObrig = (cfg?.campos || []).filter(f => f.required && f.type !== 'checkbox' && !f.groupHidden);
      for (const f of camposObrig) {
        const el = document.getElementById(f.id);
        if (!el || !el.value.trim()) {
          showFormFeedback(fbId, 'error', 'Campo obrigatório', `Preencha o campo "${f.label}".`);
          el?.focus();
          return;
        }
      }

      btn.disabled = true; btn.classList.add('is-loading');
      hideFormFeedback(fbId);
      try {
        const camposDinamicos = _coletarCamposDinamicos();
        await API.post('enviarAdendo', {
          authToken:    getAccessToken(),
          idEstagio:    _atual.id,
          tipoAdendo,
          justificativa,
          obsAdicionais: document.getElementById('adendo-obsAdicionais')?.value?.trim() || '',
          ...camposDinamicos,
        });
        btn.classList.remove('is-loading');
        btn.textContent = 'Enviado ✓';
        showFormFeedback(fbId, 'success', 'Adendo enviado!',
          'Sua solicitação foi registrada e será analisada pelo setor de estágios.');
      } catch (err) {
        showFormFeedback(fbId, 'error', 'Erro ao enviar', err.message);
        btn.disabled = false; btn.classList.remove('is-loading');
      }
    }

    /* ════════════════════════════════════════
       ENVIO — ADENDO (upload)
    ════════════════════════════════════════ */
    async function submitAdendoUpload(btn) {
      const fbId          = 'fb-adendo';
      const tipoAdendo    = document.getElementById('adendo-tipoAdendo-up')?.value;
      const justificativa = document.getElementById('adendo-justificativa-up')?.value.trim();
      const fileInput     = document.getElementById('upload-adendo');
      const file          = fileInput?.files[0];

      if (!tipoAdendo || !justificativa || !file) {
        showFormFeedback(fbId, 'error', 'Campos obrigatórios', 'Selecione o tipo, informe a justificativa e anexe o PDF do adendo.');
        return;
      }
      btn.disabled = true; btn.classList.add('is-loading');
      hideFormFeedback(fbId);
      try {
        const b64 = await fileToBase64(file);
        await API.post('enviarAdendo', {
          authToken:   getAccessToken(),
          idEstagio:   _atual.id,
          tipoAdendo,
          justificativa,
          modoAnexo:   true,
          arquivo:     { nome: file.name, base64: b64 },
        });
        btn.classList.remove('is-loading');
        btn.textContent = 'Enviado ✓';
        showFormFeedback(fbId, 'success', 'Adendo enviado!',
          'Seu documento de adendo foi recebido e será analisado pelo setor de estágios.');
      } catch (err) {
        showFormFeedback(fbId, 'error', 'Erro ao enviar', err.message);
        btn.disabled = false; btn.classList.remove('is-loading');
      }
    }

    /* ════════════════════════════════════════
       TROCAR ORIENTADOR
    ════════════════════════════════════════ */
    let _orientadoresTroca = [];

    async function carregarOrientadoresTroca() {
      if (_orientadoresTroca.length) return;
      try {
        const lista = await apiListarOrientadores(_atual?.curso || '');
        _orientadoresTroca = Array.isArray(lista) ? lista : [];
      } catch (e) {
        _orientadoresTroca = [];
      }
    }

    async function inicializarTrocaOrientador() {
      await carregarOrientadoresTroca();
      const loading = document.getElementById('trocar-ori-loading');
      const form    = document.getElementById('trocar-ori-form');
      const sel     = document.getElementById('sel-novo-ori');
      if (!loading || !form || !sel) return;

      if (!_orientadoresTroca.length) {
        loading.textContent = 'Nenhum orientador disponível. Entre em contato com o setor de estágios.';
        return;
      }

      sel.innerHTML = '<option value="">Escolha um orientador…</option>' +
        _orientadoresTroca.map(o =>
          `<option value="${escapeHtml(o.email)}" data-nome="${escapeHtml(o.nome)}">${escapeHtml(o.nome)}</option>`
        ).join('');

      loading.style.display = 'none';
      form.style.display    = '';
    }

    async function confirmarTrocaOrientador() {
      const sel  = document.getElementById('sel-novo-ori');
      const fbId = 'fb-trocar-ori';
      if (!sel || !sel.value) {
        showFormFeedback(fbId, 'error', 'Selecione um orientador', 'Escolha um orientador da lista antes de continuar.');
        return;
      }
      const emailOri = sel.value;
      const nomeOri  = sel.options[sel.selectedIndex]?.dataset?.nome || sel.value;
      const btn      = document.querySelector('#trocar-ori-form .btn-primary');
      if (btn) { btn.disabled = true; btn.classList.add('is-loading'); }
      hideFormFeedback(fbId);
      try {
        await apiTrocarOrientador({
          authToken:       getAccessToken(),
          idEstagio:       _atual.id,
          nomeOrientador:  nomeOri,
          emailOrientador: emailOri,
        });
        showFormFeedback(fbId, 'success', 'Solicitação enviada!',
          nomeOri + ' receberá um e-mail para aceitar a orientação. Você será notificado por e-mail.');
        if (btn) { btn.textContent = 'Enviado ✓'; }
        setTimeout(() => carregarEstagios(), 3000);
      } catch (err) {
        showFormFeedback(fbId, 'error', 'Erro ao trocar orientador', err.message);
        if (btn) { btn.disabled = false; btn.classList.remove('is-loading'); }
      }
    }
