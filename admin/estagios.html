<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Estágios — Admin · Central de Estágios IFRS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <link rel="stylesheet" href="../assets/css/layout.css">
  <style>
    /* ── Toolbar ── */
    .admin-toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: var(--space-3);
      align-items: flex-end;
      margin-bottom: var(--space-5);
    }
    .admin-toolbar .form-group { margin-bottom: 0; flex: 1; min-width: 130px; }
    .admin-toolbar .form-group label {
      font-size: var(--font-size-xs); color: var(--color-text-muted);
      margin-bottom: 4px; display: block; font-weight: 600;
      text-transform: uppercase; letter-spacing: .04em;
    }
    .admin-toolbar .form-group select,
    .admin-toolbar .form-group input[type="search"] {
      width: 100%; height: 36px; padding: 0 var(--space-3);
      border: 1px solid var(--color-border); border-radius: var(--radius-md);
      font-size: var(--font-size-sm); background: var(--color-surface);
      color: var(--color-text);
    }
    .toolbar-actions {
      display: flex; gap: var(--space-2); align-items: center; margin-left: auto; flex-wrap: wrap;
    }
    .toolbar-sep {
      width: 1px; height: 28px; background: var(--color-border); margin: 0 var(--space-1);
    }
    .btn-export {
      display: inline-flex; align-items: center; gap: 5px;
      height: 32px; padding: 0 var(--space-3);
      border-radius: var(--radius-md); border: 1px solid var(--color-border);
      font-size: var(--font-size-xs); font-weight: 600; cursor: pointer;
      transition: all .15s; white-space: nowrap; background: var(--color-surface);
      color: var(--color-text); text-decoration: none;
    }
    .btn-export:hover { background: var(--color-bg); border-color: #9ca3af; }
    .btn-export--xls { color: #166534; border-color: #bbf7d0; background: #f0fdf4; }
    .btn-export--xls:hover { background: #dcfce7; border-color: #86efac; }
    .btn-export--pdf { color: #991b1b; border-color: #fecaca; background: #fff5f5; }
    .btn-export--pdf:hover { background: #fee2e2; border-color: #fca5a5; }

    /* ── Tabela ── */
    .table-wrap {
      overflow-x: auto; border-radius: var(--radius-lg);
      border: 1px solid var(--color-border); background: var(--color-surface);
    }
    .data-table { width: 100%; border-collapse: collapse; font-size: var(--font-size-sm); }
    .data-table th {
      background: var(--color-bg); padding: var(--space-3) var(--space-4);
      text-align: left; font-weight: var(--font-weight-semibold);
      font-size: var(--font-size-xs); color: var(--color-text-muted);
      text-transform: uppercase; letter-spacing: 0.05em;
      border-bottom: 1px solid var(--color-border); white-space: nowrap;
    }
    .data-table td {
      padding: var(--space-3) var(--space-4);
      border-bottom: 1px solid var(--color-border); vertical-align: middle;
    }
    .data-table tr:last-child td { border-bottom: none; }
    .data-table tr:hover td { background: #F9FAFB; }
    .data-table .td-actions { display: flex; gap: var(--space-2); white-space: nowrap; }

    /* ── Badges de status ── */
    .badge {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 2px 10px; border-radius: 9999px;
      font-size: 11px; font-weight: 600; white-space: nowrap;
    }
    .badge::before {
      content: ''; display: inline-block; width: 6px; height: 6px;
      border-radius: 50%; background: currentColor; flex-shrink: 0;
    }
    .badge-pending  { background: var(--color-warning-light); color: var(--color-warning); }
    .badge-analysis { background: var(--color-info-light);    color: var(--color-info); }
    .badge-approved { background: var(--color-success-light); color: var(--color-success); }
    .badge-rejected { background: var(--color-error-light);   color: var(--color-error); }
    .badge-docs     { background: #EDE9FE; color: #7C3AED; }
    .badge-dg       { background: #FEF3C7; color: #92400E; }
    .badge-running  { background: var(--color-success-light); color: #065F46; }
    .badge-closed   { background: var(--color-bg); color: var(--color-text-muted); }

    /* ── Empty state ── */
    .empty-state {
      text-align: center; padding: var(--space-16) var(--space-6);
      color: var(--color-text-muted);
    }
    .empty-state svg { width: 48px; height: 48px; margin: 0 auto var(--space-4); opacity: 0.3; }

    /* ── Paginação ── */
    .pagination {
      display: flex; justify-content: center; gap: var(--space-2);
      margin-top: var(--space-6); flex-wrap: wrap;
    }
    .pagination button {
      padding: var(--space-2) var(--space-3); border: 1px solid var(--color-border);
      border-radius: var(--radius-md); background: var(--color-surface);
      font-size: var(--font-size-xs); cursor: pointer; transition: all 0.15s; min-width: 36px;
    }
    .pagination button:hover { background: var(--color-bg); }
    .pagination button.active { background: var(--color-primary); border-color: var(--color-primary); color: #fff; }
    .pagination button:disabled { opacity: 0.4; cursor: not-allowed; }

    /* ── Loading / error ── */
    .table-loading {
      text-align: center; padding: var(--space-12);
      color: var(--color-text-muted); font-size: var(--font-size-sm);
    }

    /* ── Alerta de pendentes ── */
    #alerta-pendentes {
      display: none; align-items: center; gap: var(--space-3);
      background: var(--color-warning-light, #fefce8);
      border: 1px solid var(--color-warning-border, #fbbf24);
      color: var(--color-warning, #b45309);
      border-radius: var(--radius-lg); padding: var(--space-3) var(--space-4);
      font-size: var(--font-size-sm); font-weight: 500; margin-bottom: var(--space-5);
    }
    #alerta-pendentes svg { flex-shrink: 0; }

    /* ── Print styles ── */
    @media print {
      #app-header, #app-footer,
      .admin-toolbar, #alerta-pendentes,
      #resultado-count, #pagination,
      .no-print { display: none !important; }

      .page-hero { padding: 12px 0 8px !important; }
      .page-hero h1 { font-size: 18px !important; margin: 0; }
      .page-hero p { display: none; }

      .table-wrap { border: none; overflow: visible; }
      .data-table { font-size: 11px; }
      .data-table th { font-size: 10px; padding: 4px 6px; }
      .data-table td { padding: 4px 6px; }
      .data-table tr:hover td { background: none; }

      .td-actions { display: none; }
      .badge::before { display: none; }
      .badge { padding: 1px 4px; }

      #print-meta {
        display: block !important;
        font-size: 11px; color: #666; margin-bottom: 8px;
      }
      body { font-size: 12px; }
    }
    #print-meta { display: none; }
  </style>
</head>
<body>

  <header id="app-header">
    <div class="container">
      <div class="header-inner">
        <a href="../index.html" class="header-brand">
          <span class="header-logo-wrap"><img src="../assets/img/logo-ifrs.png" alt="IFRS" class="header-logo"></span>
        </a>
        <div style="display:flex;align-items:center;gap:var(--space-3);">
          <div id="header-user-area"></div>
          <a href="index.html" class="back-link">
            <svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="M9.707 16.707a1 1 0 01-1.414 0l-6-6a1 1 0 010-1.414l6-6a1 1 0 011.414 1.414L5.414 9H17a1 1 0 110 2H5.414l4.293 4.293a1 1 0 010 1.414z" clip-rule="evenodd"/></svg>
            Admin
          </a>
        </div>
      </div>
    </div>
  </header>

  <main id="main-content">
    <section class="page-hero">
      <div class="container">
        <h1>Estágios</h1>
        <p>Acompanhamento completo de todos os estágios: solicitações, documentos e histórico.</p>
      </div>
    </section>

    <div class="container" style="padding-top:var(--space-6);padding-bottom:var(--space-12);">

      <!-- Alerta de pendentes -->
      <div id="alerta-pendentes" role="alert">
        <svg width="18" height="18" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
          <path fill-rule="evenodd" d="M8.257 3.099c.765-1.36 2.722-1.36 3.486 0l5.58 9.92c.75 1.334-.213 2.98-1.742 2.98H4.42c-1.53 0-2.493-1.646-1.743-2.98l5.58-9.92zM11 13a1 1 0 11-2 0 1 1 0 012 0zm-1-8a1 1 0 00-1 1v3a1 1 0 002 0V6a1 1 0 00-1-1z" clip-rule="evenodd"/>
        </svg>
        <span id="alerta-pendentes-texto"></span>
      </div>

      <!-- Toolbar de filtros -->
      <div class="admin-toolbar no-print">
        <div class="form-group">
          <label for="filtro-status">Status</label>
          <select id="filtro-status" class="form-control">
            <option value="">Todos</option>
            <option value="Pendente">Pendente</option>
            <option value="Em análise">Em análise</option>
            <optgroup label="Fluxo novo">
              <option value="Em Checklist">Em Checklist</option>
              <option value="Em Assinaturas">Em Assinaturas</option>
              <option value="Ativo">Ativo</option>
            </optgroup>
            <optgroup label="Fluxo legado">
              <option value="Aguardando Documentos">Aguardando Documentos</option>
              <option value="Docs Enviados">Docs Enviados</option>
              <option value="Aguardando DG">Aguardando DG</option>
              <option value="Aguardando Validação Final">Aguardando Validação Final</option>
              <option value="Em execução">Em execução</option>
            </optgroup>
            <option value="Encerrado">Encerrado</option>
            <option value="Reprovado">Reprovado</option>
          </select>
        </div>
        <div class="form-group">
          <label for="filtro-tipo">Tipo</label>
          <select id="filtro-tipo" class="form-control">
            <option value="">Todos</option>
            <option value="Obrigatório">Obrigatório</option>
            <option value="Não Obrigatório">Não Obrigatório</option>
          </select>
        </div>
        <div class="form-group">
          <label for="filtro-curso">Curso</label>
          <select id="filtro-curso" class="form-control">
            <option value="">Todos</option>
          </select>
        </div>
        <div class="form-group">
          <label for="filtro-empresa">Concedente</label>
          <select id="filtro-empresa" class="form-control">
            <option value="">Todas</option>
          </select>
        </div>
        <div class="form-group">
          <label for="filtro-orientador">Orientador</label>
          <select id="filtro-orientador" class="form-control">
            <option value="">Todos</option>
          </select>
        </div>
        <div class="form-group">
          <label for="filtro-supervisor">Supervisor</label>
          <select id="filtro-supervisor" class="form-control">
            <option value="">Todos</option>
          </select>
        </div>
        <div class="form-group" style="min-width:190px;">
          <label for="filtro-busca">Buscar</label>
          <input type="search" id="filtro-busca" class="form-control" placeholder="Nome, matrícula, concedente…">
        </div>
        <div class="toolbar-actions">
          <button id="btn-limpar" class="btn btn-ghost btn-sm" title="Limpar filtros">
            <svg width="14" height="14" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd"/></svg>
            Limpar
          </button>
          <button id="btn-atualizar" class="btn btn-secondary btn-sm">
            <svg width="16" height="16" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M4 2a1 1 0 011 1v2.101a7.002 7.002 0 0111.601 2.566 1 1 0 11-1.885.666A5.002 5.002 0 005.999 7H9a1 1 0 010 2H4a1 1 0 01-1-1V3a1 1 0 011-1zm.008 9.057a1 1 0 011.276.61A5.002 5.002 0 0014.001 13H11a1 1 0 110-2h5a1 1 0 011 1v5a1 1 0 11-2 0v-2.101a7.002 7.002 0 01-11.601-2.566 1 1 0 01.61-1.276z" clip-rule="evenodd"/></svg>
            Atualizar
          </button>
          <div class="toolbar-sep"></div>
          <button class="btn-export btn-export--xls" onclick="exportarXLS()" title="Exportar dados filtrados para Excel">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/>
              <line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/>
              <polyline points="10 9 9 9 8 9"/>
            </svg>
            XLS
          </button>
          <button class="btn-export btn-export--pdf" onclick="exportarPDF()" title="Imprimir / Exportar como PDF">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 01-2-2v-5a2 2 0 012-2h16a2 2 0 012 2v5a2 2 0 01-2 2h-2"/>
              <rect x="6" y="14" width="12" height="8"/>
            </svg>
            PDF
          </button>
        </div>
      </div>

      <!-- Meta de impressão (só aparece no print) -->
      <div id="print-meta"></div>

      <!-- Contador de resultados -->
      <div id="resultado-count" style="font-size:var(--font-size-xs);color:var(--color-text-muted);margin-bottom:var(--space-3);"></div>

      <!-- Tabela -->
      <div class="table-wrap">
        <table class="data-table" id="tbl-estagios" aria-label="Estágios">
          <thead>
            <tr>
              <th>ID</th>
              <th>Estudante</th>
              <th>Curso</th>
              <th>Concedente</th>
              <th>Orientador</th>
              <th>Tipo</th>
              <th>Início</th>
              <th>Fim</th>
              <th>Status</th>
              <th class="no-print">Ações</th>
            </tr>
          </thead>
          <tbody id="tbody-estagios">
            <tr>
              <td colspan="10" class="table-loading">
                <span>Carregando estágios…</span>
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <div id="pagination" class="pagination no-print"></div>

    </div>
  </main>

  <footer id="app-footer">
    <div class="container">
      <div class="footer-inner">
        <span class="footer-copy">&copy; <script>document.write(new Date().getFullYear())</script> Central de Estágios — IFRS Campus Rio Grande</span>
        <nav class="footer-links"><a href="mailto:estagios@riogrande.ifrs.edu.br">estagios@riogrande.ifrs.edu.br</a></nav>
      </div>
    </div>
  </footer>

  <!-- SheetJS para exportação XLS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://accounts.google.com/gsi/client" async></script>
  <script src="../assets/js/utils.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/api.js"></script>
  <script>
    'use strict';

    /* ────────────────────────────────────
       Estado local
    ──────────────────────────────────── */
    let _dados = [];
    let _dadosFiltrados = [];
    let _paginaAtual = 1;
    const POR_PAGINA = 25;

    /* ────────────────────────────────────
       Inicialização
    ──────────────────────────────────── */
    document.addEventListener('DOMContentLoaded', function () {
      if (!requireAdminAuth()) return;
      carregarEstagios();

      document.getElementById('btn-atualizar').addEventListener('click', carregarEstagios);
      document.getElementById('btn-limpar').addEventListener('click', limparFiltros);

      ['filtro-status','filtro-tipo','filtro-curso','filtro-empresa','filtro-orientador','filtro-supervisor'].forEach(id => {
        document.getElementById(id).addEventListener('change', aplicarFiltros);
      });
      document.getElementById('filtro-busca').addEventListener('input', aplicarFiltros);

      // Abre em status específico se vier via URL ?status=...
      const params = new URLSearchParams(window.location.search);
      if (params.get('status')) {
        document.getElementById('filtro-status').value = params.get('status');
      }
    });

    /* ────────────────────────────────────
       Carregamento
    ──────────────────────────────────── */
    async function carregarEstagios() {
      setTabelaLoading(true);
      try {
        const token = getAccessToken();
        const data = await API.get('listarSolicitacoesAdmin', { authToken: token });
        _dados = Array.isArray(data) ? data : (data.solicitacoes || []);
        popularFiltrosDinamicos();
        verificarPendentes();
        aplicarFiltros();
      } catch (err) {
        setTabelaErro('Não foi possível carregar os estágios. ' + escapeHtml(err.message));
      }
    }

    function popularFiltrosDinamicos() {
      const cursos      = [...new Set(_dados.map(s => s.curso || '').filter(Boolean))].sort();
      const empresas    = [...new Set(_dados.map(s => s.empresa || '').filter(Boolean))].sort();
      const orientadores = [...new Set(_dados.map(s => s.nomeOrientador || '').filter(Boolean))].sort();
      const supervisores = [...new Set(_dados.map(s => s.nomeSupervisor || '').filter(Boolean))].sort();

      preencherSelect('filtro-curso',     cursos,      'Todos');
      preencherSelect('filtro-empresa',   empresas,    'Todas');
      preencherSelect('filtro-orientador', orientadores, 'Todos');
      preencherSelect('filtro-supervisor', supervisores, 'Todos');
    }

    function preencherSelect(id, itens, labelTodos) {
      const sel = document.getElementById(id);
      const valorAtual = sel.value;
      sel.innerHTML = `<option value="">${labelTodos}</option>`;
      itens.forEach(v => {
        const opt = document.createElement('option');
        opt.value = v;
        opt.textContent = v;
        if (v === valorAtual) opt.selected = true;
        sel.appendChild(opt);
      });
    }

    function verificarPendentes() {
      const pendentes = _dados.filter(s => s.status === 'Pendente').length;
      const el = document.getElementById('alerta-pendentes');
      if (pendentes > 0) {
        document.getElementById('alerta-pendentes-texto').textContent =
          'Há ' + pendentes + ' solicitaç' + (pendentes === 1 ? 'ão pendente' : 'ões pendentes') + ' de aprovação.';
        el.style.display = 'flex';
      } else {
        el.style.display = 'none';
      }
    }

    /* ────────────────────────────────────
       Filtros
    ──────────────────────────────────── */
    function aplicarFiltros() {
      const status     = document.getElementById('filtro-status').value.toLowerCase();
      const tipo       = document.getElementById('filtro-tipo').value.toLowerCase();
      const curso      = document.getElementById('filtro-curso').value.toLowerCase();
      const empresa    = document.getElementById('filtro-empresa').value.toLowerCase();
      const orientador = document.getElementById('filtro-orientador').value.toLowerCase();
      const supervisor = document.getElementById('filtro-supervisor').value.toLowerCase();
      const busca      = document.getElementById('filtro-busca').value.toLowerCase().trim();

      _dadosFiltrados = _dados.filter(s => {
        if (status     && (s.status         || '').toLowerCase() !== status)     return false;
        if (tipo       && (s.tipoEstagio    || '').toLowerCase() !== tipo)       return false;
        if (curso      && (s.curso          || '').toLowerCase() !== curso)      return false;
        if (empresa    && (s.empresa        || '').toLowerCase() !== empresa)    return false;
        if (orientador && (s.nomeOrientador || '').toLowerCase() !== orientador) return false;
        if (supervisor && (s.nomeSupervisor || '').toLowerCase() !== supervisor) return false;
        if (busca) {
          const texto = [s.nomeEstudante, s.matricula, s.empresa, s.id,
                         s.nomeOrientador, s.nomeSupervisor, s.curso].join(' ').toLowerCase();
          if (!texto.includes(busca)) return false;
        }
        return true;
      });

      _paginaAtual = 1;
      renderTabela();
    }

    function limparFiltros() {
      ['filtro-status','filtro-tipo','filtro-curso','filtro-empresa','filtro-orientador','filtro-supervisor'].forEach(id => {
        document.getElementById(id).value = '';
      });
      document.getElementById('filtro-busca').value = '';
      aplicarFiltros();
    }

    /* ────────────────────────────────────
       Render tabela
    ──────────────────────────────────── */
    function renderTabela() {
      const tbody   = document.getElementById('tbody-estagios');
      const countEl = document.getElementById('resultado-count');

      if (_dadosFiltrados.length === 0) {
        tbody.innerHTML = `
          <tr><td colspan="10">
            <div class="empty-state">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12h3.75M9 15h3.75M9 18h3.75m3 .75H18a2.25 2.25 0 002.25-2.25V6.108c0-1.135-.845-2.098-1.976-2.192a48.424 48.424 0 00-1.123-.08m-5.801 0c-.065.21-.1.433-.1.664 0 .414.336.75.75.75h4.5a.75.75 0 00.75-.75 2.25 2.25 0 00-.1-.664m-5.8 0A2.251 2.251 0 0113.5 2.25H15c1.012 0 1.867.668 2.15 1.586m-5.8 0c-.376.023-.75.05-1.124.08C9.095 4.01 8.25 4.973 8.25 6.108V8.25m0 0H4.875c-.621 0-1.125.504-1.125 1.125v11.25c0 .621.504 1.125 1.125 1.125h9.75c.621 0 1.125-.504 1.125-1.125V9.375c0-.621-.504-1.125-1.125-1.125H8.25z"/></svg>
              <p>Nenhum estágio encontrado com os filtros aplicados.</p>
            </div>
          </td></tr>`;
        document.getElementById('pagination').innerHTML = '';
        countEl.textContent = '';
        return;
      }

      countEl.textContent = _dadosFiltrados.length + ' estágio' + (_dadosFiltrados.length !== 1 ? 's' : '') +
                            ' encontrado' + (_dadosFiltrados.length !== 1 ? 's' : '');

      const inicio = (_paginaAtual - 1) * POR_PAGINA;
      const fim    = Math.min(inicio + POR_PAGINA, _dadosFiltrados.length);
      const pagina = _dadosFiltrados.slice(inicio, fim);

      tbody.innerHTML = pagina.map(s => {
        const inicio = s.dataInicio  ? formatarData(s.dataInicio)  : '—';
        const fim    = s.dataTermino ? formatarData(s.dataTermino) : '—';
        return `
        <tr>
          <td><code style="font-size:11px;color:var(--color-secondary)">${escapeHtml(s.id || '—')}</code></td>
          <td>
            <div style="font-weight:500;line-height:1.3">${escapeHtml(s.nomeEstudante || '—')}</div>
            <div style="font-size:11px;color:var(--color-text-muted)">${escapeHtml(s.matricula || '')}</div>
          </td>
          <td style="font-size:12px;max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${escapeHtml(s.curso || '')}">${escapeHtml(s.curso || '—')}</td>
          <td style="max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${escapeHtml(s.empresa || '')}">${escapeHtml(s.empresa || '—')}</td>
          <td style="font-size:12px;max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${escapeHtml(s.nomeOrientador || '')}">${escapeHtml(s.nomeOrientador || '—')}</td>
          <td><span class="badge ${s.tipoEstagio === 'Obrigatório' ? 'badge-approved' : 'badge-analysis'}">${escapeHtml(s.tipoEstagio || '—')}</span></td>
          <td style="font-size:12px;white-space:nowrap">${escapeHtml(inicio)}</td>
          <td style="font-size:12px;white-space:nowrap">${escapeHtml(fim)}</td>
          <td>${badgeStatus(s.status)}</td>
          <td class="no-print">
            <div class="td-actions">
              <a href="estagio.html?id=${escapeHtml(s.id)}" class="btn btn-secondary btn-sm">Ver</a>
            </div>
          </td>
        </tr>`;
      }).join('');

      renderPaginacao(_dadosFiltrados.length);
    }

    function renderPaginacao(total) {
      const totalPaginas = Math.ceil(total / POR_PAGINA);
      const pag = document.getElementById('pagination');
      if (totalPaginas <= 1) { pag.innerHTML = ''; return; }

      let html = `<button onclick="irPagina(${_paginaAtual - 1})" ${_paginaAtual === 1 ? 'disabled' : ''}>‹</button>`;
      for (let i = 1; i <= totalPaginas; i++) {
        if (totalPaginas > 7) {
          if (i !== 1 && i !== totalPaginas && Math.abs(i - _paginaAtual) > 2) {
            if (i === 2 || i === totalPaginas - 1) html += '<button disabled>…</button>';
            continue;
          }
        }
        html += `<button class="${i === _paginaAtual ? 'active' : ''}" onclick="irPagina(${i})">${i}</button>`;
      }
      html += `<button onclick="irPagina(${_paginaAtual + 1})" ${_paginaAtual === totalPaginas ? 'disabled' : ''}>›</button>`;
      pag.innerHTML = html;
    }

    function irPagina(n) {
      const totalPaginas = Math.ceil(_dadosFiltrados.length / POR_PAGINA);
      if (n < 1 || n > totalPaginas) return;
      _paginaAtual = n;
      renderTabela();
      document.querySelector('.table-wrap').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    /* ────────────────────────────────────
       Exportação
    ──────────────────────────────────── */
    function exportarXLS() {
      if (_dadosFiltrados.length === 0) {
        alert('Nenhum dado para exportar. Ajuste os filtros e tente novamente.');
        return;
      }

      const linhas = _dadosFiltrados.map(s => ({
        'ID Estágio':         s.id                  || '',
        'Estudante':          s.nomeEstudante        || '',
        'Matrícula':          s.matricula            || '',
        'Curso':              s.curso                || '',
        'E-mail Estudante':   s.emailEstudante       || '',
        'Empresa':            s.empresa              || '',
        'Orientador':         s.nomeOrientador       || '',
        'Supervisor':         s.nomeSupervisor       || '',
        'Tipo de Estágio':    s.tipoEstagio          || '',
        'Data Início':        s.dataInicio           || '',
        'Data Término':       s.dataTermino          || '',
        'Carga Horária (h/sem)': s.cargaHorariaSemanal || '',
        'Status':             s.status               || '',
        'Obs. Setor':         s.observacaoSetor      || '',
      }));

      const ws = XLSX.utils.json_to_sheet(linhas);

      // Largura das colunas
      ws['!cols'] = [
        {wch:18},{wch:30},{wch:12},{wch:35},{wch:30},
        {wch:30},{wch:28},{wch:28},{wch:18},
        {wch:12},{wch:12},{wch:14},{wch:28},{wch:40},
      ];

      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, 'Estágios');

      const agora = new Date();
      const ts = agora.toISOString().slice(0,10);
      XLSX.writeFile(wb, `estagios_${ts}.xlsx`);
    }

    function exportarPDF() {
      if (_dadosFiltrados.length === 0) {
        alert('Nenhum dado para exportar. Ajuste os filtros e tente novamente.');
        return;
      }

      // Preenche o meta de impressão com filtros ativos e data
      const agora   = new Date().toLocaleString('pt-BR');
      const total   = _dadosFiltrados.length;
      const filtros = resumoFiltrosAtivos();
      const meta    = document.getElementById('print-meta');
      meta.innerHTML =
        `<strong>IFRS Campus Rio Grande — Relatório de Estágios</strong><br>` +
        `Gerado em: ${agora} &nbsp;|&nbsp; Total: ${total} registro${total !== 1 ? 's' : ''}` +
        (filtros ? `<br>Filtros: ${escapeHtml(filtros)}` : '');

      // Renderiza toda a lista (sem paginação) para impressão
      const tbody = document.getElementById('tbody-estagios');
      const bkpHtml    = tbody.innerHTML;
      const bkpPagina  = _paginaAtual;
      const bkpQtd     = POR_PAGINA;

      // Renderiza todos os registros filtrados na tabela temporariamente
      tbody.innerHTML = _dadosFiltrados.map(s => {
        const ini = s.dataInicio  ? formatarData(s.dataInicio)  : '—';
        const fim = s.dataTermino ? formatarData(s.dataTermino) : '—';
        return `<tr>
          <td><code style="font-size:10px">${escapeHtml(s.id || '—')}</code></td>
          <td>${escapeHtml(s.nomeEstudante || '—')}<br><small style="color:#666">${escapeHtml(s.matricula || '')}</small></td>
          <td>${escapeHtml(s.curso || '—')}</td>
          <td>${escapeHtml(s.empresa || '—')}</td>
          <td>${escapeHtml(s.nomeOrientador || '—')}</td>
          <td>${escapeHtml(s.tipoEstagio || '—')}</td>
          <td>${escapeHtml(ini)}</td>
          <td>${escapeHtml(fim)}</td>
          <td>${escapeHtml(s.status || '—')}</td>
          <td class="no-print"></td>
        </tr>`;
      }).join('');

      window.print();

      // Restaura após impressão
      setTimeout(() => {
        tbody.innerHTML = bkpHtml;
        meta.innerHTML  = '';
      }, 500);
    }

    function resumoFiltrosAtivos() {
      const partes = [];
      const st = document.getElementById('filtro-status').value;
      const ti = document.getElementById('filtro-tipo').value;
      const cu = document.getElementById('filtro-curso').value;
      const em = document.getElementById('filtro-empresa').value;
      const or = document.getElementById('filtro-orientador').value;
      const su = document.getElementById('filtro-supervisor').value;
      const bu = document.getElementById('filtro-busca').value.trim();
      if (st) partes.push('Status: ' + st);
      if (ti) partes.push('Tipo: ' + ti);
      if (cu) partes.push('Curso: ' + cu);
      if (em) partes.push('Empresa: ' + em);
      if (or) partes.push('Orientador: ' + or);
      if (su) partes.push('Supervisor: ' + su);
      if (bu) partes.push('Busca: "' + bu + '"');
      return partes.join('  ·  ');
    }

    /* ────────────────────────────────────
       Helpers
    ──────────────────────────────────── */
    function formatarData(iso) {
      if (!iso) return '—';
      const p = String(iso).split('-');
      if (p.length === 3) return p[2] + '/' + p[1] + '/' + p[0];
      return iso;
    }

    function badgeStatus(status) {
      const map = {
        'Pendente':                  'badge-pending',
        'Em análise':                'badge-analysis',
        'Em Checklist':              'badge-analysis',
        'Em Assinaturas':            'badge-docs',
        'Ativo':                     'badge-running',
        'Aguardando Documentos':     'badge-approved',
        'Docs Enviados':             'badge-docs',
        'Aguardando DG':             'badge-dg',
        'Aguardando Validação Final':'badge-dg',
        'Em execução':               'badge-running',
        'Encerrado':                 'badge-closed',
        'Reprovado':                 'badge-rejected',
      };
      const cls = map[status] || 'badge-closed';
      return `<span class="badge ${cls}">${escapeHtml(status || '—')}</span>`;
    }

    function setTabelaLoading(show) {
      if (show) {
        document.getElementById('tbody-estagios').innerHTML =
          '<tr><td colspan="10" class="table-loading">Carregando…</td></tr>';
        document.getElementById('pagination').innerHTML = '';
        document.getElementById('resultado-count').textContent = '';
      }
    }

    function setTabelaErro(msg) {
      document.getElementById('tbody-estagios').innerHTML =
        `<tr><td colspan="10" class="table-loading" style="color:var(--color-error)">${msg}</td></tr>`;
    }
  </script>
</body>
</html>
