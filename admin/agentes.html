<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" href="../assets/img/fav.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agentes de Integração — Admin · Central de Estágios IFRS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <link rel="stylesheet" href="../assets/css/layout.css">
  <style>
    .admin-toolbar{display:flex;flex-wrap:wrap;gap:var(--space-3);align-items:flex-end;margin-bottom:var(--space-5);}
    .admin-toolbar .form-group{margin-bottom:0;flex:1;min-width:140px;}
    .admin-toolbar .form-group label{font-size:var(--font-size-xs);color:var(--color-text-muted);margin-bottom:4px;display:block;}
    .table-wrap{overflow-x:auto;border-radius:var(--radius-lg);border:1px solid var(--color-border);background:var(--color-surface);}
    .data-table{width:100%;border-collapse:collapse;font-size:var(--font-size-sm);}
    .data-table th{background:var(--color-bg);padding:var(--space-3) var(--space-4);text-align:left;font-weight:600;font-size:var(--font-size-xs);color:var(--color-text-muted);text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--color-border);white-space:nowrap;}
    .data-table td{padding:var(--space-3) var(--space-4);border-bottom:1px solid var(--color-border);vertical-align:middle;}
    .data-table tr:last-child td{border-bottom:none;}
    .data-table tr:hover td{background:#F9FAFB;}
    .td-actions{display:flex;gap:var(--space-2);}
    .badge{display:inline-flex;align-items:center;gap:4px;padding:2px 10px;border-radius:9999px;font-size:11px;font-weight:600;}
    .badge::before{content:'';display:inline-block;width:6px;height:6px;border-radius:50%;background:currentColor;flex-shrink:0;}
    .badge-active  {background:var(--color-success-light);color:var(--color-success);}
    .badge-inactive{background:var(--color-bg);color:var(--color-text-muted);}
    .badge-pending {background:#FEF9C3;color:#854D0E;}
    .badge-deleted {background:#F3F4F6;color:#6B7280;}
    .empty-state{text-align:center;padding:var(--space-12);color:var(--color-text-muted);}
    .empty-state svg{width:48px;height:48px;margin:0 auto var(--space-4);opacity:.3;}
    .table-loading{text-align:center;padding:var(--space-12);color:var(--color-text-muted);font-size:var(--font-size-sm);}
    /* Modal */
    .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1000;display:flex;align-items:flex-start;justify-content:center;padding:var(--space-8) var(--space-4);overflow-y:auto;}
    .modal-overlay.hidden{display:none;}
    .modal{background:var(--color-surface);border-radius:var(--radius-xl);box-shadow:0 20px 40px rgba(0,0,0,.2);width:100%;max-width:640px;animation:modal-in .2s ease;}
    @keyframes modal-in{from{opacity:0;transform:translateY(-16px);}}
    .modal-header{display:flex;align-items:center;justify-content:space-between;padding:var(--space-5) var(--space-6);border-bottom:1px solid var(--color-border);}
    .modal-header h2{font-size:var(--font-size-lg);font-weight:600;}
    .modal-close{background:none;border:none;cursor:pointer;color:var(--color-text-muted);padding:var(--space-1);border-radius:var(--radius-md);}
    .modal-body{padding:var(--space-6);}
    .modal-footer{padding:var(--space-4) var(--space-6);border-top:1px solid var(--color-border);display:flex;gap:var(--space-3);justify-content:flex-end;flex-wrap:wrap;}
    .detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-4) var(--space-6);}
    .detail-grid .full{grid-column:1/-1;}
    .detail-label{font-size:11px;color:var(--color-text-muted);text-transform:uppercase;font-weight:600;margin-bottom:2px;}
    .detail-value{font-size:14px;}
    .delete-warning{background:#FEF2F2;border:1px solid #FECACA;border-radius:var(--radius-md);padding:var(--space-4);margin-bottom:var(--space-4);color:#991B1B;font-size:14px;}
  </style>
</head>
<body>

  <header id="app-header">
    <div class="container">
      <div class="header-inner">
        <a href="../index.html" class="header-brand">
          <span class="header-logo-wrap"><img src="../assets/img/logo-ifrs.png" alt="IFRS" class="header-logo"></span>
        </a>
        <div style="display:flex;align-items:center;gap:var(--space-3);">
          <div id="header-user-area"></div>
          <a href="index.html" class="back-link">
            <svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="M9.707 16.707a1 1 0 01-1.414 0l-6-6a1 1 0 010-1.414l6-6a1 1 0 011.414 1.414L5.414 9H17a1 1 0 110 2H5.414l4.293 4.293a1 1 0 010 1.414z" clip-rule="evenodd"/></svg>
            Admin
          </a>
        </div>
      </div>
    </div>
  </header>

  <main id="main-content">
    <section class="page-hero">
      <div class="container">
        <h1>Agentes de Integração</h1>
        <p>Gerencie convênios com agentes de integração parceiros do IFRS.</p>
      </div>
    </section>

    <div class="container" style="padding-top:var(--space-6);padding-bottom:var(--space-12);">
      <div class="admin-toolbar">
        <div class="form-group" style="min-width:220px;">
          <label for="busca-agente">Buscar</label>
          <input type="search" id="busca-agente" class="form-control" placeholder="Nome, sigla ou CNPJ…">
        </div>
        <div class="form-group">
          <label for="filtro-status">Status</label>
          <select id="filtro-status" class="form-control">
            <option value="Ativo" selected>Ativo</option>
            <option value="Inativo">Inativo</option>
            <option value="Pendente">Pendente</option>
            <option value="Excluído">Excluído</option>
            <option value="">Todos</option>
          </select>
        </div>
        <div style="display:flex;gap:var(--space-2);align-items:flex-end;">
          <button id="btn-atualizar" class="btn btn-secondary btn-sm">Atualizar</button>
          <button id="btn-novo" class="btn btn-primary btn-sm">+ Novo Agente</button>
        </div>
      </div>

      <div class="table-wrap">
        <table class="data-table" aria-label="Agentes de integração">
          <thead>
            <tr>
              <th>Nome / Razão Social</th>
              <th>Sigla</th>
              <th>CNPJ</th>
              <th>E-mail</th>
              <th>Vigência</th>
              <th>Status</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody id="tbody-agentes">
            <tr><td colspan="7" class="table-loading">Carregando…</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- Modal detalhe / novo agente / editar / excluir -->
  <div id="modal-overlay" class="modal-overlay hidden" role="dialog" aria-modal="true">
    <div class="modal">
      <div class="modal-header">
        <h2 id="modal-title">Agente de Integração</h2>
        <button class="modal-close" id="btn-modal-close" aria-label="Fechar">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd"/></svg>
        </button>
      </div>
      <div class="modal-body" id="modal-body"></div>
      <div class="modal-footer" id="modal-footer"></div>
    </div>
  </div>

  <footer id="app-footer">
    <div class="container">
      <div class="footer-inner">
        <span class="footer-copy">&copy; <script>document.write(new Date().getFullYear())</script> Central de Estágios — IFRS Campus Rio Grande</span>
        <nav class="footer-links"><a href="mailto:estagios@riogrande.ifrs.edu.br">estagios@riogrande.ifrs.edu.br</a></nav>
      </div>
    </div>
  </footer>

  <script src="https://accounts.google.com/gsi/client" async></script>
  <script src="../assets/js/utils.js"></script>
  <script src="../assets/js/notifications-bell.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/api.js"></script>
  <script>
    'use strict';
    let _dados = [], _filtrados = [], _atual = null;

    document.addEventListener('DOMContentLoaded', () => {
      if (!requireAdminAuth()) return;
      carregar();
      document.getElementById('btn-atualizar').addEventListener('click', carregar);
      document.getElementById('btn-novo').addEventListener('click', () => abrirFormNovo());
      document.getElementById('btn-modal-close').addEventListener('click', fechar);
      document.getElementById('modal-overlay').addEventListener('click', e => { if (e.target === e.currentTarget) fechar(); });
      document.getElementById('busca-agente').addEventListener('input', filtrar);
      document.getElementById('filtro-status').addEventListener('change', filtrar);
    });

    async function carregar() {
      document.getElementById('tbody-agentes').innerHTML = '<tr><td colspan="7" class="table-loading">Carregando…</td></tr>';
      try {
        const data = await API.get('listarAgentesAdmin', { authToken: getAccessToken() });
        _dados = Array.isArray(data) ? data : (data.agentes || []);
        filtrar();
      } catch (err) {
        document.getElementById('tbody-agentes').innerHTML =
          `<tr><td colspan="7" class="table-loading" style="color:var(--color-error)">Erro: ${escapeHtml(err.message)}</td></tr>`;
      }
    }

    function filtrar() {
      const busca  = document.getElementById('busca-agente').value.toLowerCase().trim();
      const status = document.getElementById('filtro-status').value;
      _filtrados = _dados.filter(a => {
        if (status && a.status !== status) return false;
        if (busca && !([a.nomeAgente, a.sigla, a.cnpj].join(' ').toLowerCase().includes(busca))) return false;
        return true;
      });
      render();
    }

    function badgeHtml(status) {
      if (status === 'Ativo')     return '<span class="badge badge-active">Ativo</span>';
      if (status === 'Inativo')   return '<span class="badge badge-inactive">Inativo</span>';
      if (status === 'Pendente')  return '<span class="badge badge-pending">Pendente</span>';
      if (status === 'Excluído')  return '<span class="badge badge-deleted">Excluído</span>';
      return `<span class="badge badge-inactive">${escapeHtml(status)}</span>`;
    }

    function render() {
      const tb = document.getElementById('tbody-agentes');
      if (_filtrados.length === 0) {
        tb.innerHTML = `<tr><td colspan="7"><div class="empty-state"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M13.5 16.875h3.375m0 0h3.375m-3.375 0V13.5m0 3.375v3.375M6 10.5h2.25a2.25 2.25 0 002.25-2.25V6a2.25 2.25 0 00-2.25-2.25H6A2.25 2.25 0 003.75 6v2.25A2.25 2.25 0 006 10.5z"/></svg><p>Nenhum agente encontrado.</p></div></td></tr>`;
        return;
      }
      tb.innerHTML = _filtrados.map(a => `
        <tr>
          <td><span style="font-weight:500">${escapeHtml(a.nomeAgente||'—')}</span></td>
          <td style="font-size:12px">${escapeHtml(a.sigla||'—')}</td>
          <td style="font-size:12px">${escapeHtml(formatCNPJ(a.cnpj)||'—')}</td>
          <td style="font-size:12px">${escapeHtml(a.email||'—')}</td>
          <td style="font-size:12px">${escapeHtml(a.periodo||'—')}</td>
          <td>${badgeHtml(a.status)}</td>
          <td><div class="td-actions">
            <button class="btn btn-secondary btn-sm" onclick="abrir(${JSON.stringify(a).replace(/"/g,'&quot;')})">Ver</button>
          </div></td>
        </tr>`).join('');
    }

    function formatCNPJ(cnpj) {
      const n = String(cnpj || '').replace(/\D/g,'');
      if (n.length !== 14) return cnpj;
      return n.replace(/^(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})$/, '$1.$2.$3/$4-$5');
    }

    // ── VIEW ──────────────────────────────────────────────────────────────────
    function abrir(a) {
      _atual = a;
      renderVisualizacao();
      document.getElementById('modal-overlay').classList.remove('hidden');
      document.body.style.overflow = 'hidden';
    }

    function renderVisualizacao() {
      const a = _atual;
      document.getElementById('modal-title').textContent = a.nomeAgente || 'Agente';
      document.getElementById('modal-body').innerHTML = `
        <div class="detail-grid">
          <div>
            <div class="detail-label">Nome / Razão Social</div>
            <div class="detail-value">${escapeHtml(a.nomeAgente||'—')}</div>
          </div>
          <div>
            <div class="detail-label">Sigla</div>
            <div class="detail-value">${escapeHtml(a.sigla||'—')}</div>
          </div>
          <div>
            <div class="detail-label">CNPJ</div>
            <div class="detail-value">${escapeHtml(formatCNPJ(a.cnpj)||'—')}</div>
          </div>
          <div>
            <div class="detail-label">Telefone</div>
            <div class="detail-value">${escapeHtml(a.telefone||'—')}</div>
          </div>
          <div>
            <div class="detail-label">E-mail</div>
            <div class="detail-value">${escapeHtml(a.email||'—')}</div>
          </div>
          <div>
            <div class="detail-label">Site</div>
            <div class="detail-value">${a.site && safeUrl(a.site) ? `<a href="${escapeHtml(safeUrl(a.site))}" target="_blank" rel="noopener">${escapeHtml(a.site)}</a>` : escapeHtml(a.site||'—')}</div>
          </div>
          <div>
            <div class="detail-label">Nº do Edital</div>
            <div class="detail-value">${escapeHtml(a.numEdital||'—')}</div>
          </div>
          <div>
            <div class="detail-label">Vigência do Convênio</div>
            <div class="detail-value">${escapeHtml(a.periodo||'—')}</div>
          </div>
          ${a.linkEdital && safeUrl(a.linkEdital) ? `<div class="full"><div class="detail-label">Link do Edital</div><div class="detail-value"><a href="${escapeHtml(safeUrl(a.linkEdital))}" target="_blank" rel="noopener">${escapeHtml(a.linkEdital)}</a></div></div>` : ''}
          ${a.obs ? `<div class="full"><div class="detail-label">Observações</div><div class="detail-value">${escapeHtml(a.obs)}</div></div>` : ''}
          <div>
            <div class="detail-label">Status</div>
            <div class="detail-value">${badgeHtml(a.status)}</div>
          </div>
        </div>`;

      const excluido = a.status === 'Excluído';
      let footer = `<button class="btn btn-ghost" onclick="fechar()">Fechar</button>`;
      if (!excluido) {
        footer += `<button class="btn btn-secondary btn-sm" onclick="renderEdicao()">Editar</button>`;
        if (a.status === 'Ativo') {
          footer += `<button class="btn btn-danger btn-sm" onclick="alterarStatus('inativarAgente')">Inativar</button>`;
        } else if (a.status === 'Inativo' || a.status === 'Pendente') {
          footer += `<button class="btn btn-primary btn-sm" onclick="alterarStatus('reativarAgente')">Ativar</button>`;
        }
        footer += `<button class="btn btn-danger btn-sm" onclick="renderExcluir()">Excluir</button>`;
      }
      document.getElementById('modal-footer').innerHTML = footer;
    }

    // ── EDIT ──────────────────────────────────────────────────────────────────
    function renderEdicao() {
      const a = _atual;
      document.getElementById('modal-title').textContent = 'Editar Agente';
      document.getElementById('modal-body').innerHTML = `
        <div id="feedback-editar"></div>
        <div class="form-row">
          <div class="form-group" style="flex:2">
            <label class="form-label">Nome / Razão Social <span style="color:var(--color-error)">*</span></label>
            <input id="e-nome" class="form-control" value="${escapeHtml(a.nomeAgente||'')}">
          </div>
          <div class="form-group" style="flex:1">
            <label class="form-label">Sigla <span style="color:var(--color-error)">*</span></label>
            <input id="e-sigla" class="form-control" value="${escapeHtml(a.sigla||'')}" maxlength="20" style="text-transform:uppercase">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Telefone</label>
            <input id="e-tel" class="form-control" value="${escapeHtml(a.telefone||'')}">
          </div>
          <div class="form-group">
            <label class="form-label">E-mail</label>
            <input id="e-email" type="email" class="form-control" value="${escapeHtml(a.email||'')}">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Nº do Edital</label>
            <input id="e-edital" class="form-control" value="${escapeHtml(a.numEdital||'')}">
          </div>
          <div class="form-group">
            <label class="form-label">Vigência do Convênio</label>
            <input id="e-periodo" class="form-control" value="${escapeHtml(a.periodo||'')}">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Site</label>
            <input id="e-site" type="url" class="form-control" value="${escapeHtml(a.site||'')}">
          </div>
          <div class="form-group">
            <label class="form-label">Link do Edital</label>
            <input id="e-link-edital" type="url" class="form-control" value="${escapeHtml(a.linkEdital||'')}">
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Observações</label>
          <textarea id="e-obs" class="form-control" rows="3" maxlength="1000">${escapeHtml(a.obs||'')}</textarea>
        </div>`;
      document.getElementById('modal-footer').innerHTML = `
        <button class="btn btn-ghost" onclick="renderVisualizacao()">Cancelar</button>
        <button class="btn btn-primary" id="btn-salvar-edicao" onclick="salvarEdicao()">Salvar Alterações</button>`;
    }

    async function salvarEdicao() {
      const btn = document.getElementById('btn-salvar-edicao');
      const nome  = document.getElementById('e-nome').value.trim();
      const sigla = document.getElementById('e-sigla').value.trim().toUpperCase();
      if (!nome || !sigla) { toast('Nome e sigla são obrigatórios.', 'error'); return; }
      btn.classList.add('is-loading'); btn.disabled = true;
      try {
        await API.post('editarAgente', {
          cnpj:       _atual.cnpj,
          nomeAgente: nome,
          sigla:      sigla,
          telefone:   document.getElementById('e-tel').value.trim(),
          email:      document.getElementById('e-email').value.trim(),
          numEdital:  document.getElementById('e-edital').value.trim(),
          periodo:    document.getElementById('e-periodo').value.trim(),
          site:       document.getElementById('e-site').value.trim(),
          linkEdital: document.getElementById('e-link-edital').value.trim(),
          obs:        document.getElementById('e-obs').value.trim(),
          authToken:  getAccessToken(),
        });
        toast('Agente atualizado com sucesso!', 'success');
        await carregar();
        // Atualiza _atual com dados novos
        const novo = _dados.find(x => x.cnpj === _atual.cnpj);
        if (novo) { _atual = novo; renderVisualizacao(); }
        else fechar();
      } catch (err) { toast('Erro: ' + err.message, 'error'); }
      finally { btn.classList.remove('is-loading'); btn.disabled = false; }
    }

    // ── DELETE CONFIRM ────────────────────────────────────────────────────────
    function renderExcluir() {
      document.getElementById('modal-title').textContent = 'Excluir Agente';
      document.getElementById('modal-body').innerHTML = `
        <div class="delete-warning">
          <strong>Atenção:</strong> Esta ação irá marcar o agente como excluído. O registro será mantido na planilha, mas não aparecerá nas listagens ativas.
        </div>
        <p style="font-size:14px">Tem certeza que deseja excluir <strong>${escapeHtml(_atual.nomeAgente||'este agente')}</strong>?</p>`;
      document.getElementById('modal-footer').innerHTML = `
        <button class="btn btn-ghost" onclick="renderVisualizacao()">Cancelar</button>
        <button class="btn btn-danger" id="btn-confirmar-excluir" onclick="confirmarExcluir()">Confirmar Exclusão</button>`;
    }

    async function confirmarExcluir() {
      const btn = document.getElementById('btn-confirmar-excluir');
      btn.classList.add('is-loading'); btn.disabled = true;
      try {
        await API.post('excluirAgente', { cnpj: _atual.cnpj, authToken: getAccessToken() });
        toast('Agente excluído.', 'success');
        fechar(); carregar();
      } catch (err) { toast('Erro: ' + err.message, 'error'); }
      finally { btn.classList.remove('is-loading'); btn.disabled = false; }
    }

    // ── NEW AGENT FORM ────────────────────────────────────────────────────────
    function abrirFormNovo() {
      _atual = null;
      document.getElementById('modal-title').textContent = 'Novo Agente de Integração';
      document.getElementById('modal-body').innerHTML = `
        <div id="feedback-agente"></div>
        <div class="form-row">
          <div class="form-group" style="flex:2">
            <label class="form-label">Nome / Razão Social <span style="color:var(--color-error)">*</span></label>
            <input id="f-nome" class="form-control" placeholder="Centro de Integração Empresa-Escola…">
          </div>
          <div class="form-group" style="flex:1">
            <label class="form-label">Sigla <span style="color:var(--color-error)">*</span></label>
            <input id="f-sigla" class="form-control" placeholder="CIEE" maxlength="20" style="text-transform:uppercase">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">CNPJ <span style="color:var(--color-error)">*</span></label>
            <input id="f-cnpj" class="form-control" placeholder="00.000.000/0000-00">
          </div>
          <div class="form-group">
            <label class="form-label">Telefone <span style="color:var(--color-error)">*</span></label>
            <input id="f-tel" class="form-control" placeholder="(53) 99999-9999">
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">E-mail <span style="color:var(--color-error)">*</span></label>
          <input id="f-email" type="email" class="form-control">
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Nº do Edital <span style="color:var(--color-error)">*</span></label>
            <input id="f-edital" class="form-control" placeholder="Edital nº …/20XX">
          </div>
          <div class="form-group">
            <label class="form-label">Vigência do Convênio <span style="color:var(--color-error)">*</span></label>
            <input id="f-periodo" class="form-control" placeholder="01/01/2024 – 31/12/2026">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Site</label>
            <input id="f-site" type="url" class="form-control" placeholder="https://…">
          </div>
          <div class="form-group">
            <label class="form-label">Link do Edital</label>
            <input id="f-link-edital" type="url" class="form-control" placeholder="https://…">
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Observações</label>
          <textarea id="f-obs" class="form-control" rows="3" maxlength="500"></textarea>
        </div>`;
      document.getElementById('modal-footer').innerHTML = `
        <button class="btn btn-ghost" onclick="fechar()">Cancelar</button>
        <button class="btn btn-primary" id="btn-salvar-agente" onclick="salvarAgente()">Cadastrar Agente</button>`;
      document.getElementById('modal-overlay').classList.remove('hidden');
      document.body.style.overflow = 'hidden';
    }

    async function salvarAgente() {
      const btn    = document.getElementById('btn-salvar-agente');
      const nome   = document.getElementById('f-nome').value.trim();
      const sigla  = document.getElementById('f-sigla').value.trim().toUpperCase();
      const cnpj   = document.getElementById('f-cnpj').value.trim();
      const email  = document.getElementById('f-email').value.trim();
      const tel    = document.getElementById('f-tel').value.trim();
      const edital = document.getElementById('f-edital').value.trim();
      const period = document.getElementById('f-periodo').value.trim();
      if (!nome || !sigla || !cnpj || !email || !tel || !edital || !period) {
        toast('Preencha todos os campos obrigatórios.', 'error'); return;
      }
      btn.classList.add('is-loading'); btn.disabled = true;
      try {
        await API.post('cadastrarAgente', {
          nomeAgente:      nome,
          siglaAgente:     sigla,
          cnpjAgente:      cnpj,
          emailAgente:     email,
          telAgente:       tel,
          numEdital:       edital,
          periodoConvenio: period,
          siteAgente:      document.getElementById('f-site').value.trim(),
          linkEdital:      document.getElementById('f-link-edital').value.trim(),
          obsAgente:       document.getElementById('f-obs').value.trim(),
          authToken:       getAccessToken(),
        });
        toast('Agente cadastrado com sucesso!', 'success');
        fechar(); carregar();
      } catch (err) { toast('Erro: ' + err.message, 'error'); }
      finally { btn.classList.remove('is-loading'); btn.disabled = false; }
    }

    // ── STATUS TOGGLE ─────────────────────────────────────────────────────────
    async function alterarStatus(action) {
      if (!_atual) return;
      try {
        await API.post(action, { cnpj: _atual.cnpj, authToken: getAccessToken() });
        toast(action.includes('inativar') ? 'Convênio inativado.' : 'Convênio ativado.', 'success');
        await carregar();
        const novo = _dados.find(x => x.cnpj === _atual.cnpj);
        if (novo) { _atual = novo; renderVisualizacao(); }
        else fechar();
      } catch (err) { toast('Erro: ' + err.message, 'error'); }
    }

    function fechar() {
      document.getElementById('modal-overlay').classList.add('hidden');
      document.body.style.overflow = '';
      _atual = null;
    }

    function toast(msg, type) {
      const el = document.createElement('div');
      el.style.cssText = 'position:fixed;bottom:24px;right:24px;z-index:9999;max-width:360px;padding:12px 16px;border-radius:8px;font-size:14px;box-shadow:0 4px 16px rgba(0,0,0,.15)';
      el.style.background = type === 'success' ? 'var(--color-success-light)' : 'var(--color-error-light)';
      el.style.color = type === 'success' ? 'var(--color-success)' : 'var(--color-error)';
      el.style.border = `1px solid ${type === 'success' ? 'var(--color-success-border)' : 'var(--color-error-border)'}`;
      el.textContent = msg;
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 4000);
    }
  </script>
</body>
</html>
