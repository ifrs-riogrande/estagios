<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ficha do Estágio — Admin · Central de Estágios IFRS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <link rel="stylesheet" href="../assets/css/layout.css">
  <style>
    /* ── Abas ── */
    .ficha-tabs {
      display: flex; gap: 0;
      border-bottom: 2px solid var(--color-border);
      margin-bottom: var(--space-6);
    }
    .ficha-tab {
      padding: var(--space-3) var(--space-5);
      font-size: var(--font-size-sm); font-weight: 500;
      cursor: pointer; border: none; background: none;
      color: var(--color-text-muted);
      border-bottom: 2px solid transparent; margin-bottom: -2px;
      transition: all 0.15s; display: flex; align-items: center; gap: var(--space-2);
    }
    .ficha-tab.active { color: var(--color-primary); border-bottom-color: var(--color-primary); }
    .ficha-tab:hover:not(.active) { color: var(--color-text); }
    .tab-count {
      display: inline-flex; align-items: center; justify-content: center;
      min-width: 20px; height: 20px; border-radius: 9999px;
      font-size: 11px; background: var(--color-bg); padding: 0 6px;
    }
    .ficha-tab.active .tab-count { background: var(--color-primary); color: #fff; }
    .tab-count:empty { display: none; }

    /* ── Detail grid ── */
    .detail-grid {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: var(--space-4) var(--space-6); margin-bottom: var(--space-6);
    }
    @media (max-width: 560px) { .detail-grid { grid-template-columns: 1fr; } }
    .detail-item label {
      font-size: var(--font-size-xs); color: var(--color-text-muted);
      display: block; margin-bottom: 2px; font-weight: 500;
      text-transform: uppercase; letter-spacing: 0.04em;
    }
    .detail-item p { font-size: var(--font-size-sm); word-break: break-word; }
    .detail-full { grid-column: 1 / -1; }

    /* ── Dados sensíveis ── */
    .dado-oculto { font-family: monospace; color: var(--color-text-muted); letter-spacing: 2px; user-select: none; }
    .dado-visivel { font-family: monospace; }
    .sensivel-badge {
      display: inline-block; font-size: 9px; font-weight: 600; letter-spacing: .04em;
      background: var(--color-warning-light); color: var(--color-warning);
      border: 1px solid var(--color-warning-border, #fbbf24); border-radius: 3px;
      padding: 0 4px; margin-left: 4px; vertical-align: middle; text-transform: uppercase;
    }

    /* ── Ações do estágio (Dados tab) ── */
    .dados-actions-bar {
      display: flex; flex-wrap: wrap; gap: var(--space-3); align-items: center;
      padding: var(--space-4) var(--space-5);
      background: var(--color-bg); border-radius: var(--radius-lg);
      border: 1px solid var(--color-border);
      margin-bottom: var(--space-4);
    }
    .dados-actions-bar-label { flex: 1; font-size: var(--font-size-sm); color: var(--color-text-muted); }
    .reject-area { display: none; margin-top: var(--space-4); }
    .reject-area.show { display: block; }

    /* ── Links de fluxo ── */
    .fluxo-links {
      display: flex; flex-wrap: wrap; gap: var(--space-3);
      padding: var(--space-4) 0; border-top: 1px solid var(--color-border);
      margin-top: var(--space-2);
    }

    /* ── Badges ── */
    .badge {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 2px 10px; border-radius: 9999px;
      font-size: 11px; font-weight: 600; white-space: nowrap;
    }
    .badge::before { content: ''; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex-shrink: 0; }
    .badge-pending   { background: var(--color-warning-light); color: var(--color-warning); }
    .badge-analysis  { background: var(--color-info-light);    color: var(--color-info); }
    .badge-approved  { background: var(--color-success-light); color: var(--color-success); }
    .badge-rejected  { background: var(--color-error-light);   color: var(--color-error); }
    .badge-docs      { background: #EDE9FE; color: #7C3AED; }
    .badge-dg        { background: #FEF3C7; color: #92400E; }
    .badge-running   { background: var(--color-success-light); color: #065F46; }
    .badge-closed    { background: var(--color-bg); color: var(--color-text-muted); }

    /* ── Doc card (aba Documentos) ── */
    .doc-card {
      background: var(--color-surface); border: 1px solid var(--color-border);
      border-radius: var(--radius-lg); padding: var(--space-5) var(--space-6);
      display: flex; flex-direction: column; gap: var(--space-4);
    }
    .doc-card-header { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--space-4); flex-wrap: wrap; }
    .doc-card-title { font-weight: var(--font-weight-semibold); font-size: var(--font-size-md); }
    .doc-card-meta { display: flex; flex-wrap: wrap; gap: var(--space-4); font-size: var(--font-size-sm); color: var(--color-text-muted); }
    .doc-files { display: flex; flex-wrap: wrap; gap: var(--space-3); }
    .doc-file-link {
      display: inline-flex; align-items: center; gap: var(--space-2);
      padding: var(--space-2) var(--space-4); border: 1px solid var(--color-border);
      border-radius: var(--radius-md); font-size: var(--font-size-sm);
      color: var(--color-secondary); text-decoration: none; transition: all 0.15s;
    }
    .doc-file-link:hover { background: var(--color-info-light); border-color: var(--color-info-border); }
    .doc-actions {
      display: flex; flex-wrap: wrap; gap: var(--space-3); align-items: center;
      border-top: 1px solid var(--color-border); padding-top: var(--space-4);
    }
    .doc-actions-left { flex: 1; font-size: var(--font-size-xs); color: var(--color-text-muted); }
    .doc-actions-right { display: flex; gap: var(--space-3); }
    .reject-panel {
      background: var(--color-error-light); border: 1px solid var(--color-error-border);
      border-radius: var(--radius-md); padding: var(--space-4); display: none;
    }
    .reject-panel.show { display: block; }

    /* ── Tabela adendos ── */
    .table-wrap { overflow-x: auto; border-radius: var(--radius-lg); border: 1px solid var(--color-border); background: var(--color-surface); }
    .data-table { width: 100%; border-collapse: collapse; font-size: var(--font-size-sm); }
    .data-table th { background: var(--color-bg); padding: var(--space-3) var(--space-4); text-align: left; font-weight: 600; font-size: var(--font-size-xs); color: var(--color-text-muted); text-transform: uppercase; letter-spacing: .05em; border-bottom: 1px solid var(--color-border); white-space: nowrap; }
    .data-table td { padding: var(--space-3) var(--space-4); border-bottom: 1px solid var(--color-border); vertical-align: middle; }
    .data-table tr:last-child td { border-bottom: none; }
    .data-table tr:hover td { background: #F9FAFB; }

    /* ── Adendo detail inline ── */
    .adendo-detail-row { display: none; }
    .adendo-detail-row.show { display: table-row; }
    .adendo-detail-row td { background: var(--color-bg); border-bottom: 1px solid var(--color-border); }
    .adendo-detail-inner { padding: var(--space-4) var(--space-4); }

    /* ── Empty state ── */
    .empty-state { text-align: center; padding: var(--space-12) var(--space-6); color: var(--color-text-muted); }
    .empty-state svg { width: 48px; height: 48px; margin: 0 auto var(--space-4); opacity: 0.3; display: block; }

    /* ── Estado de carregamento ── */
    .loading-state { text-align: center; padding: var(--space-16) var(--space-6); color: var(--color-text-muted); font-size: var(--font-size-sm); }

    /* ── Upload de documentos avulsos ── */
    .upload-area { border: 2px dashed var(--color-border); border-radius: var(--radius-md); padding: var(--space-8); text-align: center; cursor: pointer; transition: all .15s; background: var(--color-bg); }
    .upload-area:hover, .upload-area.drag-over { border-color: var(--color-primary); background: var(--color-info-light); }
    .upload-area input { display: none; }
    .upload-area svg { width: 36px; height: 36px; margin: 0 auto var(--space-2); color: var(--color-text-muted); }
    .upload-area p { font-size: var(--font-size-sm); color: var(--color-text-muted); margin-bottom: var(--space-1); }
    .upload-area small { font-size: var(--font-size-xs); color: var(--color-text-light); }
    .file-selected { display: none; align-items: center; gap: var(--space-2); padding: var(--space-2) var(--space-3); background: var(--color-success-light); border-radius: var(--radius-md); font-size: var(--font-size-sm); color: var(--color-success); margin-top: var(--space-2); }
    .file-selected.show { display: flex; }

    /* ── Docs avulsos list ── */
    .avulso-list { display: flex; flex-direction: column; gap: var(--space-3); margin-bottom: var(--space-4); }
    .avulso-item { background: var(--color-bg); border: 1px solid var(--color-border); border-radius: var(--radius-md); padding: var(--space-3) var(--space-4); display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: var(--space-3); }
    .avulso-item-info { flex: 1; }
    .avulso-item-title { font-size: var(--font-size-sm); font-weight: 600; }
    .avulso-item-meta { font-size: var(--font-size-xs); color: var(--color-text-muted); margin-top: 2px; }

    /* ── Hero subtítulo ── */
    #hero-sub { display: flex; align-items: center; gap: var(--space-3); flex-wrap: wrap; margin-top: 4px; }
    #hero-sub .hero-sep { opacity: .4; }
  </style>
</head>

  <script src="https://accounts.google.com/gsi/client" async></script>
  <script src="../assets/js/utils.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/api.js"></script>
  <script>
    'use strict';

    /* ─── Helpers ─── */
    /**
     * Formata qualquer representação de data (ISO, Date object serializado,
     * timestamp numérico, ou já DD/MM/YYYY) para DD/MM/YYYY.
     * Retorna '—' se o valor for vazio/inválido.
     */
    function fmtDataAdendo(val) {
      if (!val) return '—';
      var s = String(val).trim();
      // Já está no formato DD/MM/YYYY
      if (/^\d{2}\/\d{2}\/\d{4}$/.test(s)) return s;
      // Tenta construir um Date a partir do valor
      var d = new Date(s);
      if (isNaN(d.getTime())) return s; // retorna como veio se não for data válida
      // Ajusta fuso: usa UTC para evitar off-by-one
      var dd   = String(d.getUTCDate()).padStart(2, '0');
      var mm   = String(d.getUTCMonth() + 1).padStart(2, '0');
      var yyyy = d.getUTCFullYear();
      return dd + '/' + mm + '/' + yyyy;
    }

    /* ─── Estado ─── */
    let _id = '';
    let _estagio = null;
    let _docsEnviados   = [];
    let _aguardandoDG   = [];
    let _validacaoFinal = [];
    let _fluxoDigital   = [];
    let _fluxoTCE       = null;   // dados completos do fluxo de assinaturas TCE (admin)
    let _adendos        = [];
    let _docsAvulsos    = [];
    let _checklistInfo  = null;   // dados do checklist (obterChecklist)
    let _arquivoAvulso  = null;
    let _sensivelVisivel = false;
    let _avaliacoes     = [];
    let _parecer        = null;

    /* ─── Init ─── */
    document.addEventListener('DOMContentLoaded', async function () {
      if (!requireAdminAuth()) return;

      _id = new URLSearchParams(window.location.search).get('id') || '';
      if (!_id) return mostrarErro('Nenhum ID de estágio informado na URL.');

      await carregarTudo();
    });

    async function carregarTudo() {
      document.getElementById('estado-carregando').style.display = '';
      document.getElementById('ficha-conteudo').style.display = 'none';
      document.getElementById('estado-erro').style.display = 'none';

      try {
        const token = getAccessToken();
        const [estList, docData, adendoData, digitalRaw, historicoData, ckRaw, tceRaw, avalRaw, parecerRaw] = await Promise.all([
          API.get('listarSolicitacoesAdmin', { authToken: token }),
          API.get('listarDocumentosAdmin',   { authToken: token }),
          API.get('listarAdendosAdmin',       { authToken: token }),
          API.get('listarFluxosPendentesEtapa', { etapa: 3 }).catch(() => []),
          apiListarHistoricoEstagio(_id).catch(() => null),
          API.get('obterChecklist', { id: _id }).catch(() => null),
          API.get('obterFluxoAssinaturasAdmin', { id: _id, authToken: token }).catch(() => null),
          API.get('listarAvaliacoesEstagio', { id: _id, authToken: token }).catch(() => []),
          API.get('obterParecerFinal', { id: _id, authToken: token }).catch(() => null),
        ]);

        const lista = Array.isArray(estList) ? estList : (estList.solicitacoes || []);
        _estagio = lista.find(s => s.id === _id) || null;
        if (!_estagio) return mostrarErro('Estágio "' + escapeHtml(_id) + '" não encontrado.');

        _docsEnviados   = (docData.docsEnviados   || []).filter(d => d.id === _id);
        _aguardandoDG   = (docData.aguardandoDG   || []).filter(d => d.id === _id);
        _validacaoFinal = (docData.validacaoFinal || []).filter(d => d.id === _id);
        _fluxoDigital   = (Array.isArray(digitalRaw) ? digitalRaw : []).filter(d => d.idEstagio === _id);
        _checklistInfo  = (ckRaw && !ckRaw.error) ? ckRaw : null;
        _fluxoTCE       = (tceRaw && !tceRaw.error) ? tceRaw : null;
        const adLista   = Array.isArray(adendoData) ? adendoData : (adendoData.adendos || []);
        _adendos        = adLista.filter(a => a.idEstagio === _id);
        _docsAvulsos    = (historicoData && historicoData.documentos) || [];
        _avaliacoes     = Array.isArray(avalRaw) ? avalRaw : [];
        _parecer        = (parecerRaw && !parecerRaw.error) ? parecerRaw : null;

        renderHero();
        renderDados();
        renderDocumentos();
        renderAdendos();
        renderAvaliacoes();
        renderParecer();

        document.getElementById('estado-carregando').style.display = 'none';
        document.getElementById('ficha-conteudo').style.display = '';

      } catch (err) {
        mostrarErro('Erro ao carregar dados: ' + err.message);
      }
    }

    function mostrarErro(msg) {
      document.getElementById('estado-carregando').style.display = 'none';
      document.getElementById('estado-erro-msg').textContent = msg;
      document.getElementById('estado-erro').style.display = '';
    }

    /* ─── Hero ─── */
    function renderHero() {
      const s = _estagio;
      document.title = 'Estágio ' + s.id + ' — Admin · Central de Estágios IFRS';
      document.getElementById('hero-titulo').textContent = 'Estágio ' + s.id;
      const sub = document.getElementById('hero-sub');
      sub.innerHTML =
        escapeHtml(s.nomeEstudante || '—') +
        '<span class="hero-sep">·</span>' +
        escapeHtml(s.empresa || '—') +
        '<span class="hero-sep">·</span>' +
        badgeStatus(s.status);
    }

    /* ─── Aba: Dados ─── */
    function renderDados() {
      const s = _estagio;
      let actionsHtml = '';

      if (s.status === 'Pendente') {
        actionsHtml = `
          <div class="dados-actions-bar" id="actions-bar">
            <div class="dados-actions-bar-label">Solicitação aguardando análise.</div>
            <button class="btn btn-secondary btn-sm" onclick="executarAcao('marcarEmAnalise')">Marcar "Em Análise"</button>
            <button class="btn btn-danger btn-sm"    id="btn-reprovar" onclick="mostrarReprovacao()">Reprovar</button>
            <button class="btn btn-primary btn-sm"   id="btn-aprovar"  onclick="executarAcao('aprovarSolicitacao')">Aprovar e Gerar Documentos</button>
          </div>`;
      } else if (s.status === 'Em análise') {
        actionsHtml = `
          <div class="dados-actions-bar" id="actions-bar">

        _estagio.linkDocMatricula,
        _estagio.linkDocIdentidade,
        _estagio.linkDocBoletim,
      ].filter(Boolean).length : 0;
      const totalDocs    = admissaoDocs
        + (temChecklist?1:0) + (temTCE?1:0)
        + _docsEnviados.length + _aguardandoDG.length + _validacaoFinal.length + _fluxoDigital.length
        + avalConc.length + (temParecer?1:0) + _docsAvulsos.length;
      document.getElementById('cnt-docs').textContent = totalDocs > 0 ? String(totalDocs) : '';

      const c = document.getElementById('content-documentos');
      const sec = (titulo, conteudo) =>
        `<div style="margin-bottom:var(--space-6)">
           <h3 style="font-size:var(--font-size-sm);font-weight:600;margin-bottom:var(--space-4);
                      padding:var(--space-2) var(--space-4);
                      background:var(--color-bg);
                      border-left:3px solid var(--color-primary);
                      border-radius:0 var(--radius-md) var(--radius-md) 0;
                      color:var(--color-text)">${titulo}</h3>
           ${conteudo}
         </div>`;
      const vazio = (msg) =>
        `<p style="font-size:var(--font-size-sm);color:var(--color-text-muted)">${msg}</p>`;

      let html = '';

      // ── 1. Pasta do Estágio no Drive ─────────────────────────────────────────
      if (_estagio && _estagio.driveUrl) {
        html += sec('1. 📁 Pasta do Estágio no Drive',
          `<div class="avulso-list">
            <div class="avulso-item">
              <div class="avulso-item-info">
                <div class="avulso-item-title">Pasta do Estágio</div>
                <div class="avulso-item-meta">Todos os documentos gerados são salvos aqui</div>
              </div>
              <a href="${escapeHtml(_estagio.driveUrl)}" target="_blank" rel="noopener" class="btn btn-secondary btn-sm">📁 Abrir pasta ↗</a>
            </div>
          </div>`
        );
      }

      // ── 2. Documentos de Admissão ─────────────────────────────────────────────
      if (_estagio) {
        const docs = [
          { label: 'Comprovante de Matrícula', url: _estagio.linkDocMatricula },
          { label: 'Documento de Identidade',  url: _estagio.linkDocIdentidade },
          { label: 'Boletim / Histórico',      url: _estagio.linkDocBoletim },
        ].filter(d => d.url);
        if (docs.length) {
          const itens = docs.map((d, i) => `
            <div class="avulso-item">
              <div class="avulso-item-info">
                <div class="avulso-item-title">📄 2.${i+1}. ${escapeHtml(d.label)}</div>

              </div>
              <a href="${escapeHtml(d.url)}" target="_blank" rel="noopener" class="btn btn-secondary btn-sm">Abrir ↗</a>
            </div>`).join('');
          html += sec('2. 📄 Documentos de Admissão', `<div class="avulso-list">${itens}</div>`);
        }
      }

      // ── 3. Documentos do Fluxo ────────────────────────────────────────────────
      {
        let fluxoHtml = '';

        // 3.1 Solicitação de Estágio (checklist + docs do fluxo)
        let solHtml = '';
        if (temChecklist) solHtml += buildDocCardChecklist(_checklistInfo);
        _docsEnviados.forEach((s,i)   => { solHtml += buildDocCard(s, 'docs-enviados',  'd'+i); });
        _aguardandoDG.forEach((s,i)   => { solHtml += buildDocCard(s, 'aguardando-dg',  'g'+i); });

        let tceHtml = '';

        }

        html += sec('3. 📄 Documentos do Fluxo',
          fluxoHtml || vazio('Nenhum documento do fluxo de aprovação para este estágio.')

      // ── 4. Avaliações ─────────────────────────────────────────────────────────
      {
        const subsec = (titulo, conteudo) =>
          `<div style="margin-bottom:var(--space-5)">
             <div style="font-size:var(--font-size-xs);font-weight:600;text-transform:uppercase;
                         color:var(--color-text-muted);letter-spacing:.04em;margin-bottom:var(--space-3)">
               ${titulo}
             </div>
             ${conteudo}
           </div>`;

        const buildAvalItem = a => {
          const tipoLabel = a.tipo === 'concedente' ? 'Avaliação pela Concedente' : 'Avaliação pelo Aluno';
          const perLabel  = a.periodoRef || a.periodo || '—';
          const dtConc    = a.tsConclusao ? new Date(a.tsConclusao).toLocaleDateString('pt-BR') : '—';
          return `<div class="avulso-item">
            <div class="avulso-item-info">
              <div class="avulso-item-title">📄 ${escapeHtml(tipoLabel)}</div>
              <div class="avulso-item-meta">Período: ${escapeHtml(perLabel)} · Concluída em: ${escapeHtml(dtConc)}</div>
            </div>
            <div style="display:flex;gap:var(--space-2)">
              <a href="${escapeHtml(a.pdfUrl)}" target="_blank" rel="noopener" class="btn btn-secondary btn-sm">📄 Abrir PDF ↗</a>
              <button class="btn btn-secondary btn-sm" onclick="regenerarPdfAvaliacao('${escapeHtml(a.avalId)}', this)">🔄 Regenerar</button>
            </div>
          </div>`;
        };

        const parciais = avalConc.filter(a => a.periodo !== 'final');
        const finais   = avalConc.filter(a => a.periodo === 'final');

        let avalHtml = '';

        // 4.1 Avaliações Parciais
        const parciaisHtml = parciais.length
          ? `<div class="avulso-list">${parciais.map(buildAvalItem).join('')}</div>`
          : vazio('Nenhuma avaliação parcial concluída.');
        avalHtml += subsec('4.1 Avaliações Parciais', parciaisHtml);

        // 4.2 Avaliação Final
        const finaisHtml = finais.length
          ? `<div class="avulso-list">${finais.map(buildAvalItem).join('')}</div>`
          : vazio('Avaliação final ainda não concluída.');
        avalHtml += subsec('4.2 Avaliação Final', finaisHtml);

        html += sec('4. 📄 Avaliações de Estágio', avalHtml);
      }

      // ── 5. Parecer Final ──────────────────────────────────────────────────────
      {
        let parecerHtml = '';
        if (temParecer) {
          const dtConc = _parecer.tsConclusao ? new Date(_parecer.tsConclusao).toLocaleDateString('pt-BR') : '—';
          parecerHtml = `<div class="avulso-list">
            <div class="avulso-item">
              <div class="avulso-item-info">
                <div class="avulso-item-title">📄 5.1. Parecer Final de Estágio</div>
                <div class="avulso-item-meta">${escapeHtml(_parecer.tipoDiretoria||'')} · Aprovado em: ${escapeHtml(dtConc)}</div>
              </div>
              <div style="display:flex;gap:var(--space-2)">
                <a href="${escapeHtml(_parecer.pdfUrl)}" target="_blank" rel="noopener" class="btn btn-secondary btn-sm">📄 Abrir PDF ↗</a>
                <button class="btn btn-secondary btn-sm" onclick="regenerarPdfParecerAdmin(this)">🔄 Regenerar</button>
              </div>
            </div>
          </div>`;
        } else {
          parecerHtml = vazio('Parecer final ainda não concluído.');
        }
        html += sec('5. 📄 Parecer Final', parecerHtml);
      }

      // ── 6. Demais Documentos ──────────────────────────────────────────────────
      {
        let demaisHtml = '';
        if (_docsAvulsos.length) {
          demaisHtml = `<div class="avulso-list">` +
            _docsAvulsos.map((d, i) => `
              <div class="avulso-item">
                <div class="avulso-item-info">
                  <div class="avulso-item-title">📄 6.${i+1}. ${escapeHtml(d.titulo||'—')}</div>
                  <div class="avulso-item-meta">
                    ${escapeHtml(d.data||'—')} · Por: ${escapeHtml(d.perfil==='Admin'?'Setor de Estágios':'Estudante')}
                    ${d.nomeArquivo ? ' · ' + escapeHtml(d.nomeArquivo) : ''}
                  </div>
                </div>
                ${d.linkDrive ? `<a href="${escapeHtml(d.linkDrive)}" target="_blank" rel="noopener" class="btn btn-secondary btn-sm">Baixar ↗</a>` : ''}
              </div>`).join('') +
          `</div>`;
        } else {
          demaisHtml = vazio('Nenhum documento adicional enviado ainda.');
        }

        html += sec('6. 📄 Demais Documentos',
          demaisHtml +
          `<div style="margin-top:var(--space-5);background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-lg);padding:var(--space-5)">
            <h4 style="font-size:var(--font-size-sm);font-weight:600;margin-bottom:var(--space-4)">Enviar documento para este estágio</h4>
            <div id="fb-avulso-admin"></div>
            <div class="form-group">
              <label class="form-label" for="avulso-admin-titulo">Título / Descrição <span style="color:var(--color-error)">*</span></label>
              <input type="text" id="avulso-admin-titulo" class="form-control" placeholder="Ex: Carta de confirmação, Declaração de estágio…">
            </div>
            <div class="form-group">
              <label class="form-label">Arquivo PDF <span style="color:var(--color-error)">*</span></label>
              <div class="upload-area" id="drop-avulso-admin" onclick="document.getElementById('upload-avulso-admin').click()">

    function initAdminUploadAvulso() {
      const input = document.getElementById('upload-avulso-admin');
      if (!input) return;
      input.addEventListener('change', () => {
        const file = input.files[0];
        if (!file) return;
        if (file.type !== 'application/pdf') { showToast('Apenas arquivos PDF são aceitos.', 'error'); input.value = ''; return; }
        if (file.size > 10 * 1024 * 1024) { showToast('Arquivo muito grande. Máximo: 10 MB.', 'error'); input.value = ''; return; }
        _arquivoAvulso = file;
        const info = document.getElementById('file-avulso-admin-info');
        if (info) { info.innerHTML = `✓ ${escapeHtml(file.name)} (${(file.size/1024).toFixed(1)} KB)`; info.classList.add('show'); }
      });
      const drop = document.getElementById('drop-avulso-admin');
      if (!drop) return;
      drop.addEventListener('dragover',  e => { e.preventDefault(); drop.classList.add('drag-over'); });
      drop.addEventListener('dragleave', ()  => drop.classList.remove('drag-over'));
      drop.addEventListener('drop', e => {
        e.preventDefault(); drop.classList.remove('drag-over');
        const file = e.dataTransfer.files[0];
        if (file) { input.files = e.dataTransfer.files; input.dispatchEvent(new Event('change')); }
      });
    }

    async function enviarDocumentoAvulsoAdmin(btn) {
      const titulo = document.getElementById('avulso-admin-titulo')?.value.trim();
      const file   = _arquivoAvulso;
      const fbId   = 'fb-avulso-admin';
      if (!titulo || !file) {
        const el = document.getElementById(fbId);
        if (el) { el.innerHTML = `<div class="form-feedback form-feedback--error" style="margin-bottom:var(--space-3)"><strong>Campos obrigatórios</strong> — informe o título e selecione um arquivo PDF.</div>`; }
        return;
      }
      btn.disabled = true; btn.classList.add('is-loading');
      const fbEl = document.getElementById(fbId);
      if (fbEl) fbEl.innerHTML = '';
      try {
        await apiUploadDocumentoEstagio(_id, titulo, file);
        _arquivoAvulso = null;
        showToast('Documento enviado com sucesso!', 'success');
        // Recarrega aba de documentos
        await carregarTudo();
        mudarAba('documentos');
      } catch (err) {
        if (fbEl) fbEl.innerHTML = `<div class="form-feedback form-feedback--error" style="margin-bottom:var(--space-3)"><strong>Erro ao enviar:</strong> ${escapeHtml(err.message)}</div>`;
        btn.disabled = false; btn.classList.remove('is-loading');
      }
    }

    function buildDocCard(s, aba, uid) {
      const arquivosHtml = (s.arquivos || []).map(a => `
        <a href="${escapeHtml(a.url)}" target="_blank" rel="noopener" class="doc-file-link">

          ${escapeHtml(a.nome)}

      let etiqueta = '';
      let actionsHtml = '';

      if (aba === 'docs-enviados') {
        etiqueta = '<span class="badge badge-docs">Aguardando Revisão</span>';
        actionsHtml = `
          <div class="doc-actions">
            <div class="doc-actions-left">Revise os arquivos antes de prosseguir.</div>
            <div class="doc-actions-right">
              <button class="btn btn-danger btn-sm" onclick="mostrarPainelRejeicaoDoc('${uid}')">Devolver ao Estudante</button>
              <button class="btn btn-primary btn-sm" onclick="validarDocs('${escapeHtml(s.id)}')">Validar e Notificar Diretor</button>

        orientador:          'Aguardando Orientador(a)',

    /* ─── Aba: Adendos ─── */
    function renderAdendos() {
      document.getElementById('cnt-adendos').textContent = _adendos.length > 0 ? String(_adendos.length) : '';
      const c = document.getElementById('content-adendos');

      if (_adendos.length === 0) {
        c.innerHTML = `
          <div class="empty-state">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M16.862 4.487l1.687-1.688a1.875 1.875 0 112.652 2.652L10.582 16.07a4.5 4.5 0 01-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 011.13-1.897l8.932-8.931zM16.862 4.487L19.5 7.125"/></svg>
            <p>Nenhum adendo solicitado para este estágio.</p>
          </div>`;
        return;
      }

      c.innerHTML = _adendos.map((a, idx) => buildAdendoCard(a, idx)).join('');
    }

    function buildAdendoCard(a, idx) {
      const uid    = 'adendo-' + idx;
      const status = a.status || 'Pendente';
      const aJson  = JSON.stringify(a).replace(/"/g, '&quot;');
      const idAdendo = escapeHtml(a.idAdendo || a.id || '');

      const detailHtml = `
        <div class="detail-grid" style="margin:var(--space-3) 0 0">
          ${a.emailEstudante ? `<div class="detail-item"><label>Estudante</label><p>${escapeHtml(a.emailEstudante)}</p></div>` : ''}
          <div class="detail-item detail-full">
            <label>Justificativa</label>
            <p style="white-space:pre-wrap">${escapeHtml(a.justificativa || '—')}</p>
          </div>
          ${a.novaDataTermino ? `<div class="detail-item"><label>Nova Data de Término</label><p>${escapeHtml(fmtDataAdendo(a.novaDataTermino))}</p></div>` : ''}
          ${a.novaCarga       ? `<div class="detail-item"><label>Nova Carga Horária</label><p>${escapeHtml(a.novaCarga)}</p></div>` : ''}
          ${a.novoHorario     ? `<div class="detail-item detail-full"><label>Novo Horário</label><p style="white-space:pre-wrap">${escapeHtml(a.novoHorario)}</p></div>` : ''}
          ${a.obs             ? `<div class="detail-item detail-full"><label>Observações</label><p style="white-space:pre-wrap">${escapeHtml(a.obs)}</p></div>` : ''}
        </div>`;

      let actionsHtml = '';
      let rejectPanelHtml = '';

      if (status === 'Pendente') {
        actionsHtml = `
          <div class="doc-actions">
            <div class="doc-actions-left"></div>
            <div class="doc-actions-right">
              <button class="btn btn-secondary btn-sm" onclick="previewAdendoAdmin(${aJson})">👁 Visualizar Documento</button>
              <button class="btn btn-danger btn-sm" onclick="mostrarPainelRejeicaoAdendo('${uid}')">Devolver para ajustes</button>
              <button class="btn btn-primary btn-sm" onclick="acaoAdendo('aprovarAdendo', ${aJson}, ${idx})">Aprovar e Gerar PDF</button>
            </div>
          </div>`;
        rejectPanelHtml = `
          <div class="reject-panel" id="reject-adendo-${uid}">
            <div class="form-group" style="margin-bottom:var(--space-3)">
              <label class="form-label">Motivo da devolução</label>
              <textarea id="motivo-adendo-${idx}" class="form-control" rows="2" placeholder="Indique o que deve ser corrigido…"></textarea>
            </div>
            <div style="display:flex;gap:var(--space-2)">
              <button class="btn btn-ghost btn-sm" onclick="ocultarPainelRejeicaoAdendo('${uid}')">Cancelar</button>
              <button class="btn btn-danger btn-sm" onclick="acaoAdendo('reprovarAdendo', ${aJson}, ${idx})">Confirmar Devolução</button>
            </div>
          </div>`;

      } else if (status === 'Aguardando Correção') {
        actionsHtml = `
          <div class="doc-actions">
            <div class="doc-actions-left">
              ⚠️ Devolvido ao estudante para correção.
              ${a.motivoReprovacao ? `<br><span style="font-size:12px;color:var(--color-text-muted)">Motivo: ${escapeHtml(a.motivoReprovacao)}</span>` : ''}
            </div>
            <div class="doc-actions-right"></div>
          </div>`;

      } else if (status === 'Em Assinaturas') {
        const pastaUrl = a.driveUrl || (_estagio && _estagio.driveUrl ? _estagio.driveUrl : '');
        actionsHtml = `
          <div class="doc-actions">
            <div class="doc-actions-left">Adendo em assinaturas digitais (gov.br): Estagiário → Concedente → Coordenador → Diretor Geral.</div>
            <div class="doc-actions-right">
              <button class="btn btn-secondary btn-sm" onclick="regenerarAdendo('${idAdendo}', this)">🔄 Regenerar Adendo</button>
              <a href="https://validar.iti.gov.br/" target="_blank" rel="noopener" class="btn btn-secondary btn-sm">Validador ITI ↗</a>
              ${pastaUrl ? `<a href="${escapeHtml(pastaUrl)}" target="_blank" rel="noopener" class="btn btn-secondary btn-sm">📁 Abrir pasta ↗</a>` : ''}
              <button class="btn btn-secondary btn-sm" onclick="reenviarNotifAdendo('${idAdendo}', this)">
                <svg width="12" height="12" viewBox="0 0 20 20" fill="currentColor"><path d="M2.003 5.884L10 9.882l7.997-3.998A2 2 0 0016 4H4a2 2 0 00-1.997 1.884z"/><path d="M18 8.118l-8 4-8-4V14a2 2 0 002 2h12a2 2 0 002-2V8.118z"/></svg>
                Reenviar notificação
              </button>
            </div>
          </div>`;

      } else if (status === 'Concluído') {
        actionsHtml = `
          <div class="doc-actions">
            <div class="doc-actions-left">Adendo concluído com todas as assinaturas.</div>
            <div class="doc-actions-right">
              ${a.pdfUrl ? `<a href="${escapeHtml(a.pdfUrl)}" target="_blank" rel="noopener" class="btn btn-secondary btn-sm">📄 Abrir PDF ↗</a>` : ''}
              <button class="btn btn-secondary btn-sm" onclick="regenerarAdendo('${idAdendo}', this)">🔄 Regenerar</button>
            </div>
          </div>`;

      } else if (status === 'Recusado' || status === 'Reprovado') {
        actionsHtml = `
          <div class="doc-actions">
            <div class="doc-actions-left" style="color:var(--color-error)">
              ✗ Adendo recusado.
              ${a.motivoReprovacao ? `<br><span style="font-size:12px;color:var(--color-text-muted)">Motivo: ${escapeHtml(a.motivoReprovacao)}</span>` : ''}
            </div>
            <div class="doc-actions-right"></div>
          </div>`;

      return `
        <div class="doc-card" style="margin-bottom:var(--space-4)">
          <div class="doc-card-header">
            <div>
              <div class="doc-card-title">${escapeHtml(a.tipoAlteracao || '—')}</div>
              ${a.dataSolicitacao ? `<div style="font-size:12px;color:var(--color-text-muted)">Solicitado em ${escapeHtml(a.dataSolicitacao)}</div>` : ''}

            ${badgeAdendo(status)}
          </div>
          ${detailHtml}
          ${actionsHtml}
          ${rejectPanelHtml}
        </div>`;
    }

    function mostrarPainelRejeicaoAdendo(uid) {
      document.getElementById('reject-adendo-' + uid)?.classList.add('show');
    }
    function ocultarPainelRejeicaoAdendo(uid) {
      document.getElementById('reject-adendo-' + uid)?.classList.remove('show');
    }

    /* ─── Ações: Dados (aprovar/reprovar solicitação) ─── */
    function mostrarReprovacao() {
      document.getElementById('reject-area-dados').classList.add('show');
      document.getElementById('reject-area-dados').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }
    function ocultarReprovacao() {
      document.getElementById('reject-area-dados').classList.remove('show');
    }

    async function executarAcao(action) {
      const payload = { idEstagio: _id };
      if (action === 'reprovarSolicitacao') {
        const motivo = document.getElementById('motivo-reprovacao')?.value?.trim();
        if (!motivo) { showToast('Informe o motivo da reprovação.', 'error'); return; }
        payload.motivoReprovacao = motivo;
      }
      try {
        await API.post(action, { ...payload, authToken: getAccessToken() });
        showToast(mensagemSucesso(action), 'success');
        await carregarTudo();
      } catch (err) {
        showToast('Erro: ' + err.message, 'error');
      }
    }

    function mensagemSucesso(action) {
      return {
        aprovarSolicitacao:  'Solicitação aprovada! Documentos sendo gerados…',
        reprovarSolicitacao: 'Solicitação reprovada. Estudante será notificado.',
        marcarEmAnalise:     'Status atualizado para "Em análise".',
      }[action] || 'Ação realizada com sucesso.';
    }

    /* ─── Ações: Documentos ─── */
    function mostrarPainelRejeicaoDoc(uid) {
      document.getElementById('reject-doc-' + uid)?.classList.add('show');
    }

    async function validarDocs(id) {
      try {
        await API.post('validarDocumentos', { idEstagio: id, authToken: getAccessToken() });
        showToast('Documentos validados! Diretor Geral será notificado.', 'success');
        await carregarTudo();
      } catch (err) { showToast('Erro: ' + err.message, 'error'); }
    }

    async function reprovarDocs(id, uid) {
      const motivo = document.getElementById('motivo-doc-' + uid)?.value?.trim();
      if (!motivo) { showToast('Informe o motivo da devolução.', 'error'); return; }
      try {
        await API.post('reprovarDocumentos', { idEstagio: id, motivoReprovacao: motivo, authToken: getAccessToken() });
        showToast('Documentos devolvidos. Estudante será notificado.', 'success');
        await carregarTudo();
      } catch (err) { showToast('Erro: ' + err.message, 'error'); }
    }

    async function reprovarDocsDG(id, uid) {
      const motivo = document.getElementById('motivo-doc-' + uid)?.value?.trim();
      if (!motivo) { showToast('Informe o motivo da devolução.', 'error'); return; }
      try {
        await API.post('reprovarDocumentosDG', { idEstagio: id, motivoReprovacao: motivo, authToken: getAccessToken() });
        showToast('Documentos devolvidos ao Diretor Geral.', 'success');
        await carregarTudo();
      } catch (err) { showToast('Erro: ' + err.message, 'error'); }
    }

    async function ativarEstagio(id) {
      if (!confirm('Confirmar ativação do estágio? Um e-mail será enviado a todos os envolvidos.')) return;
      try {
        await API.post('validarDocumentosDG', { idEstagio: id, authToken: getAccessToken() });
        showToast('Estágio ativado! E-mails de confirmação enviados.', 'success');
        await carregarTudo();
      } catch (err) { showToast('Erro: ' + err.message, 'error'); }
    }

    /* ─── Ações: Adendos ─── */
    async function acaoAdendo(action, adendo, idx) {
      const payload = {
        idAdendo:  adendo.idAdendo || adendo.id,
        idEstagio: adendo.idEstagio || _id,
        authToken: getAccessToken(),
      };
      if (action === 'reprovarAdendo') {
        const motivo = document.getElementById('motivo-adendo-' + idx)?.value?.trim();
        if (!motivo) { showToast('Informe o motivo da devolução.', 'error'); return; }
        payload.motivoReprovacao = motivo;
      }
      if (action === 'aprovarAdendo') {
        if (!confirm('Aprovar o adendo e iniciar o fluxo de assinaturas (gov.br)?')) return;
      }
      try {
        await API.post(action, payload);
        showToast(action === 'aprovarAdendo'
          ? 'Adendo aprovado! PDF gerado e fluxo de assinaturas iniciado.'
          : 'Adendo devolvido ao estudante para correção.', 'success');
        await carregarTudo();
        mudarAba('adendos');
      } catch (err) { showToast('Erro: ' + err.message, 'error'); }
    }

    async function regenerarAdendo(idAdendo, btn) {
      if (!confirm('Regenerar o PDF do adendo? O arquivo atual no Drive será substituído.')) return;
      const orig = btn.textContent.trim();
      btn.disabled = true; btn.textContent = 'Gerando…';
      try {
        const res = await API.post('regenerarAdendo', { idAdendo, authToken: getAccessToken() });
        showToast('✅ Adendo regenerado com sucesso!', 'success');
        if (res && res.pdfUrl) window.open(res.pdfUrl, '_blank');
        await carregarTudo();
        mudarAba('adendos');
      } catch (err) {
        showToast('Erro ao regenerar: ' + err.message, 'error');
        btn.disabled = false; btn.textContent = orig;
      }
    }

    async function reenviarNotifAdendo(idAdendo, btn) {
      if (!confirm('Reenviar notificação para o responsável pela etapa atual?')) return;
      const orig = btn.textContent;
      btn.disabled = true; btn.textContent = 'Enviando…';
      try {
        await API.post('reenviarNotificacaoAdendo', { idAdendo, authToken: getAccessToken() });
        showToast('✉️ Notificação reenviada com sucesso.', 'success');
      } catch (err) {
        showToast('Erro: ' + err.message, 'error');
      } finally {
        btn.disabled = false; btn.textContent = orig;
      }
    }

    /* ─── Abas ─── */
    function mudarAba(aba) {
      document.querySelectorAll('.ficha-tab').forEach(t => {
        t.classList.toggle('active', t.dataset.tab === aba);
      });
      ['dados', 'documentos', 'adendos', 'avaliacoes', 'parecer'].forEach(t => {
        document.getElementById('tab-' + t).hidden = (t !== aba);
      });
    }

    /* ─── Dados sensíveis ─── */
    function toggleDadosSensiveis() {
      _sensivelVisivel = !_sensivelVisivel;
      document.querySelectorAll('.dado-sensivel').forEach(span => {
        if (_sensivelVisivel) {
          span.textContent = span.dataset.valor || '—';
          span.classList.replace('dado-oculto', 'dado-visivel');
        } else {
          span.textContent = '••••••••••••';
          span.classList.replace('dado-visivel', 'dado-oculto');
        }
      });
      const olhoAberto  = document.getElementById('icon-olho-aberto');
      const olhoFechado = document.getElementById('icon-olho-fechado');
      const label       = document.getElementById('label-sensivel');

    /* ─── Helpers ─── */
    function badgeStatus(status) {
      const map = {
        'Pendente':                  'badge-pending',
        'Em análise':                'badge-analysis',
        'Em Checklist':              'badge-analysis',
        'Em Assinaturas':            'badge-docs',
        'Ativo':                     'badge-running',
        'Aguardando Documentos':     'badge-approved',
        'Docs Enviados':             'badge-docs',
        'Aguardando DG':             'badge-dg',
        'Aguardando Validação Final':'badge-dg',
        'Em execução':               'badge-running',
        'Encerrado':                 'badge-closed',
        'Reprovado':                 'badge-rejected',
      };
      return `<span class="badge ${map[status] || 'badge-closed'}">${escapeHtml(status || '—')}</span>`;
    }

    function badgeAdendo(s) {
      const m = {
        'Pendente':            'badge-pending',
        'Aguardando Correção': 'badge-dg',
        'Em Assinaturas':      'badge-docs',
        'Aprovado':            'badge-approved',
        'Concluído':           'badge-running',
        'Reprovado':           'badge-rejected',
        'Recusado':            'badge-rejected',
      };
      return `<span class="badge ${m[s] || 'badge-pending'}">${escapeHtml(s || '—')}</span>`;
    }

    function showToast(msg, type = 'success') {
      const el = document.createElement('div');
      el.style.cssText = 'position:fixed;bottom:24px;right:24px;z-index:9999;max-width:360px;padding:12px 16px;border-radius:8px;font-size:14px;box-shadow:0 4px 16px rgba(0,0,0,.15)';
      el.style.background = type === 'success' ? 'var(--color-success-light)' : 'var(--color-error-light)';
      el.style.color = type === 'success' ? 'var(--color-success)' : 'var(--color-error)';
      el.style.border = `1px solid ${type === 'success' ? 'var(--color-success-border)' : 'var(--color-error-border)'}`;
      el.textContent = msg;
      document.body.appendChild(el);
      setTimeout(() => el.remove(), type === 'error' ? 10000 : 4000);
    }

    function formatarCPF(cpf) {
      const d = String(cpf).replace(/\D/g, '');
      return d.length === 11 ? d.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, '$1.$2.$3-$4') : cpf;
    }

    function formatarCNPJ(cnpj) {
      const d = String(cnpj).replace(/\D/g, '');
      return d.length === 14 ? d.replace(/(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})/, '$1.$2.$3/$4-$5') : cnpj;
    }

    /* ─── Aba: Avaliações ─── */

        concluido:                 'Concluído ✓',
      };

             <p>Nenhuma avaliação iniciada para este estágio.</p>

        : `<div class="table-wrap">

                   <th>Período</th>

                   <th>Iniciada em</th>
                   <th>Ações</th>
                 </tr>

               <tbody>${linhas}</tbody>

      c.innerHTML = `
        ${buildAvaliacoesPrevistasHtml(_estagio.dataInicio, _estagio.dataTermino, _avaliacoes)}
        ${tabelaHtml}

        <!-- Iniciar nova avaliação -->
        <div style="margin-top:var(--space-6);background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-lg);padding:var(--space-5)">
          <h3 style="font-size:var(--font-size-sm);font-weight:700;margin-bottom:var(--space-4)">Iniciar Nova Avaliação</h3>
          <div id="fb-nova-aval"></div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:var(--space-4);margin-bottom:var(--space-4)">
            <div class="form-group" style="margin-bottom:0">
              <label class="form-label" for="aval-tipo">Tipo de Avaliação <span style="color:var(--color-error)">*</span></label>

                <option value="">Selecionar…</option>
                <option value="ambos">Ambas (Concedente + Aluno simultaneamente)</option>
                <option value="concedente">Somente Avaliação pela Concedente</option>
                <option value="aluno">Somente Avaliação pelo Aluno</option>

            <div class="form-group" style="margin-bottom:0">

                <option value="semestral_3">Semestral — 3º semestre</option>

    async function iniciarNovaAvaliacao(btn) {
      const fbEl  = document.getElementById('fb-nova-aval');
      if (fbEl) fbEl.innerHTML = '';

      const tipo       = document.getElementById('aval-tipo')?.value;
      const periodo    = document.getElementById('aval-periodo')?.value;
      const periodoRef = document.getElementById('aval-periodo-ref')?.value?.trim();

      if (!tipo)    { mostrarFbErrroAval(fbEl, 'Selecione o tipo de avaliação.'); return; }
      if (!periodo) { mostrarFbErrroAval(fbEl, 'Selecione o período.'); return; }

      // 'ambos' = dispara concedente + aluno simultaneamente (padrão do sistema)
      const tipos = tipo === 'ambos' ? ['concedente', 'aluno'] : [tipo];

      btn.disabled = true; btn.textContent = 'Iniciando…';
      try {
        const resultados = [];
        for (const t of tipos) {
          const res = await API.post('iniciarAvaliacao', {
            idEstagio:  _id,
            tipo:       t,
            periodo:    periodo,
            periodoRef: periodoRef || '',
            authToken:  getAccessToken(),
          });
          resultados.push(res);
        }
        const msg = tipos.length > 1
          ? '✅ Ambas as avaliações iniciadas! Responsáveis notificados por e-mail.'
          : '✅ Avaliação iniciada! Responsável notificado por e-mail.';
        showToast(msg, 'success');
        await carregarTudo();
        mudarAba('avaliacoes');
      } catch (err) {
        mostrarFbErrroAval(fbEl, err.message || 'Erro ao iniciar avaliação.');
        btn.disabled = false;
        btn.textContent = 'Iniciar Avaliação e Notificar Responsável';
      }
    }

    async function regenerarPdfAvaliacao(avalId, btn) {
      if (!confirm('Regenerar o PDF da avaliação "' + avalId + '"?\nUm novo arquivo será criado na pasta do estágio.')) return;
      const orig = btn.textContent.trim();
      btn.disabled = true; btn.textContent = 'Gerando…';
      try {
        const res = await API.post('regenerarPdfAvaliacao', { avalId: avalId, authToken: getAccessToken() });
        showToast('✅ PDF regenerado com sucesso!', 'success');
        if (res.pdfUrl) window.open(res.pdfUrl, '_blank');
        await carregarTudo();
        mudarAba('avaliacoes');
      } catch (err) {
        showToast('Erro ao regenerar: ' + (err.message || err), 'error');
        btn.disabled = false; btn.textContent = orig;
      }
    }

    async function aprovarAvaliacao(avalId, btn) {
      if (!confirm('Confirmar aprovação e geração do PDF para "' + avalId + '"?\nTodos os envolvidos receberão o documento por e-mail.')) return;
      const orig = btn.textContent;
      btn.disabled = true; btn.textContent = 'Gerando PDF…';
      try {
        const res = await API.post('aprovarAvaliacao', { avalId: avalId, authToken: getAccessToken() });
        showToast('✅ Avaliação aprovada! PDF gerado e enviado por e-mail.', 'success');
        await carregarTudo();
        mudarAba('avaliacoes');
      } catch (err) {
        showToast('Erro: ' + (err.message || err), 'error');
        btn.disabled = false; btn.textContent = orig;
      }
    }

    async function reenviarNotifAvaliacao(avalId, btn) {
      if (!confirm('Reenviar notificação para o responsável pela etapa atual?')) return;
      const orig = btn.textContent;
      btn.disabled = true; btn.textContent = 'Enviando…';
      try {
        await API.post('reenviarNotificacaoAvaliacao', { avalId: avalId, authToken: getAccessToken() });

        showToast('Erro: ' + err.message, 'error');
      } finally {
        btn.disabled = false; btn.textContent = orig;
      }
    }

    function mostrarFbErrroAval(el, msg) {
      if (!el) { showToast(msg, 'error'); return; }
      el.innerHTML = `<div class="form-feedback form-feedback--error" style="margin-bottom:var(--space-3)">
        <strong>Atenção:</strong> ${escapeHtml(msg)}

          <div style="display:flex;gap:var(--space-3);align-items:flex-start">

            <p style="font-size:var(--font-size-sm);flex:1;margin:0;white-space:pre-wrap">${escapeHtml(p.parecerCoordenador.texto || '—')}</p>

    }

    async function reenviarNotifParecer(btn) {
      if (!confirm('Reenviar notificação para o responsável pela etapa atual?')) return;
      const orig = btn.textContent;
      btn.disabled = true; btn.textContent = 'Enviando…';
      try {
        // Reenvio via iniciarParecerFinal (que notifica conforme status atual — simplificado)
        await API.post('iniciarParecerFinal', { idEstagio: _id, authToken: getAccessToken() });
        showToast('✉️ Notificação reenviada.', 'success');
      } catch (err) {
        showToast('Erro: ' + err.message, 'error');
      } finally {
        btn.disabled = false; btn.textContent = orig;
      }
    }

    async function regenerarPdfParecerAdmin(btn) {
      if (!confirm('Regenerar o PDF do parecer final?')) return;
      const orig = btn.textContent;
      btn.disabled = true; btn.textContent = 'Gerando…';
      try {
        const res = await API.post('regenerarPdfParecer', { idEstagio: _id, authToken: getAccessToken() });
        showToast('✅ PDF regenerado!', 'success');
        if (res.pdfUrl) window.open(res.pdfUrl, '_blank');
        await carregarTudo(); mudarAba('parecer');
      } catch (err) {
        showToast('Erro: ' + err.message, 'error');
        btn.disabled = false; btn.textContent = orig;
      }
    }

    async function concluirEstagio(btn) {
      if (!confirm('Marcar este estágio como CONCLUÍDO? Esta ação é definitiva.')) return;
      const orig = btn.textContent;
      btn.disabled = true; btn.textContent = 'Concluindo…';
      try {
        await API.post('concluirEstagio', { idEstagio: _id, authToken: getAccessToken() });
        showToast('✅ Estágio marcado como Concluído!', 'success');
        await carregarTudo(); mudarAba('dados');
      } catch (err) {
        showToast('Erro: ' + err.message, 'error');
        btn.disabled = false; btn.textContent = orig;
      }
    }

    /* ─── Regenerar TCE inicial (gera PDF e atualiza pdfOriginalUrl no fluxo) ─── */
    async function regenerarTCEInicial(idEstagio, btn) {
      if (!confirm('Regenerar o PDF original do TCE? Isso substituirá o arquivo original no fluxo de assinaturas.')) return;
      const orig = btn.textContent.trim();
      btn.disabled = true; btn.textContent = 'Gerando…';
      try {
        const res = await API.post('regenerarTCEInicial', {
          idEstagio: decodeURIComponent(idEstagio),
          authToken: getAccessToken(),
        });
        showToast('✅ TCE regenerado com sucesso!', 'success');
        if (res.urlPdf) window.open(res.urlPdf, '_blank');
        await carregarTudo();
      } catch (err) {
        showToast('Erro ao regenerar TCE: ' + err.message, 'error');
        btn.disabled = false; btn.textContent = orig;
      }
    }

    /* ─── Regenerar PDF do checklist ─── */
    async function regenerarPdfChecklist(idEstagio, btn) {
      if (!confirm('Gerar um novo PDF do checklist? O arquivo anterior no Drive será mantido e um novo será criado.')) return;
      const orig = btn.textContent.trim();
      btn.disabled = true;
      btn.textContent = 'Gerando…';
      try {
        const res = await API.post('regenerarPdfChecklist', {
          idEstagio: decodeURIComponent(idEstagio),
          authToken: getAccessToken(),
        });
        showToast('✅ Novo PDF gerado com sucesso!', 'success');
        // Recarrega a aba para atualizar botões com nova URL e token
        await carregarTudo();
      } catch (err) {
        showToast('Erro ao gerar PDF: ' + err.message, 'error');
        btn.disabled = false;
        btn.textContent = orig;
      }
    }

    /* ─── Reenviar notificação (checklist ou assinatura, conforme status) ─── */
    async function reenviarNotificacaoAssinatura(idEstagio, btn) {
      if (!confirm('Reenviar e-mail de notificação para o ator da etapa atual?')) return;
      const orig = btn.textContent;
      btn.disabled = true;
      btn.textContent = 'Enviando…';
      try {
        // Usa rota de assinatura se já há fluxo TCE iniciado; caso contrário, usa checklist
        const action = _fluxoTCE ? 'reenviarNotificacaoAssinatura' : 'reenviarNotificacaoChecklist';
        const res = await API.post(action, {
          idEstagio: decodeURIComponent(idEstagio),
          authToken: getAccessToken(),
        });
        const emailInfo = res.email ? ` (${res.email})` : '';
        showToast(`✉️ Notificação reenviada — ${res.label || ('Etapa ' + res.etapa)}${emailInfo}`, 'success');
      } catch (err) {
        showToast('Erro ao reenviar: ' + err.message, 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = orig;
      }
    }

    /* ─── Preview de Adendo (modal) ─── */
    function previewAdendoAdmin(a) {
      const s = _estagio || {};
      const mesesPt = ['janeiro','fevereiro','março','abril','maio','junho','julho',
                       'agosto','setembro','outubro','novembro','dezembro'];
      const hoje = new Date();
      const dataLinha = 'Rio Grande, ' + hoje.getDate() + ' de ' + mesesPt[hoje.getMonth()] + ' de ' + hoje.getFullYear() + '.';

      const fmtCnpj = v => {
        const d = String(v || '').replace(/\D/g, '');
        return d.length === 14 ? d.replace(/^(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})$/, '$1.$2.$3/$4-$5') : (v || '');
      };
      const nomeAluno    = escapeHtml(s.nomeEstudante || '—');
      const empBruto     = s.empresa || '—';
      const empMatch     = empBruto.match(/^(.+?)\s*[—–-]+\s*(\d+)\s*$/);
      const empNome      = escapeHtml(empMatch ? empMatch[1].trim() : empBruto);
      const empCnpj      = fmtCnpj(s.cnpjEmpresa || (empMatch ? empMatch[2] : ''));
      const nomeEmpLabel = empNome + (empCnpj ? ', CNPJ: ' + empCnpj : '');

      const cab = `<div style="text-align:center;font-family:Arial,sans-serif;margin-bottom:8px">
        <div style="width:54px;height:54px;background:#005a2b;color:#fff;font-weight:bold;font-size:13pt;
                    display:inline-flex;align-items:center;justify-content:center;border-radius:6px;margin-bottom:6px">IFRS</div>
        <p style="margin:1px 0;font-size:8pt;font-family:Arial,sans-serif">MINISTÉRIO DA EDUCAÇÃO</p>
        <p style="margin:1px 0;font-size:9pt;font-weight:bold;font-family:Arial,sans-serif">INSTITUTO FEDERAL DE EDUCAÇÃO, CIÊNCIA E TECNOLOGIA DO RIO GRANDE DO SUL</p>
        <p style="margin:1px 0 8px;font-size:8pt;font-family:Arial,sans-serif">Campus Rio Grande</p>
      </div>
      <hr style="border:none;border-top:1px solid #888;margin:0 0 12px">
      <p style="text-align:center;font-family:Arial,sans-serif;font-size:13pt;font-weight:bold;margin:0 0 16px">ADITAMENTO AO TERMO DE COMPROMISSO DE ESTÁGIO</p>`;

      const assin = (nome, papel) =>
        `<div style="margin-top:50px;text-align:center;font-family:Arial,sans-serif;font-size:10pt">
          <div>_______________________________________</div>
          <div style="font-weight:bold;margin:2px 0">${nome}</div>
          <div>${papel}</div>
        </div>`;

      const tipo = escapeHtml(a.tipoAlteracao || '—');
      const just = escapeHtml(a.justificativa || '—');
      const camposAlter = [];
      if (a.novaDataTermino) camposAlter.push(`<li>Nova data de término: <strong>${escapeHtml(fmtDataAdendo(a.novaDataTermino))}</strong></li>`);
      if (a.novaCarga)       camposAlter.push(`<li>Nova carga horária semanal: <strong>${escapeHtml(a.novaCarga)}</strong></li>`);
      if (a.novoHorario)     camposAlter.push(`<li>Novo horário: <strong>${escapeHtml(a.novoHorario)}</strong></li>`);

      const p = t => `<p style="font-family:Arial,sans-serif;font-size:10pt;margin:8px 0">${t}</p>`;

      const corpo = `
        ${p(`O INSTITUTO FEDERAL DE EDUCAÇÃO, CIÊNCIA E TECNOLOGIA DO RIO GRANDE DO SUL – IFRS, Campus Rio Grande,
        a empresa <strong>${nomeEmpLabel}</strong>, e o(a) estagiário(a) <strong>${nomeAluno}</strong>,
        matrícula <strong>${escapeHtml(s.matricula || '—')}</strong>, curso <strong>${escapeHtml(s.curso || '—')}</strong>,
        têm entre si, justo e acordado, o presente Aditamento ao Termo de Compromisso de Estágio.`)}
        ${p(`<strong>Tipo de alteração:</strong> ${tipo}`)}
        ${p(`<strong>Justificativa:</strong> ${just}`)}
        ${camposAlter.length ? p(`<strong>Alterações solicitadas:</strong>`) + `<ul style="font-family:Arial,sans-serif;font-size:10pt">${camposAlter.join('')}</ul>` : ''}
        ${a.obs ? p(`<strong>Observações:</strong> ${escapeHtml(a.obs)}`) : ''}
        ${p('A partir deste adendo, permanecem inalteradas todas as demais disposições estabelecidas no Termo de Compromisso de Estágio original e seus aditamentos anteriores, se houver.')}
        ${p('E por estarem de inteiro e comum acordo, assinam o presente instrumento em 3 (três) vias de igual teor e forma.')}
        <p style="margin-top:20px;font-family:Arial,sans-serif;font-size:10pt">${dataLinha}</p>
        ${assin(nomeAluno, 'ESTAGIÁRIO(A)')}
        ${assin('Representante', 'CONCEDENTE')}
        ${assin('COORDENADOR(A) DO CURSO', 'COORDENADOR(A) DO CURSO')}
        ${assin('DIRETOR-GERAL DO IFRS – CAMPUS RIO GRANDE', 'INSTITUIÇÃO DE ENSINO')}`;

      document.getElementById('modal-adendo-body').innerHTML = cab + corpo;
      document.getElementById('modal-adendo').style.display = '';
    }
  </script>

  <!-- Modal preview de adendo -->
  <div id="modal-adendo" style="display:none;position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.55);overflow:auto;padding:32px 16px" onclick="if(event.target===this)this.style.display='none'">
    <div style="max-width:720px;margin:0 auto;background:#fff;border-radius:10px;padding:40px 48px;position:relative;box-shadow:0 8px 32px rgba(0,0,0,.25)">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;border-bottom:1px solid #e5e7eb;padding-bottom:16px">
        <span style="font-size:13px;font-weight:600;color:#6b7280;text-transform:uppercase;letter-spacing:.04em">Pré-visualização do Adendo</span>
        <div style="display:flex;gap:8px;align-items:center">
          <button onclick="window.print()" style="padding:6px 14px;border:1px solid #d1d5db;border-radius:6px;background:#f9fafb;cursor:pointer;font-size:13px">🖨 Imprimir</button>
          <button onclick="document.getElementById('modal-adendo').style.display='none'" style="padding:6px 14px;border:1px solid #d1d5db;border-radius:6px;background:#f9fafb;cursor:pointer;font-size:13px">✕ Fechar</button>
        </div>
      </div>
      <div id="modal-adendo-body"></div>
    </div>
  </div>
</body>
</html>
