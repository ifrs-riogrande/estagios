<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/x-icon" href="https://riogrande.ifrs.edu.br/favicon.ico">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Declarações — Admin Central de Estágios IFRS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <link rel="stylesheet" href="../assets/css/layout.css">
</head>
<body>
  <header id="app-header">
    <div class="container">
      <div class="header-inner">
        <a href="../index.html" class="header-brand">
          <span class="header-logo-wrap"><img src="../assets/img/logo-ifrs.png" alt="IFRS" class="header-logo"></span>
        </a>
        <div style="display:flex;align-items:center;gap:var(--space-3);">
          <div id="header-user-area"></div>
          <a href="index.html" class="back-link">
            <svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="M9.707 16.707a1 1 0 01-1.414 0l-6-6a1 1 0 010-1.414l6-6a1 1 0 011.414 1.414L5.414 9H17a1 1 0 110 2H5.414l4.293 4.293a1 1 0 010 1.414z" clip-rule="evenodd"/></svg>
            Admin
          </a>
        </div>
      </div>
    </div>
  </header>

  <main id="main-content">
    <section class="page-hero">
      <div class="container">
        <h1>Declarações</h1>
        <p>Histórico de todas as declarações emitidas e emissão em nome de qualquer servidor.</p>
      </div>
    </section>

    <div class="container" style="padding-top:var(--space-8);padding-bottom:var(--space-12);">
      <div style="max-width:960px;margin:0 auto;">

        <!-- Emitir declaração (admin) -->
        <div class="card" style="margin-bottom:var(--space-8);">
          <div class="card-header" style="display:flex;justify-content:space-between;align-items:center;">
            <h2 class="card-title">Emitir Declaração</h2>
            <button class="btn btn-secondary btn-sm" onclick="toggleForm()">
              <span id="btn-toggle-label">Expandir</span>
            </button>
          </div>
          <div id="form-emitir" class="card-body" style="display:none;">
            <div class="form-group" style="margin-bottom:var(--space-5);">
              <label class="form-label" for="email-servidor">E-mail do servidor <span style="color:var(--color-error)">*</span></label>
              <input type="email" id="email-servidor" class="form-control" placeholder="nome@riogrande.ifrs.edu.br" style="max-width:360px;">
            </div>

            <div style="display:grid;grid-template-columns:1fr 1fr;gap:var(--space-5);margin-bottom:var(--space-5);">
              <div class="form-group">
                <label class="form-label" for="adm-periodo-inicio">Período — início <span style="color:var(--color-error)">*</span></label>
                <input type="date" id="adm-periodo-inicio" class="form-control">
              </div>
              <div class="form-group">
                <label class="form-label" for="adm-periodo-fim">Período — fim <span style="color:var(--color-error)">*</span></label>
                <input type="date" id="adm-periodo-fim" class="form-control">
              </div>
            </div>

            <div style="display:grid;grid-template-columns:1fr 1fr;gap:var(--space-5);margin-bottom:var(--space-6);">
              <div class="form-group">
                <label class="form-label">Função <span style="color:var(--color-error)">*</span></label>
                <div style="display:flex;gap:var(--space-3);flex-wrap:wrap;margin-top:var(--space-2);">
                  <label class="radio-pill">
                    <input type="radio" name="adm-funcao" value="orientador"> Orientador(a)
                  </label>
                  <label class="radio-pill">
                    <input type="radio" name="adm-funcao" value="supervisor"> Supervisor(a)
                  </label>
                  <label class="radio-pill">
                    <input type="radio" name="adm-funcao" value="ambos"> Ambos
                  </label>
                </div>
              </div>
              <div class="form-group">
                <label class="form-label">Modalidade <span style="color:var(--color-error)">*</span></label>
                <div style="display:flex;gap:var(--space-3);flex-wrap:wrap;margin-top:var(--space-2);">
                  <label class="radio-pill">
                    <input type="radio" name="adm-modalidade" value="Obrigatório"> Obrigatório
                  </label>
                  <label class="radio-pill">
                    <input type="radio" name="adm-modalidade" value="Não Obrigatório"> Não Obrigatório
                  </label>
                  <label class="radio-pill">
                    <input type="radio" name="adm-modalidade" value="Ambos"> Ambos
                  </label>
                </div>
              </div>
            </div>

            <button class="btn btn-primary" onclick="gerarDeclaracaoAdmin(this)">
              Gerar e enviar por e-mail
            </button>
          </div>
        </div>

        <!-- Filtros do histórico -->
        <div style="display:flex;gap:var(--space-3);flex-wrap:wrap;margin-bottom:var(--space-5);align-items:center;">
          <input type="text" id="filtro-servidor" class="form-control" placeholder="Filtrar por servidor..." style="max-width:280px;" oninput="filtrarHistorico()">
          <select id="filtro-funcao" class="form-control" style="max-width:200px;" onchange="filtrarHistorico()">
            <option value="">Todas as funções</option>
            <option value="orientador">Orientação</option>
            <option value="supervisor">Supervisão</option>
            <option value="ambos">Ambos</option>
          </select>
        </div>

        <!-- Histórico geral -->
        <div class="card">
          <div class="card-header">
            <h2 class="card-title">Histórico Geral <span id="total-badge" style="font-size:13px;font-weight:400;color:var(--color-text-muted);"></span></h2>
          </div>
          <div class="card-body" id="historico-container">
            <div class="val-skeleton" style="height:160px;"></div>
          </div>
        </div>

      </div>
    </div>
  </main>

  <footer id="app-footer">
    <div class="container">
      <div class="footer-inner">
        <span class="footer-copy">&copy; <script>document.write(new Date().getFullYear())</script> Central de Estágios — IFRS Campus Rio Grande</span>
        <nav class="footer-links"><a href="mailto:estagios@riogrande.ifrs.edu.br">estagios@riogrande.ifrs.edu.br</a></nav>
      </div>
    </div>
  </footer>

  <style>
    .val-skeleton {
      background: linear-gradient(90deg, var(--color-border) 25%, #e9edf3 50%, var(--color-border) 75%);
      background-size: 200% 100%;
      border-radius: var(--radius-lg);
      animation: shimmer 1.4s infinite;
    }
    @keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }
  </style>

  <script src="https://accounts.google.com/gsi/client" async></script>
  <script src="../assets/js/utils.js"></script>
  <script src="../assets/js/notifications-bell.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/api.js"></script>
  <script>
    'use strict';

    let _todasDeclaracoes = [];

    document.addEventListener('DOMContentLoaded', async function () {
      if (!requireAdminAuth()) return;
      await carregarHistorico();
    });

    function toggleForm() {
      const form = document.getElementById('form-emitir');
      const lbl  = document.getElementById('btn-toggle-label');
      const aberto = form.style.display !== 'none';
      form.style.display = aberto ? 'none' : 'block';
      lbl.textContent    = aberto ? 'Expandir' : 'Recolher';
    }

    async function carregarHistorico() {
      try {
        const lista = await API.get('listarDeclaracoesAdmin', { authToken: getAccessToken() });
        _todasDeclaracoes = Array.isArray(lista) ? lista : [];
        filtrarHistorico();
      } catch (err) {
        document.getElementById('historico-container').innerHTML =
          '<div class="alert alert-error">Erro ao carregar: ' + escapeHtml(err.message) + '</div>';
      }
    }

    function filtrarHistorico() {
      const txtServidor = (document.getElementById('filtro-servidor').value || '').toLowerCase();
      const funcaoFiltro = document.getElementById('filtro-funcao').value || '';

      const filtrada = _todasDeclaracoes.filter(d => {
        const matchServidor = !txtServidor ||
          d.nomeServidor.toLowerCase().includes(txtServidor) ||
          d.emailServidor.toLowerCase().includes(txtServidor);
        const matchFuncao = !funcaoFiltro || d.funcao === funcaoFiltro;
        return matchServidor && matchFuncao;
      });

      renderizarHistorico(filtrada);
    }

    function renderizarHistorico(lista) {
      const badge = document.getElementById('total-badge');
      badge.textContent = lista.length ? '(' + lista.length + ' registro' + (lista.length > 1 ? 's' : '') + ')' : '';

      const c = document.getElementById('historico-container');
      if (!lista.length) {
        c.innerHTML = `<div class="empty-state">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 00-3.375-3.375h-1.5A1.125 1.125 0 0113.5 7.125v-1.5a3.375 3.375 0 00-3.375-3.375H8.25m0 12.75h7.5m-7.5 3H12M10.5 2.25H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 00-9-9z"/></svg>
          <p>Nenhuma declaração encontrada.</p>
        </div>`;
        return;
      }

      const fmtData = (iso) => {
        if (!iso) return '—';
        try { return new Date(iso).toLocaleDateString('pt-BR'); } catch (_) { return iso; }
      };
      const fmtPeriodo = (v) => {
        if (!v) return '—';
        const m = String(v).match(/^(\d{4})-(\d{2})-(\d{2})/);
        if (m) return `${m[3]}/${m[2]}/${m[1]}`;
        return v;
      };
      const labelFuncao = (f) => f === 'orientador' ? 'Orientação' : f === 'supervisor' ? 'Supervisão' : 'Orientação e Supervisão';

      let html = `<div class="table-wrapper"><table class="data-table">
        <thead><tr>
          <th>ID</th><th>Data</th><th>Servidor</th><th>Função</th>
          <th>Modalidade</th><th>Período</th><th>Estágios</th><th>Emitido por</th>
        </tr></thead><tbody>`;

      lista.forEach(d => {
        const emitidoPor = d.emitidoPor === 'admin'
          ? 'Admin' + (d.nomeEmitente ? ' (' + escapeHtml(d.nomeEmitente) + ')' : '')
          : 'Servidor';
        html += `<tr>
          <td style="font-size:11px;font-family:monospace;white-space:nowrap">${escapeHtml(d.id)}</td>
          <td style="white-space:nowrap">${fmtData(d.dataEmissao)}</td>
          <td>
            <div style="font-weight:500">${escapeHtml(d.nomeServidor)}</div>
            <div style="font-size:11px;color:var(--color-text-muted)">${escapeHtml(d.emailServidor)}</div>
          </td>
          <td>${escapeHtml(labelFuncao(d.funcao))}</td>
          <td>${escapeHtml(d.modalidade)}</td>
          <td style="white-space:nowrap;font-size:12px">${fmtPeriodo(d.periodoInicio)}<br>a ${fmtPeriodo(d.periodoFim)}</td>
          <td style="text-align:center">${d.totalEstagios}</td>
          <td style="font-size:12px">${emitidoPor}</td>
        </tr>`;
      });

      html += '</tbody></table></div>';
      c.innerHTML = html;
    }

    async function gerarDeclaracaoAdmin(btn) {
      const emailServidor = (document.getElementById('email-servidor').value || '').trim();
      const periodoInicio = document.getElementById('adm-periodo-inicio').value;
      const periodoFim    = document.getElementById('adm-periodo-fim').value;
      const funcao        = document.querySelector('input[name="adm-funcao"]:checked')?.value;
      const modalidade    = document.querySelector('input[name="adm-modalidade"]:checked')?.value;

      if (!emailServidor) { showToast('Informe o e-mail do servidor.', 'error'); return; }
      if (!periodoInicio || !periodoFim) { showToast('Informe o período completo.', 'error'); return; }
      if (!funcao)     { showToast('Selecione a função.', 'error'); return; }
      if (!modalidade) { showToast('Selecione a modalidade.', 'error'); return; }
      if (periodoInicio > periodoFim) { showToast('A data de início deve ser anterior à data de fim.', 'error'); return; }

      const orig = btn.textContent;
      btn.disabled = true;
      btn.textContent = 'Gerando…';

      try {
        const res = await API.post('gerarDeclaracaoAdmin', {
          authToken:     getAccessToken(),
          emailServidor,
          funcao,
          modalidade,
          periodoInicio,
          periodoFim,
        });
        showToast(`✅ Declaração gerada (${res.totalEstagios} estágio(s)) e enviada para ${emailServidor}.`, 'success');
        await carregarHistorico();
      } catch (err) {
        showToast('Erro: ' + err.message, 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = orig;
      }
    }
  </script>
</body>
</html>
